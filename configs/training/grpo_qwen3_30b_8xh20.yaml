# GRPO Qwen3-30B-A3B 8x H20 Config
# Actor: FSDP on 4 GPUs | Rollout: sglang on 4 GPUs (tp=4, ep=4)

training:
  data_path: results/verl_training_data.jsonl
  max_steps: 1000
  batch_size: 8
  learning_rate: 1.0e-6
  warmup_steps: 100

model:
  model_name: Qwen/Qwen3-30B-A3B
  actor_device_map: auto
  fsdp_size: 4

rollout:
  n: 4
  tp_size: 4
  ep_size: 4
  sglang_url: http://127.0.0.1:30000
  max_new_tokens: 2048
  temperature: 1.0

reward:
  sandbox_server_url: http://127.0.0.1:18890
  sandbox_config_path: configs/sandbox-server/finance_research_config.json
  resource_types:
    - unified_finance
  resource_init_configs: {}
  llm_model: gpt-4.1-2025-04-14
  llm_api_key: ""
  llm_base_url: ""
  max_turns: 15
