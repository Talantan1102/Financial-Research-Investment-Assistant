# dashboard/config/eval_system.yaml
# ============================================================================
# 评估体系覆盖矩阵 — 子系统 × 评估层级
# ----------------------------------------------------------------------------
# 论文锚点: Li et al., Agent Harness Engineering: A Survey (2026),
#           §8 Verification & Evaluation。
#
#   "没有评估就没有优化"  (No evaluation, no optimization.)
#   一个能力如果没有任何层级的评估守护,它的"能用"只是侥幸;
#   这张矩阵一眼看出整个项目哪里还没被评估盯住。
#
# 这是一份**可编辑的活文档** (SSOT):
#   改这个 yaml → 刷新 /eval 页面即更新,页面不写回。
#   evidence 路径是真实代码扫描结果;status 取值只允许
#   covered / partial / gap,非法值会在 derive/eval_matrix.py fail loud。
# ============================================================================

# 列 = 4 个评估层级 (从单元到在线,粒度由细到粗)
layers:
  - id: component
    name_cn: "组件级"
    name_en: "Component"
    desc: "单元级 — 切块/向量/检索/单工具正确性的离线指标(recall@k, nDCG, precision)"

  - id: agent
    name_cn: "智能体级"
    name_en: "Agent"
    desc: "单 agent 输出正确性 — LLM 评判 / golden case"

  - id: system
    name_cn: "系统级"
    name_en: "System"
    desc: "端到端任务成功率 — e2e golden / 回测 / 差分对照"

  - id: regression
    name_cn: "回归监控"
    name_en: "Regression & Online"
    desc: "回归套件 / 在线监控 / 鲁棒性(混沌·投毒·漂移)"

# 行 = 7 个子系统;每行有 4 个 cell,key = layer id。
# cell.status ∈ {covered, partial, gap}
#   covered  = 该层级有真实、运行中的评估守护
#   partial  = 有基础设施/部分覆盖,但有明确缺口(skip / 未接线 / 未跑)
#   gap      = 该层级实质空白
subsystems:
  # --------------------------------------------------------------------------
  - id: kb
    name_cn: "知识库检索"
    name_en: "Knowledge Base Retrieval"
    summary: >-
      组件级（单元/集成）覆盖扎实：chunker、embedding、milvus client、search
      service、ingest pipeline、cache 均有专项 L0/L1 测试；但 KB 检索质量的离线
      IR 指标（recall@k / nDCG / MRR）完全缺位，系统级回测中 KB 仅以 time-travel
      过滤 adapter 身份参与 DD 报告 backtest，无独立检索召回 ground-truth 评估，
      回归/监控层对 KB 也无任何覆盖。
    cells:
      component:
        status: partial
        methods:
          - unit-test
          - integration-test
          - cassette-replay
        evidence:
          - backend/tests/unit/test_chunkers.py
          - backend/tests/unit/test_kb_search_service.py
          - backend/tests/unit/test_embedding_service.py
          - backend/tests/unit/test_milvus_client.py
          - backend/tests/unit/test_ingest_pipeline.py
          - backend/tests/unit/test_chunk_embed_cache.py
          - backend/tests/unit/test_reliable_kb_service.py
          - backend/tests/unit/kb/test_chunk_schema_publish_date.py
          - backend/tests/unit/test_kb_factory.py
          - backend/tests/integration/test_milvus_container.py
          - backend/tests/e2e/test_kb_search_cassette.py
          - backend/tests/e2e/test_ingest_cassette.py
        gap: >-
          组件功能正确性有覆盖，但无 chunking 质量离线指标（chunk size 分布、
          oversize rate）、无 embedding 召回 ground-truth 对比（qwen v3 vs BGE
          无 A/B 数据）、无 top_k/threshold 参数调优实验；
          docs/claude-context/kb-eval-gaps.md 明确记录这些缺口推迟到 v0.8。
      agent:
        status: partial
        methods:
          - cassette-replay
          - llm-judge
        evidence:
          - backend/tests/e2e/test_kb_search_cassette.py
          - backend/tests/e2e/memory/test_memory_kb_routing_cassette.py
          - backend/tests/integration/memory/test_kb_routing_e2e.py
          - backend/tests/eval/dd_report/test_citation_metric.py
        gap: >-
          KB 在 agent 层的评估只有 routing 正确性（memory vs kb vs both 路由）和
          citation 精准率（report 引用 chunk 是否支撑论点），没有专门针对 KB 检索
          agent 输出质量的独立 golden case 集；citation_metric 是 DD 报告评估的
          一部分，非 KB 子系统独立 judge。
      system:
        status: partial
        methods:
          - backtest
          - ablation
          - e2e-cassette
        evidence:
          - backend/eval/dd_report/kb_backtest_adapter.py
          - backend/eval/dd_report/ablation/variants.py
          - backend/eval/dd_report/ablation/null_adapters.py
          - backend/tests/eval/dd_report/test_kb_backtest_adapter.py
          - backend/tests/eval/dd_report/test_ablation_variants.py
        gap: >-
          KB 在系统级仅通过 KBBacktestAdapter（time-travel 过滤）和 V1_NO_RAG
          ablation 变量间接参与 DD 报告 backtest，验证的是「有 KB 比无 KB 分数高」
          而非 KB 检索召回率本身；没有以 query→relevant chunk 为粒度的端到端检索
          recall 评估。
      regression:
        status: gap
        methods: []
        evidence: []
        gap: >-
          无 KB 检索专项回归测试套件、无在线检索召回监控、无 embedding 漂移检测、
          无 chunk schema 变更守护；docs/claude-context/kb-eval-gaps.md 的 sketch
          中提到 scripts/eval_kb_retrieval.py 和 tests/eval/results/kb_retrieval/
          占位，但均未实现。

  # --------------------------------------------------------------------------
  - id: chat
    name_cn: "对话 Agent"
    name_en: "Chat Agent"
    summary: >-
      组件级和系统级测试覆盖较充分(单元测试覆盖 planner/runner/graph/SSE/
