      test_*.py 驱动，实际未被执行，LLM-judge 质量评估停留在 infra 层；回归层
      缺乏针对 chat agent 的混沌/投毒/漂移测试。
    cells:
      component:
        status: covered
        methods:
          - unit-test
          - mock-llm
          - fixture-stub
        evidence:
          - backend/tests/unit/agents/test_chat_agent.py
          - backend/tests/unit/agents/test_chat_planner.py
          - backend/tests/unit/agents/test_chat_state.py
          - backend/tests/unit/agents/test_chat_state_routing.py
          - backend/tests/unit/orchestration/test_chat_graph_v0_9.py
          - backend/tests/unit/orchestration/test_chat_graph_skill_routing.py
          - backend/tests/unit/test_chat_graph.py
          - backend/tests/unit/test_chat_planner.py
          - backend/tests/unit/test_chat_runner.py
          - backend/tests/unit/test_chat_finalize.py
          - backend/tests/unit/test_chat_cancel_bus.py
          - backend/tests/unit/test_chat_event_bus.py
          - backend/tests/unit/services/test_chat_session_repo.py
          - backend/tests/unit/test_chat_task_repo.py
          - backend/tests/unit/test_chat_task_model.py
          - backend/tests/unit/router/test_chat_sse_events.py
        gap: ""
      agent:
        status: partial
        methods:
          - llm-as-judge
          - golden-case
          - cassette
        evidence:
          - backend/tests/eval/golden_chat/golden_chat_short.json
          - backend/tests/eval/golden_chat/golden_chat_medium_with_tools.json
          - backend/tests/eval/golden_chat/golden_chat_skill_driven.json
          - backend/tests/eval/golden_chat/golden_chat_escalation_handoff.json
          - backend/tests/eval/golden_chat/golden_chat_multi_chat_reconnect.json
          - backend/tests/eval/golden_chat/conftest.py
          - backend/tests/integration/test_eval_runner_chat_agent_sut.py
          - backend/app/services/judge.py
          - backend/tests/fixtures/cassettes/test_chat_agent_cassette/test_chat_agent_stock_quote_end_to_end.yaml
        gap: >-
          golden_chat/ 目录下 5 个 JSON case 有 judge_rubric 和 fixture loader，
          但目录中无 test_*.py，没有任何测试函数实际用 EvalRunner+Judge 执行这些
          case；L2 cassette test 被 @pytest.mark.skip 跳过（等待 e2e cassette
          重录）。
      system:
        status: partial
        methods:
          - differential-golden
          - sse-integration
          - persistence-integration
          - cancel-retry-integration
        evidence:
          - backend/tests/integration/test_chat_differential_golden.py
          - backend/tests/integration/test_chat_router_sse.py
          - backend/tests/integration/test_chat_persistence_plan1.py
          - backend/tests/integration/test_chat_cancel_retry.py
          - backend/tests/integration/test_chat_inflight_l2.py
          - backend/tests/integration/agents/test_chat_planner_self_managed_e2e.py
          - backend/tests/integration/memory/test_persona_chat_planner_e2e.py
          - backend/tests/e2e/test_chat_title_e2e.py
          - backend/tests/integration/test_chat_agent_e2e_mock.py
        gap: >-
          chat_title_e2e 依赖 serve 进程 + docker，CI 中 skip；无真实多轮对话
          端到端成功率回测；escalation → research_graph 跨子系统路径缺乏 e2e
          覆盖。
      regression:
        status: partial
        methods:
          - stale-scanner-L0
          - cancel-bus-unit
        evidence:
          - backend/tests/unit/test_chat_stale_scanner.py
          - backend/tests/unit/test_chat_cancel_bus.py
        gap: >-
          无针对 chat agent 的混沌注入、投毒、或 LLM 输出漂移检测；stale_scanner
          覆盖自愈路径但不覆盖 agent 行为回归；无在线监控指标收集。

