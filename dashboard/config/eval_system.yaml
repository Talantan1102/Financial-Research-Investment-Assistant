          - backend/tests/unit/orchestration/test_chat_graph_v0_9.py
          - backend/tests/unit/orchestration/test_chat_graph_skill_routing.py
          - backend/tests/unit/test_chat_graph.py
          - backend/tests/unit/test_chat_planner.py
          - backend/tests/unit/test_chat_runner.py
          - backend/tests/unit/test_chat_finalize.py
          - backend/tests/unit/test_chat_cancel_bus.py
          - backend/tests/unit/test_chat_event_bus.py
          - backend/tests/unit/services/test_chat_session_repo.py
          - backend/tests/unit/test_chat_task_repo.py
          - backend/tests/unit/test_chat_task_model.py
          - backend/tests/unit/router/test_chat_sse_events.py
        gap: ""
      agent:
        status: partial
        methods:
