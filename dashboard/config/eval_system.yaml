          - backend/tests/integration/agents/test_chat_planner_self_managed_e2e.py
          - backend/tests/integration/memory/test_persona_chat_planner_e2e.py
          - backend/tests/e2e/test_chat_title_e2e.py
          - backend/tests/integration/test_chat_agent_e2e_mock.py
        gap: >-
          chat_title_e2e 依赖 serve 进程 + docker，CI 中 skip；无真实多轮对话
          端到端成功率回测；escalation → research_graph 跨子系统路径缺乏 e2e
