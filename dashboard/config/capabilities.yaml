        name_en: "Human-in-the-loop"
        derive_rule: { type: code_grep, pattern: 'escalat', path_glob: 'backend/app/agents/**' }
      - id: agent_handoff
        name_cn: "Agent handoff (supervisor + cross-graph)"
        name_en: "Agent handoff"
        derive_rule: { type: code_grep, pattern: '_route_after_planner|EscalationPacket', path_glob: 'backend/app/agents/**' }
