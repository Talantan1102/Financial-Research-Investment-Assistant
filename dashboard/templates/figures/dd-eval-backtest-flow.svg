<svg viewBox="0 0 820 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="本项目深度研报评估全流程:评估题库经三道时钟闸门进入生产流水线,报告过防泄漏扫描后由四把尺子打分,最后落库两张表">
  <style>
    .ddbf-t { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    .ddbf-h { font-size: 13px; fill: #1D1D1F; font-weight: 600; }
    .ddbf-d { font-size: 11px; fill: #6E6E73; }
    .ddbf-tag { font-size: 10.5px; font-weight: 600; }
    .ddbf-arrow { stroke: #C7C7CC; stroke-width: 1.5; fill: none; marker-end: url(#ddbf-head); }
  </style>
  <defs>
    <marker id="ddbf-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" stroke="#C7C7CC" stroke-width="1.4" fill="none"/>
    </marker>
  </defs>

  <g class="ddbf-t">
    <!-- ① 题库 -->
    <text x="40" y="28" class="ddbf-tag" fill="#86868B">① 评估题库:40 道固定题</text>
    <rect x="40" y="40" width="244" height="88" rx="10" fill="#FFFFFF" stroke="rgba(60,60,67,0.18)"/>
    <text x="56" y="64" class="ddbf-h">8 家公司 × 5 个评估时点</text>
    <text x="56" y="84" class="ddbf-d">白马 / 成长 / 周期 / 困境反转 /</text>
    <text x="56" y="99" class="ddbf-d">造假退市 / 银行 / 医药 / 受制裁科技</text>
    <text x="56" y="114" class="ddbf-d">——防"只会评好公司"</text>

    <rect x="304" y="40" width="240" height="88" rx="10" fill="rgba(94,92,230,0.07)" stroke="rgba(94,92,230,0.45)"/>
    <text x="320" y="64" class="ddbf-h" fill="#4845C2">本例题目</text>
    <text x="320" y="86" class="ddbf-d">贵州茅台 600519.SH</text>
    <text x="320" y="103" class="ddbf-d">时钟拨回 2024-06-30 出一份研报</text>

    <rect x="564" y="40" width="216" height="88" rx="10" fill="#FFFFFF" stroke="rgba(60,60,67,0.18)"/>
    <text x="580" y="64" class="ddbf-h">无泄漏副线 8 道</text>
    <text x="580" y="84" class="ddbf-d">截止日 2026-04-30,</text>
    <text x="580" y="99" class="ddbf-d">在评委模型知识截止之后,</text>
    <text x="580" y="114" class="ddbf-d">作完全无泄漏的对照</text>

    <path d="M424,128 L424,160" class="ddbf-arrow"/>

    <!-- ② 三道时钟闸门 -->
    <text x="40" y="176" class="ddbf-tag" fill="#86868B">② 三道时钟闸门(回测隔离:报告"手里的材料"全部回到截止日之前)</text>
    <rect x="40" y="188" width="236" height="92" rx="10" fill="#FBFBFD" stroke="rgba(94,92,230,0.35)"/>
    <text x="54" y="211" class="ddbf-h">行情数据闸门</text>
    <text x="54" y="231" class="ddbf-d">tushare 请求注入截止日参数,</text>
    <text x="54" y="246" class="ddbf-d">返回行再按公告日二次过滤</text>
    <text x="54" y="261" class="ddbf-d">(双层防御,防接口多给)</text>

    <rect x="292" y="188" width="236" height="92" rx="10" fill="#FBFBFD" stroke="rgba(94,92,230,0.35)"/>
    <text x="306" y="211" class="ddbf-h">知识库闸门</text>
    <text x="306" y="231" class="ddbf-d">检索只放行发布日期 ≤ 截止日</text>
    <text x="306" y="246" class="ddbf-d">的研报切块;候选多取一倍,</text>
    <text x="306" y="261" class="ddbf-d">防过滤后不够用</text>

    <rect x="544" y="188" width="236" height="92" rx="10" fill="#FBFBFD" stroke="rgba(94,92,230,0.35)"/>
    <text x="558" y="211" class="ddbf-h">评委换模</text>
    <text x="558" y="231" class="ddbf-d">写报告与打分强制不同源:</text>
    <text x="558" y="246" class="ddbf-d">deepseek-v4-flash / qwen-plus /</text>
    <text x="558" y="261" class="ddbf-d">qwen-max 三评委交叉打分</text>

    <path d="M410,280 L410,312" class="ddbf-arrow"/>

    <!-- ③ 生产流水线 + 防泄漏扫描 -->
    <text x="40" y="328" class="ddbf-tag" fill="#86868B">③ 生产流水线照常跑(评估不改生产代码,只换它"手里的材料")</text>
    <rect x="40" y="340" width="464" height="96" rx="10" fill="#FFFFFF" stroke="rgba(60,60,67,0.18)"/>
    <text x="56" y="364" class="ddbf-h">五个分工智能体 + 评审环节,生成六节研报</text>
    <rect x="56" y="378" width="68" height="22" rx="6" fill="rgba(94,92,230,0.08)"/>
    <text x="62" y="393" class="ddbf-d" fill="#4845C2">公司概览</text>
    <rect x="130" y="378" width="68" height="22" rx="6" fill="rgba(94,92,230,0.08)"/>
    <text x="136" y="393" class="ddbf-d" fill="#4845C2">合规资质</text>
    <rect x="204" y="378" width="68" height="22" rx="6" fill="rgba(94,92,230,0.08)"/>
    <text x="210" y="393" class="ddbf-d" fill="#4845C2">财务分析</text>
    <rect x="278" y="378" width="68" height="22" rx="6" fill="rgba(94,92,230,0.08)"/>
    <text x="284" y="393" class="ddbf-d" fill="#4845C2">行业分析</text>
    <rect x="352" y="378" width="68" height="22" rx="6" fill="rgba(94,92,230,0.08)"/>
    <text x="358" y="393" class="ddbf-d" fill="#4845C2">风险评估</text>
    <rect x="426" y="378" width="68" height="22" rx="6" fill="rgba(94,92,230,0.08)"/>
    <text x="432" y="393" class="ddbf-d" fill="#4845C2">综合研判</text>
    <text x="56" y="424" class="ddbf-d">每节 = 叙述 + 引用切块列表;财务节另有关键指标表,风险节分四桶</text>

    <rect x="524" y="340" width="256" height="96" rx="10" fill="rgba(255,59,48,0.05)" stroke="rgba(255,59,48,0.30)"/>
    <text x="540" y="364" class="ddbf-h" fill="#C2403B">防泄漏扫描</text>
    <text x="540" y="384" class="ddbf-d">正则扫六节正文里的所有日期,</text>
    <text x="540" y="399" class="ddbf-d">出现晚于 2024-06-30 的日期</text>
    <text x="540" y="414" class="ddbf-d">→ 整轮判失败。防的是模型</text>
    <text x="540" y="429" class="ddbf-d">"凭记忆穿越"写出未来信息</text>
    <path d="M504,388 L518,388" class="ddbf-arrow"/>

    <path d="M272,436 L272,468" class="ddbf-arrow"/>

    <!-- ④ 四把尺子 -->
    <text x="40" y="484" class="ddbf-tag" fill="#86868B">④ 四把尺子独立打分(各管报告的一块,详见下一张图)</text>
    <rect x="40" y="496" width="178" height="78" rx="10" fill="rgba(94,92,230,0.07)" stroke="rgba(94,92,230,0.40)"/>
    <text x="54" y="519" class="ddbf-h" fill="#4845C2">引用核对</text>
    <text x="54" y="538" class="ddbf-d">引的切块真的支撑</text>
    <text x="54" y="553" class="ddbf-d">这句话吗</text>

    <rect x="228" y="496" width="178" height="78" rx="10" fill="rgba(52,199,89,0.07)" stroke="rgba(52,199,89,0.40)"/>
    <text x="242" y="519" class="ddbf-h" fill="#1B7A33">数值核对</text>
    <text x="242" y="538" class="ddbf-d">财务数字对 tushare</text>
    <text x="242" y="553" class="ddbf-d">真值,容差 ±1%</text>

    <rect x="416" y="496" width="178" height="78" rx="10" fill="rgba(255,159,10,0.08)" stroke="rgba(255,159,10,0.45)"/>
    <text x="430" y="519" class="ddbf-h" fill="#B26A00">风险配对</text>
    <text x="430" y="538" class="ddbf-d">每条风险是否配了</text>
    <text x="430" y="553" class="ddbf-d">有效的缓解措施</text>

    <rect x="604" y="496" width="178" height="78" rx="10" fill="rgba(0,122,255,0.06)" stroke="rgba(0,122,255,0.35)"/>
    <text x="618" y="519" class="ddbf-h" fill="#0A6CD6">多模型评委</text>
    <text x="618" y="538" class="ddbf-d">三评委 1-10 分共识,</text>
    <text x="618" y="553" class="ddbf-d">分歧大送人工复核</text>

    <path d="M410,574 L410,602" class="ddbf-arrow"/>

    <!-- ⑤ 落库 -->
    <text x="40" y="616" class="ddbf-tag" fill="#86868B">⑤ 全部落库,跨版本可比</text>
    <rect x="40" y="626" width="740" height="42" rx="10" fill="rgba(52,199,89,0.07)" stroke="rgba(52,199,89,0.40)"/>
    <text x="56" y="652" class="ddbf-d">两张表:每题一行评分明细(分项 + 失分日志)· 每轮一行汇总(git 版本号 / 消融变体 / 评委模型)——回答"这次改动让报告变好还是变坏"</text>
  </g>
</svg>
