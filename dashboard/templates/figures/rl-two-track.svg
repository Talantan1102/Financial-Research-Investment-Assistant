<svg viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="本产品 RL 两轨结构与奖励物理隔离">
  <style>
    .tt-t { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    .tt-h { font-size: 13px; fill: #1D1D1F; font-weight: 600; }
    .tt-d { font-size: 11px; fill: #6E6E73; }
    .tt-li { font-size: 11px; fill: #3A3A3C; }
  </style>
  <g class="tt-t">
    <text x="40" y="26" font-size="11" font-weight="600" fill="#86868B">本产品两类任务 → 两条独立的轨道(你 eval 侧已经长成这个形状)</text>

    <!-- 左轨 计算类 -->
    <rect x="40" y="40" width="350" height="270" rx="12" fill="rgba(52,199,89,0.06)" stroke="rgba(52,199,89,0.40)"/>
    <text x="58" y="66" class="tt-h" fill="#1B7A33">计算类轨(可验证)</text>
    <text x="58" y="86" class="tt-d">取数 / 算式 / 对账,有确定性真值</text>

    <rect x="58" y="98" width="314" height="40" rx="8" fill="#FFFFFF" stroke="rgba(52,199,89,0.30)"/>
    <text x="72" y="114" class="tt-li" font-weight="600">奖励 = oracle(规则,纯 Python 估值器 / tushare ±容差)</text>
    <text x="72" y="130" class="tt-d">确定可复现,零判官,结构上规避 reward hacking</text>

    <rect x="58" y="146" width="314" height="40" rx="8" fill="#FFFFFF" stroke="rgba(52,199,89,0.30)"/>
    <text x="72" y="162" class="tt-li" font-weight="600">数据 = oracle 反向生成(免费,见数据流水线图)</text>
    <text x="72" y="178" class="tt-d">真值算出来不用标,几百条可起步</text>

    <rect x="58" y="194" width="314" height="40" rx="8" fill="rgba(52,199,89,0.10)" stroke="rgba(52,199,89,0.45)"/>
    <text x="72" y="210" class="tt-h" fill="#1B7A33">→ RL 主战场(GRPO,outcome reward)</text>
    <text x="72" y="226" class="tt-d">这是你打得赢、性价比最高的地方</text>

    <text x="58" y="258" class="tt-d" font-weight="600">本产品资产:numerical_metric(确定性)、</text>
    <text x="58" y="274" class="tt-d">valuation_helpers(浮点逐位可复现)、</text>
    <text x="58" y="290" class="tt-d">tushare 缓存(入参 hash→快照)</text>

    <!-- 右轨 分析类 -->
    <rect x="430" y="40" width="350" height="270" rx="12" fill="rgba(255,159,10,0.07)" stroke="rgba(255,159,10,0.40)"/>
    <text x="448" y="66" class="tt-h" fill="#B26A00">分析类轨(无绝对标签)</text>
    <text x="448" y="86" class="tt-d">观点 / 逻辑 / 报告质量,只能主观判</text>

    <rect x="448" y="98" width="314" height="40" rx="8" fill="#FFFFFF" stroke="rgba(255,159,10,0.30)"/>
    <text x="462" y="114" class="tt-li" font-weight="600">奖励 = rubric / judge(三裁判 + 换序 + 长度控制)</text>
    <text x="462" y="130" class="tt-d">噪声,易 hack(长度/谄媚/编引用)</text>

    <rect x="448" y="146" width="314" height="40" rx="8" fill="#FFFFFF" stroke="rgba(255,159,10,0.30)"/>
    <text x="462" y="162" class="tt-li" font-weight="600">数据 = K2 式轨迹/画像合成 + rubric 标签</text>
    <text x="462" y="178" class="tt-d">自然度白给,但标签只能 judge</text>

    <rect x="448" y="194" width="314" height="40" rx="8" fill="rgba(255,159,10,0.12)" stroke="rgba(255,159,10,0.45)"/>
    <text x="462" y="210" class="tt-h" fill="#B26A00">→ SFT / 顶多 DPO 排序,RL 别碰</text>
    <text x="462" y="226" class="tt-d">奖励太软,outcome-RL 一优化就被 game</text>

    <text x="448" y="258" class="tt-d" font-weight="600">可借可验证骨架防 hacking:</text>
    <text x="448" y="274" class="tt-d">引用核对(citation)、过程检查</text>
    <text x="448" y="290" class="tt-d">(调对工具吗)—— 半根脊梁</text>

    <!-- 中间隔离线 -->
    <line x1="410" y1="48" x2="410" y2="302" stroke="#FF3B30" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- 底部:物理隔离 -->
    <rect x="40" y="326" width="740" height="76" rx="10" fill="rgba(255,59,48,0.05)" stroke="rgba(255,59,48,0.35)"/>
    <text x="58" y="350" class="tt-h" fill="#C2403B">⛔ 奖励物理隔离:两条信号永不混成一个数</text>
    <text x="58" y="372" class="tt-d">别搞 reward = 0.6×oracle + 0.4×judge —— 可 hack 的 judge 信号会渗进、污染那条干净的 oracle 信号,</text>
    <text x="58" y="390" class="tt-d">模型学会牺牲可验证正确性去哄裁判。混合任务(如 DD 报告)最容易犯:要么 RL 只训可验证子任务,要么逻辑改进走 DPO 独立阶段。</text>

    <text x="40" y="428" class="tt-d" font-style="italic">这跟 K2 的两轨(RLVR 可验证 + 自我批判 rubric 开放)结构同构;你的代码独立验证了这个形状是对的。</text>
    <text x="40" y="448" class="tt-d" font-style="italic">"分析类不进 RL 奖励" ≠ "分析类不训练"——它照样可以 SFT / DPO / rubric-eval,只是不做结果奖励的 RL。</text>
  </g>
</svg>
