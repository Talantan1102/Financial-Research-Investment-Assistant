<span class="chip {{ c.status }}"
      id="cap-{{ c.id|replace('.', '-') }}"
      title="{{ c.id }}"
      hx-get="/capability/{{ c.id }}/edit"
      hx-target="this"
      hx-swap="outerHTML">
  {{ c.name_cn }}
  {% set cf = c.confidence if c.confidence is defined else 0 %}
  {% if cf and cf > 0 %}
    <span class="conf-dots" aria-label="confidence {{ cf }}/5">
      {% for i in range(cf) %}<i></i>{% endfor %}
    </span>
  {% endif %}
  {% if c.derived_status != c.status %}<span class="stale-mark" aria-hidden="true">·</span>{% endif %}
</span>
