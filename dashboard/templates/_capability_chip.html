<span class="chip {{ c.status }}" id="cap-{{ c.id|replace('.', '-') }}" title="{{ c.id }}">
  {% if c.status == 'lit' %}✅{% elif c.status == 'wip' %}🟠{% else %}⬜{% endif %}
  {{ c.name_cn }}
  {% if c.derived_status != c.status %}<span class="stale-mark" title="手填覆盖派生状态({{ c.derived_status }})">✏️</span>{% endif %}
</span>
