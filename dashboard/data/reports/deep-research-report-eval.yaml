# dashboard/data/reports/deep-research-report-eval.yaml
# ============================================================================
# 研究报告:深度研报怎么评估
# ----------------------------------------------------------------------------
# 来源:2026-06-02 联网调研(RAGAS/FActScore/SAFE/VeriScore/G-Eval/ALCE/
# AttributionBench/DeepResearch Bench/GAIA/StarMine/Barber 2001 等 6 角度 50+ 源)
# + 逐条事实核查(13 agent / 43 条方法保留)综合 + 对照本项目研报评估的 5 把尺子。
# 由 dashboard/derive/report.py 类型化加载,渲染于 /eval/report/<slug>。
# 必填字段缺失会 fail loud(报告自己也得"被评估")。
#
# 写作约定:不用内部编号(如 M1)和裸缩写(如 F1/NLI);工具与论文的真名保留,
# 但每个统计概念都配一句大白话解释,读者不必背术语也能看懂。
# ============================================================================
slug: deep-research-report-eval
title: "深度研报 · 怎么评估"
subtitle: "用具体例子讲明白:7 个评估维度,每个配一个实例,并对照本项目现有的研报评估"
meta:
  date: "2026-06-02"
  basis: "6 角度联网调研(RAGAS/FActScore/SAFE/VeriScore/G-Eval/ALCE/DeepResearch Bench/GAIA/StarMine)+ 逐条事实核查 + 对照本项目现有研报评估"

summary: >-
  一篇 AI 生成的"深度研报"(对某只股票的估值、风险、投资论点、预测做长篇分析)没有唯一标准答案,
  不能像选择题那样用一个准确率打分。业界和学术界的做法是:把"这篇报告好不好"拆成若干可独立衡量的维度,
  每个维度再拆成可逐条核验的小单元(原子事实 / 引用对 / 预测数字),最后聚合成分数。一句话:普通问答评
  "答得准",深度研报评"事实不编、引用对得上、数字算得准、预测扛得住回测,而且评分员自己别被偏差带偏"。

sections:
  - heading: "为什么深度研报不能用一个准确率打分"
    body: "四个要点,说人话:"
    bullets:
      - "拆成原子单元才可核——把长报告拆成一条条原子事实 / 引用对 / 预测数字逐条判,再汇总成'说得对的比例'和'该说的没漏的比例';整篇笼统打一个分会掩盖短板(基线模型整体看着还行,时间题/对抗题可能掉到个位数)。"
      - "硬事实和观点要分开评——'2024 营收同比增长 30%'是可核查的硬事实,'护城河稳固'是观点;只该去核前者,别把观点/比喻当事实去判真伪。"
      - "自动评估器本身也会错——让程序去判'引用支不支撑''数字对不对',最强的自动评判器准确率也只有约 78–82%,且最容易在具体日期/数字上看走眼;数值密集的财报场景必须配人工抽检。"
      - "评分员有系统性偏差——让大模型当评委,它有位置偏好、偏爱自己同款模型写的、偏爱更长的答案;不纠正,打出的分会骗人。评委必须跟写报告的模型不同源、对比要正反各跑一遍、评分尽量做'是/否'两档。"

# 核心:7 个能力维度,每个配完整实例(铺垫→问→好答→坏答→怎么判分)
dimensions:
  - name: "① 忠实度 / 不编造(Faithfulness)"
    plain: "报告里写的每条事实,是否都能在它'手里的材料'(检索到的上下文/来源)里找到支撑——防幻觉第一关。"
    setup: "报告手里的材料明确写着'贵州茅台 2024 上半年营收 834 亿元、同比增长 18%',报告据此写了一句结论句。"
    question: "把这句结论拆成原子事实,逐条问:能不能被上面这段材料支撑?"
    good: "'营收约 834 亿、同比增长'——拆成 2 个原子事实都能在材料里对上,2 条全中,忠实度得分 = 2/2 = 1.0。"
    bad: "'营收 834 亿、同比增长 28%'——增速被写成 28%(材料是 18%),2 条只中 1 条,忠实度得分 = 1/2 = 0.50。"
    scored: "代表工具 RAGAS、DeepEval:把答案拆成一条条原子陈述,逐条判断'它能不能从材料里推出来',得分=被支撑的条数÷总条数(常用及格线 0.5)。TruLens 的同类做法叫 Groundedness,而且不需要标准答案就能评。"

  - name: "② 事实性逐条核查(Atomic Fact-Checking)"
    plain: "比忠实度更进一步:把长文拆成原子事实,每条去可靠外部知识源检索证据判真伪,再汇总成'说得对的比例'和'该说的没漏的比例'。"
    setup: "报告里一段对宁德时代的描述:'2011 年成立,2018 年深交所上市,2024 年动力电池全球市占率第一'。"
    question: "把这段拆成 3 条原子事实,逐条去外部权威源(公司公告 / 维基百科)核,有几条为真?"
    good: "三条都可核实,得分 = 3/3 = 1.0;好报告只写'可被独立核实'的硬事实。"
    bad: "把上市年份写成 2016(实际 2018),3 条中 2 条对,得分 ≈ 0.67;实体越冷门、数字越细,越容易错。"
    scored: "代表工具 FActScore:逐条对维基百科核(论文实测 ChatGPT 写人物传记只有约 58% 为真,越冷门的人物掉到 16%)。SAFE 更进一步,让模型自己去发 Google 搜索逐条查证,并同时看'说得对'和'说得全'。VeriScore 只核可核查的事实、把'护城河稳固'这类观点丢掉不核。⚠ 逐条核查很慢,后续工作 VeriFastScore 把它合并成一次性抽取+校验,快了约 6.6 倍。"

  - name: "③ 引用可溯源(Citation / Attribution)"
    plain: "每句带引用的话,它挂的来源是否真的支撑这句——不是'有没有引用',而是'引用对不对'。投研结论必须能溯源,这是研报的命门。"
    setup: "报告写'贵州茅台毛利率连续三季提升',句末挂了 3 个引用 [研报A][研报B][研报C]。"
    question: "这句话被它挂的来源整体支撑吗?有没有挂了无关的引用?"
    good: "[A][B] 都提到毛利率逐季上行 → '该引到的引到了'(召回)命中;3 篇都相关 → '没乱挂'(精准)满分。"
    bad: "[C] 整篇没提毛利率(去掉它,剩下的仍完全支撑这句)→ [C] 判为多余引用,精准分被扣;若三篇全没提毛利率 → 召回也挂(=凭空捏造的引用)。"
    scored: "代表工具 ALCE:按句切开,判两件事——这句被它引用的来源整体支撑吗(召回),挂的每条引用是不是真有用、没乱挂(精准)。DeepResearch Bench 的引用检查更狠,真去爬被引网址、逐条验证支不支撑。⚠ 研究(AttributionBench)发现:即便最强的自动判引用程序,准确率也只有约 78–82%(不给示例直接用只有 66%),六成以上的错都出在'具体日期/人名/数字看走眼';专家策展的 ExpertQA 里高风险领域约 51% 的来源被专家判为不可靠 → 财报场景必须配人工抽检。"

  - name: "④ 数值准确 + 检索质量(Numerical & Retrieval)"
    plain: "报告里的数字对不对(静态核对),以及对检索增强(RAG)系统——检索回来的材料够不够好(漏没漏关键证据、有用的有没有排前面)。数字错了,结论全塌。"
    setup: "报告给出一组财务数字,标准答案有 4 个关键指标;检索回 4 段材料,相关性是 [相关, 无关, 相关, 无关]。"
    question: "报告的数值对了几个?检索把相关材料排前面了吗?"
    good: "4 个数字对 3 个(说对的比例 0.75)、该覆盖的 2 个都覆盖(该说的没漏,比例 1.0),综合分 ≈ 0.857;相关材料排在前面,检索排序得分 ≈ 0.833。"
    bad: "把'毛利率 32.1%'写成'23.1%'(数字颠倒)直接扣分;关键材料被排在无关材料之后,检索排序得分掉下来。"
    scored: "代表工具 RAGAS:用一个同时惩罚'说错'和'漏说'的综合分衡量数值正确性;再用检索排序/覆盖两个指标看检索质量。硬验证一端用 GAIA(466 道题,答案对就得分、错就不得分,客观判定无需大模型:人类做对 92%,GPT-4 加插件只有 15%)和 BrowseComp(1266 道'极难搜、答案唯一'的题)。"

  - name: "⑤ 预测可回测(Forecast Backtesting)· 金融特有(本项目已下线)"
    plain: "⚠ 本项目已主动下线此维 —— 深度研报『去推荐化』(2026-06-04 决策)后不再产出评级 / 目标价 / 预测,没有预测对象可回测;此维作为『深度研报评估』方法论的完整一环保留在此,并附本项目为何不采用。原义:研报最硬核的检验,对未来的预测(每股收益 / 目标价 / 评级)用截止日之后的真实行情来验证——准不准、方向对不对、按它操作能不能赚钱;别的评估都没有这一维。"
    setup: "报告 2024-06 给贵州茅台目标价 120 元(现价 100 元)、评级'买入'。一年后:股价年中摸到 121 元、年底收在 108 元。"
    question: "这个目标价算命中吗?方向对吗?误差多大?"
    good: "先说清口径再答——按'期内任意时点摸到就算命中'是命中(121>120),按'看期末收盘'是没中(108<120);误差幅度 = |108−120|÷120 = 10%;方向(看涨、也确实涨了)对。"
    bad: "不说口径直接报'命中/没中';只说中没中、不报差多远;不扣交易成本就吹'按它操作能赚钱'。"
    scored: "目标价命中率(按期末收盘只有约 26–38% 命中,按期内任意时点摸到约 64%,口径必须写清)+ 误差幅度;盈利预测误差(预测的每股收益减实际,带正负号能看出是系统性高估还是低估);把评级分组做组合回测看超额收益(Barber 等 2001:最被看好组年化 18.8%、最不被看好组 5.78%,但 ⚠ 扣掉交易成本后,净超额收益就不再可靠为正了)。"

  - name: "⑥ 大模型当评委 与 偏差纠正(LLM-as-Judge)"
    plain: "报告里大量'没有标准答案'的维度(论点是否自洽、风险是否配缓解、行文是否清晰)只能让大模型当评委打分。但评委有系统性偏差,不纠偏的分数会骗人。"
    setup: "给评委一句评分准则:'报告列出的每个风险是否都配了缓解措施';报告列了 5 个风险,其中 4 个写了缓解。"
    question: "这条准则该打几分?怎么防评委自己的偏差?"
    good: "代表工具 G-Eval:让评委先自动展开评分步骤,再综合给分 → 约 0.8,并指出缺哪个;同时让评委跟写报告的模型不同源、两份对比时正反各跑一遍以抵消位置偏好。"
    bad: "让和写报告同款的模型来打分(偏爱自己人,这种偏差实测可达 0.52);两份对比只跑一遍(约 18% 的对比换个先后顺序赢家就变了);评分用三档(三档的人机一致性比'是/否'两档低约 20 个百分点)。"
    scored: "G-Eval(让评委自动展开步骤再给分,在摘要任务上与人工打分的相关性约 0.51);评分准则尽量拆成'是/否'两档(DeepResearch Bench II 拆了 9430 条、Scale AI 的 ResearchRubrics 明令禁止让大模型自行扩写准则);Expert-Consulting 基准给每题配平均 13.8 个'机器精确核验'的硬检查点 + 故意埋'认知陷阱'(顶级 agent 接受率也只有约 9.5%);ARES 用少量人工标注做统计校准,给排名配上 95% 置信区间。"

  - name: "⑦ 报告级综合基准(Report-Level Benchmark)"
    plain: "前面是单点指标,这一维把多个维度合成'一份报告整体值多少分',并能横向比不同 agent。"
    setup: "要给两个深度研究 agent 生成的同题研报排名,沿全面性 / 深度 / 指令遵循 / 可读性 4 个维度评。"
    question: "怎么打出可比、且与人类判断一致的整体分?"
    good: "代表基准 DeepResearch Bench 的 RACE 方法——拿待评报告对照一份高质量参考报告打'相对分',评委与人类判断一致率 72.56%。"
    bad: "不给参考报告、让评委凭空打绝对分(没有参考对照时与人类一致率只有 60.46%,而且同一篇重打分数会飘)。"
    scored: "RACE(对照参考报告、沿 4 维打相对分;实测排行榜 Gemini 深度研究 48.88 > OpenAI 深度研究 46.98 > Perplexity 42.25,单次评测约 0.13 美元);Giskard RAGET 把检索增强系统拆成生成/检索/改写等组件,定位是哪一块拖后腿;Researchy Questions 提供约 9.6 万道真实研究型问题当题源。"

benchmarks:
  - name: "RAGAS / DeepEval / TruLens(检索增强报告的评测框架)"
    what: "可直接调用的指标库:忠实度、答案相关性、检索精准/覆盖、数值正确性。DeepEval 把它做成像写测试一样的阈值断言(默认及格线 0.5),TruLens 的三件套不需要标准答案就能评。"
    fit: "和本项目'引用抽取核对''数值核对'这两把尺子同源——把'拆成一条条 claim、逐条判被来源支撑、算支撑比例'这层补进来落地成本最低,普通大模型即可,不必上专门的判定模型。"
  - name: "FActScore / SAFE / VeriScore(长文事实性)"
    what: "拆原子事实逐条对外部源核:FActScore 对维基百科(ChatGPT 传记只有约 58% 为真);SAFE 让模型自己发 Google 搜索逐条查证、同时看对与全(比人工便宜约 20 倍);VeriScore 只核可核查的事实、把观点和比喻丢掉。"
    fit: "VeriScore'区分硬事实段落和投资观点段落'的思路最该借鉴——研报里两类内容混杂,不该拿一把尺子量。"
  - name: "ALCE / AttributionBench / ExpertQA(引用可溯源)"
    what: "ALCE 按句切开判'该引的引到了没'和'有没有乱挂引用';AttributionBench 专门评'判引用的程序本身有多准'(上限约 78–82%,六成以上的错出在具体数字/日期);ExpertQA 是专家策展的长答案(高风险领域约 51% 来源不可靠)。"
    fit: "直接坐实'让程序判引用、在财报数字场景必须配人工抽检'——给'引用抽取核对'设一个固定比例的人工抽检兜底。"
  - name: "DeepResearch Bench(RACE 整体打分 + 引用核查)"
    what: "100 道博士级任务;RACE 方法对照参考报告沿 4 维打相对分(与人类一致 72.56%,去掉参考对照掉到 60.46%);引用核查环节真去爬被引网址、逐条验证。排行榜 Gemini 深度研究 > OpenAI 深度研究 > Perplexity。"
    fit: "本项目最该对标的'报告级'尺子——给每只票备一份'参考研报'做对照打分,能把整体评委打分与人类的一致性显著拉高。"
  - name: "GAIA / BrowseComp(硬匹配基准)"
    what: "GAIA 466 道题,答案对就得分、错就不得分(客观判定无需大模型,人类 92% vs GPT-4 加插件 15%);BrowseComp 1266 道倒着构造的'极难搜、答案唯一'题。"
    fit: "数值/事实核对的'硬'版本——本项目'数值核对'可借它的思路,把关键数字交给精确匹配,而不是让大模型软判。"
  - name: "金融:盈利预测误差 / 目标价命中 / 推荐回测 / StarMine"
    what: "盈利预测误差(预测减实际、带正负号能看出系统性高估);目标价命中率(按期末收盘约 30% vs 按期内摸到约 64%)+ 误差幅度;把评级分组做组合回测看超额收益(扣成本后净收益不再可靠为正);LSEG StarMine 按'历史准确度+时效性'给分析师加权。"
    fit: "本项目'预测回测'这把尺子的学术/业界后盾——补一个'乐观偏差'子维度 + 推荐回测强制计交易成本,正是这些工作的核心教训。"

pitfalls:
  - "别用一个总分打整篇报告:会掩盖短板(整体看着还行,时间/对抗/数值某一轴可能掉到个位数)。务必按维度分项报数。"
  - "别把观点当事实去核:'护城河稳固''看好未来三年'是观点,不是可核查事实;只该去核硬事实——研报尤其要把硬事实段落和观点段落分开处理。"
  - "让程序判引用、判数字不可全信:最强的自动评判器准确率也只有约 78–82%,且最容易在具体日期/数字上看走眼。结论:数值密集场景必须配人工抽检兜底。"
  - "目标价命中率不写口径会误导:按期末收盘约 30% vs 按期内任意时点摸到约 64%,差近一倍。报命中率必须同时说明口径,并配'差多远'的误差幅度。"
  - "推荐回测不扣交易成本会高估研报价值:Barber 等 2001 的经典结论——毛收益看着漂亮,扣掉来回换手的交易成本后,净超额收益不再可靠为正。"
  - "评委偏差不纠正分数会骗人:偏爱自己同款模型(偏差可达 0.52)、位置偏好(约 18% 的对比换序就变赢家)、偏爱更长答案都很普遍;评委跟写报告的模型不同源、对比正反各跑一遍、评分两档化,是三条必做护栏。"
  - "厂商自评博客打折扣:换个评委、换个口径就能让分数不可比(同一基准不同口径能差 20 多分),横评要拆开按维度看、查清各家配置。"

# 对照本项目现有的研报评估(5 把尺子):现状 + 可补什么
gaps:
  - component: "引用抽取核对"
    current: "抽出报告里的'事实+引用'对,算'引用抽得准不准'和'该有引用的覆盖了多少'。对应外部的 ALCE / FACT 这一层。"
    suggestion: "在它上面再加一层'忠实度比率'(像 RAGAS/FActScore 那样:拆成一条条 claim → 逐条判被来源支撑 → 算支撑比例),能直接定位是哪条 claim 没据;并按 VeriScore 思路把硬事实段落和投资观点段落分开评。"
  - component: "数值核对(±1% 容差)"
    current: "对 4 类数值指标按 ±1% 容差逐项比对,并把中文数字归一。对应外部的 RAGAS 数值正确性 / GAIA 精确匹配。"
    suggestion: "加一道'机器精确核验'的硬护栏:像'2024 三季度毛利率 32.1%'这种应走精确匹配的'对/错'判定,而不是交给大模型软判(自动评判器恰恰在具体数字上最易错);再叠加'认知陷阱'题,看 agent 是否真读懂了源材料里的约束。"
  - component: "风险与缓解措施配对"
    current: "评委判每个风险是否配了有效的缓解措施,分 4 档桶。本身就是一条评分准则。"
    suggestion: "把打分口径明确改成'是/否'两档(三档/部分给分的人机一致性比两档低约 20 个百分点),并锁定执行这条评分的模型跟写报告的模型不同源,避免偏爱自己人。"
  - component: "预测回测(方向 / 目标价命中 / 风险预警率)— 已下线"
    current: "原设计:用截止日之后的真实行情验证方向对不对、目标价中没中、风险预警率,是很多纯文本评估都没有的优势维度。但 2026-06-04『去推荐化』决策后,报告不再产出评级 / 目标价 / 预测,此维没有评测对象,整把尺子下线(评估由五把尺子缩为四把)。"
    suggestion: "不再改进此维,而是移除整条预测回测链路。附带收益:它是唯一需要『截止日之后的真相』来打分的尺子,删掉后最大的数据泄漏隐患(裁判模型『记得未来』)随之消失,全部 40 个金标准 case 都能报真数(不再只有 8 个 sanity)。删后金融差异化改由数值核对(对 Tushare 真值)+ 多模型估值 cross-check + 多空辩论承担。"
  - component: "三个模型当评委 · 多数决"
    current: "3 个大模型各打分取多数决,并审计它们的分歧。对应外部的 G-Eval / ARES。"
    suggestion: "加偏差纠正护栏:评委跟写报告的模型强制不同源、对比正反各跑一遍抵消位置偏好、评分两档化;并引入'对照参考报告打相对分'的整体评法(给每只票备一份参考研报,实测能让与人类的一致性高约 12 个百分点)+ 像 ARES 那样给排名配置信区间。"
  - component: "整体评估框架"
    current: "5 把尺子 + 四种消融对照,按题型分发到各尺子。"
    suggestion: "(1) 把每次评测花的 token / 延迟成本也当成一等指标进评估(别只躺在卡片里);(2) 引入'对照参考报告'的整体评法做不同 agent 的横向对比;(3) 给'让程序判引用/判数字'设固定比例的人工抽检兜底。"

