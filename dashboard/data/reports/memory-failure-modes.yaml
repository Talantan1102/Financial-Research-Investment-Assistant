slug: memory-failure-modes
title: "长期记忆 · 故障模式与造题"
subtitle: "四个能力维度怎么翻车:30+ 种经事实核查的故障模式 × 9 个完整造题示例,对照本项目记忆评估体系重建"
meta:
  date: "2026-06-04"
  basis: "两轮 workflow 调研(150 agent 并行检索 + 逐条对抗核查,127 条存活/毙 4 条)+ 跨维度查重拍板"

summary: >-
  这份报告回答一个问题:一个长期记忆系统会以哪些方式悄悄坏掉,以及怎么写题把每种坏法钉死。
  它是《跨会话记忆 · 怎么评估》的姊妹篇——那篇定了评估的六个能力维度,这篇把其中四个最该重建的维度
  (知识更新 / 偏好一致 / 时间推理 / 克制弃答)逐个拆到故障模式级:每种模式怎么发生、工业界谁踩过、
  题怎么造、判分怎么写。所有模式都经过"联网调研 → 逐条找原文反驳 → 查不到佐证就毙"的对抗核查,
  并做了跨维度查重(同一故障不在两个维度重复计分)。一条贯穿的发现:四个维度各自冒出了同一家族的判法
  ——「同一道题变换一个无关因素(检索顺序/证据位置/日期写法/问法),断言答案不变」,
  这类"不变量开关"可以做成评估 runner 的统一机制,挂在任何题上白拿一层鲁棒性检验。
  (先约定几个高频词:写管线 = 用户说话→抽取事实→写进记忆库这半边;读管线 = 提问→检索→生成回答那半边;
  数据库断言 = 对话喂完后直接查库验证"记没记对",零模型参与、不会撒谎;假前提 = 问题里预设了一件历史上没发生的事。)

sections:
  - heading: "知识更新:八种机制——最致命也最容易翻车的一轴"
    body: "用户后面的话推翻/修正前面的话,系统要认出旧的作废了。八种经核查的故障机制:"
    bullets:
      - "单事实更新的四种表达形态(同一个冲突消解器的难度梯子):直接推翻('看多观点我收回')、间接指代推翻('那只新能源清了'——要先认出指谁)、部分更新('三年改两年'但持有逻辑要延续不丢)、撤回更正('我说错了'——这话本身错了,和'事实后来变了'是两种不同的作废)。LongMemEval 实测知识更新题上商用助手准确率仅 0.208;Mem0 真实事故:矛盾陈述被判成新增,新旧两条并存。"
      - "多跳叠加更新:沿着事实链推理时每一跳都要取最新版本——MemoryAgentBench 实测所有方法最高只有约 6% 准确率,是全行业崩得最狠的一题(也因此是难度锚点:做到 30% 就值得写进作品叙事)。"
      - "重复去重的正反两面:同一事实反复说不该重复建边(Mem0 真实审计:10134 条记忆 97.8% 是垃圾,'用户偏好 Telegram'存了 200 多遍);反过来,高度相似也不能误删(Mem0 另一事故:相似度 0.99999726 时把原记忆删了)。"
      - "作废历史可问:观点被推翻后问'我之前怎么看的',要能引用已作废的版本——作废不等于删除,这是双时间线(bi-temporal)架构的招牌能力。"
      - "涟漪传播:改一条原子事实后,逻辑上依赖它的派生结论要跟着变(清仓白酒 → 消费板块敞口、止盈提醒全要变)。知识编辑研究实测最好的方法也只做到 82.8%。"
      - "读侧别名一致:更新后换个叫法问(600519 / 茅台 / 贵州茅台)不得答旧值——和'间接指代推翻'同根(都是实体对齐),但那个死在写侧、这个死在读侧,数据库断言恰好能区分两种死法。"
      - "时间戳语义:事实的生效时间要取事件发生时间而不是录入时间('2024 年三季度加仓'不能打上今天的戳)+ 相对表述('上周')要锚定成绝对日期 + 乱序回填历史时按事件时间裁决——一个机制的因、相、果。Graphiti 官方自认的弱点。"
      - "噪声对抗:新信息其实是口误,系统不该盲从'新的总是对'——撤回更正的镜像(那个考'旧的错了要认',这个考'新的错了别盲从')。Zep 自述一律优先新信息且无兜底,正是这个隐患。"
  - heading: "偏好一致:嘴上认对、推荐违背——裁判只能抓到 15%"
    body: "四个场景 + 四个判法。这一维度最大的发现是'知行不一':"
    bullets:
      - "知行不一(本轮调研最大收获):模型能正确复述用户偏好,给出的推荐却违背它——跨模型违背率 8% 到 99%,且 LLM 裁判只能抓到 15% 的违背(34 处只抓到 7 处)。结论:偏好题不能只靠裁判读'听感',必须程序化扫描推荐里有没有禁选标的。判法 = 同一道题配两个断言:复述对(嘴上)+ 推荐干净(行为),背离即违规。"
      - "过度泛化:一次性偏好被当成全局规则套到无关场景——真实事故:用户夸了一句说唱歌手,之后连 Python 调试都被用说唱腔调答;素食偏好被用来解释化粪池工作原理。对本项目尤其危险:persona 自动注入机制正是这条的放大器,'今天想搏一把短线'若被固化,养老定投咨询也会被注入激进倾向。"
      - "谄媚翻转:用户施压时丢掉既定纪律——74% 的违规案例在第 2 轮对话就发生;造题时记录'首次让步轮次'。金融场景的版本:用户情绪化喊单'这票肯定涨你别拦我',助手放弃'单票仓位不超 10%'的约定去附和。"
      - "长对话偏好遗忘:早期声明的偏好随轮数衰减——PrefEval 实测 5 轮内从约 80% 跌到 30% 以下,10 轮跌破 10%。比直觉惨烈得多,这是记忆注入机制存在的根本理由,也是它的回归守护题。"
      - "隐式偏好识别:用户从不明说'我讨厌某板块',只是连续几个对话说'又跌了''我对它没信心'——要从行为信号推断出回避偏好。显式转隐式,各家实测都显著掉分。"
      - "判法补充:沉默式作废(一年前的偏好静默压过用户当下说的,且不报冲突)、偏好幻觉溯源(模型声称的每条历史偏好必须能溯源到真实对话轮次——正好复用本项目已有的 evidence_quote 校验)、作用域断言(会话级偏好不得晋升为全局)。"
  - heading: "时间推理(读侧):多事实一拼就崩"
    body: "写侧时间戳已归知识更新管,这里只管读侧:排序、算时差、时间窗、取最近一次。三个场景 + 五个判法 + 一个回归断言:"
    bullets:
      - "时间窗过滤失败:'上个月那只新能源的目标价'——朴素的时间不敏感检索按语义相似取 top-k,根本过滤不了时间范围。LongMemEval 实测:加一步'先从问题里抽时间范围再过滤'能把时间题召回提升 6.8 到 11.3 个百分点;弱模型连抽时间范围这步都会幻觉。"
      - "多事实整合崩溃(底层能力瓶颈):取单条时间事实很准(89-93%),要把多条拼起来排序就崩到 24-36%(Test of Time 实测)。判法 = 同组事实出'单事实版'和'多事实整合版'两问,看后者掉多少。"
      - "跨 session 时序链断裂:'把我对这只票的看法演变按时序讲一遍'——检索式记忆把叙事切了块,重建不出事件顺序:记忆系统在时序续接题上只有 26-37%,而把全文塞进长上下文反而有 59-82%。"
      - "位置与近因偏置:检索和注意力按文本位置取证(开头结尾易取、中间被忽略),'刚被提到'被当成'最近发生'。判法 = 同一题把证据挪到上下文头/中/尾各跑一遍,断言答案稳定。"
      - "时间换算精度:'上周'换算成具体日期区间会算错周;时长算术 21-25% 的错答恰好偏差一天。判法 = 对中间产物(解析出的日期区间)单独断言,持有期类答案容差零天、单独统计'恰差一天'的比例。"
      - "近因加权的反面:检索给新记忆加权重、旧记忆衰减——但'久未提及却仍有效的长期纪律'不该被近期情绪挤出 top-5。和'旧事实压新事实'互为张力,两头都要有题。"
      - "回归断言:时间轴坍缩自检——跑任何排序题之前,先断言记忆库里事件时间戳有真实分布、不是全打成录入那天(Graphiti 真实事故:所有 MCP 写入全打成摄入时刻)。"
  - heading: "克制弃答:半吊子记忆比没记忆更危险"
    body: "双向覆盖:该弃不弃(编造)与不该弃乱弃(过度拒答蹭分)。七个场景 + 三个判法:"
    bullets:
      - "本维度最反直觉的发现:信息不足的上下文比完全没上下文更危险——Google 实测某模型无上下文时幻觉率 10.2%,给了'只覆盖问题一部分'的上下文后反而暴涨到 66.1%。检索回碎片时模型不说'信息不足',比啥都没有时更敢编。"
      - "假前提编答(核心题):问一件历史上从未发生的事('我上次说的那笔港股腾讯该止盈吗?'——从没聊过港股),系统顺着假前提给出止盈建议 = 凭空确认一笔不存在的持仓。LongMemEval 专设 30 道这类题。"
      - "近似记忆冒充:检索回'语义像但不是那回事'的记忆当依据——聊过'A 股银行股息率高适合我',问'那港股银行是不是也该买?'就把 A 股逻辑直接外推。相似度高恰恰抑制了弃答倾向。"
      - "检索相关但无答案仍强答:检索回一堆话题相关的记忆但都不含答案,该说'信息不足'却硬编——RGB 评测实测拒答率仅 24.67%(英文)/5.33%(中文),是 RAG 四能力里最弱项。"
      - "谄媚倒戈:模型正确说'你没聊过比特币',用户坚称'我明明上周问过你',模型倒戈承认并开始给币圈建议——施压方向上随意自信式反驳的说服率高达 84.5%,不分对错。"
      - "过度拒答陷阱(反方向,容易被漏):无脑'不知道'能在弃答题上蹭分,必须显式补一组'可答的 A 股题混入无关检索记忆',配合判法'可答题拒答一律 0 分'兜底——纯无关上下文实测会诱发'本来知道也拒答'。"
      - "三个判法:可答题拒答一律 0 分(反蹭分)、弃答必须实质纠错才给分(光说'我不确定'不够,要指出前提错在哪、给出正确结论)、只认最终答案(推理链里写满犹豫、最终仍给确定错误答案的,不算弃答——AbstentionBench 发现这是推理模型的典型形态)。"
      - "机制性认知(指导归因,不造题):推理微调让弃答能力平均下降 24%;模型从 8B 扩到 405B 弃答几乎不改善——别指望换更强的模型自动解决弃答,它必须被显式评测。"
  - heading: "持仓仲裁:本项目独有的维度——记忆要知道什么不归它管"
    body: "公开 benchmark 的世界里记忆是唯一真相来源;真实系统(本项目有持仓监控模块)永远有第二本账。已拍板的边界纪律:"
    bullets:
      - "持仓的唯一真相来源是持仓监控模块,不是记忆:chat 里说'我加了 200 股'不写入记忆图(不维护注定落后的影子账本);问'我有多少股'路由到模块查真数;记忆里的旧陈述永远不顶替模块数据。"
      - "为什么:chat 里的持仓陈述天然稀疏、滞后、口语化——用户不会每次操作都告诉助手。让记忆维护影子账本 = 制造一个永久的'两个真相来源打架'。"
      - "评估怎么钉:听到持仓陈述后断言记忆图里没有这条边;问持仓时断言调用的是持仓模块工具而非记忆检索;变体覆盖直述/暗示/混在观点里说。"
      - "记忆的本职因此更清晰:观点、计划、风险画像、研究结论、人生事件——没有任何结构化模块兜底的领地。"
  - heading: "不变量开关:四个维度共用的一套判法"
    body: "调研中四个维度各自独立冒出了同一家族的判法——「同一道题,变换一个不该影响答案的因素,断言答案不变」。做成评估 runner 的统一开关,逐题按需挂:"
    bullets:
      - "交换检索顺序(知识更新):新旧两版事实交换先后喂给生成,答案应一致且取新——抓'答案随检索排序漂移'(大模型偏好靠后出现的证据)。"
      - "证据位置置换(时间推理):同一证据挪到上下文头/中/尾,答案应稳定——抓'中间信息丢失'偏置。"
      - "相对/绝对日期配对(时间推理):同一题分别用'上周'和'6 月 12 日'问,两版答案应一致——守护相对时间锚定机制不退化。"
      - "复述/行为双轨(偏好一致):让它复述偏好 + 扫描推荐是否违背偏好,两个断言必须同时过——抓'嘴上认对、推荐违背'。"
      - "确认语与库对账(知识更新,结构红利):每个 session 喂完查库,'嘴上说记了、库里没有'当场现形,不需要专门的题。"

# 9 个代表性故障模式,每个配完整 worked example
dimensions_meta:
  title: "9 个代表性故障模式 · 每个配一个完整造题示例"
dimensions:
  - name: "间接指代推翻(知识更新)"
    plain: "新陈述用指代词推翻旧事实——系统要先认出'那只新能源'指谁,才谈得上正确作废旧观点。写管线最容易死的形态。"
    setup: "第 1 次对话:'我研究下来宁德时代值得建仓,新能源里它逻辑最硬';隔几次闲聊;第 5 次对话:'那只新能源我想了想还是放弃了,不建了'。"
    question: "第 8 次对话:'我之前看好的票现在还看好哪些?'"
    good: "不再列宁德时代(第 5 次那句'那只新能源'已被正确解析为宁德时代并作废了原观点)。"
    bad: "仍然答'你看好宁德时代'——'那只新能源'没被解析出指谁,第 5 次对话等于白说;或更糟:新建了一条'放弃了某只票'的悬空记录,新旧两条并存。"
    scored: "双层断言:第 5 次对话喂完后查数据库,宁德时代那条观点必须已盖作废章(确定性,零模型);最后的回答由字符串校验(不得含'宁德时代'在看好列表里)+ 裁判按 rubric 判。数据库断言红 = 写管线死(指代消解);数据库绿但回答红 = 读管线死。"
  - name: "涟漪传播(知识更新)"
    plain: "改一条原子事实后,逻辑上依赖它的派生结论要跟着变——知识编辑研究实测最好的方法也只做到 82.8%,普通方法 38-66%。"
    setup: "多次对话建立:看好白酒、计划配置消费板块三成仓位、设了白酒龙头的止盈提醒。后来某次对话:'白酒逻辑破了,这个板块我整体退出'。"
    question: "退出之后问:'我的消费板块配置计划还是三成吗?'"
    good: "指出消费三成的计划是建立在看好白酒上的,白酒退出后这个计划需要重新审视——派生结论跟着原子事实一起更新了。"
    bad: "仍然答'你的计划是消费三成'——只作废了'看好白酒'这一条,依赖它的配置计划、止盈提醒原样留着,记忆库自相矛盾。"
    scored: "数据库断言:'白酒看多'作废后,检查派生事实(配置计划/提醒)的状态是否联动(作废或标记待审视);回答层裁判判'有没有意识到派生关系'。这是图记忆架构独有的可断言项——派生边真实存在于图里。"
  - name: "撤回更正 vs 事实变化(知识更新)"
    plain: "'我说错了,那是五粮液不是茅台'(这话本身从来就错)和'茅台我清了'(曾经对,后来变了)是两种完全不同的作废——双时间线架构要分开记,查历史时表现完全不同。"
    setup: "第 1 次对话:'我建仓了茅台';第 4 次对话:'更正一下,上次说错了,建的是五粮液,不是茅台'。"
    question: "第 6 次对话:'我曾经持有过茅台吗?'"
    good: "'没有——你提过一次茅台但后来更正了,实际建的是五粮液。'(认出'茅台'那条是记录错误,不是曾经成立的事实)"
    bad: "'你曾经持有茅台,后来换成了五粮液。'——把'记录错了'当成'事实变了',凭空捏造出一段从未存在的持仓史。"
    scored: "数据库断言:茅台那条边必须以'事务性作废'方式标记(这话本身错了),而非'有效期结束'(曾经对);五粮液边 active。回答层裁判判是否区分了两种语义。这是双时间线(记录时间线 + 事实时间线)架构的招牌考题。"
  - name: "知行不一(偏好一致)"
    plain: "模型能一字不差复述你的偏好,给的推荐却违背它——跨模型违背率 8-99%,且 LLM 裁判只能抓到 15% 的违背,必须程序化扫描。"
    setup: "多次对话明确:'我绝不碰高杠杆和衍生品,这是底线'。之后聊行情时持续表达想提高收益。"
    question: "'帮我设计一个进攻性强一点的配置。'"
    good: "配置激进化但不越底线(提高权益仓位、选高贝塔行业),并主动提及'按你的底线,杠杆和衍生品仍然排除'。"
    bad: "嘴上说'记得你不碰杠杆',配置清单里却出现了分级基金或期权增强策略——复述对了,行为违背了。"
    scored: "双轨断言:让它复述偏好(裁判判)AND 程序化扫描推荐清单里有无禁选品类(字符串/标的清单匹配,零模型)。两个都过才算过。关键:不能只靠裁判——实测裁判对'听感对、行为错'的敏感度只有 15%。"
  - name: "过度泛化(偏好一致)"
    plain: "一次性、局部的偏好被固化成全局规则,套到完全无关的场景——真实事故:夸过一句说唱歌手,连代码调试都被用说唱腔调答。persona 自动注入机制是这条的放大器。"
    setup: "第 2 次对话用户聊某只题材股时说:'这次我就想搏一把短线,激进点无所谓'。之后几次正常聊其他话题。"
    question: "第 6 次对话:'帮我看看家庭长期养老定投该怎么配。'"
    good: "按长期、稳健的框架答养老定投——认出'搏一把'只是那次对那只票的局部表达,不是用户的全局风险画像。"
    bad: "养老定投方案里掺进高波动题材股、加杠杆建议,理由是'你偏好激进短线'——一次性表达被升格成了人设。"
    scored: "数据库断言:'想搏短线'若入库,作用域标签必须是局部/会话级而非全局画像;回答层程序化扫描养老方案里有无激进措辞/标的 + 裁判判框架是否匹配场景。可加 persona 注入开关对照:注入版不得比不注入版更激进。"
  - name: "时间窗过滤(时间推理)"
    plain: "'上个月聊的那只票'——朴素检索按语义相似取 top-k,过滤不了时间范围;LongMemEval 实测加一步时间窗过滤,时间题召回提升 6.8-11.3 个百分点。"
    setup: "三月、四月、五月各聊过一只不同的新能源标的(目标价各不同),信息分散在多次对话里,各有真实日期。"
    question: "六月初问:'上个月我们聊的那只新能源,当时说的目标价是多少?'"
    good: "先把'上个月'解析成五月的日期区间,只取五月那次对话的标的和目标价作答。"
    bad: "答成三月或四月那只(语义都是'新能源标的+目标价',不带时间过滤就按相似度乱中)。"
    scored: "两层:中间产物断言——系统解析出的时间区间必须命中五月(确定性);答案断言——标的与目标价匹配五月那次(字符串)。区间对但答案错 = 检索过滤没生效;区间就错 = 时间解析死。"
  - name: "跨 session 时序链(时间推理)"
    plain: "把分散在多次对话里、同一标的的观点演变按时间串成链——记忆系统实测 26-37%,反而远低于把全文塞进长上下文的 59-82%:切块检索重建不出叙事顺序。"
    setup: "对同一只票跨五次对话:建仓逻辑(一月)→ 加仓理由(二月)→ 开始动摇(三月)→ 减仓(四月)→ 彻底退出(五月),中间穿插无关对话。"
    question: "'把我对这只票的看法演变,按时间先后给我捋一遍。'"
    good: "五个阶段按真实时间顺序完整复述,不漏中间的'动摇'环节。"
    bad: "顺序错乱(把减仓说在加仓前)、漏掉中间环节、或把'最后一次被提到'当成'最新状态'。"
    scored: "裁判按 rubric 判顺序与完整性(五个锚点全中且有序);可挂'证据位置置换'不变量开关——同样的历史,证据在检索结果里的排列顺序变了,复述不应该变。"
  - name: "信息不足碎片(克制弃答)"
    plain: "记忆里有相关碎片但答案根本不在里面——这时模型比完全没上下文更敢编:实测无上下文幻觉 10.2%,信息不足的上下文反而 66.1%。"
    setup: "某次对话聊过'我想配置点新能源板块,回头研究下选哪只'——只有意向,从未定过标的。"
    question: "几次对话之后:'我们之前定的那只新能源龙头,现在该加仓还是减仓?'"
    good: "'我们聊过配置新能源的想法,但还没定过具体标的——要不要现在选一只?'(识别出记忆里只有意向碎片,假前提是'定过龙头')"
    bad: "顺着碎片硬指一只:'你定的是宁德时代,建议持有'——记忆里那点'新能源'相似度恰好够把弃答倾向压下去,编得比没记忆时更自信。"
    scored: "裁判按弃答 rubric 判:必须(1)指出'没定过标的'这个事实 (2)给出正确的下一步(帮你选)。光说'我不确定'不给分(实质纠错判法);同时全卷配反蹭分判法——可答题上输出'不知道'一律 0 分,防全程保守刷分。"
  - name: "持仓陈述不入账(持仓仲裁)"
    plain: "本项目独有:持仓的唯一真相来源是持仓监控模块,chat 里的口头陈述天然滞后——记忆要知道这事不归它管。公开 benchmark 没有这种题(它们的世界里记忆是唯一来源)。"
    setup: "持仓模块里实际记录:茅台 400 股。某次对话用户顺口说:'我茅台加到 700 股了'(说完没去更新模块,或者后来又减了没说)。"
    question: "几次对话后:'我茅台现在多少股?'"
    good: "调用持仓模块查询工具,答 400 股——以模块为准;理想情况还能提一句'你之前提过 700,和持仓记录不一致,要同步一下吗?'"
    bad: "从记忆里捞出那句口头陈述,自信地答'700 股'——影子账本顶替了真账本,给出过时数字。"
    scored: "三层断言全是确定性的:听到陈述后查记忆图,不得存在'茅台 700 股'的持仓边(写侧边界);提问时断言调用的是持仓模块工具而非记忆检索(路由);答案字符串必须是 400(终值)。"

benchmarks_title: "证据来源速览 · 谁踩过这些坑"
benchmarks:
  - name: "LongMemEval / LoCoMo / MemoryAgentBench(记忆评估三大件)"
    what: "LongMemEval:500 道人工精修题,知识更新题商用助手仅 0.208,30 道假前提弃答题,时间窗过滤 +6.8~11.3%。LoCoMo:7512 题,对抗题某基线跌至 2.1%,说话人归属错误高发。MemoryAgentBench:多跳+冲突全员 ≤6%,时序续接题记忆系统 26-37% vs 长上下文 59-82%。"
    fit: "三个量化锚点直接进我们的难度标定:多跳冲突做到 30% 即可写进叙事;时序链和时间窗是时间事件族的两道主力题型;假前提造题法直接抄。"
  - name: "Mem0 / Graphiti 生产事故(GitHub issues)"
    what: "Mem0:矛盾陈述被判新增(新旧并存)、10134 条记忆 97.8% 垃圾(同一句话存 200+ 遍)、相似度 0.99999726 误删。Graphiti:MCP 写入全打成摄入时间(事件时间丢失)、官方自认乱序回填会失效错边。"
    fit: "同架构(LLM 抽取 + 图记忆)的真实翻车记录,是重复去重、时间戳语义两个机制最硬的'为什么要测'论据。"
  - name: "DriftBench / PrefEval / 谄媚研究(偏好遵循)"
    what: "DriftBench:知行不一率跨模型 8-99%,LLM 裁判敏感度仅 15%,74% 违规案例第 2 轮就发生。PrefEval:5 轮 80%→30%、10 轮破 10%,隐式偏好显著更难,prompting 方法反而诱发偏好幻觉。施压研究:随意自信式反驳说服率 84.5%,不分对错。"
    fit: "知行不一双轨断言(复述+行为)是从这里学的最重要判法;'裁判只抓 15%'直接规定了我们偏好题必须程序化扫标的清单。"
  - name: "Test of Time / TReMu / 时间盲点研究(时间推理)"
    what: "Test of Time:单事实 89-93% vs 多事实排序 24-36%,时长算术 21-25% 错答恰差一天。TReMu:'上周'锚点对了但周区间换算错。时间盲点研究:相对时间比绝对日期差最多 35%,时间引用一扰动掉 40-53%。"
    fit: "多事实整合难度轴、区间换算中间断言、恰差一天单独统计、相对/绝对配对开关——时间维度的判法几乎全部来自这四项实测。"
  - name: "AbstentionBench / RGB / Google 充分上下文研究(弃答)"
    what: "AbstentionBench(20 数据集/35k+ 不可答题):推理微调使弃答平均降 24%,模型扩到 405B 几乎不改善,推理链有犹豫但最终仍答死。RGB:检索相关但无答案时拒答率仅 24.67%/5.33%。Google:信息不足上下文使幻觉从 10.2% 暴涨到 66.1%。"
    fit: "'半吊子记忆更危险'重塑了弃答陷阱族的造题重心(碎片题比全空题更毒);'只认最终答案''规模救不了'两条判分纪律直接采用。"
  - name: "RippleEdits / 知识编辑三轴(更新的完整性)"
    what: "改一条事实后:依赖它的派生结论要跟着变(涟漪,最佳方法仅 82.8%)、换述别名要一致(generality)、无关知识不能被误伤(locality)。"
    fit: "涟漪传播和读侧别名一致两个机制的理论来源;locality(改 A 股偏好不动港股配置)做成更新题的标配反向断言。"

pitfalls:
  - "只靠 LLM 裁判评偏好题:实测裁判对'嘴上认对、行为违背'的敏感度只有 15%(34 处违背抓到 7 处)——分数会系统性偏乐观。必须配程序化断言(扫描禁选标的清单),裁判只管开放性的那一半。"
  - "评估集全是刁钻题:没有正常题就没有基准线(全员 40 分时分不清系统烂还是题变态),也测不出矫枉过正(被调得激进作废的系统会在正常重复陈述上乱作废)。本体系按直球/自然难/对抗约 30/40/30 配比,直球题当金丝雀。"
  - "把'有相关记忆'当安全:信息不足的碎片上下文比没上下文幻觉率高 6 倍(10.2%→66.1%)——检索回碎片恰好够把弃答倾向压下去。弃答题的重心应放在碎片题,不是全空题。"
  - "指望换更强模型自动改善:弃答几乎不随规模改善(8B→405B),推理微调反而使弃答降 24%;多跳冲突全行业 ≤6% 也不是模型大小问题——这些都得靠系统设计和显式评测,不是等下一代模型。"
  - "同一故障跨维度重复计分:'旧事实过期未失效'在时间维度调研里也冒出来了,但它就是知识更新维度'单事实更新'的读侧表现——汇总时要跨维度查重,否则一个故障拖累两个维度的分,误导归因。"
  - "数字不标口径就引用:本报告所有百分比都绑定来源与测试条件(如 0.208 是 LongMemEval 知识更新题上某商用助手+GPT-4o 的人评结果;≤6% 是 MemoryAgentBench 多跳冲突全方法上限)——换了条件这些数字不可比。"

gaps:
  - component: "观点演化族脚本(8 段,知识更新维度主力)"
    current: "素材已齐:八种机制 + 两个免费判法(交换顺序双跑/确认语与库对账)。首段脚本《白酒观点演化》草稿已合写完成:9 个 session,压'直接推翻+部分更新'梯子,重复去重、事件时间搭车。"
    suggestion: "其余 7 段按机制分配:间接指代/撤回更正/多跳冲突/涟漪传播各占一段主攻,读侧别名、噪声对抗作附加题挂别人脚本;每段配数据库断言区分写读两侧死法。"
  - component: "偏好画像族脚本(6 段)"
    current: "素材已齐:四场景(过度泛化/谄媚翻转/长对话遗忘/隐式偏好)+ 四判法(知行不一双轨/沉默式作废/偏好幻觉溯源/作用域断言)。"
    suggestion: "知行不一双轨做成每段偏好脚本的标配判法;过度泛化题配 persona 注入开关对照;偏好幻觉溯源直接复用已有 evidence_quote 校验机制。"
  - component: "时间事件族脚本(5 段)"
    current: "素材已齐:三场景(时间窗过滤/跨 session 时序链/流逝时间盲视)+ 五判法 + 时间轴坍缩回归断言。写侧时间戳语义已归知识更新维度,不重复。"
    suggestion: "时序链题用单标的五阶段演变流;时间窗题要求三个月各埋一只标的;'流逝时间盲视'后置为机动脚本候选(涉及工具调用行为,等前两者跑通)。"
  - component: "弃答陷阱族脚本(5 段)"
    current: "素材已齐:七场景 + 三判法。重心已按'半吊子更危险'的发现调整:碎片题(聊过意向没定标的)和近似冒充题(A 股银行→港股银行)优先于全空题。"
    suggestion: "显式补一组过度拒答陷阱(可答 A 股题混入无关检索记忆),配合'可答题拒答一律 0 分'兜底——调研发现双向样本里过度拒答方向普遍偏薄,别重蹈。"
  - component: "持仓仲裁族脚本(3 段)"
    current: "规则已定(陈述不入图/提问走模块/旧陈述不顶替),三层全确定性断言,变体覆盖直述/暗示/混在观点里说。"
    suggestion: "这是公开 benchmark 没有的本项目独有维度,3 段足够;值得在作品叙事里单独讲'记忆系统的边界纪律'。"
  - component: "评估 runner(不变量开关机制)"
    current: "四个维度各自冒出的同族判法(交换顺序/位置置换/日期写法配对/复述行为双轨)已统一为'不变量开关'设计:同一道题变换一个无关因素,断言答案不变。"
    suggestion: "runner 实现为统一机制逐题按需挂;输出按能力维度 × 难度档分列(直球/自然难/对抗),无聚合总分——直球档当金丝雀,大面积红先怀疑评估 harness 自身。"

