slug: chat-agent-evaluation
title: "对话 / 工具型 Agent · 怎么评估"
subtitle: "用具体例子讲明白:7 个评估维度 × worked example,横跨回答质量 / 任务完成 / 过程轨迹 / 生产在线四个角度,对照本项目 chat + MCP + supervisor 现有评估"
meta:
  date: "2026-06-02"
  basis: "六方向并行联网调研 + 22 条事实对抗校验(全 confirmed/partly,无完全错误)+ 对照本项目 chat 评估"

summary: >-
  评一个会聊天、还会动手调工具的 agent,不是一根指标能盖住的,而是四个相互独立、按需取用的角度:
  ①回答质量(单条回答好不好——用一个更强的模型当裁判打分);②任务完成(任务有没有真做成——
  不看它嘴上说什么,看跑完之后数据库/环境被改成了什么状态);③过程轨迹(中间步骤对不对——
  该调的工具调了没、参数对不对、有没有画蛇添足);④生产在线(上线后真实流量里表现如何——
  点赞率、重试率、抽样打分、护栏拦截)。两条贯穿全篇的暗线:一是"拿强模型当裁判"有系统性偏差
  (偏好排第一个的、偏好长的、偏好自己写的),必须靠交换位置、长度去偏、强制写推理、多次采样来压;
  二是整个领域正从"比对模型吐出来的文本"转向"校验环境最终被改成了什么状态",并用"连做 k 次都成功的
  概率"取代"单次成功率"来度量可靠性。
  (先约定几个高频词:裁判 = 拿另一个更强的模型给被评 agent 的回答打分;终态 = 一段任务跑完后
  数据库/环境的最终状态;轨迹 = agent 从头到尾每一步调了什么工具、传了什么参数的完整动作序列;
  护栏 = 跑在每个请求上、快而确定、负责放行或拦截的实时检查,区别于只做抽样诊断的评估。)

sections:
  - heading: "四个相互独立的角度:分别评什么、用什么尺子"
    body: "评对话/工具型 agent 不是单一分数,而是四个正交角度,评估时按需取用(下面每条括号里是代表方法):"
    bullets:
      - "回答质量——单条回答本身好不好:用强模型当裁判,要么给绝对分(G-Eval 按评分标准打 1-5、MT-Bench 打 1-10),要么两个答案成对比谁好(Arena-Hard / AlpacaEval 聚合成赢面或 Elo)。好的裁判设计能让 GPT-4 跟人类的一致率到 80-90%,甚至高过人类彼此之间的一致率。"
      - "任务完成——任务有没有真做成:给一个初始数据库 + 用户意图,agent 边调工具边遵守政策,跑完比对数据库终态和标注目标态(τ-bench / WebArena / SWE-bench / GAIA / 伯克利函数调用榜)。核心是评'环境被改成什么样',不是评对话措辞。"
      - "过程轨迹——中间步骤对不对:把 agent 走过的工具调用序列和参考序列比对,可单独看工具集合、顺序、参数(LangChain agentevals 纯规则比对 / TRAJECT-Bench 拆成多维 / 逐步奖励模型给每步打分)。"
      - "生产在线——上线后真实流量里如何:用户点赞(显式)、重试率/放弃率(隐式)、按抽样比例自动打分(在线裁判)、实时护栏拦幻觉、A/B、录制回放守回归。要分清护栏(每个请求都跑、放行或拦截)和评估(只抽样诊断质量漂移)。"
  - heading: "暗线一:'用强模型当裁判'有系统性偏差,必须主动去偏"
    body: "裁判很好用,但它不中立——会被三件事带偏,每件都有对应的解法,金融报告天然偏长,这套纪律不能省:"
    bullets:
      - "位置偏好:偏好排在前面的答案。Arena-Hard 实测把甲乙位置交换跑两遍只有约 65% 一致(GPT-4 约三成情况偏第一个)——解法是'交换位置双跑、两遍方向一致才算赢,否则判平局'。"
      - "长度偏好:长答案天然占便宜。AlpacaEval 2.0 的解法是对裁判偏好做一次回归、把'两答案长度差'当变量,预测'假如一样长'的偏好——长度去偏后与竞技场人类排名的相关系数从 0.94 升到 0.98。"
      - "自我偏好 + 灌水攻击:裁判倾向给'自己这一家写的'打高分(原论文自陈数据有限、宜当倾向非定论);更夸张的是'重复列表'灌水攻击能把 GPT-3.5/Claude-v1 骗到 91.3% 误判,而 GPT-4 只 8.7%。配套手段:强制先写推理、给示例、多次采样投票降方差(注意这几招出处各异,引用要标清来源)。"
  - heading: "暗线二:从'比对文本'转向'校验终态',用连胜率度量可靠性"
    body: "agent 评估这几年的主旋律,是把'对不对'的判据从模型输出的措辞挪到环境的最终状态,并把'单次成功'升级成'稳定成功':"
    bullets:
      - "校验终态而非文本:τ-bench 对话结束后比数据库终态、WebArena 给每类任务手写一个可执行校验函数去查网站后端真实状态、SWE-bench 直接把补丁打上去跑测试、GAIA 用近似精确匹配——都绕开了'裁判读对话感觉答得不错'这种软判定。"
      - "连胜率取代单次成功率:τ-bench 提出'连做 k 次都成功的概率'(论文写作 pass^k)专门度量稳定性。同一个模型零售域单次成功约 61%、但连做 8 次全成功的概率跌破 25%——'偶尔做对'和'稳定做对'差距巨大,只报单次成功率会严重高估可靠性。"
  - heading: "专题:检索增强(RAG)对话怎么评——拆成检索 × 生成两轴"
    body: "本项目的知识库问答正是 RAG 对话。评它要把两件事彻底分开,才能定位故障在'没检索到'还是'检索到了却答歪':"
    bullets:
      - "检索质量:相关资料排得靠不靠前(精确率)、覆盖全不全(召回率)——相关片段排第一精确率≈1.0、排第二≈0.5。"
      - "生成质量:答案里每个论断能不能从检索资料推出(RAGAS 依据性 = 被支持的论断数/总论断数)、答案切不切题(切题度,反向从答案推问题再比相似度)。TruLens 把'资料相关性 + 回答依据性 + 回答切题度'做成三件套,一眼定位故障层。"
      - "引用核对(ALCE):逐句核对答案里的行内引用是否真支持该句论断——金融数字幻觉代价高,这一项配上'给示例锚定 + 多裁判集成'最该优先做。"

# 核心:7 个评估维度,每个配完整 worked example(铺垫→问→好答→坏答→怎么判分)
dimensions:
  - name: "① 回答质量:用强模型当裁判打分"
    plain: "单条回答本身好不好——没有唯一标准答案的开放问题,用一个更强的模型按评分标准打分,把'好坏'量化成可比的分。"
    setup: "用户问:'用大白话讲讲市盈率和市净率有什么区别,各自适合看哪类公司?'agent 给出一段回答。"
    question: "这段回答的质量(准确性 / 条理 / 切题)值几分?"
    good: "先一句话点出'市盈率看盈利、市净率看净资产',再分点说清各自适合的公司类型(市盈率适合盈利稳定的、市净率适合重资产或周期股),最后给一句使用提醒——准确、有条理、不跑题。裁判给高分。"
    bad: "堆了一大段定义公式却没回答'适合看哪类公司',或夹带一个错误结论(如说市净率适合看互联网轻资产公司)——冗长、跑题或含错,裁判给低分。"
    scored: "G-Eval:把评分标准用大模型自动展开成评估步骤,裁判顺着推理打 1-5,再用'各分数 × 其概率'求期望把离散分变连续(在摘要数据集 SummEval 上与人类相关系数 0.514,远超 ROUGE/BERTScore)。MT-Bench 则打 1-10、数学题先让裁判自己独立解一遍当参考答案再评(误判率从约七成压到约一成五);裁判与人类去平局后一致率 85%、高于人类彼此的 81%。"
  - name: "② 任务完成:校验终态而非对话文本"
    plain: "agent 边聊边调工具改数据库,任务到底做没做成——不看它嘴上说'已为您改好',看对话跑完数据库被改成了什么状态。"
    setup: "航司客服场景:初始数据库里有用户的订单,用户说'帮我把后天那班机改到下周一'。agent 要问清订单号、识别票种、按政策(如最低价经济舱不可改签)决定执行还是拒绝。"
    question: "这次改签任务算成功吗?"
    good: "agent 调订单查询工具确认票种可改、调改签工具把日期改成下周一、数据库终态 = 标注的目标态(航班日期已更新、差价已处理);若票种是不可改签的最低价经济舱,则正确拒绝、数据库保持不变。两种都判成功。"
    bad: "对话里回了'已为您改签成功',但实际没调改签工具、或改错了航班、或对不可改签票种强行改了——对话措辞看着对,数据库终态不对,判失败。"
    scored: "τ-bench:跑完比对数据库终态和标注目标态,完全不看对话文本(GPT-4o 零售域单次约 61%、航司域约 35%)。同族还有 WebArena(每类任务手写可执行校验函数查网站后端真实状态)、SWE-bench(打补丁跑测试、原本失败的转通过且原本通过的不挂才算解决,精校子集到 2025 年底最好成绩约 88%)、GAIA(近似精确匹配,人类 92% vs 早期 GPT-4 加插件仅 15%)。"
  - name: "③ 可靠性:连做 k 次都成功的概率"
    plain: "不是'能不能做对一次',而是'同一个任务连做几次会不会次次都对'——把稳定性单拎出来量化,这是上线前最该盯的一轴。"
    setup: "同一道改签任务(或同一句斜杠命令触发的工具调用),让 agent 在相同初始条件下独立重跑 8 次。"
    question: "它是'稳定做对'还是'偶尔蒙对'?"
    good: "8 次里次次都正确识别票种、调对工具、终态一致——连做 8 次全成功的概率高,说明路由和工具调用稳。"
    bad: "8 次里有几次走对、有几次漏问订单号或调错工具——单次成功率看着还行(比如 61%),但'连 8 次全对'的概率跌破 25%,暴露它其实不稳。"
    scored: "τ-bench 的连胜率(论文写作 pass^k):同任务连做 k 次全成功的概率,专门区别于'至少成功一次'的成功率(新版结果更严:领先模型单次通过 25.5%、连做 4 次全过只剩 9.3%)。对本项目最直接——把已有的差分对照金标准跑多次、报'k 次全过率',就能守住路由/工具调用的一致性。"
  - name: "④ 过程轨迹:工具调用序列比对"
    plain: "光看最终答案不够,还要看中间这串工具调用对不对——该调的调了没、顺序对不对、参数填得对不对、有没有画蛇添足多调。"
    setup: "用户问'宁德时代最新一季毛利率多少';参考轨迹是 agent 应当调一次行情/财报工具、参数指向宁德时代最新季报。"
    question: "agent 这次走过的工具调用序列,合不合格?"
    good: "恰好调了那一个该调的工具、参数对(标的=宁德时代、周期=最新季报),没有多余调用——和参考序列在'工具集合 + 参数'上对得上。"
    bad: "调错工具(把财报工具调成行情工具)、参数错(标的写成'宁德'匹配不上、或周期取了去年),或保险式地把记忆工具、知识库工具一股脑都调一遍(画蛇添足)——序列和参考对不上。"
    scored: "LangChain agentevals:把实际序列和参考序列格式化后纯规则比对,又快又便宜、结果确定,匹配松紧分四档。要检测'有没有调参考之外的多余工具',用'子集'模式(要求实际工具是参考的子集);'强制命中某工具'(如斜杠命令)用最严格模式做确定性回归。TRAJECT-Bench 进一步把轨迹拆成'工具名序列对不对 / 必需工具覆盖率 / 参数满足约束 / 最终答案对不对'四维定位弱点。"
  - name: "⑤ 克制:该不调工具时能不能忍住"
    plain: "好 agent 不只是'会调工具',还得'该不调时不乱调'——给一个本不该触发工具的问题,看它克制还是保险式地硬调一通。"
    setup: "只给了查行情、查财报这类金融工具,用户却问'帮我把这段话翻译成英文'(或闲聊'你觉得今天天气怎么样')——根本不该调任何金融工具。"
    question: "面对这个工具帮不上忙的问题,agent 怎么做才对?"
    good: "一个工具都不调,直接用自身能力回答或礼貌说明'这超出我能查的金融数据范围'——识别出工具用不上、克制住。"
    bad: "保险式地硬调一个金融工具(比如对'翻译'请求也去查了行情),既浪费 token 又可能拿无关结果把回答带偏。"
    scored: "伯克利函数调用榜的'相关性检测':给一堆无关工具,看模型是否克制、不乱调用,调了就扣分。对应本项目记忆 vs 知识库的路由——可加一维'相关性/拒绝',专放工具帮不上忙的问题,考核它的克制力(也正好接上轨迹层用子集模式量化'多调了几步')。"
  - name: "⑥ RAG 依据性:回答有没有被检索资料支撑"
    plain: "知识库问答最致命的是'一本正经编数字'——要逐条拆开回答里的论断,看每条能不能从检索到的资料里推出来,推不出的就是幻觉。"
    setup: "用户问某公司情况,系统检索回几段研报片段(里面有营收、毛利率,但没有任何目标价)。agent 据此作答。"
    question: "这段回答忠不忠于检索到的资料?"
    good: "营收、毛利率都用片段里有的数字、可逐句溯源;问到目标价时如实说'检索到的资料里没有目标价,无法给出'——每个论断都有据。依据性高。"
    bad: "顺手编了一个资料里根本没有的'目标价 420 元'、或把营收数字记串了——拆成论断看,这一条找不到任何片段支撑。依据性掉下来。"
    scored: "RAGAS 依据性 = 被支持的论断数 / 总论断数(例:答案两个论断里'生于德国'有据、'某具体日期'无据 → 依据性 = 1/2 = 0.5);配检索轴的精确率/召回率(相关片段排第一精确率≈1.0)。引用核对(ALCE)逐句核对行内引用是否真支撑该句。金融数字幻觉代价高 → 优先做论断级依据性 + 引用核对,并'给示例锚定 + 多裁判集成'降噪。"
  - name: "⑦ 生产在线:真实流量里的闭环信号"
    plain: "上线后离线分就不够了,要在真实流量上闭环——靠用户点赞、重试放弃这类行为信号、抽样自动打分、实时护栏,持续发现质量漂移。"
    setup: "agent 已上线,用户连发:'特斯拉财报怎么样' → '我是说最新一季毛利率' → 然后关掉了会话。"
    question: "怎么从这段真实交互里自动读出'答得好不好'?"
    good: "隐式信号引擎判第二条是重试(重新措辞 = 上一条没答好)、整段以放弃收尾;在线裁判按抽样比例(如 10-15% 流量)把'问题+回答+检索片段'喂裁判自动打分、低分回灌离线集;答案里若冒出无依据数字,回答后护栏实时拦截替换。看板上于是显示'估值类问题重试率 18%、资讯类只 6%',直接定位短板。"
    bad: "只看离线分、对线上质量漂移无感;或一味优化'留存/会话变长'这类代理指标——结果模型学会'黏住用户'而非'帮到用户',必须配任务成功率这类真实价值指标兜底。"
    scored: "显式反馈(点赞绑到调用记录,稀疏、<5% 用户会点)+ 隐式反馈(重试/放弃/追问率,覆盖全量但有噪声)+ 在线裁判(抽样自动打分、失败回灌)+ 实时护栏(请求前拦越界、回答后拦无依据幻觉,可微调小模型保延迟)+ A/B(配显著性检验、警惕代理指标)+ 回归(金标准用例集 + 录制回放,持续集成里不真打 API、断网也能测)。"

benchmarks_title: "代表性方法 · 评测速览"
benchmarks:
  - name: "G-Eval(按评分标准打分 + 概率加权)"
    what: "三步:大模型把一条评分标准自动展开成评估步骤 → 裁判顺步骤推理打 1-5 → 不取整数而取各分数 token 的概率算期望,把离散分变连续、缓解'大量样本卡同一个分'。在 SummEval 上与人类相关 0.514。"
    fit: "开放式回答(研报段落、解释类问答)没有唯一答案时的主力打分法;'概率加权'让分数更细、更稳。注意它的评估维度要贴任务自定义(SummEval 原始四维是连贯/一致/流畅/相关)。"
  - name: "MT-Bench / Chatbot Arena(绝对打分 + Elo)"
    what: "80 道两轮题、八类。裁判先写理由再输出分;数学/推理类先让裁判独立解一遍当参考答案再评(误判率约七成→约一成五)。裁判与人类去平局后一致率 85%、高过人类彼此 81%。"
    fit: "'裁判先写推理再打分''难题给参考答案'两招直接可用;一致率高过人类彼此,是'强模型当裁判可信'的经典背书。"
  - name: "Arena-Hard / AlpacaEval 2.0(成对比较 + 去偏)"
    what: "成对比谁赢、聚合成赢面或 Elo。Arena-Hard 用 500 道竞技场难题、交换位置双跑取一致(与人类排名一致 89.1%、区分度 87.4%、约 $25/模型);AlpacaEval 2.0 对标准答案算赢面 + 长度去偏(相关系数 0.94→0.98、跑完不到 $10)。"
    fit: "本项目研报偏长 → '交换位置 + 长度去偏'这套去偏纪律是刚需,否则长答案和排第一的答案天然占便宜、分数失真。"
  - name: "τ-bench(工具-用户-规则三方 + 连胜率)"
    what: "给初始数据库 + 大模型扮演的用户逐步透露需求,agent 边调工具边守政策;评估只比对话结束后的数据库终态。提出 pass^k(连做 k 次全成功的概率)度量稳定性。GPT-4o 零售域单次约 61%、连 8 次<25%。"
    fit: "最贴本项目'chat + 工具改状态'的形态:给金标准用例标注'期望的工具副作用终态'评终态、再跑多次报连胜率,直接补上'稳定性'这个当前没测的维度。"
  - name: "SWE-bench / WebArena / GAIA(可执行终态校验)"
    what: "SWE-bench:真实 GitHub issue + 自带测试,打补丁跑测试、失败转通过且原通过不挂才算解(精校子集到 2025 末约 88%)。WebArena:可自部署真实网站 + 812 任务,每类手写校验函数查后端真实状态(早期 GPT-4 仅 14.41%、人类 78.24%)。GAIA:466 题近似精确匹配、不用裁判(人类 92% vs 早期 GPT-4 加插件 15%)。"
    fit: "三个都示范'评环境终态/副作用,不评文本'。本项目虽不做代码/网页,但'为每类任务写一个可执行校验函数'的思路可移植到工具调用金标准。"
  - name: "伯克利函数调用榜 / ToolBench(工具调用)"
    what: "伯克利榜单轮用语法树比对函数名/参数名/值/类型,另有'真跑看返回值'和'相关性检测'(给无关工具看模型是否克制不调),新版加多轮改比系统状态。ToolBench/ToolLLM 收 16464 个真实 API,用完成率(规定步数内有没有完成)+ 胜出率(两条解题路径比谁好)评。"
    fit: "'相关性检测'正好量化本项目要的'该不调工具时的克制力';语法树比对是工具参数级回归的现成范式(对应斜杠命令必中工具那条分支)。"
  - name: "LangChain agentevals / TRAJECT-Bench(轨迹)"
    what: "agentevals 把消息序列格式化后纯规则比对,可单看工具集合/顺序/参数,匹配四档、参数匹配分'相等/只看名/子集/超集'(检测多余工具用子集模式)。TRAJECT-Bench 把轨迹拆成工具名序列/必需工具覆盖率/参数约束/最终答案四维。"
    fit: "LangGraph 的轨迹天然就是消息+工具调用序列,接 agentevals 几乎零改造;'最严格模式做确定性回归''子集模式量化多调'直接对应本项目命令系统和记忆/KB 路由。"
  - name: "RAGAS / TruLens / ALCE(RAG 检索增强对话)"
    what: "RAGAS 依据性(论断级:被支持数/总数)+ 切题度(反向从答案推问题比相似度);TruLens 三件套(资料相关性+回答依据性+回答切题度)定位故障层;ALCE 逐句核对行内引用是否真支撑。"
    fit: "本项目知识库问答的离线指标缺口正是这里——检索轴(精确率/召回率)+ 生成轴(依据性)可上持续集成、不需大量人工标注;引用核对可复用项目已有的引用原文校验机制。"
  - name: "More Agents / Self-Consistency(投票聚合,可靠性增强)"
    what: "对有唯一答案(数值/分类)的题,同一模型多次采样按多数投票(self-consistency);'连做多次'既能投票提准、也能拿来度量稳定性。"
    fit: "可叠在裁判和工具调用上降方差;但只适用于有'同一个标准答案'的子任务——开放式研报投不出来,别误用。"

pitfalls:
  - "把'裁判分高'当真相:裁判有系统性偏差——位置(交换双跑只 65% 一致)、长度(长答案占便宜)、自我偏好(倾向自家模型,宜当倾向非定论),还能被'重复列表'灌水攻击骗到 91.3% 误判(GPT-4 仅 8.7%)。必须交换位置 + 长度去偏 + 强制写推理 + 多次采样,缺一项分数就不可信。"
  - "只评对话文本、不评环境终态:agent 可能嘴上说'已为您办好'、实际工具没调对。趋势是 τ-bench/WebArena 式比对'环境最终被改成什么状态/产生什么副作用',文本判定要让位给终态判定。"
  - "用单次成功率冒充可靠性:'偶尔做对'和'稳定做对'差距巨大(单次 61% 但连 8 次<25%)。上线前一定要用连胜率(pass^k),只报单次会严重高估。"
  - "代理指标陷阱:单纯优化'留存/会话变长'会让模型学会'黏住用户'而非'帮到用户',必须配任务成功率这类真实价值指标兜底;A/B 也要先算样本量再做显著性检验。"
  - "厂商数字与时效不核就引用:SWE-bench 精校子集到 2025 末已约 88%(早年举'60% 多'已过时)、WebArena 从 14.41% 升到约 60%——榜单数字会过期;且某模型'在推理上超过 GPT-4o'往往只在数学/推理类成立、不代表通用能力。引用必查时效与适用范围。"
  - "细节张冠李戴是高频翻车:agentevals 检测'多调工具'要用子集模式(别和允许多调的超集模式搞反);SummEval 的维度是连贯/一致/流畅/相关(不含'忠实度');某些榜单子环境主指标是成功率而非 F1。横评务必逐条核对口径。"

# 对照本项目 chat + MCP + LangGraph supervisor 现有评估:现状 + 可补什么
gaps:
  - component: "chat 端到端评估(现有 LLM-as-judge)"
    current: "现有 chat 评估是端到端用大模型当裁判打整体质量分,覆盖'回答质量'这一角度;已有差分对照金标准和 DD 研报的 V0-V3 控制变量对照。"
    suggestion: "最低成本、最高收益地加两项:(1) 连胜率——同一金标准用例跑 k 次、报'k 次全成功率',守住路由/工具调用一致性(直接复用差分金标准 + V0-V3 框架);(2) 工具调用终态断言(τ-bench 思路)——给每个金标准用例标注'对话结束后期望的数据库/工具副作用状态',评终态而非对话文本。"
  - component: "过程轨迹层(目前实质空白)"
    current: "LangGraph 的轨迹天然就是'消息 + 工具调用序列',但目前没有针对轨迹本身的离线断言——只看最终回答,不校验中间调了哪些工具、参数对不对。"
    suggestion: "接 LangChain agentevals(几乎零改造):(1) 斜杠命令/强制工具这条分支用最严格模式做确定性回归;(2) 记忆 vs 知识库的路由用子集模式量化'有没有多调工具';(3) 新增一维'相关性/拒绝'——给一个本不该触发工具的问题,考核 agent 的克制力。"
  - component: "知识库问答的离线检索/生成指标(对照已记录的 KB 评估缺口)"
    current: "知识库问答现有评估偏端到端;切块/向量/检索/生成的离线指标仍是已记录在案的缺口,缺把'没检索到'和'检索到却答歪'拆开的能力。"
    suggestion: "上 RAGAS 检索轴(精确率/召回率)+ 生成轴(论断级依据性)进持续集成,不需大量人工标注;金融对数字幻觉零容忍 → 优先做论断级依据性 + 引用核对,复用项目已有的引用原文校验机制(provenance substring oracle)。"
  - component: "生产在线评估(目前无,个人作品流量有限)"
    current: "数据库为准的调用记录已具备(会话持久化),但还没把线上行为信号沉淀成评估闭环;个人作品流量不足以支撑严肃 A/B。"
    suggestion: "低成本先行:(1) 前端点赞写成一个分数绑到调用记录上(几乎零成本拿金标准来源);(2) 按问题类型分桶埋'重试/放弃'隐式信号;(3) 检索链路把依据性做成回答后的护栏(小模型保延迟)。A/B 只在架构上留口子、不现在实装。"
  - component: "裁判去偏纪律(横切所有用裁判的地方)"
    current: "凡是用 LLM-as-judge 的评分点,目前未系统性内建去偏;而金融研报天然偏长、最吃长度偏好的亏。"
    suggestion: "把'交换位置双跑 + 长度去偏'设成裁判调用的默认纪律;警惕'裁判和被评 agent 是同一个模型'带来的自我偏好,考虑换另一家的模型当裁判;裁判用例要逐条核口径(SummEval 维度、子集 vs 超集别搞反)。"
  - component: "可靠性度量进主管线(差分金标准现只在单测)"
    current: "已有差分对照金标准(如持仓演化那几例),但主要被单元测试消费、未作为一等可靠性指标进 eval 主管线打分。"
    suggestion: "把'连做 k 次全过率'(pass^k)接进 eval_runner 当一等指标,和回答质量分并列报;对开放式回答用'多次采样投票'降裁判方差、对有唯一答案的工具任务用连胜率度量稳定性。"

