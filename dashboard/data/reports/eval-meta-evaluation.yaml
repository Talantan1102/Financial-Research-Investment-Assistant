slug: eval-meta-evaluation
title: "元评估 · 怎么论证评估体系可信"
subtitle: "评估体系自己也要被评估:效度/信度/区分度/运营健康四类准则 × 9 个可跟算示例,对照本项目记忆评估的差距图"
meta:
  date: "2026-06-05"
  basis: "4 路 workflow 调研(benchmark 科学/裁判元评估/工业实践/心理测量学)+ 28 条准则逐条对抗核查"

summary: >-
  你建了一套评估体系,凭什么说它可信?工业界把这个问题拆成四问:测得对不对(效度——分数变化
  是否反映真实质量变化,还是测到了格式、捷径、裁判脾气)、测得稳不稳(信度——换个随机种子、
  改个措辞、重跑一次,结论还成立吗)、好坏拉得开吗(区分度与诊断力——强弱系统的置信区间能不能
  分开,红灯能不能指到病灶)、长期用得下去吗(运营健康度——裁判被审计过吗、成本可控吗、误报
  会不会让团队习得性无视)。两条贯穿的暗线:其一,LLM 裁判自己必须先被审判——实测强模型裁判
  判客观对错只比掷硬币略好(50.9%),位置一对调三成判决会翻,没审计的裁判等于没有判分标准;
  其二,没有误差棒的分差表等于没有结论——对话流评估里同一段脚本挂多道题,误差不独立,按题算
  方差会把标准误低估三倍以上。一个反直觉的事实:被全行业引用的著名基准在最佳实践评分里垫底,
  而"能一键复现全部数字"这一条,公开基准里几乎没人做到。
  (先约定几个高频词:元评估 = 对评估体系本身的评估;金标准 = 人工核验过的正确答案;
  效标 = 用来校验评估分数的外部真实表现;置信区间 = 分数的不确定范围,两个区间不重叠才敢说有差距。)

sections:
  - heading: "效度:分数变化 = 真实质量变化吗"
    body: "效度是四类里最根本的——测错了对象,再稳再便宜都没用。五个经核查的判据:"
    bullets:
      - "效标效度(最硬的一条):评估分能否预测真实任务表现。反面惨案:GPT-4 在医疗考题基准拿 0.71、换成真实病历只剩 0.28,且基准上第一名换到真实临床笔记直接被反超——排名反转就是效度崩塌的铁证。正面做法:拿真实使用对话当下游金标准,验证'评估高分的版本真的表现更好'。"
      - "构念效度:分差反映目标能力,还是格式与捷径?红旗信号:改变题目表面形式(如选项编号 (A) 改 (1))让分数波动约 5%,说明模型在靠格式作答而非真本事。"
      - "内容效度:题集系统覆盖目标能力,而非随手挑题。先写下'要测什么'的能力清单,逐项核对覆盖,并显式声明'本评估不覆盖什么'——承认不完整本身是效度加分项(HELM 的做法:42 个场景里 21 个是此前主流评估忽略的,并自陈缺口)。"
      - "防数据污染:测试题出现在被测模型的训练语料里 = 作弊高分。自建对话题、用真实使用数据是最干净的防污染手段;公开数据集改编的题要先查能否在网上原样搜到。"
      - "题目无歧义:一道好题应让两名领域专家独立得出相同的通过/不通过判定,做不到就是题含糊——失败反映的是题不清而非能力差。工业建议:从 20-50 个源自真实失败的简单任务起步,而非一上来堆几百道。"
  - heading: "信度:重跑一次,结论还在吗"
    body: "LLM 评估的信度威胁比传统测验多一类——对非语义扰动的过敏。四个判据:"
    bullets:
      - "重测信度:同一系统同一题多跑几次,分数稳不稳。实测多数场景 4 次重复即可把 95% 区间宽度压到 0.01 以下;另一个被忽视的误差源:同一模型不同渠道版本统计上显著不同——记录精确模型版本号是信度的一部分。"
      - "误差棒与配对差分:每个分数都该带标准误;比较两个版本时,在同一批题上逐题对比胜负(配对差分)远比比较两个裸均分灵敏——题目分数天然相关(0.3-0.7),配对恰好把题目难度方差消掉,是'免费'的灵敏度。"
      - "聚类标准误(对话流评估最容易踩的坑):同一段脚本/同一个 session 挂多道题时误差不独立,按题算标准误会低估 3 倍以上——必须按脚本/session 聚类。"
      - "扰动信度:改写问法、调换选项顺序、换标点,判定不该变。实测反转选项顺序能让某些一致性指标从 0.75 以上崩到 0.2——评估对表面形式过敏,就谈不上测能力。"
  - heading: "区分度与诊断力:好坏拉得开吗,坏在哪说得清吗"
    body: "分不开好坏的评估是钝刀,分得开但说不清哪里坏的评估是黑盒。四个判据:"
    bullets:
      - "区分度(separability):对分数做重采样得到每个系统的置信区间,统计两两配对中区间不重叠的比例。标杆数字:Arena-Hard 区分度 87.4%,同口径下 MT-Bench 只有 22.6%——500 道好题胜过 80 道平庸题。"
      - "与人类金标准的一致率要声明口径:Arena-Hard 用置信区间口径报 89.1%;同一个 MT-Bench,用纯相关系数算会虚高到 91.3%,置信区间口径只剩 26.1%——口径不声明,数字没有意义。"
      - "逐题体检(项目反应理论):每道题估难度/区分度/猜测率,全队都对(太易)或全队都错(太难或题坏)的题区分度为零、不产生信息,该删该改。猜测率异常高是污染信号。工业简化版:统计每题在不同版本上的答对率,删零信息题。"
      - "锚题降本:题集变大后,精挑一组最有区分力的'锚题'做日常回归,全量评估留给里程碑——1.4 万道题里精挑 100 道即可可靠复现全量结果(误差 2% 以内)。"
  - heading: "运营健康度:裁判先被审判,体系当工件来管"
    body: "LLM 裁判是现代评估体系的最大单点风险,审计它有一套成熟动作;体系本身则要按生命周期管理:"
    bullets:
      - "裁判-人类一致率 meta-eval(信任裁判的唯一正路):先手标一小批金标准,测裁判与人类的一致率,达标才允许自动跑全集。LongMemEval(长期记忆场景)用'裁判与人类专家一致率 >97%'给整套评估背书;报一致率必须同时声明口径——成对还是单答、含不含平局、人和人之间的基线是多少(85% 的裁判一致率要对照人与人之间 81% 才有意义)。"
      - "裁判没那么可靠的实锤:用'客观一对一错'考裁判,GPT-4o 普通提示词只判对 50.9%(知识类 44.2%,低于随机)——强模型裁判裸用只比掷硬币略好,审计不是可选项。"
      - "位置偏差翻转审计(成本最低的去偏):每次成对比较把两个答案位置对调再判一次,两次一致才采纳。实测 GPT-4 位置对调后一致率仅 65%、约三成判决偏向排第一的答案;某些裁判一致率只有 23.8%。"
      - "冗长与自我偏好审计:把'被判对'的回答灌长但不增信息,看裁判倒不倒戈(重复列表攻击能把某些裁判骗到 91.3% 误判);裁判别用'写答案的那个模型'自己判自己(自我偏好与'能否认出自己写的'正相关)——换一个不同家族的模型当裁判。"
      - "把评估当工件管(四十六条最佳实践的精华):设计有目标与基线、实现可复现防污染、文档写清指标与局限、维护有反馈与退役机制。反差数字:被全行业用的 MMLU 在该评分里仅 5.5 分(满分约 15),24 个知名基准里只有 3 个提供一键复现脚本——'run_eval 一键复现全部数字'这一条就能超过大多数公开基准。"
  - heading: "对照本项目:记忆评估体系的差距图"
    body: "拿这套框架照自己(对话流记忆评估:脚本 + 双层断言 + LLM 裁判 + 维度×难度分数表):"
    bullets:
      - "效度最强:首跑冒烟抓出 5 个系统级真 bug(含两个'生产从未工作过')——这是效标效度的教科书证据;题为自建对话流,天然防污染;六大能力维度有内容覆盖清单。缺:真实使用对话的下游验证。"
      - "诊断力在位:双层断言(逐 session 查库 + 最终评回答)能把病灶指到写侧还是读侧——比'分数低'高一个信息量级;红灯三分类(harness 问题/真翻车/连锁)是误报治理流程。"
      - "信度部分在位:判分链确定性优先、不变量开关(交换检索顺序双跑)、每 case 干净库起跑。缺:重测方差未测、分数无误差棒、按题算方差没做 session 级聚类。"
      - "区分度未被证明:只测过一个系统、没有强弱对照——计划用消融实验补(故意关掉冲突消解跑全量,评估应能把好坏置信地拉开)。"
      - "裁判审计全空(最大窟窿):裁判-人类一致率没测、位置翻转审计没做、自我偏好没防(生成与裁判同一家模型)。落地排序:① 手标 20-30 条金标准测裁判一致率 ② 误差棒 + 聚类标准误进分数表 ③ 位置翻转审计进裁判调用 ④ 消融区分度实验。"

dimensions_meta:
  title: "9 个元评估准则 · 每个配一个可跟算示例"
dimensions:
  - name: "效标效度:评估分预测真实表现"
    plain: "评估的终极拷问——在你的题上拿高分的系统,在真实使用里真的更好吗?断了这一环,分数只是自嗨。"
    setup: "记忆评估给版本甲 82 分、版本乙 74 分。你另有 20 段真实用户对话,人工判过两个版本在其中的实际表现。"
    question: "82 分的版本甲在真实对话里也更好吗?"
    good: "20 段真实对话里甲在 15 段表现更好——评估分与真实表现同向,效标效度成立;把这个验证写进评估文档。"
    bad: "真实对话里乙反而更好(排名反转)——医疗基准的真实惨案:考题上 GPT-4 第一(0.71),真实病历上掉到 0.28 还被反超。此时该修的是评估,不是系统。"
    scored: "评估排名与真实表现排名的一致方向比例;出现排名反转即效度警报。最低可行:抽几条 dogfood 真实对话当下游金标准定期比对。"
  - name: "误差棒与配对差分"
    plain: "72 分和 75 分,有差距吗?不带不确定度的分数没法回答——而比较两版本时,配对差分比比均分灵敏得多,还是免费的。"
    setup: "版本甲 72 分、版本乙 75 分,各跑了 50 道题。"
    question: "能下结论乙更好吗?"
    good: "先算标准误:若 ±4 分,72 与 75 的区间大幅重叠,不能下结论;再做配对差分——同一批题逐题比胜负,乙赢 31 题、甲赢 12 题、平 7 题,配对检验显著——这才敢说乙更好。题目分数天然相关(0.3-0.7),配对恰好消掉题目难度方差。"
    bad: "'75 > 72,乙更好'——噪声当信号;或者只比较两个独立置信区间是否重叠(浪费了同题相关性,检验力偏弱)。"
    scored: "每个分数 ±标准误;两版本比较一律配对差分。这是 Anthropic 统计评估方法论的地基。"
  - name: "聚类标准误:同脚本的题不是独立样本"
    plain: "对话流评估一段脚本挂七道题——这七道共享同一段写入历史,一损俱损,按 7 个独立样本算方差会严重自欺。"
    setup: "4 段脚本各挂 7 道题,共 28 题。写管线在某段脚本上整体失败,该段 7 题全红。"
    question: "算总分的标准误,分母按 28 还是按 4?"
    good: "按脚本聚类:随机化单元是脚本不是题,28 题实际只有 4 个独立信息源。实测聚类标准误可比朴素算法大 3 倍以上——承认不确定度大,才不会把噪声当提升。"
    bad: "按 28 个独立样本算出很小的标准误,得出'新版本显著提升'——其实只是某段脚本恰好顺利。"
    scored: "凡题目成簇(同段材料/同 session 多题),标准误必须按簇聚类。对话流评估天然全员中招,这条是本项目分数表的必修课。"
  - name: "裁判-人类一致率 meta-eval"
    plain: "LLM 裁判在判分之前,自己得先被人类判一次——这是信任自动裁判的唯一正路。"
    setup: "评估里 LLM 裁判按 rubric 判记忆回答合不合格。你手工标了 30 条作金标准。"
    question: "裁判的判定和你的判定,一致率多少?"
    good: "30 条里 28 条一致(93%),且声明口径(单答判定/无平局/对照人人基线)——写进评估文档,裁判获得信任执照;低于基线就改判分 rubric 重测,不达标不上岗。LongMemEval 正是用'>97% 一致'给整套长期记忆评估背书。"
    bad: "从未对过人类金标准就裸用裁判——实测裁判判客观对错可以低到 50.9%(知识类 44.2%,比随机还差),裸信裁判 = 把判分标准外包给一个没体检过的黑盒。"
    scored: "一致率 = 裁判与人类金标准判定相同的比例,达标阈值自定但必须公开口径与人人基线。"
  - name: "位置翻转审计:裁判最便宜的去偏"
    plain: "成对比较时,裁判会偏爱排在前面的答案——把位置对调再判一次,两次一致才算数,几行代码的事。"
    setup: "裁判要判'回答甲 vs 回答乙谁更忠于记忆'。"
    question: "怎么防裁判其实在选'排第一的那个'?"
    good: "甲乙顺序判一次、乙甲顺序再判一次:两次都选同一个 → 采纳;两次矛盾 → 判平局或送人工。实测 GPT-4 不做翻转时约三成判决偏向第一位。"
    bad: "只判一次就采纳——位置偏差直接写进分数;候选超过两个时更糟,某些裁判在三四个候选下一致率跌破一半。"
    scored: "翻转一致率(两次判定相同的比例)本身就是裁判质量指标;评估体系里所有成对裁决默认双跑。"
  - name: "区分度:好坏系统的区间分得开吗"
    plain: "评估的存在意义是分出好坏——拿几个已知强弱的版本喂给它,置信区间分不开就是钝刀。"
    setup: "手里有三个版本:完整版、关掉冲突消解的削弱版、关掉检索的残废版(已知强弱顺序)。"
    question: "评估能把三者按置信区间拉开吗?"
    good: "完整版 81±3、削弱版 62±4、残废版 31±5,区间互不重叠——区分度成立,顺带验证了'冲突消解这个组件值 19 分'(消融实验的副产品)。"
    bad: "三个版本 71±8、68±9、64±8 全部重叠——要么题太弱要么噪声太大,这套评估测不出组件价值。标杆:Arena-Hard 区分度 87.4% vs MT-Bench 22.6%。"
    scored: "两两配对中置信区间不重叠的比例;个人项目最低可行 = 消融对照(故意削弱一个组件),评估必须能把它和完整版分开。"
  - name: "重测信度:分数是不是这个分"
    plain: "温度不为零、裁判有方差、系统有随机性——同一套东西重跑,分数漂多少决定你能信小数点后几位。"
    setup: "同一版本同一脚本,连跑 5 次评估。"
    question: "5 次分数是 74/73/75/74/74,还是 68/79/71/82/65?"
    good: "前者:波动 ±1,4 次重复即可把区间压到可用——单次跑分可信,可以拿来做版本比较。"
    bad: "后者:±8 的漂移,任何一次单跑的分数都不可比——必须先找到方差来源(裁判?检索顺序?LLM 抽取?)收窄,或报多次均值。另一个隐蔽误差源:换了模型版本/渠道,统计上就是另一个系统,版本号要进报告。"
    scored: "重复运行的分数方差/区间宽度;关键结论用多次均值,报告记录精确模型版本。"
  - name: "逐题体检:删掉零信息的题"
    plain: "全队都对的题和全队都错的题都不产生信息——题目本身要定期体检,区分度为零的清出去。"
    setup: "评估集 30 道题在 4 个版本上跑完,有 6 道全员通过、3 道全员失败。"
    question: "这 9 道题留不留?"
    good: "全员通过的 6 道:太易,降为'金丝雀'(只在体系自检时跑,不计分)或删除;全员失败的 3 道:逐条人工检查——是题坏/标签错,还是真的全行业难题(如多跳冲突那种全员 6% 的,保留当难度锚)。猜测率异常高的题是污染信号。"
    bad: "30 道全保留照常计分——9 道零信息题稀释了分数的区分力,还白烧 30% 的跑分成本。"
    scored: "每题的跨版本答对率分布;两端(全对/全错)的题逐条裁决去留。工业重型版是项目反应理论估难度/区分度/猜测率三参数。"
  - name: "一键复现:超过大多数公开基准的一条"
    plain: "评估数字别人(包括三个月后的你)能不能一条命令重现?公开基准里这条的达成率低得惊人。"
    setup: "你在文档里写'记忆评估写侧断言通过率 5/8'。"
    question: "三个月后怎么验证这个数字不是当时手滑?"
    good: "`python -m eval.memory_dialogue.run_eval --script ...` 一条命令重跑出同一张分数表,脚本/数据/judge prompt 全部版本化在仓库里——24 个知名基准里只有 3 个做到这条,做到就超过大多数。"
    bad: "数字在聊天记录/截图里,复现要靠回忆当时的环境和参数——BetterBench 实测这是公开基准最普遍的失败(实现阶段平均分最低)。"
    scored: "一键复现脚本存在且可跑 + 结果与已发布数字一致;统计显著性与复现性是 46 条最佳实践评分里全行业最弱的两项。"

benchmarks_title: "证据来源速览 · 元评估的工具箱"
benchmarks:
  - name: "Arena-Hard(区分度+一致率双指标的开创)"
    what: "用两个量化指标评'评估本身':与人类偏好排名的置信区间口径一致率 89.1%、模型区分度 87.4%(MT-Bench 同口径只有 22.6%);另有配对排名 Brier 分 0.069 衡量'排名预测的校准'。"
    fit: "我们评估体系的'毕业答辩'模板:区分度用消融版本验证,一致率拿用户人工排序当金标准。"
  - name: "Anthropic 统计评估方法论(误差棒/配对/聚类)"
    what: "给评估加统计学地基:中心极限定理算标准误、配对差分利用题目相关性(0.3-0.7)提升灵敏度、成簇题目聚类标准误(可比朴素算法大 3 倍以上)、trial 隔离防相关失败。"
    fit: "分数表改造的直接依据:±标准误、按脚本聚类、配对比较——三条全部直接适用于对话流评估。"
  - name: "JudgeBench / RewardBench(裁判的考场)"
    what: "用客观对错考裁判:同题造'一对一错'回答对,裁判挑对的。GPT-4o 普通提示词仅 50.9%(知识类 44.2% 低于随机);RewardBench 用人工核验的优选/劣选三元组,劣选带可验证硬伤且长度受控。"
    fit: "给金融记忆裁判造考题的现成方法:对的回答 + 带具体事实硬伤的回答,长度相近,看裁判挑不挑得出。"
  - name: "LongMemEval 的裁判背书流程"
    what: "长期记忆场景的元评估示范:裁判(指定精确版本)先对人类专家标注测一致率,>97% 达标后才自动评 500 题;判分 prompt 与 meta-eval 细节进附录。"
    fit: "与本项目场景完全对口,落地排序第一项(手标 20-30 条金标准测裁判一致率)就是照它抄。"
  - name: "MT-Bench 偏差实测 + CALM 统一审计"
    what: "裁判偏差的量化起点:位置(翻转一致率 65%/23.8%)、冗长(重复列表攻击骗倒 91.3%)、自我偏好(给自家高 10%-25%,原文自陈证据有限)。CALM 框架扩到 12 类偏差,注入扰动测稳健率(恐惧情绪注入能把稳健率从 0.92+ 打到 0.25-0.36)。"
    fit: "审计菜单:本项目优先做位置翻转(零成本)+ 冗长攻击(金融研报偏长,最吃这亏)两项。"
  - name: "BetterBench / HELM(体系生命周期管理)"
    what: "BetterBench 用 46 条最佳实践评 24 个基准:MMLU 仅 5.5 分、只有 3 个基准给一键复现脚本、统计显著性全行业最弱(均分 5.62/15)。HELM 示范'先定义评测空间再系统抽样'+ 每场景 7 指标并行 + 自陈缺口。"
    fit: "把评估当工件管的对照清单;'一键复现 + 带显著性'两条做到即超大多数公开基准——本项目 CLI 已具雏形。"
  - name: "心理测量学迁移(IRT/分半信度/锚题)"
    what: "测验理论的现成工具:项目反应理论逐题估难度/区分度/猜测率(猜测率异常高=污染信号);分半信度无需重跑即可算内部一致性;tinyBenchmarks 实证 1.4 万题精挑 100 道锚题即可复现全量(误差 2% 内)。"
    fit: "题集长大后的降本与体检工具;个人项目简化版:跨版本答对率分布删零信息题 + 固定锚题做日常回归。"

pitfalls:
  - "裸信 LLM 裁判:实测强模型裁判判客观对错只有 50.9%(知识类低于随机),位置一对调三成判决翻盘——裁判不过人类一致率审计就上岗,等于判分标准没有标准。"
  - "没有误差棒的分差表:72 vs 75 在 ±4 标准误下毫无结论;更隐蔽的是对话流评估按题算方差——同脚本的题共享命运,朴素标准误低估 3 倍以上,把噪声当成提升。"
  - "一致率不声明口径:同一个评估,相关系数口径 91.3%、置信区间口径 26.1%——不写口径的一致率数字可以随便挑好看的报。"
  - "把'广泛使用'当'质量过硬':MMLU 被全行业引用,但最佳实践评分仅 5.5 分、含错标与不可答题;引用一个基准前先看它自己的体检报告。"
  - "排名反转不当回事:基准上第一、真实场景被反超(医疗考题 0.71 → 真实病历 0.28)——评估分和真实表现脱钩时,继续按分数优化就是在优化一个假目标。"
  - "零信息题白烧钱:全队都对和全队都错的题不产生区分信息,还稀释分数;但'全员都错'要先人工裁决是题坏还是真难题(全行业 6% 的多跳冲突就该保留当难度锚)。"

gaps:
  - component: "效度(本项目最强项)"
    current: "效标效度有教科书级证据:首跑冒烟抓出 5 个系统级真 bug(含两个'生产从未工作过');自建对话流题天然防污染;六大能力维度有内容覆盖清单;红灯三分类(harness/真翻车/连锁)是现成的误报治理流程。"
    suggestion: "补真实使用对话的下游验证:抽几条 dogfood 对话当外部效标,定期比对'评估高分版本是否真实表现更好';评估文档加一节'本评估不覆盖什么'(HELM 式自陈缺口)。"
  - component: "信度(部分在位)"
    current: "判分链确定性优先(数据库断言/字符串校验零 LLM)、不变量开关(检索顺序双跑)、每 case 干净库起跑(trial 隔离)——三件套已是信度设计。"
    suggestion: "三个缺口按序补:(1) 分数表加 ±标准误,(2) 按脚本聚类算方差(同脚本七题不是七个独立样本),(3) 关键结论跑 3-5 次报均值并记录模型精确版本。"
  - component: "区分度(未被证明)"
    current: "只测过一个系统,没有强弱对照——'评估能把好坏拉开'尚无证据。"
    suggestion: "消融区分度实验:故意削弱组件(关冲突消解/关检索)造已知强弱的版本组,验证评估能用置信区间把它们分开——同时白拿'组件价值量化'这个作品叙事素材。"
  - component: "裁判审计(最大窟窿)"
    current: "裁判-人类一致率没测过;位置翻转审计没做;生成与裁判同一家模型(自我偏好风险);rubric 判定从未对过人工金标准。"
    suggestion: "落地排序:(1) 手标 20-30 条记忆判定金标准,测裁判一致率并公开口径——LongMemEval 同款流程;(2) 成对裁决加位置翻转双跑;(3) 裁判换不同家族模型或至少做一轮冗长攻击审计(金融研报偏长,最吃这亏)。"
  - component: "统计口径与复现(离'超过大多数公开基准'一步之遥)"
    current: "run_eval CLI 已能一键出全部数字(24 个知名基准只有 3 个做到);但分数无显著性标注。"
    suggestion: "给分数表的每个结论配置信区间;评估文档加'复现一节'(命令/数据版本/judge prompt 版本)——统计显著性与复现性正是全行业最弱两项,补齐即是差异化。"
  - component: "题集体检(题量长大后的事)"
    current: "28 段脚本约 85 题的规模尚可全量跑;暂无逐题区分度数据(只有一个被测系统)。"
    suggestion: "消融版本组建立后顺手做:统计每题跨版本答对率,删全对题、裁决全错题(保留难度锚如多跳冲突);题集再扩大时精挑锚题做日常回归、全量留里程碑。"

