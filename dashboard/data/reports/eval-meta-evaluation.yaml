# ----------------------------------------------------------------------------
# 来源:2026-06-05 workflow 调研(4 路并行:benchmark 科学/裁判元评估/工业实践/
# 心理测量学迁移,37 agent,28 条准则核查存活)+ 逐条对抗式事实核查。
# 是《长期记忆 · 故障模式与造题》的下一环:那篇讲题怎么造,这篇讲"造出来的
# 评估体系,拿什么证明它自己可信"。对照本项目对话流记忆评估体系的差距图。
# 由 dashboard/derive/report.py 类型化加载,渲染于 /eval/report/<slug>。
