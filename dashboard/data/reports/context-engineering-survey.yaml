# dashboard/data/reports/context-engineering-survey.yaml
# ============================================================================
# 研究报告:工业界 agent loop 的上下文工程怎么做
# ----------------------------------------------------------------------------
# 来源:2026-06-04 Workflow 8 路并行联网调研(Anthropic 官方体系 / Claude Code
# 生产实践 / Manus KV-cache 经济学 / OpenAI 会话管理 / LangChain 生态 / 长上下
# 文退化实证 / 工具结果管理 / 记忆系统接缝)+ 21 条承重结论对抗式事实核查
# (confirmed 18 / partly 3,凡 partly 一律用更正版)+ 对照本项目 chat 模式
# 重设计草案逐条裁决。
# 由 dashboard/derive/report.py 类型化加载,渲染于 /eval/report/<slug>,
# 入口挂「上下文与记忆」维度页 /m/context。
# 写作约定:不用读者无法对应的内部代号;厂商数字一律标注口径(官方文档/工程
# 博客/论文/社区逆向,一手还是二手);每个要点配贴近本项目业务的例子。
# ============================================================================

slug: context-engineering-survey
title: Agent Loop 上下文工程 · 怎么做
subtitle: >-
  用具体例子讲明白:7 个上下文工程设计决策 × 真实场景,横扫 KV-cache 前缀经济学 / 压缩与可回取 / 检索式记忆 / 中文 token
  计数,对照本项目 chat 模式重设计草案逐条裁决
meta:
  date: '2026-06-04'
  basis: >-
    8 路并行联网调研 + 21 条承重结论对抗式核查(confirmed 18 / partly 3,均用更正版)+ 对照本项目 chat 重设计草案
summary: >-
  上下文工程,说白了就是管理"每一轮调模型时,窗口里到底装哪些 token"。为什么值得专门一份调研:一来模型的记性会随上下文变长而变差(实证:18
  个前沿模型无一幸免,而且远在窗口装满之前就开始);二来厂商对"和上次请求开头逐字相同的部分"有大幅打折(qwen 缓存命中部分约按输入价两折计费)——窗口里的东西放哪、什么时候压缩、压缩丢什么,直接决定一个
  agent 的智商和成本。先约定几个高频词:窗口/上下文 = 一次模型调用能看到的全部文本;前缀缓存(KV-cache)= 厂商把"跟上次请求开头逐字相同"的部分打折复用,但只要有一个字不同,从那个字起折扣全部作废;压缩(compaction)=
  窗口快满时让模型把旧对话总结成摘要、用摘要重开;摘要降级(digest)= 把大工具结果换成短摘要外加一个能取回原文的指针;context rot = token
  越多模型召回越差,是连续下滑不是撞墙;lost in the middle = 窗口开头和结尾的内容记得牢、中间最容易被忽略。核心结论一句话:把窗口切成"稳定前缀(角色/工具说明/用户画像)→
  历史(摘要+最近几轮)→ 本轮工具轨迹 → 尾部动态状态"四个区,谁都不许越界——尤其"还剩几步/预算还剩多少"这类每圈都变的状态必须放最尾部,放进开头就是每圈亲手把打折优惠撕掉。所有厂商数字均标口径;凡对抗核查标
  partly 的一律用更正版。
sections:
- heading: 为什么要管:上下文是有限的、会退化的资源
  body: >-
    把窗口当无限大的垃圾桶,是上下文工程要反对的第一直觉。Anthropic 工程博客的论证:transformer 里每个 token 要和其它所有 token
    两两建立注意力关系,token 越多这张关系网被摊得越薄——所以上下文是带"注意力预算"的有限资源,每个冗余 token 都在主动拉低表现。实证地基来自三项研究:Chroma
    的 context rot 报告(2025,一手)测了 18 个前沿模型(含 Claude / GPT / Gemini / Qwen 系列),每一个都随输入变长而退化,且是连续下滑不是撞墙;"lost
    in the middle"(Liu 等,2023,一手)发现答案放在窗口开头和结尾召回最好、放中段最差,呈 U 形;RULER(NVIDIA,2024,一手)量化了"标称
    vs 有效"窗口差距——GPT-4 标称 12.8 万 token,有效只有 6.4 万。放到本项目场景:一个聊了五十轮的会话,用户在第三轮说过"我只看新能源,白酒就别推了",到第四十轮这句话正好位于窗口中段——恰是模型最容易忽略的位置;等到助手把贵州茅台推了出来,问题不在模型蠢,在窗口没管。
  bullets:
  - >-
    Chroma context rot(一手):18 个模型全部随输入变长连续退化,刻意不给统一百分比(退化幅度因模型/任务/长度而异);反直觉发现——把背景材料打乱后模型反而比逻辑连贯的版本表现更好,连贯语义本身会制造干扰。
  - >-
    RULER(一手):有效窗口普遍远小于标称——GPT-4 标称 12.8 万有效 6.4 万;声称支持 3.2 万 token 的模型里只有约四成真达标(论文原文是十选四,"约一半"的流传说法偏松,此处用更正口径)。
  - >-
    lost in the middle(一手):多文档问答里答案文档放在中间位置时召回显著低于首尾,U 形曲线在不同窗口长度下都成立。工程含义不是"别放中间",而是"中段留给可降级内容,关键信息占首尾"。
  - >-
    单个干扰项就降分(Chroma 一手):检索回来"相似但不对"的材料,比什么都不放更糟——这直接影响记忆/知识库该不该每轮强制注入(见后文)。
- heading: 前缀稳定是第一铁律:KV-cache 经济学
  body: >-
    Manus 的工程博客(一手)把前缀缓存命中率称为"生产 agent 单一最重要指标",理由是一笔账:agent 每圈只产出少量决策文字、却要把越来越长的历史整个喂回去,Manus
    实测输入输出 token 比约 100:1——成本几乎全花在反复"重读"历史上。而厂商对逐字相同的前缀有大折扣:Manus 引 Anthropic Sonnet
    价目,缓存命中比未命中便宜约十倍;本项目用的 qwen(DashScope)有隐式上下文缓存,默认开启、命中部分约按输入价两折计费(官方文档口径,落地前按所用模型当期价目核实)。代价是规矩:缓存按"精确前缀匹配"生效,开头有一个字不同,从那个字起全部作废。放到本项目场景:回答"宁德时代最新一季毛利率多少、跟比亚迪比呢"要转五圈循环,每圈请求的开头(角色设定+工具说明+用户画像)逐字相同就自动吃折扣;但若把"你还剩
    8 步"写进开头,下一圈变成"还剩 7 步"——一字之差,五圈全部全价重算你最想缓存的部分。Manus 点名的同类错误还有把秒级时间戳放在系统提示开头。
  bullets:
  - >-
    Manus 三铁律(一手):前缀保持稳定 / 上下文只追加不回改 / 需要时显式标记缓存断点。输入输出比约 100:1、单任务平均约 50 次工具调用,都是
    Manus 自报口径。
  - >-
    qwen 上下文缓存(阿里云官方文档,一手):隐式缓存默认开、无需付费启用,命中按输入价约两折,最小 256 token 起;显式缓存创建付约 1.25
    倍、命中约一折、五分钟有效期。注意两折与一折是两套机制的口径,落地按实际模型与地域价目核实,命中"不保证",要靠回包里的缓存命中 token 数实测。
  - >-
    工具定义紧跟系统提示之后序列化,会话中途增删一个工具 = 后续所有轮次的缓存全部作废,还会让模型看到指向"已消失工具"的历史而困惑(Manus 一手)。要按场景启停工具时,用掩码/约束生成挡住,别真删——"掩码不删除"。
  - >-
    Anthropic 提示缓存文档(一手)同一结论的官方表述:缓存层级是工具→系统提示→消息,改了哪一层、该层及之后全部失效;OpenAI 文档(一手)的版本是"静态内容放前面,动态内容放后面"。
- heading: 压缩的工业三层:落盘可回取 → 占位符微压缩 → 全量总结
  body: >-
    窗口逼近上限时怎么办,Claude Code(生产 agent 里最成熟的一个)给出三层流水线(社区逆向+官方博客交叉):第一层"预算层"——大的工具输出(读文件/搜索结果)早早落盘,窗口里只留路径引用,要用按路径取回;第二层"微压缩"——更老的工具结果清成一句占位符(让模型知道"这里曾有过、被移走了"),但保留消息骨架和调用配对关系,原文可按指针取回;第三层"全量压缩"——接近窗口满时用模型把整段对话蒸馏成结构化摘要、带着摘要重开新窗。关键区分:前两层是可逆的(原文还在,能取回),只有第三层是不可逆的有损总结。放到本项目场景:用户让"把六只持仓股挨个查财报和公告,汇总风险",每份财报工具返回几千
    token,转到第八圈窗口里堆了一万多 token 的工具结果——老的换成"全文已缓存,毛利率 22.3%、营收同比增 18%"的占位摘要,原文留在 PG 工具结果缓存里;但比对工具失败的报错原文要留着(模型靠读失败原文纠错,Manus
    的说法是"把走错的路留在上下文里");等真到全量压缩时,摘要模板里必须写明"每个定量数字带口径和来源原样保留"——"贵州茅台毛利率 91.2%(2025 年报口径)"绝不能被糊成"毛利率很高"。
  bullets:
  - >-
    Anthropic 官方压缩 API(一手):默认 15 万 input token 触发、最小 5 万;摘要写进一个压缩块,之前的消息自动丢弃;压缩本身是一次额外的大模型调用、单独计费——所以阈值必须留余量,贴着窗口满才压,压缩自己都没空间跑。
  - >-
    Anthropic 官方工具结果清理(一手):默认 10 万 token 触发、保最近 3 个工具调用、清掉的换占位符;有个"至少清够多少才动手"的参数——因为清理同样会作废缓存前缀,清太碎反而更贵。
  - >-
    Claude Code 命令行的压缩触发阈值,官方从未公布——社区逆向出 75% 到 95% 各种说法互相打架且随版本漂移,引用任何一个当"官方规格"都是错的;它的结构化摘要模板(用户意图/技术决策/触及文件/错误与解决/待办状态/下一步)也是社区逆向,但模板思路值得抄。
  - >-
    压缩踩在子任务中段是头号社区抱怨(Claude Code 一手 issue):正查到第三只股票准备比对时触发压缩,模型醒来忘了查到哪。解法是双阈值——软阈值到了等当前工具链跑完再压,硬阈值才强制。
- heading: 检索式记忆 vs 每轮强制注入:两派分水岭与各自的病
  body: >-
    记忆系统怎么接进 agent loop,工业界有一条清晰的分水岭。一派是 MemGPT/Letta 的"模型自管":记忆读写做成工具,模型自己决定什么时候查、什么时候写——核心病是"模型忘了查"(冷启动:用户问跟持仓相关的问题,模型压根没想起来要查持仓)。另一派是
    Zep/Mem0 的"自动注入":后台检索好拼进窗口,不劳模型操心——核心病有两个,一是无关轮次也照灌(用户问"美联储议息什么时候",持仓记忆塞进去白占 token,检索不准时等于主动喂干扰项),二是注入位置若在系统提示区、每轮内容变化会反复打掉前缀缓存(有社区一手
    issue 实测过这种事故:每隔几轮全量重算一次,两万 token 的会话每次多等数分钟)。Anthropic 的官方建议是混合:开场预载一部分(像 Claude
    Code 启动即读入项目说明文件),其余 just-in-time——模型拿着轻量指针(文件路径/查询语句)需要时自己拉取。放到本项目场景:用户画像(持仓/偏好白马)几乎每轮都相关,开场注入一次、会话内冻结;"上个月聊过的某次加仓讨论"这类长尾记忆做成检索工具,模型需要才调,系统提示里写明纪律——涉及用户持仓/偏好/历史观点,先查记忆。
  bullets:
  - >-
    注入派做好了的上限(Zep 论文一手):平均上下文从约 11.5 万 token 降到 1600,回答准确率反升——前提是检索精度高;检索不准时注入的是干扰项,比不注入更糟(对照
    Chroma 单干扰项降分的实证)。
  - >-
    自管派的代价(MemGPT 论文点名):模型每圈要花推理预算决定"查不查、写不写",循环变慢变贵。
  - >-
    冷启动兜底别用"强制模型每轮首调记忆搜索"——强制工具调用时模型会给必填参数瞎编值(OpenAI 社区一手),搜索词是编的、召回就塌。画像兜底用确定性规则注入(代码直接拼,不经模型决策)。
  - >-
    画像放哪有讲究:全用户共享的角色/工具纪律放系统提示最前(跨会话吃缓存),用户私有画像放共享段之后、会话内冻结;画像中途更新走"新消息追加",绝不回改已缓存的段。
- heading: 中文 token 计数:按字符估算的系统性低估
  body: >-
    预算闸、压缩阈值、大结果降级全建立在"窗口现在多少 token"的估算上——中文场景这里有个安静的深坑。qwen 官方文档(一手)的口径:中文 1 个 token
    约对应 1.5 到 1.8 个字符;而"每 2.5 个字符算一个 token"这类系数会系统性低估三成五到五成。放到本项目场景:一段五千字的中文研报讨论,按
    2.5 系数估约 2000 token,按 qwen 实际约 3000 token——预算闸显示还剩三成,实际已经超了;压缩该触发时没触发,窗口悄悄滑进退化区。本项目现状代码(会话内存的估算常数)用的恰是
    2.5,这次调研顺带把现状问题也暴露了。修法分两层:优先用 DashScope 回包的真实 usage 回填(每圈拿到上一圈的精确 token 数,零成本零误差);估算只做首圈
    fallback,系数改用官方口径(约每 1.65 字符一个 token);所有阈值统一用 token 不用字符——同样"2000 字符",中文约 1200 token、英文约
    550 token,一刀切的字符阈值中英文行为差两倍。
  bullets:
  - qwen 官方口径(一手):英文 1 token ≈ 3-4 字符,中文 1 token ≈ 1.5-1.8 字符。
  - >-
    LangChain 的默认估算系数 4.0 字符/token 明确标注"针对常见英文文本"、对 CJK 无声明且自带免责(一手)——拿英文系数算中文,误差不是偏一点,是方向性的。
  - >-
    对抗核查特别裁决:"每 2.5 字符一个 token"这个常数没有任何厂商一手文档背书,属工程经验值用错了参照分词器;统一改用真实 tokenizer 或回包
    usage 校准。
dimensions_meta:
  title: 7 个上下文工程设计决策 · 每个配一个真实场景
  labels:
    setup: 场景
    question: 怎么做
    good: 好做法
    bad: 翻车点
    scored: 怎么判断 · 谁在用
dimensions:
- name: 窗口分区:稳定前缀在前,动态状态在尾
  plain: 决定窗口里每段内容的位置——哪些逐字不变吃缓存折扣,哪些每圈更新只能放最后。
  setup: >-
    chat 重设计后,回答"宁德时代最新一季毛利率多少、跟比亚迪比呢"要转五圈循环。每圈都想提醒模型"你还剩几步、预算还剩多少",免得它无节制查下去——这个每圈都变的提示写在哪?
  question: 窗口怎么排布,动态状态放哪?
  good: >-
    窗口切四区:最前是逐字节恒定的稳定前缀(角色+工具纪律+用户画像,画像会话内冻结);其后是历史区(压缩摘要+最近几轮原文,摘要一旦生成不再变);然后是本轮工具轨迹(只追加不回改);"还剩几步/预算剩多少"做成追加在最尾部的一条短提示,每圈重写——只作废尾部这一小段缓存,而且尾部恰是模型召回最强的位置(lost
    in the middle 的反面),一举两得。Manus 的 todo 清单复诵走的就是这条尾部通道。
  bad: >-
    把"还剩 8 步"写进系统提示前部——下一圈变"还剩 7 步",从那个字起整段前缀缓存作废,五圈循环每圈全价重算角色+工具说明+画像这块最该缓存的内容。同类错误:秒级时间戳放开头(Manus
    点名的 common mistake)、每圈重拼用户画像、把检索结果插进系统提示区。
  scored: >-
    看回包里的缓存命中 token 数(DashScope 是 prompt_tokens_details.cached_tokens),把命中率做成一等观测指标——Manus
    称之为生产 agent 单一最重要指标(输入输出比约 100:1,成本几乎全在重读历史)。谁在用:Manus(三铁律)、Anthropic(改系统提示层=该层及之后全失效,一手文档)、OpenAI(静态放前动态放后,一手文档)、Claude
    Code(动态提醒追加到下一条用户消息)。
- name: 大工具结果:占位符+可回取指针,不是一刀切截断
  plain: 一份财报 JSON 几千 token,全文常驻窗口太奢侈,直接砍掉又怕后面要用——换成短摘要加一个能取回原文的指针。
  setup: >-
    用户让"把六只持仓股挨个查财报和公告,汇总风险",每份财报工具返回几千 token,转到第八圈,窗口里堆了一万多 token 的工具结果,大部分已经用过了。
  question: 老的工具结果怎么处理?
  good: >-
    超过阈值(按 token 算,例如 800 token)的工具结果,老圈的替换成"占位符+关键数字摘要+缓存键"(例:全文已缓存,毛利率 22.3%、营收同比增
    18%),原文留在 PG 工具结果缓存;给模型一个显式的"按键取回"工具,要细节自己拉回——Claude Code 连报错信息都在教模型用偏移量参数取片段。最近几圈的工具结果保留全文(它们是下一步决策的依据)。
  bad: >-
    不可逆地只留摘要不留指针——第十圈模型想要"比亚迪那份财报里的存货周转率"时无路可走;或者干脆截断,模型不知道信息曾存在;或者把失败的报错也压掉——模型纠错全靠读失败原文(Manus:把走错的路留在上下文里),失败轨迹在下一次成功之前不降级。
  scored: >-
    看"取回率"(模型多久调一次取回工具,太高说明降级太激进)和工具结果占窗口比例(社区口径:工具输出占长会话六到八成 token,二手)。谁在用:Claude
    Code 三层流水线(落盘+路径可回取)、Anthropic 工具结果清理(默认保最近 3 个、清掉换占位符,一手)、LangChain Deep Agents(超
    2 万 token 落盘留路径+头十行预览,官方博客一手)。
- name: 压缩时机与摘要模板:对齐任务边界,保住定量数字
  plain: 窗口快满时让模型总结旧对话重开——什么时候压、用什么模板总结,决定丢掉的是冗余还是关键。
  setup: >-
    一个长会话聊了三十多轮、覆盖八只股票,窗口逼近预算上限该压缩了;但模型此刻正在"查完比亚迪财报、准备和宁德时代比对"的子任务中段。
  question: 现在立刻压,还是等等?摘要怎么写?
  good: >-
    双阈值:软阈值(如七成)到了不立刻压,等当前子任务的工具链跑完再压——压在子任务中段是 Claude Code 社区的头号抱怨;硬阈值(如九成)强制压。摘要用结构化模板:用户原始意图
    / 已确认的关键事实 / 每个定量数字带口径和来源 / 出过的错和解法 / 未决问题 / 下一步。金融场景的铁规矩:"贵州茅台毛利率 91.2%(2025 年报口径)"必须原样保留,不能被"毛利率很高"糊掉。压缩本身是一次额外的大模型调用,其成本计入本轮预算闸。
  bad: >-
    纯按 token 阈值机械触发,正好压在多工具子任务中段,模型醒来忘了查到哪;自由发挥式总结把定量数字压成定性形容;压缩后又立刻被本轮轨迹顶回阈值、反复压缩抖动(压完要留缓冲);把压缩成本漏在预算闸外,一压缩预算就爆。
  scored: >-
    压缩是有损的,看压缩后任务成功率回归(Anthropic 调法:先最大化召回、再迭代提精度,一手博客)。口径对照:Anthropic 官方压缩 API 默认
    15 万 token 触发、最小 5 万(一手);Claude Code 命令行的百分比阈值全是社区逆向(75%-95% 互相打架)别当规格。谁在用:Anthropic
    压缩 API、Claude Code(结构化摘要模板,社区逆向)、OpenAI 摘要会话(双阈值,保最近两轮逐字,一手 cookbook)。
- name: 协议红线:工具调用与工具结果消息必须成对
  plain: 模型发起的每个工具调用消息,后面必须紧跟对应的结果消息——压缩删消息切破这个对子,接口直接报错。
  setup: >-
    压缩逻辑把三十轮历史砍到最近四轮,边界正好切在"调用比对工具的指令消息"和"比对结果消息"之间——指令被删了,结果还留着。
  question: 会发生什么?怎么防?
  good: >-
    边界规则写死:裁剪/压缩边界只允许落在用户消息之前、或一个完整的"调用+结果"序列之后;轮内降级只替换结果内容、保留消息骨架和配对关系(占位符让模型知道曾有过);用"已处理消息标记集合"做幂等,防止同一段被反复降级。LangChain
    的总结实现有个值得抄的细节:若总结窗口最后一条带工具调用,连带后续所有对应结果消息一起纳入。
  bad: >-
    删消息删破对子——DashScope/OpenAI 直接返回四百错误(带工具调用的助手消息后面必须跟工具消息);本项目重设计是裸 Python 循环手搓消息列表,没有框架兜底,这个错误在压缩和降级两条路径上必踩;保留最近几条消息的朴素写法(列表切片)不检查边界,照样切破。
  scored: >-
    协议口径非性能数字。谁在用:LangChain trim_messages(裁剪后从用户消息开始、结尾停在完整工具序列的边界参数,一手文档)、LangMem
    总结节点(运行摘要对象带已总结消息标记,一手)、Anthropic 工具结果清理(默认只清结果保调用、成对处理,一手)。
- name: 记忆注入:检索式工具为主,画像冷启动兜底
  plain: 用户的持仓/偏好这些记忆,是每轮自动塞进窗口,还是让模型需要时自己查?
  setup: >-
    用户这轮问"今天新能源板块怎么样"——跟他持有宁德时代相关;下一轮问"美联储议息什么时候"——跟持仓无关。记忆系统里存着他的持仓、偏好白马股、上个月说过想加仓。
  question: 记忆怎么进窗口?
  good: >-
    双轨:画像(持仓/偏好这类几乎每轮都相关的背景)在会话开场用确定性规则注入一次、会话内冻结;其余记忆(历史观点/某次讨论的结论)做成检索工具让模型按需调,系统提示写明纪律——涉及用户持仓/偏好/历史观点先查记忆。这正是
    Anthropic 推荐的混合:预载一部分,其余 just-in-time(模型拿轻量指针按需拉取)。
  bad: >-
    每轮强制把检索到的记忆塞进窗口——无关轮次白占 token,检索不准时等于主动注入干扰项(单个相似但不对的材料就降分,Chroma 一手);全靠模型自己想起来查——冷启动病,"该查持仓时压根没想起来";强制模型每轮首调记忆搜索——模型给搜索参数瞎编值,召回质量塌(OpenAI
    社区一手)。
  scored: >-
    注入派上限看 Zep(一手论文):平均上下文从约 11.5 万 token 降到 1600、延迟降九成——前提是检索精度高。自管派代价看 MemGPT(一手论文):模型每圈花推理预算做记忆家务,循环变慢。谁在用:MemGPT/Letta(自管分页)、Zep/Mem0(后台检索注入)、Anthropic
    memory 工具(系统提示强制"做任何事前先看记忆目录",一手);本项目已有的分层记忆正是 MemGPT 谱系,重设计把检索路由从固定节点改成模型自驱工具。
- name: token 计数与预算闸:中文按真实 tokenizer,不按字符除系数
  plain: 预算闸、压缩阈值全建立在"窗口现在多少 token"的估算上——中文按字符除系数会系统性低估。
  setup: >-
    会话里全是中文研报和财报讨论,预算闸按"字符数除以 2.5"估 token,界面显示还剩三成预算。
  question: 这个估算可信吗?
  good: >-
    优先用 DashScope 回包的真实 usage 回填——每圈拿到上一圈的精确 token 数,零成本零误差;估算只做首圈 fallback,系数用 qwen
    官方口径(中文约每 1.65 字符一个 token);所有阈值(大结果降级、压缩触发)统一用 token 不用字符。
  bad: >-
    沿用每 2.5 字符一个 token——比 qwen 实际低估三成五到五成,预算闸显示还剩三成实际已超,形同虚设;同一个"2000 字符"阈值,中文约 1200
    token、英文约 550 token,行为差两倍;拿 LangChain 默认的 4.0 系数算中文,错得更远(那是英文口径,一手文档自带免责声明)。
  scored: >-
    口径:qwen 官方文档(一手)中文 1 token ≈ 1.5-1.8 字符、英文 ≈ 3-4 字符。对抗核查裁决:2.5 这个常数无任何厂商一手背书。谁在用:所有按
    token 计费/限窗的系统;本项目现状会话内存的估算常数恰是 2.5,这次调研顺带暴露了现状问题,可独立先修。
- name: 窗口外笔记:工具台账承载去重、打转指纹与升级物料
  plain: 不是所有状态都要挤进模型窗口——查过什么、失败几次、要带去深度研究的物料,记在窗口外的结构化台账里。
  setup: >-
    一个轮次转了十圈、调了十二次工具,其中两次失败、三次重复(查过同一只股票的同一张报表);用户最后说"升级成深度研究吧",升级打包需要带走"已查到的关键事实"。
  question: 这些执行的元状态放哪?
  good: >-
    窗口外一个只追加的工具台账,每条记:第几步、工具名、参数指纹、结果摘要、成败、缓存键。一个抽象三个用途:查过的(工具,参数)组合直接复用缓存结果不重跑;连续两圈指纹完全相同判定原地打转、强制停下如实上报——用确定性指纹当裁判,不靠模型自省(无外部反馈的纯自省在推理任务上不升反降,这是上一篇
    agent loop 调研的核查结论);升级深度研究的打包物料直接从台账取。台账本身不进模型窗口,只有摘要可能被引用。
  bad: >-
    把台账塞进系统提示区(又破前缀缓存);没有台账,打转检测靠问模型"你是不是在打转"(不可靠);升级打包时从原始消息列表现扒工具结果(脆、漏);台账记了缓存键却没给模型取回工具(记了等于白记)。
  scored: >-
    对应 Anthropic 的结构化笔记(笔记持久化在窗口外、要用再拉回,一手博客)与 Manus 的文件系统当外存(压缩必须可还原:丢正文、留路径,一手)。谁在用:Claude
    Code(笔记/待办/进度文件 + git 历史跨窗口续命)、Manus(todo 清单尾部复诵)、本项目重设计草案的工具台账。
benchmarks_title: 代表系统 / 方法 · 上下文管理机制速览
benchmarks:
- name: Anthropic 压缩 + 工具结果清理(官方 API)
  what: >-
    服务端压缩:默认 15 万 input token 触发、最小 5 万,摘要写进压缩块、之前消息自动丢弃,压缩那步是额外采样单独计费(一手文档)。客户端工具结果清理:默认
    10 万触发、保最近 3 个工具调用、清掉换占位符、可设"至少清够多少才动手"(因为清理也作废缓存)、可排除特定工具不清。
  fit: >-
    两级压缩的官方范本——先轻(清工具结果,无损可回取)后重(全量总结,有损)。本项目对位:轮内降级 ≈ 工具结果清理,跨轮压缩 ≈ 服务端压缩,但要自己实现(qwen
    无此服务端特性)。
- name: Claude Code 三层流水线(生产实践)
  what: >-
    预算层(大输出早期落盘只留路径)→ 微压缩(老工具结果清成占位符、保配对骨架、按路径可取回)→ 全量压缩(结构化摘要模板:意图/决策/文件/错误/待办/下一步)。命令行触发阈值官方从未公布,社区逆向
    75%-95% 互相打架且随版本漂移;压缩踩在任务中段是其头号社区抱怨(一手 issue)。
  fit: >-
    生产 agent 最成熟的上下文管理实践;"可逆(落盘取回)与不可逆(总结)分层"是本项目大结果降级设计的直接蓝本。引用其阈值数字要全部标社区逆向。
- name: Manus 上下文工程(KV-cache 优先)
  what: >-
    输入输出比约 100:1,成本几乎全在重读历史;缓存命中价差约十倍(引 Anthropic Sonnet 价目);三铁律:前缀稳定/只追加/显式断点;掩码不删除管理工具;文件系统当外存(压缩必须可还原);todo
    清单尾部复诵防目标漂移;保留错误让模型自纠;少用同构示例防节奏定式。全部一手博客。
  fit: >-
    把上下文工程从"省 token"上升到"成本结构"的视角。本项目尾部动态区(循环状态提示放最尾)直接来自其复诵机制;"保留错误"与报错喂回自纠的设计互相咬合。
- name: OpenAI 会话管理(客户端原语 + 服务端压缩)
  what: >-
    客户端:修剪会话(保最近几个用户轮)与摘要会话(双阈值,保最近两轮逐字);服务端 truncation 参数(自动丢历史中段,文档口径自相矛盾、不可控,官方
    SDK 自己都绕开它另做客户端方案)。推理模型的反直觉约束(一手 cookbook):涉及工具调用的轮次必须回传上一轮推理内容,否则掉分(SWE-bench 约
    3%)。
  fit: >-
    "别依赖服务端自动丢弃"的反面教材——丢哪段不可控。推理内容回传的约束是 qwen thinking 模式必须实测的对照项(不能想当然套用,已列入本项目冒烟测试清单)。
- name: LangChain / LangGraph(总结节点 + 修剪工具)
  what: >-
    总结节点挂在每次调模型前;修剪工具用"从用户消息开始、停在完整工具序列"的边界参数防切破调用配对;运行摘要对象带已总结消息标记集合防重复处理。一手文档与一手
    issue(总结节点在工具调用后触发时曾把用户消息删光导致接口报错)。
  fit: >-
    协议红线(工具配对不可切破)的工程化范本。本项目不用 LangChain,但压缩边界规则与幂等标记直接对标其实现细节——裸循环手搓消息列表时这些兜底要自己写。
- name: MemGPT / Letta(自管分页派)
  what: >-
    主上下文三段(系统指令/工作区/先进先出队列),模型用记忆工具自己搬运;占用超警戒线(论文举例七成)插系统警告提示模型搬运,满了驱逐一批消息生成递归摘要。代价:模型每圈花推理预算做记忆家务;病:模型忘了查。一手论文。
  fit: >-
    本项目分层记忆的谱系来源。重设计把记忆检索从固定路由节点改成模型自驱工具,等于向自管派靠一步——必须配冷启动兜底(画像确定性注入)。
- name: Zep / Mem0(自动注入派)
  what: >-
    后台检索(语义+关键词+图遍历,检索路径无大模型,P95 约 300 毫秒,二手转述工程口径)在轮次之间拼进窗口;Zep 实测平均上下文从约 11.5 万 token
    降到 1600、延迟降九成(一手论文)。
  fit: >-
    注入派做好了的上限参照。但注入位置若在系统提示区、每轮变化会反复打掉前缀缓存(社区一手 issue 实测)——本项目画像注入"会话内冻结"的规矩就是为避开这口锅。
- name: 长上下文退化实证(context rot / lost in the middle / RULER)
  what: >-
    18 个前沿模型全部随输入变长连续退化、无统一百分比(Chroma 一手);答案在窗口中段召回最差、首尾最好(一手);标称窗口与有效窗口差距大——GPT-4
    标称 12.8 万有效 6.4 万,声称支持 3.2 万的模型仅约四成真达标(一手,十选四)。
  fit: >-
    所有上下文工程决策的实证地基:别把标称窗口当容量、重要内容放尾部、检索精度不够别硬注入。也是本项目"离线标定 qwen 在中文研报语料上退化起点"这个待补评测的方法论来源。
pitfalls:
- >-
  把每圈变化的动态状态(剩余步数/预算/秒级时间戳)写进系统提示前部——前缀缓存按精确匹配,一字不同从那个字起全部作废,等于每圈全价重算最该缓存的部分。本项目重设计草案最初就这么设计,八路调研全部点名后改为尾部追加。
- >-
  中文 token 按每 2.5 字符一个估算——qwen 官方口径是每 1.5-1.8 字符一个,系统性低估三成五到五成,预算闸和压缩阈值全部偏晚。本项目现状会话内存的常数恰是
  2.5,独立于重设计也该修。
- >-
  删消息切破工具调用与结果的配对——带工具调用的助手消息后面必须紧跟对应的工具结果消息,切破直接四百报错;裁剪边界必须落在用户消息前或完整工具序列后,裸循环手搓消息列表没有框架兜底,必须自己写边界检查。
- >-
  压缩踩在子任务中段——查完三只股票正要比对时触发压缩,模型醒来忘了查到哪(Claude Code 头号社区抱怨)。要软硬双阈值:软阈值等本圈工具链跑完,硬阈值才强制。
- >-
  不可逆摘要丢原文——大工具结果只留摘要不留指针,后面模型想要"那份财报里的存货周转率"无路可走。要占位符+缓存键+显式取回工具,原文在数据库缓存里可还原。
- >-
  失败轨迹被压掉——模型自纠靠读失败原文(报错信息+堆栈),压掉等于断了纠错回路。失败的工具结果在下一次成功之前不降级,成功的冗余输出才是降级对象。
- >-
  把 Claude Code 社区逆向的压缩阈值当官方规格——75% 到 95% 各种说法互相打架且随版本漂移,官方从未公布;唯一一手数字是其压缩 API 的 15
  万 token 触发,但那是另一套服务端机制,别混为一谈。
- >-
  把标称窗口当可用容量——有效窗口常只有标称一半(RULER 实测 GPT-4 标称 12.8 万有效 6.4 万),贴着标称填等于把模型推进退化区;压缩阈值应锚定有效窗口而非标称。
- >-
  强制模型每轮首调记忆搜索来治"忘了查"——强制工具调用时模型给必填参数瞎编值,搜索词是编的、召回就塌。画像兜底用确定性规则注入,纪律性检索靠系统提示引导。
- >-
  工具定义会话中途增删——工具定义序列化后紧跟系统提示,增删一个工具等于后续所有轮次缓存全部作废,还让模型看到指向已消失工具的历史而困惑。按场景限制工具用掩码/约束生成,不要真删。
gaps:
- component: chat 重设计草案 · 循环状态提示的位置
  current: >-
    草案最初把"还剩几步/预算剩多少"的循环状态设计成写进系统提示前部、每圈更新——初衷是让模型知道循环有界、自己收敛。
  suggestion: >-
    八路调研全部点名此设计与前缀缓存冲突:系统提示层一变,该层及之后全部缓存作废,qwen 隐式缓存约两折的折扣每圈全丢。已改:系统提示区逐字节冻结(角色+工具纪律+画像),循环状态做成追加在消息列表最尾部的一条短提示——尾部也是召回最强位置,与
    Manus 的 todo 清单复诵同通道,省钱与防忘一举两得。
- component: 现状会话内存 · 中文 token 估算系数
  current: >-
    现状代码按每 2.5 字符一个 token 估算(会话内存模块的常数),压缩触发判断建立在这个估算上。
  suggestion: >-
    qwen 官方口径中文每 1.5-1.8 字符一个 token,现系数系统性低估三成五到五成——实际触发压缩比预期晚,真实窗口占用比显示的高。重设计改为:优先用
    DashScope 回包真实 usage 回填,估算 fallback 用每 1.65 字符一个;这个修正对现状代码同样适用,可独立先修。
- component: chat 重设计草案 · 大工具结果降级
  current: 草案最初设计为超过 2000 字符的工具结果只进摘要加缓存引用,摘要是原文的唯一替身。
  suggestion: >-
    两处修正:阈值从字符改 token(同一字符数中英文 token 差两倍);"只进摘要"不可逆,改成 Claude Code 式占位符+缓存键+显式取回工具,原文留在已有的
    PG 工具结果缓存里,模型要细节自己取回——"再取回"成为一等公民,而不是只留个看得见摸不着的键。
- component: chat 重设计草案 · 压缩边界的协议安全
  current: >-
    草案有跨轮压缩和轮内降级两条路径,但最初未写明边界规则——裸 Python 循环手搓消息列表,没有任何框架兜底。
  suggestion: >-
    补上协议红线:压缩/降级边界只允许落在用户消息之前或完整工具调用序列之后;轮内降级只替换内容、保留消息骨架与配对;用已处理消息标记集合防重复处理。另补保护名单:用户原始指令、失败轨迹、升级物料、关键定量数字永不进可降级池——金融场景里数字被糊掉比窗口爆掉更致命。
- component: chat 重设计草案 · 记忆注入双轨
  current: >-
    草案把记忆与知识库检索从"每轮路由节点强制注入"改成"模型主动调工具",画像保留冷启动注入。
  suggestion: >-
    调研裁决方向正确(Anthropic just-in-time 官方背书,且避开"每轮注入干扰项"的实证坑),但冷启动兜底要写实:画像注入用确定性规则(会话开场一次、会话内冻结、更新走新消息追加),不靠强制模型首调搜索(会瞎编参数);系统提示写明"涉及持仓/偏好/历史观点先查记忆"的纪律,并用评测守护"该查记忆时模型有没有查"。
- component: chat 重设计草案 · 压缩触发时机
  current: 草案定了七成阈值触发跨轮压缩,比业界常见的更早,给压缩自身留了空间,方向正确。
  suggestion: >-
    补两点:对齐任务边界(软阈值到了等本圈工具链跑完再压、硬阈值九成强制——压在子任务中段是 Claude Code 头号社区抱怨);压缩本身是一次额外大模型调用,其成本计入本轮预算闸,防止"一压缩预算就爆"。另:阈值锚定有效窗口而非标称窗口,qwen
    在中文研报语料上的实际退化起点可用离线评测标定(正好补知识库评估缺口卡里"缺离线指标"的口)。
- component: chat 重设计草案 · 缓存命中观测
  current: 草案最初没有把前缀缓存命中率纳入观测体系。
  suggestion: >-
    每圈把 DashScope 回包的缓存命中 token 数写进 trace span,命中率做成一等指标(Manus:生产 agent 单一最重要指标)——这也是验证"窗口分区是否真的稳定"的唯一客观手段。另加冒烟测试:验证
    qwen 隐式缓存真实命中与计费口径(两折说法落地前按所用模型当期价目核实,对抗核查标注此条未一手验证)。
