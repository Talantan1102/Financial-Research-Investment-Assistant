# 渲染于 /eval/report/chatloop-eval-scorecard(server.py report_view 通用路由)。
# 数据来源:backend/eval/chatloop/ 评估体系 2026-06-08/09 首跑(真 ChatLoopAgent +
# 真 PG/MCP/LLM,deepseek-v4-flash SUT)。设计稿见 docs/superpowers/specs/
# 2026-06-08-chatloop-eval-blueprint-design.md;明细见 backend/eval/chatloop/RESULTS-2026-06-08.md。
# 注:body 服务端纯文本渲染(不解析 markdown),数字一律走 bullets。
