# 研究报告:本产品 RL 落地设计 — 两轨 / oracle 反向数据生成 / 就绪度 / 最小试点
# ----------------------------------------------------------------------------
# 来源:2026-06-09 围绕"本项目哪块适合做 RL、怎么落地"的设计推演(对话沉淀)
# + 代码就绪度审计(6 路并行读本仓代码,file:line 证据,审计底稿
# docs/research/2026-06-09-rl-readiness-audit.md)+ verl 施工配方
# (docs/research/2026-06-09-verl-multistep-tool-rl-recipe.md)。
# 体裁:设计/落地(挂 tool 维度深度调研区,锚 tool_augmented_training;
# 与「工业界后训练 survey」「verl 多步工具 RL 施工配方」组成三部曲)。
# 写作约定:不用读者无法对应的内部代号;判断结论尽量带本仓真实组件名;
# 凡涉及正被另一会话重构的 dd_report,结论标"快照于 2026-06-09,该模块在动"。
