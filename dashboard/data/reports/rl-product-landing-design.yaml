slug: rl-product-landing-design
title: 本产品 RL 落地设计 · 两轨 / 数据生成 / 就绪度
subtitle: >-
  三部曲的收口:工业界怎么做(survey)→ 用 verl 怎么实现(施工配方)→ 我们怎么落地。把"哪块适合 RL"的判别、两轨结构、oracle 反向数据生成方法论、奖励物理隔离、分析类打分阶梯,落到本仓真实资产与代码就绪度审计上,给出第一个最可能跑通的最小试点
meta:
  date: '2026-06-09'
  basis: 设计推演 + 6 路代码就绪度审计(file:line 证据)+ verl 施工配方对照;审计/配方底稿见 docs/research
summary: >-
  先说最该说的元判断:以本项目的定位(全走 API 模型、无自有权重、无 GPU 训练环境、是个人作品),产品价值上 RL 其实不必做——提示词 + schema 约束 + critic 重写已经够用。RL 唯一正当的理由是作品叙事价值:端到端跑通一个可验证奖励的 RL 闭环,展示 LLM 算法 +
  应用设计的深度。所以"选哪块做 RL"的判据要倒过来:不是"产品最需要哪块",而是"哪块闭环最干净、单机能跑完、最能讲清算法"。按这个标准答案很集中——本产品有两类任务,计算类(取数→算→对账,有确定性真值)和分析类(观点/逻辑/报告质量,无绝对标签),这跟工业界头部模型的两轨结构(可验证奖励
  + 自我批判 rubric)同构,而且本项目 eval 侧已经独立长成了这个形状(一个确定性数值比对 + 一个三裁判判官)。本报告把整条设计收口成几个判断:RL 灌进计算类轨(数据靠 oracle 反向生成、几乎免费),分析类轨留在提示词/SFT/rubric-eval、不做结果奖励 RL,两轨奖励物理隔离永不混成一个数;第一个试点选"单工具数值取数
  + ±容差奖励"这条阻抗最低的窄切片。代码就绪度审计的结论是:四块硬前提本项目都有现成或近现成的资产,没有一块能零胶水直接接但胶水总量很小,唯一真阻塞(dd_report 正被另一会话重构)有干净绕法。先约定几个词:oracle = 给定输入产出确定性真值的参考实现;pass@k = 同题采 k 次至少对一次的比例,衡量基座有没有可被
  RL 放大的非零成功率;物理隔离 = 两类奖励信号不平均成一个标量。
sections:
- heading: 元判断:产品上不必,作品叙事上值得做一个干净切片
  body: >-
    这一步最重要,也最容易被"RL 很热"带跑偏。本项目全部调用面今天都跑在 API 模型上,质量靠严格 JSON schema、工具白名单、评审组打分触发重写、Python 兜底覆写——这是健康的"提示词 + 约束"层,大多数面停在这里是对的。真要做 RL,前提先摆清:需要开放权重基座(7B/8B 级)加单机八卡,参照社区
    3B 规模 LoRA GRPO 约 6 小时 40 美元的口径试错成本可控。所以判据倒过来:选那个"训练闭环最干净、最能讲清楚算法、单机能跑完"的,而不是"产品最需要"的。按这个标准,最该做 RL 的是"多工具取数→可验证计算"这一类——它满足"完成路径不唯一但结果可验证",正是 RL 打败 SFT 的经典场景(SFT 只能模仿一条示范路径,RL
    用最终结果当奖励让模型自己探索哪条工具序列稳定算对)。
  bullets:
  - >-
    不该做 RL 的判断同样重要:研报生成质量(只能 judge,长度/谄媚/编引用高发)、多空辩论(多轮 + judge 最难)、记忆抽取(样本不够、SFT 更直接)、会话标题(有兜底,训了浪费)——把弹药全压在可验证轨。
  - >-
    给小模型上能力先蒸馏不直接 RL(同基座蒸馏在数学基准上远超直接大规模 RL,头部开源模型实测);RL 的三道门槛(能写打分函数 / 基座非零成功率 / 提示词和 SFT 已穷尽)全过才上,这是产品级强化微调文档的官方判据。
  - >-
    作品叙事价值才是这项目做 RL 的正当理由——它恰好踩在工业界最热的工具集成推理 RL 方向(取数→算,结果可验证),技术深度叙事完整,且本项目的 oracle 资产是大多数团队没有的独特拼图。
- heading: 两轨结构:计算类 RL,分析类不碰,奖励物理隔离
  body: >-
    把本产品的任务按"有没有确定性真值"一分为二,就得到两条该用不同方法的轨道。计算类(取数/算式/对账)有确定性真值,对应可验证奖励;分析类(观点/逻辑/报告质量)没有绝对标签,只能 rubric/judge。这跟头部模型的两轨设计同构,而且本项目 eval 侧已经独立建出了这个形状(一个确定性数值比对
    + 一个三裁判判官)——等于代码独立验证了这个结构是对的。但两轨对个人项目不是对称的:计算类轨数据便宜(oracle 反向)、奖励干净、hacking 风险低、RL 性价比高,是你的护城河;分析类轨数据贵、易 hack、ROI 低,该留在提示词/SFT/rubric-eval,顶多 DPO 排序,别冲结果奖励 RL。最危险的误读是"既然两类就统一处理"——千万别把
    oracle 分和 judge 分平均成一个奖励数,judge 的噪声和 hacking 会顺着均值漏进干净信号、把护城河污染了。
  figure: rl-two-track.svg
  figure_caption: >-
    两轨结构 + 奖励物理隔离:左轨计算类(oracle 奖励 → RL 主战场)/ 右轨分析类(judge → SFT/DPO 不碰 RL),中间红色虚线 = 两类奖励信号永不混成一个标量;分析类可借可验证骨架(引用/过程检查)防 hacking。
  bullets:
  - >-
    "分析类不进 RL 奖励" ≠ "分析类不训练":它照样可以 SFT(好报告示范)、DPO(裁判排序的偏好对)、rubric-eval 持续盯质量——只是不做结果奖励的 RL。别把"不 outcome-RL"听成"放着不管"。
  - >-
    物理隔离的落地:混合任务(如 DD 报告,既有数字对错又有逻辑好坏)最容易犯——要么 RL 只训可验证子任务(奖励只用 oracle、逻辑写作另用提示词/SFT/DPO),要么逻辑改进走 DPO 当独立阶段,绝不加权揉成一个 reward。
  - >-
    分析类不是纯 judge——可以塞可验证的过程骨架(引用的数字是真的吗、用对财务数据了吗)当半根脊梁,既减 hacking 又给中间信号,这正是头部模型"防 hacking 的约束性 rubric"在干的事。
- heading: oracle 反向数据生成:验证集是 oracle 的副产品,不是标注出来的
  body: >-
    "没有验证集"这件事,在可验证任务上其实是最便宜的部分,因为它的整个意义就在于答案是算出来的、不用人标。方法论核心是反向生成:先采真实输入(tushare 全市场)→ 用 oracle 算出 gold → 再围着这个答案套出题目。普通做法是正向(先想题再找答案,慢、要人工);可验证任务走反向,答案是
    oracle 的副产品。本项目正好攥着让它可行的两样原料:海量真实输入(tushare 几千只票×多期×多字段)+ 现成 oracle(纯 Python 估值器 + 数值比对内核)。难度不靠拍脑袋定,要跑出来——基座对每题采 n 次、oracle 打分、按通过率分桶(全对太易、全错太难或污染、中间是金矿留作 RL),这一步本身就是
    pass@k 测量,同时回答了"能不能跳 SFT"。建一次,三用:同一批数据是 pass@k 测量集、RL 训练 prompt 集、切一刀就是 eval 集。
  figure: oracle-inversion-pipeline.svg
  figure_caption: >-
    oracle 反向数据生成流水线:采输入 → oracle 算 gold → 反向套题(用散户口吻穿自然外衣)→ 反抽校验仍映射 gold → 难度分桶(= pass@k)。一份三用;底部边界提醒只放有 oracle 的(取数+算数)。
  bullets:
  - >-
    自然度借工业界做法、真值守 oracle:纯模板题很僵(真实股民不那么说话),用散户口吻 skill 把(输入,gold)包成口语问法补自然度,再反抽校验自然问句仍精确映射那条 gold(防自然化把可验证性搞丢)——脊梁是可验证真值、外衣是自然话术,各取所长。
  - >-
    能不能跳 SFT 冷启动用 pass@k 判、不靠"感觉模型会调工具":GRPO 要每个 prompt 的 n 条 rollout 里至少蒙对一条才有梯度;pass@1 在中间区间或 pass@k 健康就跳、直接 GRPO;pass@k≈0 就先 SFT 或把任务改短改易。这次测量零训练成本、还顺带验了 RL 该不该上。
  - >-
    边界要守:只放最终答案是数字/布尔、有 oracle 的;"该用 DCF 还是 PE""护城河强不强"没确定性真值,塞进来只能退化成 judge、污染整个集子——那是分析类轨的活。
- heading: 确定性 oracle 边界:命门,且很窄
  body: >-
    这是能不能上 RL 的命门:RL 奖励必须确定性可复现,而本项目的真值分两半,只有一半可当奖励。代码就绪度审计把这条线用 file:line 证据钉死了。能当奖励的(结构化可程序校验):估值算式输出(纯 Python 算术,浮点逐位实测可复现,离 RL 最近)、数值取数准确率(对 tushare ±1%)、工具选择/路由(golden
    的 first_tool + 参数)、弃权检测、记忆抽取边(持仓数量/成本等结构化属性精确匹配)。必须排除的(全是 judge/主观/调 LLM):grounding、报告质量、引用、风险配对、分歧异常诊断叙事、分析师洞察、多空辩论、预测方向(逻辑确定但靠事后 K 线、且 loader 代码此刻被重构删了)。一个关键确认:估值器实测纯而可复现,而分歧诊断、分析师、辩论都调
    LLM——所以 oracle 的确定性边界就卡在估值结果那层,叙事踢出去。"取数"层本身(走网络的 tushare)也不在确定性内,必须 cassette/快照固化后才进边界。
  figure: deterministic-oracle-boundary.svg
  figure_caption: >-
    确定性 oracle 边界:左✅有确定性真值可当 RL 奖励(估值算式/数值取数/工具选择/弃权/记忆抽取边),右❌必须排除(grounding/报告质量/诊断叙事/辩论/预测方向)。边界卡在估值结果那层,judge/叙事踢出 reward。
  bullets:
  - >-
    边界一句话:把 reward 画在"结构化可程序校验的层",绝不算在"自然语言质量/grounding/叙事"上——后者全是 judge,引入噪声 + 成本 + 不可复现,毒化 RL 信号。
  - >-
    估值数学层(估值 helper + 计算入口)实测全纯 CPU、同步、确定性、零随机/网络/DB,同输入连调两次浮点逐位一致——这是本产品离 RL 最近、最干净的一块;oracle 只吃结构化估值输入、不碰调 LLM 的诊断/辩论。
  - >-
    "可验证"不等于"不可 hack":只查最终数字,模型可能不真调工具直接蒙;配合硬门控(没调工具就给答案即便蒙对也判低分)+ 数值容差归一化(别用裸精确匹配,会诱导刷超长答案)堵这个。
- heading: 分析类怎么打分:不好打分,但有从客观到主观的阶梯
  body: >-
    "分析类不好打分"是真的,而且这个难本身是个信号灯:不好打分 = 奖励太软 = reward hacking 风险高 = RL 不该往那儿打,反向确认了不对称策略。但"不好打分" ≠ "不能打分"——诀窍是别打"结论"的分,打"可拆解的脚手架"的分,从客观到主观排成阶梯:第 0 级(最高杠杆)不打结论、打落地性
    + 完整性(引用的数字是真的吗、用对数据了吗、该算的算了吗、结论与正文数字自洽吗)——绝大多数烂分析烂在没落地/幻觉/不完整,不是烂在最终判断错,所以这一级抓住大部分质量问题还完全不用判主观结论;第 1 级 rubric 拆解(把"打 1-10 分"换成逐条勾选,你的多维 critic + 尽调 SOP 就是现成
    rubric);第 2 级去偏的成对裁判(A vs B 不打绝对分、换序两判都赢才算赢、长度控制、多裁判多数 + 分歧标红——你的组合判官正是这个);第 3 级弱结果锚当校准(投资建议事后收益做健全性校验、不当奖励)。四级零件本项目全有,且足够做 eval 与排序,但不够 RL-grade。
  bullets:
  - >-
    你不需要"解决"分析类打分(干净地解决不了):做到 eval/排序够用(落地性 + rubric + 去偏成对 + 结果锚),把 RL 留给可验证轨——这四级零件本仓都有(引用核对、多维 critic、组合判官、回测/预测指标)。
  - >-
    残渣承认:有一块永远客观不了("这个投资逻辑够不够深刻"),当噪声信号只排序(DPO 对),绝不当精确 RL 奖励——别对它硬做 RL 优化,模型会学会 game 裁判编出似是而非的逻辑。
  - >-
    弱结果锚的口径:纯结果 RL 在金融失败(市场短期随机),所以前向收益别当 RL 奖励、只当 eval 的健全性校验(我裁判判的"好分析"和事后收益至少弱正相关吗),本仓回测/预测指标可复用。
- heading: 最小试点与就绪度:第一个最可能跑通的窄切片
  body: >-
    代码就绪度审计的结论很正面:RL 这类任务的四块硬前提本项目都有现成或近现成资产(oracle、可重放环境、多步工具底座、单机 LoRA 规模),没有一块能零胶水直接接但胶水总量很小。推荐第一个试点是"单工具数值取数 + 确定性 ±容差奖励"——四块阻抗全在这条线上最低:工具入口已
    async/入参结构化/返回 dict/schema 是 OpenAI function 格式;tushare 缓存层就是 verl 想要的"入参 hash → 快照";工具选择真值是确定性 JSON 零转换;容差内核现成。明确避开对话状态机、依赖整个对话状态的记忆/技能类工具、judge 层、调 LLM 的分叉。唯一真阻塞是
    dd_report eval 正被另一会话重构(若干真值相关文件被删改),但有干净绕法:试点的奖励函数用裸数值 + ±容差自包含实现、不 import 那些在动的模块,即可先跑通工具选择 + 取数那条线。
  figure: rl-minimal-pilot.svg
  figure_caption: >-
    最小试点 = 单工具数值取数 + ±容差奖励;就绪度对照表(四块阻抗最低)+ 胶水清单(按工作量排序)+ 唯一真阻塞(dd_report 重构)及其裸容差自包含绕法。动手前必跑 smoke 见图脚注。
  bullets:
  - >-
    胶水清单按工作量从小到大:工具 schema 转 verl YAML(约十行,先做)→ 复用 tushare 缓存当 cassette(近零)→ BaseTool adapter(约 30 行/工具)→ 真值快照固化器(中)→ 裸容差奖励函数(约 50–100 行)→ 独立训练 venv + 复制约 5 个 oracle 源文件。
  - >-
    样本量是个待补项:确定性可 oracle 样本合并去重约 150–170 条,没到几百门槛,且回测标的多样性低;但工具选择/对话场景 golden 是"问题 + 期望"模板,可低成本扩量到几百条。
  - >-
    动手前必跑的 smoke(符合本仓"import 链假设要 smoke test 验"约定):独立训练 venv 能 import oracle 源文件;mock 模式确认工具入口形状与不触网;1-step 确认工具真被调起 + tokenization 一致性告警清。
dimensions_meta:
  title: 7 个设计决策 · 每个配一个真实判断
  labels:
    setup: 场景
    question: 怎么定
    good: 好判断
    bad: 翻车点
    scored: 依据 · 落到本项目
dimensions:
- name: ① 哪块适合 RL:判据要倒过来
  plain: 以个人作品定位,选 RL 切片的标准不是"产品最需要",是"闭环最干净、单机能跑、最能讲清算法"。
  setup: 想给项目加 RL,但全走 API、无 GPU、是作品集,不知道该不该做、做哪块。
  question: 该不该做、做哪块?
  good: >-
    产品价值上 RL 不必做(提示词 + 约束已够);唯一正当理由是作品叙事——跑通一个可验证奖励的 RL 闭环展示算法深度。按"干净闭环"判,选"多工具取数→可验证计算"(完成路径不唯一但结果可验证,正是 RL 打败 SFT 的经典场景)。
  bad: >-
    被"RL 很热"带着两轨都上 RL;或硬把研报质量这种只能 judge 的面做结果奖励 RL;或给小模型直接砸大规模 RL(该先蒸馏);或没过 RL 三门槛(可写 grader / 非零成功率 / 提示词 SFT 已穷尽)就上。
  scored: >-
    判据 = RL 三门槛(产品级强化微调官方)+ 干净闭环。落到本项目:计算类有 oracle 是你独特拼图,分析类留轻方法。谁在用:工具集成推理 RL(Search-R1/ReTool)是这条线。
- name: ② 两轨划分:计算类 RL,分析类不碰
  plain: 按"有没有确定性真值"把任务一分为二,两轨用不同方法、奖励物理隔离。
  setup: 本产品既有取数/算账(有真值)又有研报观点(无绝对标签),怎么分配 RL 力气。
  question: 两类各走什么?
  good: >-
    计算类(可验证)→ oracle 奖励 → RL 主战场;分析类(无标签)→ rubric/judge → 提示词/SFT/顶多 DPO,不碰结果奖励 RL。两轨奖励永不混成一个数(judge 噪声会污染干净 oracle 信号)。你 eval 侧已建出这形状(确定性数值比对 + 三裁判)。
  bad: >-
    把 oracle 分和 judge 分加权揉成一个 reward(混合任务最容易犯);或以为"像 K2 就两轨都 RL"(K2 开放轨也用 rubric + 自我批判不是纯 outcome RL);或把"分析类不 RL"误听成"分析类不训练"。
  scored: >-
    判据 = 该子任务有没有确定性真值。落到本项目:numerical_metric/估值器 = 计算类;组合判官 = 分析类。谁在用:头部模型两轨(RLVR + rubric)结构同构。
- name: ③ oracle 反向生成数据:验证集是副产品
  plain: 可验证任务的验证集不是标注的,是采输入→oracle 算答案→反向套题生成的。
  setup: 想测 pass@k 也想攒 RL 训练集,但"没有验证集"。
  question: 数据从哪来?
  good: >-
    反向生成:采真实输入(tushare 全市场,分层、旧期间防污染)→ oracle 算 gold → 围着答案套题(用散户口吻穿自然外衣)→ 反抽校验仍映射 gold → 基座采 n 次按 pass@k 分桶留中间带。一份三用(pass@k 集 / RL 训练集 / eval 集)。
  bad: >-
    用监督学习脑子以为"得有人标一批";或自然化问题时让 gold 对不上还不校验(丢可验证性);或不做难度分桶(全对全错的题没梯度信号);或越过边界把判断类塞进来。
  scored: >-
    判据 = 难度跑出来分桶 + 反抽校验通过。落到本项目:tushare 海量输入 + 估值器 oracle + 散户口吻 skill。谁在用:可验证任务普遍做法(答案算出来不标注)。
- name: ④ 自然度:K2 表面 + oracle 脊梁
  plain: 工业界轨迹合成更自然,但它给的是自然输入不是可验证标签,两者叠在不同层。
  setup: 觉得纯模板题太僵,K2 式画像/场景合成更自然、想直接用。
  question: 怎么既自然又可验证?
  good: >-
    脊梁(标签)= oracle 反向(确定真值);表面(输入)= K2 式自然问法外衣。先有(输入,gold)可验证脊梁,再用 LLM 穿口语外衣,最后反抽校验外衣没把脊梁拧歪。自然度借工业界、真值守 oracle。
  bad: >-
    照搬 K2 用合成出来的答案当标签——把你最大优势(确定性 oracle)亲手扔了,重新掉回 judge 噪声 + hacking;或用工具模拟器(你有真工具,直接冻 cassette 更保真,模拟器是给没工具的场景的)。
  scored: >-
    判据 = 自然问句反抽仍精确映射 gold。落到本项目:retail-investor-voice 穿外衣 + 估值器/tushare 守真值。谁在用:头部模型轨迹合成做表面、RLVR/验证器做标签。
- name: ⑤ 奖励物理隔离:两类信号不混成一个数
  plain: oracle 奖励和 judge 奖励绝不加权平均成一个标量,否则脏信号污染干净信号。
  setup: 一个 DD 报告任务既有数字对错又有逻辑好坏,想给它一个总奖励。
  question: 混合任务的奖励怎么设计?
  good: >-
    物理隔离:要么 RL 只训可验证子任务(奖励只用 oracle,逻辑写作另用提示词/SFT/DPO),要么逻辑改进走 DPO 当独立阶段。两条信号各走各的管子不汇流。本项目最省事的实现就是 RL 奖励只吃 oracle、分析类不进 RL 奖励。
  bad: >-
    搞 reward = 0.6×oracle + 0.4×judge——可 hack 的 judge 信号渗进、污染干净 oracle 信号,模型学会牺牲可验证正确性去哄裁判;或把分析类的过程检查也误当成能进 RL 奖励的主信号。
  scored: >-
    判据 = RL 奖励标量里有没有掺 judge 分(有就错)。落到本项目:试点奖励只用数值容差。谁在用:头部模型可验证轨与开放轨奖励分离。
- name: ⑥ 分析类打分阶梯:打脚手架不打结论
  plain: 分析类不好打分但能打,从落地性到主观残渣排成四级阶梯,够 eval/排序不够 RL。
  setup: 想给研报质量打分但它主观、还易 hack,不知道怎么打。
  question: 分析类怎么打分?
  good: >-
    别打结论打脚手架:第 0 级落地性 + 完整性(引用真不真、该算的算没算、自洽吗)抓大部分质量问题;第 1 级 rubric 拆解(多维 critic + SOP);第 2 级去偏成对裁判(换序两判 + 长度控制 + 多数 + 分歧标红);第 3 级弱结果锚当校准。四级零件本仓全有。
  bad: >-
    直接让单一裁判给"整体质量"打绝对分(三偏置全进);或把这个软信号当精确 RL 奖励硬优化(模型 game 裁判编逻辑);或拿前向收益当 RL 奖励(市场短期随机,只能当 eval 健全性校验)。
  scored: >-
    判据 = 信号够不够 eval/排序(够)vs 够不够 RL-grade(不够)。落到本项目:引用核对/多维 critic/组合判官/回测指标四级零件。谁在用:判官评估 + rubric 工程的标准做法。
- name: ⑦ 任务形态:单对话轮 + 多工具步
  plain: 可验证 RL 锁定"单对话轮 + 多工具步",不是多轮对话;两者是正交两根轴。
  setup: 困惑训练数据是单轮还是多轮——但单轮对话里 agent 也能多次调工具。
  question: 锁定什么任务形态?
  good: >-
    锁"单对话轮(一个金融问题)+ 多工具步(agent 内部循环调工具)"。一条样本 = 一个任务 = 一个 prompt;一次 rollout = 工具循环轨迹;奖励 = oracle 验最终答案。无歧义的单一答案靶子,正是 verl 的工具循环为之设计的形态。
  bad: >-
    把"多步工具"和"多轮对话"混为一谈(verl 的 multi-turn rollout 指工具步那根轴);或一开始就把多对话轮拖进 RL(奖励变浑、credit-assignment 难)。追问/对话能力以后单独用 SFT 或提示词处理。
  scored: >-
    判据 = 奖励靶子是不是单一最终答案。落到本项目:一个金融问题→多工具取数→一个可验证数值。谁在用:verl 工具循环 / Search-R1 / ReTool 都是单对话轮 + 多工具步。
benchmarks_title: 本产品资产 · RL 复用度速览
benchmarks:
- name: 估值数学层(估值 helper + 计算入口)
  what: >-
    DCF/PE/PB/EV-EBITDA/敏感性/一致性全纯 CPU、同步、确定性、零随机/网络/DB;实测同输入连调两次浮点逐位一致;除标准库外仅依赖一个数据校验库,可在独立进程 import。
  fit: 离 RL 最近、最干净的一块——直接当确定性 oracle(只吃结构化估值输入、调 calculate_valuations);分歧诊断/分析师/辩论调 LLM 须排除。
- name: 数值比对内核(numerical_metric)
  what: >-
    拉 tushare 真值按 ±1% 相对误差比对,纯同步、零判官、走协议注入可切 cassette;但吃结构化报告 dict 而非整条轨迹文本,且容差/单位归一化半成品(正则不去千分位、无单位裸数字按元算)。快照于 2026-06-09,该模块在动。
  fit: 容差内核可复用,但起步建议裸容差自包含实现绕开正在重构的依赖;归一化器(去千分位/统一单位)是 oracle 的真正工程量。
- name: tushare 缓存层(可重放环境)
  what: >-
    主键 = api 名 + 参数 sha256 → 缓存 DataFrame,正是 verl 想要的"入参 hash → 快照"形态;另有 VCR 录制的 tushare 真实回放但绑 pytest 不可脱。覆盖面目前窄(几只票×几个接口)。
  fit: 直接复用当 cassette 后端(execute 里按入参取、miss 落真 API),近零胶水;注意存的是序列化 DataFrame、verl 进程 pandas 版本要对齐。
- name: chatloop 工具入口(多步底座)
  what: >-
    工具 run 已 async、入参 Pydantic、返回 dict、schema 已是 OpenAI function 格式、数据层 mock-cache-cassette 解耦经端到端守护;无状态数值工具最简单,有状态记忆/技能类依赖整个对话状态(硬墙)。
  fit: 复用单个无状态数值工具的 run + schema(约 30 行 BaseTool adapter),不复用对话状态机(verl 用自己的工具循环);RL 试点只取无状态工具。
- name: 评估资产(组合判官 + golden + 回测)
  what: >-
    已有组合判官(多评估模型多数投票 + 分歧标红)、4 类异构 golden(尽调/工具选择/对话/记忆)、回测框架、对话流记忆评估;工具选择/记忆抽取的 golden 是确定性 JSON。
  fit: 分析类打分阶梯四级零件全在这;工具选择真值零转换进训练数据;但统一"问题→数值真值"题集不落盘、量 ~150–170 条需扩量。
pitfalls:
- 被"RL 很热"带着两轨都上 RL——分析类奖励太软、一优化就被 game;弹药全压可验证轨,分析类留提示词/SFT/rubric-eval。
- 把 oracle 分和 judge 分加权揉成一个 reward——judge 噪声渗进污染干净信号,模型学会牺牲可验证正确性哄裁判;两轨奖励物理隔离。
- 凭"感觉模型会调工具"决定跳不跳 SFT——用 pass@k 测:每个 prompt 的 n 条 rollout 至少蒙对一条才有梯度,pass@k≈0 就先 SFT 或缩短任务。
- 自然化问题时不反抽校验——LLM 可能把问题悄悄改成问别的、gold 对不上,丢了可验证性。
- 越过 oracle 边界——把"该用 DCF 还是 PE""护城河强弱"塞进可验证集,只能退化成 judge、污染整个集子。
- 用裸字符串精确匹配当数值奖励——诱导模型刷超长答案钻空子;用数值容差 + 单位归一化(去千分位/统一百分比)。
- 把前向收益当 RL 奖励——市场短期随机(纯结果 RL 在金融失败),只能当 eval 的健全性校验。
- 把"分析类不进 RL 奖励"听成"分析类不管它"——它照样可以 SFT/DPO/rubric-eval,只是不做结果奖励 RL。
- 在正被另一会话重构的 dd_report 上写真值胶水——字段在动会撞;试点用裸容差自包含实现绕开,等其落定再接。
gaps:
- component: oracle 接入(reward function)
  current: 纯 Python 估值器实测浮点逐位可复现、近乎理想 oracle;但无模块级 compute_score,数值比对内核吃结构化 dict 而非整条轨迹文本,且其依赖正被另一会话重构。
  suggestion: >-
    新写约 50–100 行裸容差奖励函数:从轨迹文本抽最终答案 + 数值容差归一化 + 返回带 score 键 dict;起步不复用正在重构的多指标比对类,等其落定再接。
- component: 工具接入(BaseTool adapter)
  current: chatloop 工具入口已 async/入参结构化/返回 dict/OpenAI-schema、数据层解耦经端到端守护——阻抗低。
  suggestion: 写约 30 行/工具的 adapter 补生命周期 + dict 转 ToolResponse + 注入 cassette 名;schema 转 verl YAML 约十行;只取无状态数值工具,避开依赖整个对话状态的记忆/技能类(硬墙)。
- component: 可重放环境(cassette)
  current: tushare 缓存层 = "api 名 + 参数 hash → DataFrame",几乎就是 verl 要的形态;覆盖面窄(几只票×几个接口)。
  suggestion: 直接复用当 cassette 后端(免写索引器);注意 pandas 版本对齐;覆盖面随数据集一起扩。
- component: 题集真值(数据)
  current: 无统一"问题→数值真值"题集;工具选择/记忆抽取 golden 是确定性 JSON 可零转换,但数值真值不落盘(运行时 live 拉、loader 此刻被删),确定性可 oracle 样本约 150–170 条。
  suggestion: 写真值快照固化器把 live 数值固化进 ground_truth;工具选择/对话 golden 模板化扩量到几百;新建数值计算 golden;date 全 isoformat。
- component: 确定性边界(命门)
  current: 估值器纯可复现,但分歧诊断/分析师/辩论调 LLM;取数侧网络确定性审计未读 tushare client 未验。
  suggestion: oracle 只到估值结果那层、叙事/诊断踢出;读 tushare client 确认取数可被 cassette 完全拦截、无隐藏随机/时间依赖。
- component: 训练环境
  current: 估值数学层零第三方、orchestrator 层仅 + 一个数据校验库,实测可独立 import;但 verl/sglang 要 Linux+CUDA+多卡、与后端环境不兼容。
  suggestion: 训练 venv 独立、塞约 5 个 oracle 源文件 + 数据校验库(增量极小无 CUDA 冲突);PYTHONPATH 指后端;落地前实跑 import smoke。
