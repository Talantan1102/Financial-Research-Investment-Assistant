# dashboard/data/reports/subagent-dispatch-survey.yaml
# ============================================================================
# 研究报告:子 agent 的派发(dispatch)怎么做
# ----------------------------------------------------------------------------
# 来源:2026-06-03 七路并行联网+代码调研(Anthropic 多 agent 研究系统 / Cognition
# Don't Build Multi-Agents / OpenAI Swarm·Agents SDK / LangGraph supervisor·swarm /
# CrewAI / MetaGPT / ChatDev / AutoGen / Magentic-One / MAST 失败分类学 / MoA /
# 多 agent 辩论 / More-Agents / SLM-for-agents 等 40+ 系统与论文)+ 逐条对抗式
# 事实核查 + 对照本项目自己的多-agent 编排。
# 由 dashboard/derive/report.py 类型化加载,渲染于 /eval/report/<slug>。
# 写作约定:不用读者无法对应的内部代号;厂商自报数字一律标注口径(内部 eval /
# 相对提升 / baseline);统计与机制全配大白话。
# ============================================================================
slug: subagent-dispatch-survey
title: "子 agent 派发 · 怎么做"
subtitle: "用具体例子讲明白:7 个派发设计决策 × 真实场景,横扫主管-工人 / handoff / 流水线三大派系 + 学术理论,对照本项目自己的多-agent 编排"
meta:
  date: "2026-06-03"
  basis: "7 路并行调研(40+ 系统与论文)+ 逐条对抗式事实核查 + 对照本项目编排"

summary: >-
  把'多个 AI agent 协作'想象成一个项目组分活:一个人(单 agent)从头干到尾,连贯但慢、还容易超出脑容量;
  拆成一个组长 + 几个组员(多 agent)能并行、能各管一摊,但'怎么分工、各自能看到多少信息、活干完怎么拼回去、有人交错活怎么兜底'每一步都是坑。
  这份报告把业界和论文里'怎么把活派给子 agent'拆成 7 个必须拍板的设计决策,每个配一个真实场景的'好派法 vs 翻车',再对照本项目自己的编排。
  一句话总纲:多 agent 不是'人多力量大',而是'更多互相看不见的局部决策 = 更多冲突 + 高得多的成本(token 用量约是普通对话的 15 倍、单 agent 的 3-4 倍;口径见维度⑥)'——
  只在'广度能并行、写操作(改同一份东西、比如多人改同一份代码)单线程、单块价值够高'这个窄窗口里才划算,窗口外一个上下文连贯的单 agent 往往更对、更省、更好调。
  (先约定几个高频词:context = 喂给一个 agent 的输入文字;token = 模型计长度/计费的单位,越长越贵、且单次有硬上限;fan-out = 一次性撒给多个 worker 并行跑;synthesize / 综合 = 把多份产出拼成一个最终结果;spawn = 起一个新的子 agent 去干活。)

sections:
  - heading: "三大派系:控制权怎么在 agent 之间流动"
    body: "按'谁决定下一步交给谁'分,业界把活派给子 agent 的做法分三大派(实际项目里常混用):"
    bullets:
      - "主管-工人(orchestrator-worker / lead-subagent):一个 lead(就是前面说的组长 / 主管 agent)持有全局,把子任务一次性撒给(fan-out)一群 worker 并行跑,再把结果收回来自己综合。Anthropic 多 agent 研究系统、Claude Code 的 subagent、LangGraph supervisor、微软 Magentic-One 属此派(OpenAI Deep Research 是用单个强模型顶替整套编排的反例)。共性:worker 几乎都拿干净独立 context、lead 自己综合(synthesize)、普遍禁递归。"
      - "handoff / swarm(对等交接):没有中央调度,agent A 觉得'这事该 B 干'就把控制权直接'传棒'给 B,自己退场,B 接管对话(swarm = 蜂群,就是这种没有中央调度、agent 直接传棒的去中心结构的统称)。OpenAI Swarm(已被 Agents SDK 取代)、LangGraph swarm 属此派。一条最容易混的分界线:handoff 之后'谁对用户作答'变了(像客服把你转接给专员,之后专员直接跟你说话);而'把另一个 agent 当工具调用'(agents-as-tools)之后'谁作答'没变——子 agent 跑完只返回结果、由调用方综合(像客服替你去后台查一下,查完还是客服本人回你)。"
      - "静态流水线 / SOP 装配线(派发在编译期定死):不靠运行时 LLM 临场决策,把'谁在什么时候说话'写进固定的图或标准作业流程。MetaGPT(口号'Code = SOP(Team)',产品→架构→工程→测试串行)、ChatDev(瀑布式四阶段:设计→编码→测试→文档,平均不到 7 分钟、不到 1 美元跑完一个软件)、AutoGen GroupChat(round-robin 静态 / auto 动态可切)、CAMEL(两 agent 角色对话)属此派。赌的是'流程的确定性 > 单步的灵活性'。"
  - heading: "两件跟三派无关、但每次都得单独决定的事:评审回环 + 通信范式"
    body: "下面两件事不属于某一派(是横切所有派系的轴),而是任何派发结构都要单独拍板的:"
    bullets:
      - "评审回环(verifier-in-the-loop):派一个独立的 critic/verifier 子 agent 专门给产出挑错,把反馈喂回去让原 agent 重做(代表是 Reflexion 的'生成→自我反思→重试'闭环)。它和派系无关,任何结构都能挂一个评审回环上去提质;本项目的 critic 子图 + Writer 有界重试正是这一路。"
      - "子 agent 之间传'什么内容'(通信范式):自由文本最灵活但最易错位——MAST 把 36.9% 的失败都归在'agent 之间没对齐';更稳的几种是共享黑板(所有 agent 往一块公共白板写、各自只看跟自己相关的部分,MetaGPT 的全局消息池就是它的 LLM 版)、点对点消息、以及结构化 schema / 强类型产物(给每个子 agent 的输入输出都规定一张固定字段表、类型对不上就报错——本项目用 Python 的 Pydantic 实现;相当于不让 agent 用随口自由文本传话、而是填表格、字段不对就拦在源头)。"
      - "再往上一层是把'按什么协议传'也标准化:业界正从随手自由文本收敛到 MCP(给 agent 喂工具和数据的标准接口)、Google A2A(agent 对 agent 直连的通话协议)、上溯到 2000 年代的老协议 FIPA-ACL——但这些都是跨进程 / 跨机器协作才需要的重型方案;本项目所有 agent 同在一个程序进程里(in-process,直接传 Python 对象、不走网络),用 Pydantic 强类型就够、用不上这层。"
  - heading: "两极之争:Anthropic 放心并行 vs Cognition 死守单线程"
    body: "这份报告的智识主线,是两篇标题相反的工程长文——看似对立,拆开后其实在同一条判据上收敛。"
    bullets:
      - "Anthropic《How we built our multi-agent research system》:对'读多写少'的研究类任务放心 fan-out。lead(Opus 4)并行起 3-5 个 worker(Sonnet 4;Anthropic 另给按难度的档位——简单事实 1 个、对比 2-4 个、复杂研究 10+ 个,见维度⑤),复杂 query 研究时间最多缩短 90%;Opus-lead + Sonnet-worker 比单 Opus 高 90.2%(自家内部评测上的相对提升,完整口径见'最该记住的坑'那一节)。"
      - "Cognition(Devin 团队)《Don't Build Multi-Agents》:对'写代码'这类动作互相依赖的任务坚决反对并行。名场面 Flappy Bird:一个子 agent 把背景做成了超级马里奥风、另一个做了风格不搭的鸟,各自局部都合理、合起来拼不出游戏——'动作携带隐含决策,冲突的决策带来糟糕结果'。主张单线程 + 共享完整 trace(trace = 这个 agent 从头到尾每一步做了什么的完整动作轨迹,不只最后结论),超长就用专门模型把历史压成关键事件。"
      - "其实不真对立:Anthropic 的'研究 = 只读 fan-out'恰好落在 Cognition 认可的'只读子 agent 可并行'区间;两家都同意'并行写'危险。所以贯穿全篇的总判据是——能并行的本质 = 任务可切成互不依赖、不写同一份共享状态的只读块(Anthropic 说的'读多写少'、Cognition 说的'只读子 agent'、和这里的'互不依赖的只读块',其实是同一件事的三种说法)。Anthropic 自己也说'编码任务里真能并行的远比研究少'。"
  - heading: "学术界补的三块拼图:聚合提质 · 模型分档 · 拓扑可学习"
    body: "论文从三个角度给'派发'提供了理论弹药:"
    bullets:
      - "多份独立产出聚合起来会系统性提质——统计内核是'独立的错误若不完全相关,聚合会放大正确信号'。More Agents Is All You Need:同一模型采样 N 次按相似度投票,Llama2-13B 在 GSM8K(小学应用题数学基准)上投到约 15 次就追平单跑的 Llama2-70B(54%)、把采样数加到 40 次才升到 59% 反超(数字限 GSM8K,别外推成通用提升)。Mixture-of-Agents:分层让 aggregator 批判性融合多个(哪怕更弱)模型的回答,纯开源就在 AlpacaEval 2.0(对话质量自动评测)做到 65.1% 的胜率(这是 GPT-4 评委判定'答案优于固定参照'的长度受控胜率,不是答对率)、高于 GPT-4 Omni 自己在同一榜单上的 57.5%——是两者各自的榜上胜率,不是直接对打。多 agent 辩论:3 个 agent 辩 2 轮,GSM8K 数学题从 77% 提到 85%。"
      - "但'人多'不等于'全连'——让每个 agent 都看所有人是浪费。连接拓扑(哪些 agent 互相看对方产出、连成一张通信图)只要稀疏一点,就能在持平准确率下省下可观的 input token(论文在 MATH 数学集上最多省约 41.5%);agent 数和轮数堆太多,还会因'过度从众'反而把集体带偏(辩论增益堆到一定轮数后边际递减)。聚合的收益有边界,不是越多越好。"
      - "不同的活该用不同档的模型——NVIDIA《Small Language Models are the Future of Agentic AI》:agent 的子任务往往窄、重复、低变异,用小模型(<10B 参数)就够,大模型只在需要通用对话推理时上场;服务一个 7B 小模型比 70-175B 大模型在延迟/能耗/算力上便宜约 10-30 倍。这正是'贵 lead + 便宜 worker'分档的经济依据。"
      - "第三块:'谁连谁'本身也能当成可优化对象——拓扑可学习。GPTSwarm 把 agent 之间的通信图当一张可微调的图去优化,DyLAN 在运行时按各 agent 的实际贡献动态裁剪团队。这跟前面三大派系正交(它优化的是连接结构本身);本项目走的是静态图 + LLM 路由,没碰这条学习型拓扑。"

dimensions_meta:
  title: "7 个派发设计决策 · 每个配一个真实场景"
  labels:
    setup: "场景"
    question: "怎么派"
    good: "好的派法"
    bad: "翻车点"
    scored: "怎么判断 · 谁在用"

dimensions:
  - name: "① 谁来路由:静态图 / LLM 路由器 / handoff 交接"
    plain: "派活的第一个决策——'下一步交给哪个 agent'由谁拍板:是编译期写死的流程图、运行时让一个 LLM 当路由器临场判断、还是 agent 之间直接传棒。"
    setup: "用户问题类型不固定:可能是'茅台现在多少钱'(查事实)、'茅台和五粮液哪个好'(对比)、'帮我做一份尽调'(深度研究)。三类该走完全不同的处理路径。"
    question: "谁来判断当前问题属于哪类、该交给谁处理?"
    good: "用 LLM 路由器在运行时按问题语义动态分诊。Anthropic 的 lead agent 是'分析问题→定策略→派子 agent';本项目 chat 图的 ChatPlanner 产一个结构化 Plan,再交给一条纯函数路由边(不调 LLM,只照 Plan 里的字段决定走哪条分支)——把'LLM 决策'和'图边执行'解耦,比纯靠 LLM 当路由器更可测。LangChain 的建议:先从 supervisor 起步,简单好调试(它还能层层嵌套成'分层主管',详见维度⑤)。"
    bad: "把路由智能寄托在弱编排逻辑上:CrewAI hierarchical 的已知翻车是'不强制条件分支,导致错派 agent、覆盖输出'(出自第三方批评分析,非官方文档);或用纯静态 if-else 图硬编码分类,问题类型一旦超出预设就卡死。"
    scored: "问题类型可枚举且边界清晰 → 静态图最省最稳(MetaGPT 的 SOP);类型开放、需要语义判断 → LLM 路由器(Anthropic / LangGraph supervisor / 本项目 ChatPlanner);只有当数据证明延迟是瓶颈、且 agent 很少错派时 → 才升级到 handoff/swarm 去掉中央这一跳(能明显降低端到端延迟,代价是失去中央纠错)。(对称的'反向派发'还有两种非 lead 指派的经典形态——Contract Net 拍卖式:lead 把任务喊一嗓子、空闲 worker 竞标、择优中标,像派单平台抢单;黑板式:任务挂到公共待办墙、谁有空谁揭单;都是 LLM 时代少用、本项目未走。)"
  - name: "② 并行 fan-out vs 串行流水线"
    plain: "子任务是同时 fan-out 一群 agent 并行跑,还是排成流水线一个接一个串行——核心看子任务之间有没有依赖。"
    setup: "任务 A:'调研这 5 家白酒公司的最新财报要点'(5 个标的互不依赖);任务 B:'先给茅台估值,再基于估值结论写多空辩论'(辩论必须用到估值结果)。"
    question: "这两个任务,该并行拆开还是串行排队?"
    good: "互不依赖的(A)→ fan-out 并行:Anthropic 对研究类一次起 3-5 个 worker 并行、复杂 query 研究时间最多缩短 90%(另一种真并行是 LLMCompiler:planner 先把工具调用编成一张依赖 DAG、再自动并行跑无依赖的分支);本项目研报模式里数据采集器用并发原语把全部工具一次性扇出,critic 子图用 LangGraph 的 Send 原语(把一个子任务连同它的输入打包、扇出成一个并行分支)把 8 个评分维度扇出再汇总(结构上画出来是扇出、实际执行还是一个接一个跑)。有依赖的(B)→ 串行流水线,上游产出进 context 喂下游(本项目研报图 5-agent 线性、多空辩论轮间串行)。"
    bad: "给有依赖、要拼装的任务硬拆并行。Cognition 的 Flappy Bird 是这条轴最经典的翻车:Subagent 1 把背景做成超级马里奥风、Subagent 2 做了风格不搭的鸟,两个并行 agent 各自看不到对方、做了互相矛盾的隐含假设,最后拼不起来。"
    scored: "判据就一句:'子任务 B 需不需要先看 A 的产出?'不需要 → 并行(读类 / 检索 / 独立打分);需要 → 串行(写类 / 构建 / 共享一份演进中的状态)。Anthropic 自己也承认'编码任务里真能并行的远比研究少',主动避开了并行写;编码域主流(OpenHands 事件流单 agent、SWE-agent)也都是'强单 agent + 工具'而非并行拆写。(并行后还有一道子选择:回收是同步阻塞等齐——Anthropic 现状、不能中途纠偏——还是异步流式逐个回收、可早停慢 worker;本项目目前同步等齐。)"
  - name: "③ context 隔离:干净 context vs 完整 trace(动作轨迹)vs 共享池"
    plain: "派给子 agent 时,给它一份全新干净的 context(只交代任务),还是把主线的完整历史/动作轨迹都塞过去——这是 Anthropic 和 Cognition 分歧最尖锐的一轴。"
    setup: "给一个子 agent 派'查宁德时代最新财报要点'的检索子任务。"
    question: "要给它干净 context(只给任务描述),还是把整段对话历史和兄弟 agent 的轨迹都传过去?"
    good: "独立成块的检索/打分任务 → 干净隔离 context:Anthropic 每个 subagent 有独立 context window、借此绕过单窗口 token 上限('token 用量单独就解释了 BrowseComp(一个考网页检索能力的评测集)80% 的成绩差异');Claude Code 的 subagent 默认全新 context、看不到主对话历史;本项目所有子 agent 都是无状态、强类型的独立处理单元(actor,跑完就忘、不自己存状态)。要和兄弟产出拼装的写类任务 → 共享完整 trace(Cognition:'共享 context,而且共享完整 agent 轨迹,不只是单条消息')。"
    bad: "给强耦合的写类任务用干净 context → 子 agent 不知道兄弟做了什么 → Flappy Bird 式拼接失败;反过来,给纯检索任务塞完整历史 → 既浪费 token,又引入无关上下文(distractor)把子 agent 带偏。"
    scored: "判据 = 子结果之间的耦合度。各自独立成块(查不同公司、并行打分)→ 干净 context 更省更准;要拼成一个整体(写一段代码、构建一个产物)→ 共享完整 trace。折中做法:MetaGPT 用'全局消息池 + 按角色订阅'只取相关消息,ChatDev 跨阶段只传 solutions、不传全对话历史(至于'子 agent 之间用什么形式传',是一条独立的横切轴,见前文'通信范式'一节)。"
  - name: "④ 结果聚合:专门综合者 / 谁最后接棒谁说了算 / 投票"
    plain: "子 agent 的产出怎么收回来拼成一个最终结果——是有个专门的'综合者'agent 收口、谁最后接棒谁说了算、还是多份产出投票表决。"
    setup: "8 个评分子 agent 各从一个维度给研报打了分;或多个检索子 agent 各查回一段资料,要合成一份答复。"
    question: "这些分散的产出,怎么收成一个最终结果?"
    good: "开放式文本(研报综合)→ 专门综合者(synthesizer,业界也叫 reducer)收口:Anthropic 的 lead 自己综合、再过一个引用归属 agent;本项目 critic 子图把 8 维分数按列表拼接合并、再由 Writer 合成最终报告。有唯一答案(数值/分类)→ 投票(self-consistency,就是后面'学术拼图'里 More Agents 那套'同一题多跑几次取多数');简单单线对话 → 谁最后接棒谁说了算(last-agent-wins,handoff 派)。"
    bad: "让 supervisor 把子 agent 的回答重新转述——LangChain 实测的'电话游戏'失真:层层转述累积错误。把转述改成让子 agent 原文直传是其中关键一项,整套 supervisor 改进合计带来近 50% 的成绩提升(在一个客服零售场景评测上测得)。另一个翻车是对开放式文本用 majority voting:报告/代码这种没有'同一个标准答案',根本投不出来。"
    scored: "判据就一句:任务有没有一个可对齐的'同一个答案'?有 → 投票;没有 → 专门 synthesizer 收口、且尽量保留原文不转述;简单单线对话 → 谁最后接棒谁说了算。(各自的代表系统见上方'好的派法'。)"
  - name: "⑤ 深度与终止:深度上限 / 防 over-spawn / 何时停"
    plain: "能不能让子 agent 再 spawn 子 agent、派多深、什么条件下收手——多 agent 比单 agent 难控的就是'没人盯着全局'。"
    setup: "lead agent 拿到一个复杂尽调请求,要决定 spawn 几个 subagent、能不能让 subagent 再往下 spawn、跑到什么程度算完。"
    question: "怎么防止它派得太多太深,又怎么知道什么时候该停?"
    good: "硬深度上限 + 显式终止条件:Claude Code 的 subagent 跑在隔离 context、实践上不向下再 spawn(fork 也只一层,防无限递归)——这吸取了早期 AutoGPT / BabyAGI(让 agent 自己无限拆解任务、不收敛失控)的教训;本项目 agents 层全 stateless、无 agent 递归(唯一'深度上限 2'是 skill 嵌套加载,不是 agent 递归)。再加 prompt 里写死'难度→规模'映射(Anthropic:简单事实查 1 个 agent / 对比 2-4 个 / 复杂研究 10+ 个)和语义终止(lead 判断'够了'、子任务全部 DONE)。把框架内置的递归层数硬上限(recursion_limit,撞到就强制停)当安全网,不当控制手段。"
    bad: "不设上限:Anthropic 早期真实翻车——'orchestrator 过度热情,为一个简单问题 spawn 了 50 个 subagent',还会'陷入搜索不存在来源的死循环';LangGraph 里 agent a→b→a 成环,一路烧钱直到撞 recursion limit 才停。"
    scored: "深度怎么定:任务树天然递归(跨 10 个子系统的重构)才需要 >1——'分层主管'(按子领域再拆一层 supervisor)就是深度 >1 的合法形态,和'禁子 agent 自发递归'不矛盾;否则一律压到 1-2 层。何时停:四种合法出口——语义终止(lead 判断够了)、撞硬上限(防呆安全网)、交还人类、成本闸(花光预设的 token / 美元预算就强制收口)。MAST 提醒:21.3% 的失败来自'不知道何时停 + 停了也不验证'。"
  - name: "⑥ 模型分档:贵 lead + 便宜 worker"
    plain: "lead、worker、综合者这些位置,该用同一档模型还是分档——按'这一步需不需要强推理'来分,而不是按'重不重要'。"
    setup: "一个 lead 协调 5 个并行检索 worker,最后还有一个综合者把结果写成报告。"
    question: "这些位置该用同一档模型,还是分档?"
    good: "按'要不要强推理'分档:规划/路由/最终综合/裁判用强模型(错了全盘错),并行检索/抽取/格式化用便宜模型(单点错会被聚合稀释)。Anthropic 的教科书数字:Opus-lead + Sonnet-worker 比单 Opus 高(90.2%,完整口径见'两极之争');RouteLLM 量化了路由经济学——维持约 95% 强模型质量下、把简单 query 路由到便宜模型,相对纯用强模型可省约 35-85% 成本(越接近闲聊省得越多、越靠硬推理省得越少)。本项目按能力/成本分 fast < balanced < deep 三档,规划/分析/写作走 balanced、检索/打分走 fast,两个估值打分器干脆零 LLM(完整映射见'对照本项目')。"
    bad: "(1) 全用最贵模型:worker 是 token 大头(口径:Anthropic 自报多 agent ≈15× 普通对话 token、单 agent ≈4× 普通对话,故多 agent ≈3.75× 单 agent;这笔成本主要烧在 worker 侧),全 Opus 成本爆炸;(2) 反过来 lead 也用便宜模型:规划和综合质量塌,错误在源头被放大,后面 worker 再强也救不回。也别走另一个极端——'机械活 ≠ 无脑用最弱模型'(本项目有条约定'派 subagent 默认 sonnet、不降 haiku',但那是开发流程约定、非产品运行时 tier,详见'对照本项目')。"
    scored: "按'需不需要强推理'分,不是按'重不重要'分;worker 数量越多,分档省下的钱被乘以 worker 数、ROI 越高。NVIDIA SLM 论文进一步主张:高频、窄、低变异的子任务可以逐步降档到小模型(7B 比 70-175B 便宜约 10-30 倍)。"
  - name: "⑦ 失败与重试:子 agent 超时 / 吐垃圾的兜底"
    plain: "5 个并行 worker 里有人超时、有人吐了无法解析的垃圾,lead 怎么兜——多 agent 有状态又长程,错误会层层放大,这是它比单 agent 脆弱的物理原因。"
    setup: "一次研报采集里,5 个并行工具调用中有 1 个超时、1 个返回了无法解析的垃圾 JSON。"
    question: "lead 该怎么兜这两种失败?"
    good: "超时的 → lead 显式感知,在'带更多上下文重试 / 跳过并标注缺口 / 停下来上报人类'里选(本项目工具节点用并发原语一次性等所有工具返回,并让单个工具报错不连累其它——每个异常被裹成一条'失败结果'而不是抛断);垃圾产出的 → 过 schema 校验或 critic,拦在被下游消费之前,修不好就拒掉 + 标缺口(本项目 ChatPlanner 用白名单防幻觉、critic 当质量门、多空辩论有完整降级矩阵)。再配检查点让长任务能从断点续跑,不必全部重来。"
    bad: "把失败悄悄吞掉('静默失败是最危险的');或者无脑重试——'agent 超时等不到响应就重试,却没搞清原操作到底完成没有',导致同一请求被处理多次、产生重复副作用。"
    scored: "失败可容忍(少一个检索源)→ 跳过并标缺口;失败致命(估值这步挂了)→ 停下来上报;产出质量不可信 → 加 critic/validator 当质量门(但 critic 也烧 token,只在错误会层层传播、风险高时才加);任何分支都要 fail loud、绝不静默降级(与本项目'快速失败、不静默兜底'的硬规则同源)。"

benchmarks_title: "代表性系统 · 派发机制速览"
benchmarks:
  - name: "Anthropic 多 agent 研究系统(orchestrator-worker)"
    what: "lead(Opus 4)运行时动态 spawn 3-5 个 worker(Sonnet 4)并行检索,每个 worker 干净独立 context,lead 自己迭代 synthesize 并决定是否再派;同步等待、不能中途纠偏。"
    fit: "'贵 lead + 便宜 worker'分档是已被量化的设计(比单 Opus 高 90.2%,口径见'两极之争');但要记住代价——多 agent 的 token 成本高一个量级(倍数见总纲),只对高价值、可并行的研究类任务划算。"
  - name: "Claude Code 的 subagent / Agent 工具"
    what: "主 agent 按 description 自动委派,可一条消息发多个调用并行 fan-out,每个 subagent 全新隔离 context,结果以最后一条消息回主 agent;subagent 实践上不向下再 spawn(防无限递归)。"
    fit: "把 8 个派发轴做成了可配置开关(per-agent 模型、maxTurns、并行/后台、fork 继承历史);'禁递归防无限嵌套'与本项目'子 agent 无递归'同源。"
  - name: "OpenAI Swarm → Agents SDK(handoff vs agents-as-tools)"
    what: "Swarm:agent 通过返回另一个 Agent 的函数把控制权交接出去(已被 Agents SDK 取代)。Agents SDK 区分两种语义:handoff(专家接管对话、原 agent 退出)vs as_tool(把 agent 当函数调,结果返回、调用方综合)。"
    fit: "'谁对用户作答会不会变'是这两种派发最本质的分界。要让专家直接接管 → handoff;要 orchestrator 保持统一口径并能并行调多个专家 → agents-as-tools。"
  - name: "LangGraph supervisor vs swarm"
    what: "supervisor:中央 LLM 节点每轮决定下一个 worker、串行回环、可层级嵌套(supervisor-of-supervisors)。swarm:agent 间用 Command(goto)(直接命令'跳到另一个 agent'的 API)直接 handoff、记住上一个活跃 agent、last-agent-wins。"
    fit: "supervisor 多一跳路由调用换可控/好调试,swarm 去掉中间人换低延迟。官方建议:先用 supervisor,确证 latency 是瓶颈再考虑 swarm。"
  - name: "CrewAI(sequential vs hierarchical)"
    what: "sequential:静态串行流水线,上游产出经 Task(context=[...]) 显式喂下游,无路由开销。hierarchical:manager agent 用委派工具把活分给 coworker、review 后综合(语义偏 agents-as-tools)。"
    fit: "直白的流水线用 sequential 更快更省;需要路由智能才上 hierarchical。第三方分析指出 hierarchical 比 sequential 约多 30-50% token,且委派靠字符串匹配 coworker 名字、较脆。"
  - name: "MetaGPT(SOP 角色流水线)"
    what: "把软件公司标准流程写死成串行角色(产品→架构→项目→工程→测试),用全局共享消息池 + 按角色订阅交换结构化文档而非自由对话;工程师跑代码自纠、最多重试 3 次。"
    fit: "'流程确定性 > 单步灵活性'的代表;在它自带的 SoftwareDev 评测上,token 用量指标为 31255、人工修订仅 0.83 次/任务(论文另报每行代码均摊 124.3 token——两者口径不同、别直接相除)。任务结构稳定、要可复现可审计时,静态派发是对的。"
  - name: "AutoGen GroupChat + FSM(有限状态机)"
    what: "speaker_selection_method 一个旋钮覆盖静态↔动态:round_robin/manual(静态)、auto(LLM 当路由器选下一个说话者);再用 allowed_speaker_transitions 转移图把群聊收成有限状态机。"
    fit: "混合派的典范:用静态转移图把 auto 的 LLM 选择'收窄到图允许的后继',既防 agent 一多转移组合爆炸/选次优烧 token,又保留有限灵活——对应本项目'LLM 产 Plan、纯函数边路由'的解耦思路。"
  - name: "Magentic-One(微软,双账本 Ledger 调度)"
    what: "Orchestrator 维护两本账:Task Ledger(外层:事实+猜测+计划)和 Progress Ledger(内层:逐轮回答'谁下一个说话、这一步分派给谁、有没有在原地打转');由 orchestrator 按 Progress Ledger 每轮动态指派 4 个固定专家之一(不并行);stall 计数超阈值(论文实验中 >2)就回外层重规划。"
    fit: "把'主管脑子里的两本账'显式化成数据结构、可解释可 replan;代价是串行、慢、无并行。'卡住就重规划'是值得借鉴的失败处理范式。"
  - name: "Mixture-of-Agents / 多 agent 辩论 / More Agents(聚合提质派)"
    what: "MoA:分层多 proposer 并行生成、aggregator 批判性融合(纯开源在 AlpacaEval 2.0 达 65.1% 胜率、超 GPT-4 Omni 57.5%)。同一派还有多 agent 辩论、More Agents 采样投票、LLM-Blender 排序融合(各自数字见'学术拼图')。"
    fit: "本项目多空辩论正是这一派的落地。共同内核:独立错误不相关时,聚合(融合/辩论/投票)放大正确信号。但拓扑要稀疏——稀疏连接持平准确率却省下可观 input token(数字见'学术拼图'),别让每个 agent 都看所有人。"
  - name: "OpenAI / Gemini Deep Research(单强模型替代编排,反例)"
    what: "不搞 lead-worker 多 agent,而是用一个端到端强化学习(RL,把整个 agent 当一个整体直接训出来、而不是靠外部编排拼)训出来的强 agent,在'计划-行动-观察'循环里自己迭代调工具、读几十个来源、产带引用的报告;靠模型自身能力维持上百步的长轨迹、走不通就回溯。"
    fit: "全篇总纲的最强反问——同样产出深度研报,OpenAI 选了单 agent 而非编排。它提醒:多 agent 不是默认更优,'窗口外单 agent 往往更对更省';把'要不要拆多 agent'当成一道要论证的选择题,而非起手式。"
  - name: "Small Language Models for Agentic AI(NVIDIA,模型分档理论)"
    what: "主张 agentic 子任务窄、重复、低变异,该用小模型(<10B)做,大模型只管 root 推理;给出 6 步'把高频子任务从大模型降档到微调小模型'的转换流水线。"
    fit: "'贵 lead + 便宜 worker'分档的经济支柱:7B 小模型比 70-175B 大模型便宜约 10-30 倍(延迟/能耗/算力)。可指导本项目挑变异最低、调用最频繁的 fast 档子 agent 作为未来本地小模型替换候选。"

pitfalls:
  - "最大的认知误区:多 agent = 更聪明。真相是'更多互相看不见的局部决策 = 更多冲突 + 高得多的成本'(倍数口径见总纲)。MAST(一篇专门把多 agent 失败拆类的论文,扒了 1600+ 条标注轨迹)发现失败主因不是模型不够强——三大类里'规格/分派设计没做好'占 41.8%、'agent 之间没对齐'占 36.9%、'验证/终止缺失'占 21.3%(占比取自论文对全量 ~1600 条轨迹的三类 rollup;六名专家人工标注只用于建分类法、算标注一致性),前两类相加约 79% 都是编排层的锅。论文结论:换更大模型救不了,得靠更好的编排、通信协议、验证。"
  - "含糊的分派指令是头号杀手:Anthropic 早期只对 lead 说'research the semiconductor shortage'(研究芯片短缺),结果一个 worker 去查 2021 年汽车芯片危机、另外两个重复查 2025 供应链——重复劳动、留下空白。修法:每个子 agent 必须给清楚的目标 + 输出格式 + 工具与来源指引 + 明确任务边界。"
  - "另外几类高频坑,前面 7 个决策里已逐个讲透,这里只点名回指、不再展开:不设上限就 over-spawn(Anthropic 真为简单问题 spawn 过 50 个、还会反复搜索不存在的来源停不下来,见⑤)、聚合的'电话游戏'(supervisor 层层转述失真,见④)、context 隔离是双刃剑(给强耦合写类任务用干净 context 会 Flappy Bird 式拼接冲突、给纯检索塞完整历史又引入干扰,判据是耦合度,见③)、子 agent 静默失败或无脑重试(悄悄丢产出最毒、没搞清原操作完成没就重发会产生重复副作用,任何分支都要 fail loud,见⑦)。"
  - "静态流水线没有运行时仲裁者会自己塌:CAMEL 论文列了经典失败——两 agent 角色对调(执行者反过来发指令)、空头支票('我会去做…'但不做)、互相道谢的死循环;全靠开场的角色提示词硬扛。而且任务一旦冒出 SOP 没覆盖的分支,静态流程就卡死或走歪。"
  - "厂商自报数字要核口径:90.2% 是 Anthropic 自家内部研究 eval 上的相对提升,不是公开 benchmark,无第三方复现;RouteLLM 的省钱幅度依 baseline 而异(相对随机路由器省约 48% vs 相对纯 GPT-4 省超 85%,是两套不同设定;且相对纯 GPT-4 的 85%/45%/35% 还分别绑 MT-Bench/MMLU/GSM8K 三个不同评测,'35-85%'不是同一设定下的连续区间);某些'某模型在推理上超过 GPT-4o/Claude-3.5'只在数学/推理类 benchmark 成立,不代表通用能力。横评一定要查清每个数字的 baseline 和适用范围。"

gaps:
  - component: "chat 模式的 supervisor 路由(ChatPlanner)"
    current: "ChatPlanner 用受约束 LLM 产结构化 Plan(里面带'要调哪些工具/能不能并行/要不要升级/要不要加载技能'等字段),再交给一条纯函数路由边(不调 LLM,只照 Plan 字段决定走哪条分支)——把'LLM 决策'和'图边执行'解耦,比纯靠 LLM 当路由器更可测;用白名单防幻觉(工具/技能不在册就丢弃)。对应业界 supervisor 范式,但更工程化。"
    suggestion: "对照 MAST'41.8% 失败来自规格/分派设计',可把'分派指令质量'也纳入评测:memory-vs-kb 路由现在只有 8 个种子(计划扩 50 未扩),优先扩到 50 + 加边界/歧义 case + 跑多次报均值,把路由准确率做成离线 golden。另外,本项目走静态图 + LLM 路由,未涉足'学习型拓扑'(GPTSwarm / DyLAN 那类把 agent 连接当一张可优化的图、运行时按任务动态裁剪团队)——这是一条可以坦诚标注的能力边界。"
  - component: "研报模式的并行 fan-out(critic 子图 Send API)"
    current: "这是项目里唯一'一个母节点把活一次性撒给多个子任务、再把结果收回来拼一起'(业界叫扇出-汇总 / map-reduce)的地方:用 LangGraph 的 Send 机制把 8 个评分维度扇出、再把分数按列表拼接合并。注意是结构上并行设计、执行上仍一个接一个跑——打分节点刻意没放进并发线程,为的是让录制的测试回放能按调用顺序稳定匹配;数据采集器和工具节点的并发则用通用并发原语。对应 Anthropic 的 orchestrator-worker 扇出。"
    suggestion: "并行度目前写死(8 维固定),且打分还是顺序执行。注意 critic 这 8 维是固定的语义评分轴、不同于 Anthropic 那种同质 worker 池;而且它其实已经会在缺输入时自动跳过维度(估值/辩证两维在没有对应输入时主动标记'跳过'、不计入均值),可补的是把这个跳过从'事后按输入有无剔除'前移成'按报告类型在扇出前就决定派哪几维'、省掉空跑的分支。另注:打分并发的收益本就有限——critic 每维只几百 token、串行也不显著卡住事件循环,真正值得并发的是 Writer 那种长调用,所以'改并发'是锦上添花、不是性能瓶颈解。"
  - component: "bull/bear 多空辩论(DebateOrchestrator)"
    current: "2 轮 × 2 advocate:第 1 轮互不看、独立产论据,第 2 轮交叉看对方再反驳——对应学术界 multi-agent debate;轮间串行、轮内用并发原语(asyncio.gather,同时跑、等全部返回)并行;有完整降级矩阵(任一轮失败退回单线)。第 8 维'辩证平衡'打分器(dialectical_balance,一个 rule-based 打分器,专门校验最终结论里是否真同时引用了多空双方的论据)。"
    suggestion: "辩论提质已被论文验证(Du et al.:GSM8K +8、即 77→85,算术 +14.8、即 67→81.8),但本项目固定 2 轮。可对照'辩论增益堆到一定轮数后边际递减'的经验做轮数实验;并把'辩论是否真降低幻觉'扩成端到端事实性对照组——复用项目已有的'差分对照测试'(同一输入跑两版、比产出差异,如持仓演化那 5 例)加 critic 现成的'事实性'打分维度,比'有辩论 vs 无辩论'的得分。另外,辩论的通信图不必全连——稀疏拓扑(每个 advocate 只看部分对手产出)能省 input token(数字见'学术拼图');本项目只 2 个 advocate 暂用不上,扩 advocate 时值得借鉴。"
  - component: "两层路由器(memory-vs-kb / 估值多模型)"
    current: "两处共有的范式:第一层确定性规则匹配(零 LLM 零延迟),未命中才落第二层 LLM 兜底——对应 RouteLLM'规则优先 + LLM 兜底'的成本感知路由。两者落地程度不同:memory-vs-kb 路由两层都已接通,命中两类时并行检索、单路失败优雅降级不连累另一路;估值多模型路由的第二层 LLM override 当前只是留口 hook、默认不调、只跑确定性映射(它的并行/降级语义也与 memory-kb 那套不同,别一概而论)。"
    suggestion: "可给本项目两层路由配 RouteLLM 同款的成本指标(它量化过的分档收益见上文维度⑥):统计多少 query 被规则层拦下、省了多少次 LLM 调用,以及误路由率,做进成本 dashboard 当一等指标。"
  - component: "模型分档(tier 路由)"
    current: "planner/analyst/writer = balanced 档,critic-aggregate 名义上也是 balanced 档(但汇总节点只拼接分数、不真调 LLM),advocate/LLM 打分器/采集器 = fast 档,两个估值/辩证打分器是 rule-based 零 LLM;硬规则'派 subagent 默认 sonnet、不降 haiku'。但要诚实标口径:这只是逻辑 tier 声明——当前默认的 tier 路由把 fast/balanced/deep 三档全部解析到同一个模型,多模型配置还没接上,所以'贵 lead + 便宜 worker'的成本差异目前是留了口子、尚未真正生效。"
    suggestion: "对照 NVIDIA SLM 论文的 6 步'大模型→小模型'转换流水线:可统计哪些 fast 档子 agent 调用最频繁、变异最低(采集器/打分器),作为未来本地小模型替换的候选(本项目的本地化方向已留 protocol 口子)。"
  - component: "深度上限与失败兜底"
    current: "agents 层全是无状态、强类型的子 agent、无 agent 递归(唯一'深度 2'是技能嵌套加载上限,不是 agent 递归);工具节点用并发原语让单个工具报错不连累其它兄弟;critic 当质量门、限制 Writer 最多重试 1 次;借 LangGraph 的检查点支持从断点续跑。与业界'禁递归 + fail loud + 断点续跑'一致。"
    suggestion: "与 Anthropic / Claude Code 的'禁递归 + 断点续跑'同源,基本到位。可补三块:(1) 把 MAST 单列的'验证/过早终止'(占 21.3%)做成显式 eval 维度——目前 critic 只校验报告质量,'子 agent 该不该提前停'还没断言;(2) 把任务真正交还人类执行——本项目现有 escalation 只是 chat→深度研究的 agent 间升级 + 人类确认门控(人把关、不接手干活),没有'委派给人去做'这条出口;(3) 派发可观测性——接进链路追踪(TraceService)做'按子 agent 归因',看清谁拖慢/烧钱(可学 Magentic 的 stall 计数)。"

