# ----------------------------------------------------------------------------
# 来源:2026-06-17 对话推演(承 rl-product-landing-design §③④ 反向生成方法论的
# 下游深化)+ 本仓本轮已落地的验证集基建(indicator_oracle / 计算口径冻结 spec /
# trade_cal window 动作 / B-harness 实跑 pass@1 5/6,file 证据)。
# 体裁:验证方法论(挂 verification 维度;与 tool 维度「RL 三部曲」上下游互链:
# 三部曲讲"怎么训",本篇讲"喂进去的题怎么造得既真实又铺满难度谱")。
# 写作约定:不用读者无法对应的内部代号;判断结论带本仓真实组件名。
# ============================================================================

slug: verification-question-gates
title: 验证集出题的两道闸 · 难度设计 × 真实性
subtitle: >-
  反向出题(采真实输入 → oracle 算 gold → 反套题面)解决了"标准答案从哪来",让答案几乎免费——但它不挑题。穷举(股票 × 指标 × 窗口 × 算子)会生一大堆"有可信答案、却没人会问"的题。所以出完题必须过两道正交的闸:难度闸管"这题让 agent 干多少活",真实性闸管"这题有没有人会问"。本篇把这两道闸的设计机制讲透,并对照本仓已落地的 indicator_oracle / 口径冻死 / trade_cal window / B-harness(pass@1 实测 5/6)给出可执行蓝图。承 RL 三部曲 §③④ 的下游深化。
meta:
  date: '2026-06-17'
  basis: 对话推演沉淀 + 本仓已落地验证集基建(indicator_oracle / 计算口径冻结 spec / trade_cal window / B-harness 实跑 pass@1 5/6,file 证据);承 rl-product-landing-design §③④
summary: >-
  先把命题摆正:反向出题解决的是"标准答案从哪来"——采真实输入(tushare)→ oracle 算 gold → 反向套题面,答案是 oracle 的副产品、几乎免费(详见 RL 三部曲 §③)。但"答案免费"不等于"题有价值"。穷举组合会生出一大堆"有可信答案、却没人会问"的题——ST 股 × 茅台相关性、CAGR × 20 个交易日、上市三个月的票近五年涨幅——不筛会污染 pass@k(在测 agent 答没人问的题)、浪费 RL 算力。所以一道有价值的题要同时满足三件事:有可信答案(反向出题给)、难度合适(难度闸)、真实(真实性闸)。本报告专讲后两道闸,几个判断:(1)难度不在数学(oracle 秒算,1 股还是 50 股没区别),在 agent 的活链——靠 5 个结构旋钮(链长 / 组合算子 / 数据规模 / 日期弯绕 / 干扰歧义)把题分简 / 中 / 复三档,gold 形状随档从"一个数"升到"排名 / 集合",判分器也分档;(2)难度要先验设计 + 后验标定双管——结构复杂度只是先验猜测,真实 pass@k 才是这只 agent 的真难度,用实测重贴标签、照出战力断崖;(3)真实性靠三层闸——生成时合法配对矩阵 + 股票池约束挡荒谬、从真实用户 job 出发实例化让真实性"天生"就有、强模型当真实性裁判 + 跟真实流量分布对齐兜残余;(4)两道闸正交——你要的是既真实、又铺满难度谱的题,右上角(真实 × 中高难)才是 RL 金矿。本仓已落地反向出题的全部零件(indicator_oracle 六指标 + 口径冻死 + window 窗口确定化 + B-harness 自动判分),pass@1 实测 5/6,出题机只差"按本蓝图把单题扩成上万题"这一步。
sections:
- heading: 出题机长什么样:反向出题 + 两道闸
  body: >-
    反向出题的核心(先有答案、再有题)在 RL 三部曲 §③ 已讲透,这里只压一句:采真实输入 → oracle 算 gold → 反向套题面,答案是 oracle 的副产品、几乎免费。但"答案免费"不等于"题有价值"。一道有价值的题要同时满足:有可信答案(反向出题给)+ 难度合适(难度闸)+ 真实(真实性闸)。所以完整流水线是:反向出题(出 gold)→ 难度闸(分档 + 标定)→ 真实性闸(挑有人问的)→ B-harness 跑 agent 自动判 → pass@k 分布喂 RL。本报告专讲中间那两道闸——它们决定出来的上万道题是"金矿"还是"噪声"。
  bullets:
  - >-
    两道闸正交,别混:难度管"链多长"(1 股 1 指标 vs 4 股筛选),真实性管"有没有人问"(茅台涨幅 vs ST 股 × 茅台相关性)。一道题可以又真实又难(我持仓 5 只里涨幅为正且回撤<20% 的有哪几只——RL 金矿),也可以荒谬又难(随机 50 只的相关性矩阵——纯噪声)。只有"真实 × 中高难"那一格有价值。
  - >-
    闸的位置:难度闸一半在生成时(模板分档,先验)、一半在判分后(pass@k 标定,后验);真实性闸主要在生成时(约束 + 意图锚定),少量在判分前(裁判筛 + 流量对齐)。两道闸都尽量"生成时就保证",而不是"事后大海捞针"。
- heading: 难度闸:难度不在数学,在 agent 的活链
  body: >-
    反直觉但关键:回撤、相关性怎么算,对 oracle 是一样简单的——它秒算,1 股还是 50 股、1 个指标还是 5 个,对它没区别。真正的难度,是 agent 为了答这题要干多少活、链有多长、多少地方会翻车。所以难度是用"题型模板"设计出来的,不是用数据。五个旋钮拧大一点就更难:链长(几股 × 几指标 × 几窗口,取数 / 计算步数翻倍、planning 更难、上下文更长)、组合算子(排序 / 筛选 / 聚合 / 对比,算完单指标还要再套一层逻辑,容易漏容易错)、数据规模(数据多 → 撑爆上下文 / 触发截断翻页,正是 data_refs 通道治的那个坑)、日期弯绕(窗口不是现成的"近一年",要推算"上季度""财报前后")、干扰歧义(题面塞无关信息、或股票名要消歧)。一道题拧 1 个旋钮 = 中等,拧 2-3 个 = 复杂。gold 的形状也随档升:简单 / 中等单值 = 一个数(判 |答 − gold| < 容差)、排序档 = 有序列表(判名次)、筛选档 = 集合(判相等,可能空集),所以判分器要跟着分档写。
  figure: difficulty-knobs-tiers.svg
  figure_caption: >-
    难度闸:5 个结构旋钮(链长 / 组合算子 / 数据规模 / 日期弯绕 / 干扰歧义)→ 简 / 中 / 复三档(拧 0 / 1 / 2-3 个),gold 形状随档从"数"升到"排名 / 集合";底部先验(结构分档)+ 后验(pass@k 实测)双标定,照出战力断崖供 RL 瞄准。
  bullets:
  - >-
    三档样板(就是手测那 6 题的放大版):简单(拧 0 旋钮,~3 步,"茅台近一年涨多少",agent 90%+)；中等(拧 1 旋钮,~6-10 步,"茅台 × 五粮液相关性"=2 股 + 对齐、"茅台回撤和波动率"=1 股 2 指标,~50-80%)；复杂(拧 2-3 旋钮,~15-30 步,"这 4 只里涨幅为正且回撤<20% 的有哪几只"=4 股 × 2 指标 + 布尔筛选 → 集合,~20-50%)。正好对应手测的 S1/S2、M1/M2、C1/C2,C1 那次 agent 翻车就是复杂档的真实失败。
  - >-
    难度要先验设计 + 后验标定双管:你事先标的档只是先验猜测;一个你以为"中等"的模板真跑 pass@k 可能是 95%(其实简单)或 30%(其实很难)。所以按结构复杂度先粗分出题(先验)→ 跑 B-harness 拿每档真实 pass@k(后验)→ 用实测重贴"真难度"标签。这一步才点全题:找 agent 战力的"断崖"在哪——哪个指标 / 算子 / 链长档,正确率从 90% 掉到 50% 再掉到 20%。
  - >-
    别穷举出一堆简单题:直接笛卡尔积绝大多数是简单题、没用。靠"每档模板各实例化多少道"设配额(如 40% 简单 / 40% 中等 / 20% 复杂),让题集刻意铺满难度谱。配额是先验旋钮,实测 pass@k 再回过头修正配额。
- heading: 真实性闸:有可信答案 ≠ 有人会问
  body: >-
    笛卡尔积(股票 × 指标 × 窗口 × 算子)能保证"有 oracle 算出的可信答案",却保证不了"有人会这么问"。一大半是合法但荒谬:ST 康美 × 茅台相关性(垃圾股跟茅台比相关性没人问)、茅台近 20 个交易日的 CAGR(CAGR 是几年的概念套 20 天荒谬,但 oracle 照算出一个数)、上市三个月的票近五年涨幅(数据根本不存在)、茅台 × 隆基绿能相关性(白酒跟光伏八竿子打不着)。不筛的代价:污染 pass@k、RL 浪费算力。原则:真实性最好生成时就保证。三层闸从硬到软——第一层生成约束(指标 × 窗口合法矩阵:CAGR 只配 ≥2 年、PE 分位只配 ≥3 年长历史、相关 / 波动 ≥3 月、涨幅 / 回撤任意；股票池:沪深 300 / 行业龙头 / 用户真实持仓,剔 ST、退市、流动性极差;数据可得性:上市时长 ≥ 窗口长度;有意义配对:相关 / 对比只在同板块、同指数成分、同持仓内)；第二层意图锚定(别从笛卡尔积出发,从真实用户 job 出发——选股尽调 → 涨幅 / 回撤、持仓体检 → 在持仓内筛选 / 排序、风险评估 → 波动率、配对判断 → 同板块相关性。每题是一个真实 job 的实例化 → 真实性"天生"就有,这正是 RL §④"自然外衣"的上游:先有真实意图、才谈自然措辞)；第三层事后软筛(强模型当真实性裁判:"真实散户 / 研究员会问这个吗?1-5 分 + 理由",低分剔；有 chat 日志时跟真实流量的(意图 / 指标 / 股数 / 窗口)分布对齐,按真实频率加权而非均匀采样)。
  figure: realism-three-gates.svg
  figure_caption: >-
    真实性闸(漏斗):笛卡尔积(含大量荒谬)→ 闸① 生成约束(合法矩阵 + 股票池 + 数据可得 + 同组配对)→ 闸② 意图锚定(从真实 job 实例化)→ 闸③ 事后软筛(真实性裁判 + 流量对齐)→ 真实题。右侧标注"真实性 ≠ 自然度":意图在上游、措辞在下游。
  bullets:
  - >-
    真实性 ≠ 自然度:RL §④ 的"散户口吻穿外衣 + 反抽校验"管的是"措辞像不像人话";真实性闸更上游,管"这题本身有没有人会问"。措辞再自然,"ST 股 × 茅台相关性"也是没人问的题。两者叠在不同层:意图(真实性)→ 组合形状 → 措辞(自然度)→ 反抽校验(守 gold)。
  - >-
    供给侧 vs 需求侧:笛卡尔积是供给侧(我能算什么),真实性来自需求侧(有人想知道什么)。这也是为什么强调"意图单独成轴、别拿数据域当意图"(本仓穷举维度返工的教训)。意图锚定是真实性的主闸、生成约束是兜底硬规则、裁判 + 流量对齐抓残余。
  - >-
    闸自己也要验:人工抽检 50 道("这像不像真人会问"),不像的反推哪层漏了;有真实 query 时做覆盖比对(生成集覆盖了高频问法没?含不含用户从不问的类型?),别凭空造需求。流量对齐是金标准但要先攒够真实流量,没攒够前先靠意图锚定兜。
- heading: 本仓已落地:出题机的零件都在,差"扩量"这一步
  body: >-
    这两道闸不是纸上设计——反向出题的全部零件本仓这轮已 ship:indicator_oracle(六指标纯函数:区间涨幅 / 最大回撤 / 年化波动率 / 相关性 / CAGR / PE 分位,backend/eval/indicator_oracle.py)= gold 发生器,口径冻死过(收益率用 tushare pct_chg、波动率 √252、ddof=1,见 computation-caliber-freeze spec);trade_cal 的 window 动作把"近一年"解析成确定的(起,止,交易日)= 难度闸里"日期弯绕"旋钮的确定化、也让 oracle 和 agent 取同一段数据(口径对齐 method B);B-harness 实跑 6 题(简 / 中 / 复三档各 2)自动判分,pass@1 = 5/6(M1 经口径冻死后从判错变判对,坐实方法可行,C1 复杂档 agent 真翻车)。所以现在缺的只有"按本蓝图把 6 题扩成上万题"这一步。
  bullets:
  - >-
    缺口一(难度的组合算子层):现 indicator_oracle 是单指标纯函数,复杂档(排序 / 筛选 / 聚合)要在其上加一层确定性组合(sorted / 布尔条件 / mean),gold 从"数"变"排名 / 集合",判分器同步分档。都是确定性 Python,gold 仍可信、仍自动。
  - >-
    缺口二(真实性的意图模板 + 股票池):意图锚定要把"选股尽调 / 持仓体检 / 风险评估 / 配对判断"写成 job 模板,每个自带合理组合形状;股票池接沪深 300 / 用户持仓;合法配对矩阵(指标 × 窗口)落成一张表。
  - >-
    缺口三(规模 + 流量对齐):现 6 题是手挑锚点,扩到上万要按(股票 × 意图 × 窗口)配额批量生成;本仓有 chat 可观测系统,可统计真实 query 分布做加权(真实性闸第三层),但需先攒够真实流量。
- heading: 下游:两道闸滤出的题怎么喂 RL
  body: >-
    这两道闸的终点,是给 RL 一份"既真实、又铺满难度谱"的题集——具体怎么进 RL 由 RL 三部曲接。难度闸标定出的"战力断崖中段"(pass@k ~50-80% 那档)就是 RL 的黄金打击带(太简单没学习信号、太难可能要换多步信用分配,见 RL §⑦);真实性闸保证 RL 不把算力浪费在没人问的荒谬题上;反向出题让这份"pass@k 测量集 = RL 训练 prompt 集 = eval 集"一份三用(RL §③)。一句话:本报告的两道闸是 RL 三部曲的"进料口品控"——管的是喂进 RL 的料干不干净、覆盖够不够。
  bullets:
  - >-
    黄金中段:RL 打"从会到不会"的断崖中段;难度闸的后验标定就是为了把这条断崖照清楚(哪个指标 / 算子 / 链长档塌)。太简单档 RL 学不到东西,太难档(pass@k≈0)没梯度、该先 SFT 或缩短任务。
  - >-
    物理隔离仍成立:这两道闸只管计算类轨(有 oracle 的题);分析类(观点 / 报告质量)没 oracle、反向出题用不上,走 judge——别让真实性裁判的软分混进 RL 奖励(RL §⑤ 物理隔离)。真实性裁判只用来"筛题",不进"奖励"。
dimensions_meta:
  title: 6 个出题决策 · 每个配一个真实判断
  labels:
    setup: 场景
    question: 怎么定
    good: 好判断
    bad: 翻车点
    scored: 依据 · 落到本项目
dimensions:
- name: ① 难度装在哪:题型模板,不是数据
  plain: 难度不在数学(oracle 秒算),在 agent 的活链;靠题型模板设计,不靠换数据。
  setup: 想让验证集铺开难度,但发现换股票 / 换指标,题对 agent 还是一样难。
  question: 难度从哪来?
  good: >-
    把难度装进模板:5 个结构旋钮(链长 / 组合算子 / 数据规模 / 日期弯绕 / 干扰歧义),拧 0 个 = 简单、拧 1 个 = 中等、拧 2-3 个 = 复杂。同一台 oracle 套不同复杂度模板,就出不同难度的题。
  bad: >-
    以为"换更冷门的股票 / 更复杂的指标"就更难——oracle 算它们一样简单,agent 的活链没变长,难度纹丝不动;或把"算式难"当"题难"(算式 oracle 秒解,跟 agent 难度无关)。
  scored: >-
    判据 = 这道题让 agent 多走几步工具 / 多套几层逻辑。落到本项目:1 股 1 指标 ~3 步 vs 4 股筛选 ~20 步。谁在用:agentic 评测都按"工具步数 / 组合复杂度"分难度。
- name: ② gold 形状随档升:数 → 排名 → 集合
  plain: 难度升级时 gold 从"一个数"变成"排名 / 集合",判分器必须跟着分档。
  setup: 复杂题(排序 / 筛选)的标准答案不再是一个数,judge 怎么比?
  question: gold 长什么样、怎么判?
  good: >-
    简单 / 中等单值 → gold = 一个数,判 |答 − gold| < 容差;排序档 → gold = 有序列表,判名次一致;筛选档 → gold = 集合(可能空集),判集合相等。oracle 加组合算子层(sorted / 布尔 / mean)照样自动产出结构化 gold。
  bad: >-
    gold 升成集合 / 排名后,判分器还用数值容差去比(判全错);或筛选题忘了空集也是合法 gold(C2 的正确答案就是空集);或排序题只比第一名、不比完整名次。
  scored: >-
    判据 = 判分器的形状匹配 gold 的形状。落到本项目:indicator_oracle 现单值,组合算子层 + 分档判分器是待补缺口一。谁在用:结构化答案评测普遍按答案类型分判分器。
- name: ③ 难度双标定:先验设计 + 后验 pass@k 重贴标签
  plain: 结构复杂度只是先验猜测,真实 pass@k 才是这只 agent 的真难度。
  setup: 按模板标了"简 / 中 / 复",但不知道对这只 agent 是不是真这么难。
  question: 难度标签信先验还是信实测?
  good: >-
    双标定:按结构复杂度先粗分出题(先验)→ 跑 B-harness 拿每档真实 pass@k(后验)→ 用实测重贴"真难度"标签,照出战力断崖(正确率从 90% 掉到 50% 再到 20% 的那个指标 / 算子 / 链长档)。这一步零训练成本,还顺带回答"RL 该不该上"。
  bad: >-
    只信结构先验、不实测(一个你以为"中等"的模板可能实跑 95% 或 30%);或只实测、不设计结构(穷举出来全是简单题,实测全 95%、照不出断崖);或不设配额,题集挤在简单档。
  scored: >-
    判据 = 实测 pass@k 是否回过头修正了难度标签和配额。落到本项目:B-harness 实跑即这步,6 题 pass@1 5/6。谁在用:pass@k 分桶(RL 三部曲 §③ / OpenAI RFT 中间区间)。
- name: ④ 真实性三层闸:约束硬挡 / 意图锚定 / 裁判+流量
  plain: 有可信答案 ≠ 有人会问;真实性靠三层闸,生成时就挡掉荒谬。
  setup: 笛卡尔积出的题一大半荒谬(ST 股 × 茅台相关性、CAGR × 20 天),怎么筛?
  question: 怎么保证题真实?
  good: >-
    三层闸:① 生成约束(指标 × 窗口合法矩阵 + 股票池 + 数据可得性 + 同组配对)硬挡荒谬;② 意图锚定(从真实用户 job 实例化)让真实性"天生"就有;③ 事后软筛(强模型当真实性裁判 + 跟真实流量分布对齐)兜残余。真实性最好生成时保证,不是事后捞。
  bad: >-
    只做事后筛、不做生成约束(大海捞针,且裁判也会漏);或跨毫无关系的股票配相关性 / 对比;或让 CAGR 配 20 天、PE 分位配短历史这种非法组合进集子;或没攒够流量就硬做"流量对齐"(无米之炊)。
  scored: >-
    判据 = 荒谬题在"出生前"被挡掉的比例。落到本项目:意图模板 + 股票池 + 合法配对矩阵是待补缺口二。谁在用:合成数据普遍用"约束生成 + 意图模板"控真实性。
- name: ⑤ 真实性 ≠ 自然度:意图在上游,措辞在下游
  plain: 真实性管"有没有人问"(意图层),自然度管"像不像人话"(措辞层),两层不同。
  setup: 已有 retail-investor-voice 把题包成口语,是不是就真实了?
  question: 自然措辞够不够保真实?
  good: >-
    不够。先有真实意图(真实性闸)→ 定组合形状 → 再穿自然外衣(RL §④ retail-voice)→ 反抽校验守 gold。措辞自然只是最后一层化妆,挡不住"ST 股 × 茅台相关性"这种意图层就荒谬的题。
  bad: >-
    把"自然度"当"真实性"——给一道没人会问的荒谬题穿上流利口语,它还是没人问;或反过来跳过自然度,纯模板题僵硬不像真实股民问法(自然度也得做,只是它在下游)。
  scored: >-
    判据 = 这道题的"意图"是不是某个真实用户 job。落到本项目:retail-investor-voice 管措辞、意图模板管真实性,两者分属不同层。谁在用:RL §④ 的"K2 外衣 + oracle 脊梁"——本篇补它上游的意图层。
- name: ⑥ 两道闸正交:既真实又铺满难度谱才是金矿
  plain: 难度和真实性是正交两轴,目标是右上角(真实 × 中高难)那一格。
  setup: 出了一堆题,有的真实但太简单、有的很难但荒谬,哪些有价值?
  question: 什么样的题才值得留 / 喂 RL?
  good: >-
    把题铺在二维上:横轴难度、纵轴真实性。只有"真实 × 中高难"那一格是 RL 金矿(我持仓 5 只里涨幅为正且回撤<20% 的有哪几只)。两道闸各管一轴、互不替代:真实但太简单 → 没学习信号;难但荒谬 → 纯噪声、浪费算力。
  bad: >-
    用一道闸代另一道(以为题难就有价值,结果难是因为荒谬);或只优化一个轴(全是真实简单题 / 全是荒谬难题);或把两个轴揉成一个"质量分"(丢掉正交信息,没法分别诊断)。
  scored: >-
    判据 = 题落在二维的哪一格。落到本项目:难度闸 + 真实性闸分别把两轴管住,B-harness 实测填进格子。谁在用:RL 进料品控(本篇)→ RL 训练(三部曲)。
benchmarks_title: 本产品资产 · 出题机复用度
benchmarks:
- name: indicator_oracle(六指标纯函数)
  what: >-
    区间涨幅 / 最大回撤 / 年化波动率 / 相关性 / CAGR / PE 分位,纯 Python、确定性、口径冻死(收益率 pct_chg、√252、ddof=1);backend/eval/indicator_oracle.py + 8 个单测。
  fit: 真实性闸下游的 gold 发生器,直接当反向出题的标准答案源;复杂档要在其上加组合算子层(sorted / 布尔 / mean)产结构化 gold,是缺口一。
- name: 计算口径冻结(caliber-freeze spec)
  what: >-
    冻死收益率 / 窗口 / 复权 / 年化因子 / ddof / 分位的约定 + 各指标容差表;docs/superpowers/specs/2026-06-16-computation-caliber-freeze-design.md。method B = oracle 用 agent 实际窗口算 gold。
  fit: 保证 oracle 的 gold 和 agent 的答案算的是同一件事(否则两边都对、数字却不一样,误判);M1 经此从判错变判对。
- name: trade_cal window 动作
  what: >-
    给"今天 + 周期码(1y/6m/ytd/20td…)"一次返回确定的(start, end, trading_days);已合入 main(#167)。
  fit: 难度闸"日期弯绕"旋钮的确定化基件;让 oracle 和 agent 取同一段交易日(口径对齐);相对区间解析从多次往返收成 1 次。
- name: B-harness(自动判分跑机)
  what: >-
    跑 agent → 从 trace 提实际窗口 → indicator_oracle 按冻结口径算 gold → 正则解析答案 → 容差判;实跑 6 题 pass@1 = 5/6。
  fit: 难度闸的后验标定器(实测 pass@k);扩量后即"出题 → 判分 → 难度分桶"的执行引擎。
- name: retail-investor-voice skill(自然外衣)
  what: 把(输入, gold)包成散户口吻问法的 skill;RL §④ 的自然度来源。
  fit: 真实性闸下游的"措辞层"(意图锚定定形状后,它穿口语外衣);注意它管自然度、不管真实性。
- name: chat 可观测系统(流量对齐)
  what: chatloop 运行时可观测聚合(后端只读 API + 看板页),可统计真实用户 query。
  fit: 真实性闸第三层"流量对齐"的数据源;需先攒够真实流量,在那之前靠意图锚定兜。
pitfalls:
- 直接笛卡尔积穷举——绝大多数是简单题、没用;靠每档模板配额(如 40/40/20)刻意铺满难度谱。
- 只信结构先验不实测,或只实测不设计结构——前者难度标签可能全错,后者照不出战力断崖;两者要双管。
- 把真实性当成"措辞自然"——只做 retail-voice 外衣、不做意图锚定 / 生成约束,ST 股 × 茅台这类意图层就荒谬的题照样漏进。
- 跨毫无关系的股票配相关性 / 对比(白酒 × 光伏)——相关 / 对比只在同板块、同指数、同持仓内配。
- 指标 × 窗口非法配对——CAGR × 20 天、PE 分位 × 短历史,oracle 照算出数但题荒谬;用合法配对矩阵硬挡。
- gold 升成集合 / 排名后判分器还用数值容差——判全错;判分器必须跟着 gold 形状分档(含空集是合法答案)。
- 把真实性裁判的软分混进 RL 奖励——破坏物理隔离;裁判只用来"筛题",绝不进"奖励"(分析类轨的活)。
- 没攒够真实流量就硬做"流量对齐"——无米之炊;先靠意图锚定 + 生成约束兜,流量够了再加权。
