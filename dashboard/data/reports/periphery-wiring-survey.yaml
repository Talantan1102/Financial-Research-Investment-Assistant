# dashboard/data/reports/periphery-wiring-survey.yaml
# ============================================================================
# 研究报告:工业界怎么把周边能力接进 agent loop —— 万物皆工具,例外要有理由
# ----------------------------------------------------------------------------
# 来源:2026-06-04 两个 Workflow 共 12 路并行联网调研(周边接线 7 路:MCP 三原
# 语 / Claude Code 工具版图 / OpenAI 工具设计 / 记忆工具vs注入 / 升级委托工具
# 化 / 工具数量实证 / 反模式;技能接线专项 5 路:Agent Skills 标准 / Claude
# Code skill 运行时 / 竞品规则系统 / 技能选中与规模化 / 脚本执行)+ 承重结论
# 对抗式核查(两批合计 40+ 条,凡 partly/refuted 一律用更正版)+ 对照本项目
# chat 模式重设计草案逐条裁决。
# 由 dashboard/derive/report.py 类型化加载,渲染于 /eval/report/<slug>,
# 入口挂「工具接口与协议」维度页 /m/tool。
# 写作约定:不用读者无法对应的内部代号;厂商数字一律标注口径(官方文档/工程
# 博客/论文/社区逆向,一手还是二手);每个要点配贴近本项目业务的例子。
# ============================================================================

slug: periphery-wiring-survey
title: Agent Loop 周边接线 · 怎么做
subtitle: >-
  用具体例子讲明白:7 个接线设计决策 × 真实场景,横扫"什么该是工具"的判据与例外 / 工具数量治理 / 信号工具 / 记忆双轨 / 技能渐进披露,对照本项目
  chat 模式重设计草案逐条裁决
meta:
  date: '2026-06-04'
  basis: >-
    12 路并行联网调研(周边接线 7 路 + 技能接线专项 5 路)+ 40+ 条承重结论对抗式核查(凡 partly/refuted 均用更正版)+ 对照本项目
    chat 重设计草案
summary: >-
  重设计一个 chat agent loop 时,真正的体力活不在循环本身,而在"周边能力怎么接进来":记忆、知识库、技能、升级深度研究、结果缓存——每一个都要回答同一个问题:它该做成模型自主调用的工具,还是代码确定性注入的上下文,还是循环外的编排?本项目重设计的接线原则是"能建模成工具的全变工具,例外要有理由",这份调研就是去工业界验证这条原则和它的例外。先约定几个高频词:工具(tool)=
  模型在对话中自主决定调用的能力,带参数 schema;注入 = 代码在拼窗口时确定性放进去的内容,模型无需决策;信号工具 = 调用后不返回数据、只改状态/通知外界的工具(如提议升级);渐进披露
  = 先给轻量目录、模型按需取全文的装载模式;语义重叠簇 = 一组名字和功能都相近的工具(模型最容易选错的地方)。核心结论三句话:第一,"谁决定何时用它"是最高判据——模型该决策的做工具,应用该当背景喂的做注入(MCP
  协议把这条写进了规范);第二,工具数量的红线比直觉低(qwen 官方:单次不超过 20 个),且真杀手不是总数而是语义重叠簇;第三,装载进窗口的方法论在被使用期间不能降级——模型正按它干活时把它压成摘要,等于抽掉脚手架。所有厂商数字均标口径;凡对抗核查标
  partly 的一律用更正版。
sections:
- heading: 最高判据:谁决定何时用它 —— MCP 三原语的控制权分界
  body: >-
    "什么该是工具"在工业界有一份最正式的答案:MCP 协议把服务端能力分成三种原语,分界标准就一条——谁控制调用。Tools = 模型控制(模型在对话中自主发现并调用);Resources
    = 应用控制(宿主程序决定何时取来、取多少、塞不塞进窗口,模型不自主拉取);Prompts = 用户控制(用户显式触发,典型形态是斜杠命令)。这张"谁控制"表是官方规范逐字内容(对抗核查一手确认)。放到本项目:用户画像(持仓/偏好)每轮都要在场、不需要模型决定"要不要看一眼自己是谁"——它精确对应
    application-controlled resource 的语义,所以走确定性前缀注入而不做工具,这就是"万物皆工具"的例外判据:例外的理由是控制方不是模型。反过来,知识库检索做成工具是对的——检索时机由模型按对话需要决定,正是
    model-controlled。工业现状的一个注脚:三原语里 tools 的客户端采用率压倒性,resources/prompts 普遍未被客户端实现——所以"能做工具的全做工具"恰好顺着主流走,但要清楚自己在哪些地方自建了
    resource 通道(本项目的画像注入就是)。
  bullets:
  - >-
    MCP 官方判据(一手,逐字核到):模型该基于对话决策的 → tool;应用该当背景上下文喂的 → resource;用户该显式选的 → prompt。Resources
    被设计成被动只读数据源,宿主可以先用向量/关键词筛选再喂,不占模型决策轮次。
  - >-
    Claude Code 的同款分界(一手+逆向):模型决定用的是工具(读写文件/搜索/跑命令/派子代理);每轮都必须为真的事实(项目说明文件/环境信息/git
    状态)走注入不做工具——"做成工具会逼模型先调一次才知道自己是谁"。
  - >-
    判据的反面也成立:把"每轮必做且可写死"的事(如记忆与知识库之间的路由分类)做成模型决策,是把确定性工作交给概率系统——本项目重设计把原来的路由节点退役、降级为系统提示里一段启发式文案,正是把这类工作还给代码。
  - >-
    例外要付的账要认:本项目自建的画像注入通道等价于 resource,但没走 MCP resource 协议(因为客户端支持普遍缺失,务实选择)——若未来要把能力暴露给外部
    MCP 宿主,这部分不可移植。
- heading: 工具数量的红线与真杀手:语义重叠簇
  body: >-
    本项目重设计最初的工具清单有约 19 个(8 个金融只读 + 6 个记忆 + 3 个技能 + 升级提议 + 缓存取回)。调研给了一个直接的一手锚:阿里云 Model
    Studio 官方文档(qwen 自家)明确"单次请求不要传超过 20 个工具",理由是工具描述消耗大量 token、增加成本、拖慢响应、降低工具选择准确率——19
    贴着红线。但多路实证一致指出:真正的杀手不是总数,而是语义重叠簇。本项目 6 个记忆工具(archival_memory_search / recall_memory_search
    / core_memory_append…,MemGPT 谱系命名)名字和功能高度同族,正是模型最容易选错、参数最容易填错的地方;工具选择偏置研究还实测了第二个隐藏变量:模型系统性偏好列表靠前的工具。裁决:收敛,把记忆六件套合并成"统一读
    + 统一写"两个工具(用参数枚举区分动作,而不是用工具数量区分),技能三件套合并成两个,总数 19 → 14——既离红线留出余量,又把两个重叠簇直接消掉。
  bullets:
  - >-
    阿里云官方红线(一手,核查逐字确认,出处是 Model Studio 的模型能力页):"单次请求不超过 20 个工具以保证效率与成本效益"。这是 qwen
    谱系唯一的厂商一手数量口径。OpenAI 的对应口径:开场可见函数建议少于 20(官方自标"软建议");推理系列模型少于约 100 个工具/每工具少于约
    20 个参数算训练分布内——注意后者是"不会崩"的下限不是推荐值,官方同页警告限内也会有歧义混淆。
  - >-
    工具目录变大的实测退化(论文一手,摘要口径):准确率随工具数增加下降 7% 到 85%(跨模型区间);开源谱系(含 qwen 蒸馏系)在工具变多时是降幅最大档,GPT-4o
    反而最轻——分模型小数在论文正文表格,未独立复核,趋势结论承重可用。
  - >-
    语义重叠的实证(论文一手):相似工具混淆直接影响选择与参数填写;模型系统性偏好列表靠前的工具(位置偏置)。工程含义:高频工具放列表前部,缓存取回这类罕用工具垫底;合并比删除更有效——把六个记忆动作合并成两个工具的参数枚举,语义边界从"六选一"变成"二选一加参数"。
  - >-
    "总数低于 20 就安全"是错觉的另一面:真实世界多轮组合任务的会话级准确率,57 个模型没有一个超过 15%(论文一手,注意口径是端到端会话级不是单次选择)——多轮循环
    × 工具数量是乘性恶化,本项目的离线评测必须按多轮口径测,不能只看单轮选对率。
- heading: 工具规模化的五级阶梯:从命名纪律到延迟加载
  body: >-
    工具只会越来越多——新数据源(债券/期货/宏观)每个都要一个新工具。工业界对此的答案是一个按规模逐级启用的阶梯。第零级是协议卫生(任何规模都做):命名空间区隔、合并总是顺序调用的工具、描述关键规则前置、会话内绝不增删工具定义(增删一个
    = 后续所有轮次缓存全废)。第一级是静态裁剪:按场景预切工具子集(本项目的 chat 工具集合就是从全量里切出来的场景子集)。第二级是当前工业主流——延迟加载加工具检索:全部工具注册给运行时,初始上下文只装一个搜索工具加几个最常用工具的完整定义,模型需要冷门工具时先搜、命中的才展开完整定义。Anthropic
    实测(一手):五十多个工具的场景,某旗舰模型工具选择准确率从 49% 升到 74%,token 占用降约 85%;官方启用阈值是十个以上工具或定义超一万 token。第三级是检索式预筛(系统先语义检索筛工具再喂模型,工具池几百以上才考虑;代价是检索器召回不全时模型连看都看不到那个工具)。第四级是代码执行终局(工具变代码模块,模型写代码组合调用,实测一个跨系统工作流
    token 降 98.7%)。本项目裁决:直接把第二级做成一等设计——但有一个 qwen 特有的适配:Anthropic 的延迟加载是其 API 原生特性,DashScope
    没有,而 OpenAI 协议下工具参数必须在请求里声明全。所以自实现版是混合形态:工具参数三组常驻恒定(核心组带完整定义、延迟组只带名字加一句话触发描述、再加一个文档检索工具),模型要用延迟组工具时先检索其完整使用文档——文档以工具结果进消息流(只追加,不碰工具参数,不破缓存),下一圈带着文档正确调用。裸调参数错时分发层按真实定义校验、喂回"请先检索文档"的指导性错误,自纠回路接住。
  bullets:
  - >-
    这个设计解开了一个隐性矛盾:工具描述要写厚(互斥边界/反例/示例)与常驻 token 要省互相打架——现在厚的部分全部进按需检索的文档(零常驻成本),常驻的只有一句话触发描述。描述质量与
    token 预算解耦。
  - >-
    增长曲线就绪:新数据源进来 = 加一个约 50 token 的瘦条目加一份零常驻成本的文档;工具从 14 涨到 40,常驻块只涨约 1.5K token。与技能渐进披露(元数据常驻+正文按需装载)形成对称结构,一套认知覆盖工具与技能两条增长轴。
  - >-
    诚实标注:14 个工具启用延迟加载低于 Anthropic"值得"阈值的典型场景(官方口径十个以上勉强够格),代价是延迟组工具每轮首次使用多一圈检索往返;这笔账在"工具必然增长"的产品预期下成立,且机制总成本约百行代码。
  - >-
    核心组圈定靠数据不靠拍脑袋:用既有的工具调用统计(每工具月度频率)自动产出核心组调整建议,配置驱动、部署时生效、会话内不变——"哪些工具配得上完整定义常驻"变成可观测决策。
  - >-
    增长的设计纪律先于一切机制:加能力前先问它是数据源、方法论还是确定性计算——只有数据源配得上新工具名额;方法论进技能(约 100 token 元数据),计算进技能脚本(零工具名额)。
- heading: 信号工具:升级提议怎么建模,调用之后该停还是该继续
  body: >-
    "提议升级深度研究"这类能力——调用后不返回数据、只改状态/通知前端——工业界叫法不一(信号工具/控制流工具/handoff),但建模成工具是绝对主流:OpenAI
    Agents SDK 把"移交给另一个 agent"自动注册成一个特殊工具(transfer_to_<目标名>),还官方支持带结构化参数(原因/优先级/摘要);12-factor
    agents 把"找人类"也写成工具;Claude Code 的"呈递计划等批准""向用户提问"全是同构的信号工具。本项目的 offer_deep_research(reason)
    踩中这个谱系,reason 参数对齐官方范本。但调研揪出一个偏离主流的设计:草案最初让模型调完升级提议后"继续把本轮答完"——而工业界信号工具的统一语义是调用即让出(handoff
    转移控制权、12-factor 中断循环、人在环暂停整张图),靠工具返回值里一句"请收尾"的文案引导模型自律,是把编排逻辑押在概率行为上。裁决修正:调用升级提议后,循环代码强制进入收尾模式——下一圈禁止再调任何工具(tool_choice
    限制),模型只能生成收尾文字,生成完即结束;同轮第二次调用直接拒绝(幂等熔断)。收尾由代码保证,不靠模型自觉。
  bullets:
  - >-
    handoff 官方语义(一手逐字):每个移交目标自动生成 transfer_to_<名字> 工具,调用即控制权转移、无返回值给调用方;可带结构化元数据(原因/优先级/摘要)经本地校验传给回调。这是"委托建模成工具"最干净的官方样板。
  - >-
    信号工具的返回值文案是设计点不是细节:返回空字符串或"好的"会让模型困惑(静默成功漂移),返回指令性文案("请收尾")可能触发模型继续长篇生成。更稳的做法:返回纯状态语义("升级已提议;本轮工具通道已关闭"),配合循环层的确定性限制。
  - >-
    幂等是信号工具的必修课:委托类工具的头号失败模式是回环(来回无限委托,CrewAI 官方点名"委托循环");本项目升级提议同轮只许一次,第二次调用直接拒——熔断在循环代码里,不在提示词里。
  - >-
    "该不该调"恰是函数调用公认最弱项:不该调时正确弃权的准确率,最差案例不到 7%(基准二手转述口径)。所以升级提议必须单独评测两个方向——该升级时升了吗(轻问题乱升级吗)——离线金标准 case 双指标分桶。
- heading: 记忆接线:工具还是注入,按三个维度切
  body: >-
    记忆系统接进 agent loop,工业界分两派:MemGPT/Letta 把记忆读写全做工具(模型自管,最灵活),代价是"模型忘了查/忘了存就丢了"(官方原话承认);ChatGPT
    走全自动注入(后台检索拼进系统提示),零摩擦但模型没有主动控制。调研收敛出三个切分维度:一看失败可容忍度——"这轮漏读会直接答错"的内容(画像/持仓/风险偏好)必须确定性注入,不能赌模型主动;二看频率与稳定性——高频且会话内稳定的注入,长尾/情景式的做检索工具;三看探索价值——需要模型按线索深挖的做工具(just-in-time)。Anthropic
    官方背书的就是混合:开场预载一部分求快,其余让模型自主探索。本项目的双轨(画像开场注入冻结 + 长尾记忆做检索工具)正是这个混合,调研全票背书;同时给了两个收紧:画像里会过期的数字(现价/市值)不进冻结前缀——"会变的"恰好落在"该做工具"那一侧,走只读行情工具实时取;纯工具派的"模型忘了查"必须有兜底——靠系统提示纪律("涉及持仓/偏好/历史观点先查记忆")加离线评测守护,而不是强制模型每轮首调搜索(强制调用时模型会给参数瞎编值,搜索词是编的召回就塌)。
  bullets:
  - >-
    工具派的根本失败模式有官方自认(Letta 一手):"记忆质量完全取决于模型的判断,模型没存的就丢了"。Anthropic 自家记忆工具的对冲是往系统提示硬塞"做任何事之前必须先看记忆目录"——等于承认裸工具不可靠。
  - >-
    "漏读"风险的最接近量化(论文一手,口径要小心):长期记忆基准里,记忆类错误的 72% 源于"检索不完整"——注意这是端到端召回质量的代理指标,不能宣称"模型 72% 的时间忘了调工具"。
  - >-
    注入派做好了的上限(论文一手):时序知识图谱记忆系统实测平均上下文从约 11.5 万 token 降到 1600、延迟降九成、准确率反升——前提是检索精度高;检索不准时注入的是干扰项,比不注入更糟。
  - >-
    本项目场景的双轨落点:用户问"今天新能源板块怎么样"——画像(持有宁德时代)已在前缀,模型直接结合;用户问"上个月我说过想加仓哪只来着"——长尾情景,模型调记忆搜索工具;用户问"美联储议息什么时候"——跟持仓无关,什么记忆都不注入不检索,这正是检索式相对每轮强制注入省下的部分。
- heading: 技能接线:渐进披露三级、装载内容的生命周期、该装载没装载
  body: >-
    技能(打包好的领域方法论+资源+脚本)怎么接,Anthropic Agent Skills 是最成熟的标准:三级渐进披露——元数据级(技能名+触发描述,约
    100 token 一个,常驻系统提示)、正文级(方法论全文,官方建议 5 千 token / 500 行以内,触发时装载)、资源与脚本级(几乎无上限,按需取/执行,脚本源码永不进窗口只回输出)。装载机制有个容易想当然的细节(核查专门确认):API
    形态下模型是用 bash 读文件,Claude Code 形态下有一个专门的 Skill 工具(只收技能名一个参数)——本项目没有给模型文件系统,用 load_skill
    工具装载是对官方机制的正确"翻译"。最重要的工业经验是装载内容的生命周期:官方语义是正文装载后"留在会话里贯穿任务",Claude Code 的压缩机制给每个已装载技能保留前
    5000 token、所有重挂技能共享 25000 token 预算——而本项目草案最初允许把装载的方法论当普通工具结果降级成摘要,被三路调研一致判为最危险设计:模型正按方法论第四步查财报时把方法论压掉,等于抽掉脚手架。修正:活跃技能的方法论不降级,只有切换到别的技能后才降,降级时硬规则条款保留原文,并配"这是历史方法论勿重新执行"的标记。另一个反直觉澄清(官方一手):技能"失效"通常不是内容被压掉,而是模型选择了别的做法——第一对策是强化触发描述,不是重装。
  bullets:
  - >-
    触发描述是技能系统唯一的发现信号,写法有官方铁律(一手):第三人称;同时写"做什么+何时用"并含触发词(本项目风险评估技能的描述要写成"当用户问持仓风险/集中度/回撤/敞口时使用",不是"风险评估方法论");禁第一二人称("我可以帮你…"会污染系统提示导致发现问题)。
  - >-
    "该装载没装载"是模型自主装载范式的固有难题(竞品信号:OpenHands 把"让模型自主触发微代理"的提案关闭为不计划做)。守护三道:触发描述工程;触发离线评测(每技能至少
    3 条金标准 query,正例加"共享关键词但不该触发"的近似负例,训练/验证切分防过拟合——官方评测先行方法论现成);高确定场景可加确定性兜底提示(中文场景子串匹配召回差,要用语义触发或先不做)。
  - >-
    工具粒度的收敛(多路一致):读方法论和读附属资源都是"读静态内容",合并成一个装载工具(资源参数可选,返回正文时顺带附资源清单当目录页,省一次发现调用;资源引用强制一级深——嵌套引用会被预览式读取读残,官方点名坑);跑脚本语义不同(副作用+返回码),独立保留。
  - >-
    脚本执行的契约(官方一手):脚本源码永不进窗口,只有标准输出回流;失败回喂要结构化(标准输出/标准错误/返回码三元组+错误码枚举),让模型区分"逻辑错该改参数"和"超时超限该换策略";脚本内部自带错误处理,官方反模式是把裸异常甩给模型收拾;大输出强制写缓存返回摘要加取回键,契约保证不靠模型自觉。
dimensions_meta:
  title: 7 个接线设计决策 · 每个配一个真实场景
  labels:
    setup: 场景
    question: 怎么做
    good: 好做法
    bad: 翻车点
    scored: 怎么判断 · 谁在用
dimensions:
- name: 工具还是注入:控制权判据
  plain: 一个周边能力接进循环的第一问——由模型在对话中决定何时用它,还是由代码决定何时给模型看。
  setup: >-
    用户画像(持仓宁德时代、偏好白马股)几乎每轮回答都要参考;知识库里的研报片段只有特定问题才需要。这两个能力分别怎么接?
  question: 什么做成工具,什么做成注入?
  good: >-
    按"谁决定何时用它"切:知识库检索的时机由模型按对话需要决定 → 工具(模型自主调 kb_search);画像每轮都要在场、不需要模型决策 → 代码确定性注入稳定前缀(会话内冻结)。这正是
    MCP 三原语的官方分界:模型控制的是 tool,应用控制的是 resource。画像做注入还有第二重理由:做成工具会逼模型先调一次才知道用户是谁(Claude
    Code 把项目说明/环境信息走注入,同款判断),且每轮重复调用纯属浪费。
  bad: >-
    把画像做成 get_persona 工具——模型每轮多一次"要不要查画像"的决策(凭空增加一次该调没调的失败面),漏调直接答错;反过来把知识库检索做成每轮强制注入——无关轮次白占
    token,检索不准时等于主动喂干扰项(实证:单个相似但不对的材料就降分)。
  scored: >-
    判据口径:MCP 官方规范"谁控制它"表(一手逐字)。谁在用:MCP 生态(tools 采用率压倒性,resources 客户端支持普遍缺失——所以自建注入通道是务实主流)、Claude
    Code(事实走注入、能力走工具)、本项目重设计(画像注入+检索工具双轨)。
- name: 工具数量治理:合并语义重叠簇
  plain: 工具清单不是越全越好——总数有厂商红线,而真正杀准确率的是一簇名字功能都相近的工具。
  setup: >-
    重设计最初的清单约 19 个工具,其中记忆类 6 个(archival_memory_search / recall_memory_search / core_memory_append
    / core_memory_replace / archival_memory_insert / 图谱遍历),名字高度同族;技能类 3 个(装载方法论/装载资源/跑脚本)。
  question: 19 个工具对 qwen 是多是少?怎么收?
  good: >-
    先对锚:阿里云官方红线"单次不超过 20 个"(qwen 自家一手),19 贴线。再看结构:合并语义重叠簇比砍总数有效——记忆六件套合并成统一读(memory_search
    带范围参数)+ 统一写(memory_write 带动作枚举)两个;技能三件套合并成装载(资源参数可选)+ 跑脚本两个;总数 19 → 14,两个混淆簇消失。列表排序也是超参:高频工具放前(位置偏置实证:模型偏好列表靠前项),罕用的缓存取回垫底。
  bad: >-
    只盯总数不看结构——"19 小于 20 所以安全"是错觉,六个记忆工具内部的选错率才是真实损耗;或反向过度设计——上动态工具加载/检索(那是几十上百工具才值得的方案,Anthropic
    官方口径:10 个以下工具不值得,且引入"会话内工具集变化"破坏缓存与模型预期)。
  scored: >-
    口径:阿里云 Model Studio 官方"不超过 20"(一手);OpenAI"开场少于 20(软建议)"(一手);工具目录增大准确率掉 7%-85%(论文一手摘要,开源谱系最脆);相似工具混淆+位置偏置(论文一手)。谁在用:Anthropic(合并原则:总是顺序调用的工具该合并)、OpenAI(命名空间内少于
    10 个函数)、本项目重设计(19→14)。
- name: 信号工具:升级提议的收尾语义
  plain: 调用后不返回数据、只改状态通知外界的工具(提议升级深度研究)——调完之后模型该停还是该继续,由谁保证。
  setup: >-
    用户问"帮我全面研究下宁德时代值不值得投",模型判断超出 chat 深度,调用 offer_deep_research(reason="需要多模型估值交叉验证")。前端要弹升级确认框,深度研究是另一条重流水线。此刻模型自己怎么办?
  question: 信号工具调用后的控制流怎么设计?
  good: >-
    建模成工具是主流(handoff 谱系:移交/找人/提计划全是工具),reason 参数对齐官方范本。关键是收尾语义由代码保证:调用后循环强制进入收尾模式——下一圈禁止再调任何工具,模型只能生成一段收尾文字(给用户一个简版观点),生成完即结束本轮;同轮第二次调用直接拒绝(幂等熔断)。工具返回值用纯状态语义("升级已提议;本轮工具通道已关闭"),不写指令性文案。
  bad: >-
    靠工具返回值里"请先收尾本轮回答"的文案让模型自律——把编排逻辑押在概率行为上,模型可能发完升级信号又继续调工具、或把"已升级"当成继续深挖的理由(信号与行动错位);或返回值只写"ok"——静默成功漂移,模型困惑重复调用;或不做幂等——同轮连发三次升级提议,前端弹三个框。
  scored: >-
    工业对照:handoff 调用即控制权转移、12-factor 找人工具调用即中断循环、人在环调用即暂停——"调用即让出"是统一语义(均一手)。评测专项:升级提议单列"该调时调没调/不该调时弃权没弃权"双指标——后者是函数调用公认最弱项(最差案例不到
    7%,二手转述口径)。谁在用:OpenAI Agents SDK、12-factor agents、Claude Code(提计划/提问工具)、本项目重设计(熔断收尾版)。
- name: 记忆双轨:注入与工具的切分线
  plain: 哪类记忆开场注入、哪类做成检索工具——三个维度切,不是二选一站队。
  setup: >-
    记忆系统里存着:用户持仓与偏好(几乎每轮相关)、上个月某次加仓讨论的结论(偶尔相关)、用户三个月前说过的一句风险顾虑(长尾)。用户这轮问"今天新能源板块怎么样"。
  question: 这三类记忆分别怎么进窗口?
  good: >-
    三维度切分:失败可容忍度(漏读即答错的 → 注入:持仓偏好画像开场进稳定前缀,会话内冻结)、频率稳定性(高频稳定 → 注入;长尾情景 → 工具:加仓讨论、风险顾虑做
    memory_search 按需查)、是否会变(会过期的现价/市值不进冻结前缀,走只读行情工具实时取)。系统提示写明纪律:涉及持仓/偏好/历史观点先查记忆。这是
    Anthropic 官方背书的混合:开场预载求快,其余模型自主探索。
  bad: >-
    全做工具——踩"模型忘了查"的坑(工具派官方自认:模型没存的就丢了;对冲只能靠系统提示硬塞"先看记忆"指令);全自动注入——无关轮次白占 token、检索不准时主动喂干扰项;用"强制模型每轮首调记忆搜索"治忘查——强制调用时模型给搜索参数瞎编值,召回塌;画像里嵌会过期的行情数字——冻结前缀与真实持仓漂移。
  scored: >-
    两派上限与代价的实测:注入派做好了平均上下文 11.5 万降到 1600 token、延迟降九成(论文一手);工具派每圈花推理预算做记忆家务、循环变慢(MemGPT
    论文点名)。"漏读"风险代理:记忆类错误 72% 源于检索不完整(论文一手,端到端口径)。谁在用:MemGPT/Letta(全工具)、ChatGPT(全注入)、Anthropic
    记忆工具+Zep/Mem0(各占一派)、本项目重设计(三维度混合)。
- name: 技能渐进披露:元数据常驻,正文按需
  plain: 几个到几十个技能(打包的领域方法论),怎么让模型既知道它们存在、又不为没用到的付 token。
  setup: >-
    本项目有 7 个技能(风险评估/财报分析方法论等)。用户问"帮我评估下持仓的风险敞口"——模型要先意识到风险评估技能存在,装载它的方法论,再按方法论调财报/行情/公告工具。
  question: 技能清单和正文分别放哪?怎么保证该装载时装载?
  good: >-
    三级渐进披露(对标 Agent Skills 标准):元数据级(技能名+触发描述,约 100 token 一个,官方口径)常驻稳定前缀——7 个共约 700
    token,远低于任何拐点,这个规模上检索化反而有害(白加一轮往返);正文级(方法论全文,5 千 token/500 行以内)由模型调装载工具按需取;资源脚本级按需。触发描述写成触发判据("当用户问持仓风险/集中度/回撤/敞口时使用"),第三人称,技能间边界互斥。守护"该装载没装载":每技能至少
    3 条金标准 query(含共享关键词的近似负例)做触发离线评测;清单生成抽成函数,写死逃生口——技能涨到十几个或选错率抬头时切两层(高频常驻+其余检索)。
  bad: >-
    触发描述写成功能介绍("风险评估方法论")——模型不知道何时该用,该触发不触发;全部技能正文常驻——为没用到的方法论付 token 税(竞品硬约束的来源:某产品规则字符上限、某产品建议常驻规则只留一两条);7
    个技能就上 embedding 检索——过早优化,检索器召回不全比模型漏选更隐蔽;描述把失败 query 的关键词硬塞进去——过拟合,换个说法就崩(官方要求训练/验证切分)。
  scored: >-
    官方口径:元数据约 100 token/技能、正文 5 千 token 内、清单预算为窗口 1%(溢出时保名字丢低频描述)——全部一手核到。装载载体核查澄清:API
    形态是模型用 bash 读文件,Claude Code 形态是专门的 Skill 工具(单参数)——本项目无文件系统给模型,装载工具是正确翻译。谁在用:Claude
    Agent Skills(标准)、Claude Code(运行时)、OpenHands 微代理(触发式对照)、Cursor 规则(四种触发模式对照)、本项目技能系统。
- name: 装载内容的生命周期:活跃方法论不降级
  plain: 技能方法论装进窗口后,什么时候可以被压缩降级——答案是"在它还在指导工作时,绝不"。
  setup: >-
    模型装载了风险评估方法论,正按它第四步逐只查持仓股财报;此时本轮工具结果堆积,窗口压力到了降级阈值,降级逻辑扫到"最老的大块内容"——恰好是那份方法论。
  question: 方法论该被降级成摘要吗?
  good: >-
    按生命周期降级,不按窗口压力一刀切:当前活跃技能的方法论全文常驻(官方语义:正文装载后留在会话里贯穿任务);只有明确切换到别的技能后,旧方法论才降级;降级时硬规则条款(必须排除一次性损益这类
    MUST 约束)保留原文不糊成一句话;降级后配标记"这是历史方法论,勿重新执行其中步骤"(防模型把旧步骤当新指令重跑);压缩场景给每技能定量保留预算(参照:每技能保前
    5000 token、共享 25000,官方一手)。
  bad: >-
    把方法论当普通工具结果按"老了就降"的统一策略处理——模型干到第四步时脚手架被抽掉,实测失效模式正是"触发了但漏掉关键规则"(官方点名:某模型写查询时忘了过滤测试账号,尽管方法论里写了);或者反过来误判失效原因——官方澄清:技能失效通常不是内容被压掉,而是模型选了别的做法,第一对策是强化描述与指令,不是重装。
  scored: >-
    官方生命周期口径(一手逐字):正文"作为单条消息进对话并贯穿整个会话,后续轮次不再重读";压缩后重挂最近调用的技能,每个保前 5000 token、共享 25000,老技能可能被整个丢弃。谁在用:Claude
    Code(生命周期+压缩预算+历史技能提醒三件套)、OpenHands(方法论拼进系统提示常驻不降级)、本项目重设计(活跃锁+硬规则保留+历史标记)。
- name: 脚本执行:确定性步骤写成代码
  plain: 技能里可复用的确定性计算(估值公式/数据清洗)写成脚本由模型触发执行——比让模型照文字一步步算更稳更省。
  setup: >-
    风险评估技能带一个集中度计算脚本。模型装载方法论后调用跑脚本工具执行它;某次脚本因为输入数据缺列失败了。
  question: 脚本怎么执行、失败怎么回喂?
  good: >-
    脚本源码永不进窗口,只有输出回流(官方核心设计:用 token 生成排序算法远贵于直接跑算法,且确定性可靠);失败回喂结构化:标准输出/标准错误/返回码三元组+错误码枚举(超时/输出超限单列),模型能区分"逻辑错该改参数"(看标准错误)和"超限该换策略";脚本内部自带错误处理,打印可读的错误信息;大输出强制写缓存、返回摘要+取回键(契约保证);跑脚本工具独立成工具(执行语义与读内容完全不同,不并入装载工具)。
  bad: >-
    脚本把裸异常甩给模型收拾(官方反模式:返回原始堆栈,模型容易乱修);脚本里写无注释的魔法常数(官方:你都不知道对的值,模型怎么知道);方法论里不写清"运行这个脚本"还是"参考这个脚本的算法"——模型把脚本源码读进窗口浪费
    token,或该跑的没跑;大结果直接打印——撞输出超限,且窗口被一次性灌爆。
  scored: >-
    官方契约(一手):执行经 bash、"只有脚本输出消耗 token";返回结构带标准输出/标准错误/返回码(0 成功);错误码枚举含执行超时/输出过大。对比:某竞品代码解释器是"模型现写代码再跑"、会话过期不可恢复——预制脚本作为版本化技能资产复用是本质差异。谁在用:Claude
    Skills(脚本目录+验证回环)、本项目技能系统(执行器+白名单,重设计补结构化回喂)。
benchmarks_title: 代表系统 / 方法 · 周边接线机制速览
benchmarks:
- name: MCP 三原语(协议规范)
  what: >-
    服务端能力按控制方分三类:Tools=模型控制(自主发现调用)/ Resources=应用控制(宿主决定取与喂,被动只读,可先筛后喂)/ Prompts=用户控制(显式触发,斜杠命令形态)。官方"谁控制它"表是分界的最高判据(一手逐字核到)。
  fit: >-
    "万物皆工具,例外要有理由"的例外判据来源:本项目画像注入的例外理由就是"它是应用控制不是模型控制"。注:resources/prompts 客户端支持普遍缺失,自建注入通道是务实主流。
- name: Claude Code 工具版图 + Tool Search
  what: >-
    最成熟的"万物皆工具"样本:模型决策的能力全是工具(几十个),每轮必真的事实走注入,确定性约束走钩子(执行前允许/拒绝)。工具多了官方自己也扛不住——Tool
    Search 把冷门工具延迟加载,大工具库上 Opus 4 选择准确率 49%→74%(官方一手),token 削减约 85%。
  fit: >-
    "工具不是免费的"的官方自证。本项目 14 个工具不需要延迟加载(官方口径 10 个以下不值得),"会话内工具集稳定"反而比 Claude Code 现状更保守安全。
- name: OpenAI 工具设计指南 + handoff
  what: >-
    开场可见函数建议少于 20(软建议);推理系列少于约 100 工具/20 参数算分布内(下限非推荐);命名空间内少于 10 个函数;关键规则前置的描述写法在内部评测高
    6%(单工具案例,方向承重);"总是顺序调用的工具该合并";handoff 把委托建模成 transfer_to_X 特殊工具,带结构化原因参数(全一手)。
  fit: >-
    工具数量治理与信号工具的双重官方范本。本项目 19→14 的合并、offer_deep_research 的 reason 参数、描述前置关键规则全部对标。
- name: Anthropic Agent Skills(标准)+ Claude Code skill 运行时
  what: >-
    三级渐进披露:元数据约 100 token/技能常驻、正文 5 千 token 内触发装载、资源脚本几乎无上限按需。运行时细节(一手核到):清单预算为窗口
    1%(溢出保名字丢低频描述);正文装载后贯穿会话不重读;压缩时每技能保前 5000 token、共享 25000,老技能整个丢弃并配"历史技能勿重执行"提醒;触发描述写法整章铁律(第三人称/做什么+何时用/评测先行)。
  fit: >-
    本项目技能系统的直接蓝本:装载工具=官方 Skill 工具的翻译;活跃方法论不降级、降级配历史标记、触发评测三件套全部从这里抄。预算数字(1%/5000/25000)可直接参考。
- name: 竞品规则系统(OpenHands 微代理 / Cursor 规则 / Copilot 指令)
  what: >-
    第三种载体"触发式"的代表:规则引擎按关键词/文件路径/语义匹配决定装载,模型完全被动。OpenHands 关键词命中才拼进系统提示,且"让模型自主触发"的提案被官方关闭为不计划做;Cursor
    四种触发模式(永远/路径匹配/模型自判/手动),社区共识永远注入的规则只留一两条。
  fit: >-
    对照系:本项目选了"模型自主装载"(概率性),放弃了触发式的确定性——这是真实代价,所以触发评测是必修;中文场景子串匹配召回差,确定性兜底要用语义触发。
- name: Voyager 技能库(学术原型)
  what: >-
    技能=可执行代码,索引键=技能描述的向量;新任务把"计划+环境反馈"拼成查询做相似度检索,取最相近五个技能注入。被检索的是描述不是代码;执行确定性、检索语义近似,两者解耦(论文一手)。
  fit: >-
    技能规模化的退路原型:本项目 7 个技能远不需要,但"清单生成抽成函数、写死切检索的逃生口"的设计预埋正是为了这条路。
- name: 工具数量实证三件套(LongFuncEval / RAG-MCP / BiasBusters)
  what: >-
    工具目录增大准确率掉 7%-85%、开源谱系最脆(一手摘要);全量塞工具基线选择准确率 13.62%、检索后 43.13%(一手,基座恰是 qwen-max,窄域勿外推绝对值);相似工具混淆+位置偏置(模型偏好列表靠前项)是两个独立损耗源(一手)。
  fit: >-
    "19 贴线该收敛"的实证地基;也是本项目离线评测的方法论来源(AST 比对+该调时调/不该调时弃权双指标+按工具簇分桶)。
- name: 12-factor agents(找人即工具)+ 记忆两派(MemGPT vs ChatGPT)
  what: >-
    找人类写成结构化工具(意图/问题/紧急度/格式),调用即中断循环等回复(一手;社区流传的"三次失败就升级"是衍生说法,不在官方内容里)。记忆两派:MemGPT
    全工具自管(灵活但模型忘了存就丢)vs ChatGPT 全自动注入(零摩擦但无主动控制)。
  fit: >-
    信号工具"调用即让出"语义与记忆三维度切分的谱系来源。本项目升级提议的熔断收尾、记忆双轨混合都在两派之间取了有据可依的中间位。
pitfalls:
- >-
  把"每轮必真的事实"做成工具——模型得先调一次才知道用户是谁,漏调直接答错,每轮重复调用纯浪费。画像/持仓这类内容走确定性注入,这是"万物皆工具"最重要的例外。
- >-
  只盯工具总数不看语义重叠簇——"19 小于 20 所以安全"是错觉,六个名字相近的记忆工具内部的选错率才是真实损耗;合并成"统一读+统一写带参数枚举"比纠结总数有效。
- >-
  信号工具靠返回值文案让模型自律收尾——模型可能发完升级信号又继续调工具(信号与行动错位)。收尾语义必须由循环代码保证(下一圈禁调工具),不靠提示词。
- >-
  信号工具不做幂等——模型同轮连调三次升级提议,前端弹三个确认框。同轮第二次调用直接拒绝,熔断写在分发层。
- >-
  强制模型每轮首调记忆搜索来治"忘了查"——强制调用时模型给必填参数瞎编值,搜索词是编的、召回就塌。画像兜底用确定性注入,纪律性检索靠系统提示引导加评测守护。
- >-
  装载中的方法论被当普通内容降级——模型正按它第四步干活时脚手架被抽掉,实测失效模式是"触发了但漏掉关键规则"(查财报忘了排除一次性损益)。活跃技能不降级,降级按技能切换边界。
- >-
  技能触发描述写成功能介绍——"风险评估方法论"模型不知道何时用;要写触发判据"当用户问持仓风险/集中度/回撤/敞口时使用",第三人称,技能间边界互斥。
- >-
  误判技能失效原因——官方澄清:失效通常不是内容被压掉,而是模型选了别的做法;第一对策是强化描述与指令,不是重装,更不是给降级背锅。
- >-
  脚本把裸异常甩给模型——模型对着原始堆栈乱修。脚本内部自带错误处理,回喂带标准输出/标准错误/返回码三元组,超时和超限单列错误码。
- >-
  会话中途增删工具定义——工具定义紧跟系统提示序列化,增删一个等于后续所有轮次缓存全废,还让模型看到指向已消失工具的历史而困惑。场景化限制用调用约束,不真删。
- >-
  七个技能就上向量检索选技能——过早优化:这个规模检索化白加一轮往返,且检索器召回不全比模型漏选更隐蔽(模型连看都看不到)。逃生口写死在"技能数到十几个或选错率抬头"再切。
gaps:
- component: chat 重设计草案 · 工具清单总量与重叠簇
  current: >-
    最初清单约 19 个工具:8 个金融只读 + 6 个记忆(MemGPT 谱系命名高度同族)+ 3 个技能 + 升级提议 + 缓存取回。贴着 qwen 官方"单次不超过
    20 个"的红线,且含两个语义重叠簇。
  suggestion: >-
    已收敛到 14 个:记忆六件套合并成统一读(范围参数)+ 统一写(动作枚举)两个;技能三件套合并成装载(资源参数可选,返回正文顺带资源清单)+ 跑脚本两个。列表排序按位置偏置调:高频在前、缓存取回垫底。每个工具的描述写"何时用+何时不用(反例)",关键规则前置。
- component: chat 重设计草案 · 升级提议工具的收尾语义
  current: >-
    最初设计:模型调用升级提议工具后,工具返回"已提议升级,请先收尾本轮回答",模型继续在同轮自由生成收尾。
  suggestion: >-
    偏离工业统一语义(调用即让出:移交转控制权/找人中断循环/人在环暂停)。已改:调用后循环代码强制进入收尾模式——下一圈禁止再调任何工具,模型只能生成收尾文字,生成完即结束;同轮第二次调用直接拒绝(幂等熔断);返回值改纯状态语义。收尾由代码保证,不靠模型自觉。
- component: chat 重设计草案 · 活跃技能方法论的降级保护
  current: >-
    最初设计把装载的技能方法论当普通工具结果对待——超过窗口压力阈值后老内容统一降级成摘要加缓存键。
  suggestion: >-
    三路调研一致判为最危险设计。已改:降级粒度按技能生命周期——当前任务活跃技能的方法论全文常驻,切换技能后旧方法论才降级;降级时硬规则条款保留原文;配"历史方法论勿重新执行"标记;压缩场景参照官方预算(每技能保前
    5000 token、共享 25000)。另吸收官方澄清:失效通常是模型选了别的路而非内容被压,第一对策是强化触发描述。
- component: chat 重设计草案 · 技能触发守护
  current: 最初草案对"该装载没装载"没有任何守护机制,纯靠模型自主。
  suggestion: >-
    补三道:触发描述工程(第三人称+触发词+互斥边界);触发离线评测(每技能至少 3 条金标准 query,含共享关键词的近似负例,训练/验证切分防过拟合,接进现有评测跑批);尾部动态区可选确定性兜底提示(对齐
    Claude Code 每轮"与你任务相关的技能"提醒;中文场景不用子串匹配,用语义触发或先不做)。清单生成抽成函数,写死切两层检索的逃生口。
- component: chat 重设计草案 · 画像冻结范围
  current: 最初设计把用户画像(含持仓)整体注入稳定前缀并会话内冻结。
  suggestion: >-
    收紧:冻结前缀只放稳定部分(偏好/风险画像/持仓标的清单);会过期的数字(现价/市值)不进前缀,走只读行情工具实时取——"会变的"落在"该做工具"一侧。用户会话中途改持仓
    → 刷新走新轮次边界,不回改已缓存段。
- component: chat 重设计草案 · 脚本失败回喂
  current: 最初草案只说跑脚本工具包装现有执行器(带白名单),没定义失败怎么回喂模型。
  suggestion: >-
    补契约:回喂显式带标准输出/标准错误/返回码三元组,超时/输出超限映射成独立错误码(模型据此区分"逻辑错改参数"和"超限换策略");脚本内部自带错误处理打印可读信息(官方反模式:裸异常甩给模型);大输出强制写缓存返回摘要加取回键,契约保证不靠模型自觉。
- component: chat 重设计草案 · 工具增长的渐进披露
  current: >-
    最初草案对工具增长只留了分级逃生口(语义簇合并→检索化),没有一等机制;用户裁决工具必然越来越多,要求把延迟加载加工具检索做成一等设计。
  suggestion: >-
    已升格:工具参数三组常驻恒定——核心组六个带完整定义(高频数据工具+控制关键工具)、延迟组八个只带名字加一句话触发描述、外加一个文档检索工具;模型用延迟组工具先检索完整使用文档(文档以工具结果进消息流,不碰工具参数不破缓存);裸调参数错由分发层校验喂回指导。配套:冒烟测试加验瘦定义在
    DashScope 的接受度;评测加三类金标准 case(该搜先搜/裸调自纠/核心组直调不滥搜);核心组按工具调用统计数据驱动调整。
- component: chat 重设计草案 · 离线评测的工具选择专项
  current: 原评测计划只有端到端对话质量评测,没有工具选择层的专项度量。
  suggestion: >-
    补一组针对 qwen 的工具选择离线评测:不真跑工具,比对模型输出的调用与金标准的结构等价(函数名+参数);分桶度量"该调时调没调"和"不该调时弃权没弃权"(升级提议单列后者——函数调用公认最弱项);按工具簇分桶看混淆率(记忆/知识库两类各自的命中);多轮口径必测(真实世界多轮组合任务的会话级准确率,57
    个模型没有一个超过 15%——单轮选对不代表多轮不崩)。
