# ----------------------------------------------------------------------------
# 来源:2026-06-03 Workflow 9 路并行联网调研(canonical loop/ReAct / workflow-vs-
# agent / OpenAI Agents SDK / LangGraph / 上下文工程·compaction / 流式·打断·
# steering / 12-factor agents / 反思·自纠 / plan-execute·早期自治教训)+ 63 条
# 承重结论逐条对抗式事实核查(confirmed 45 / partly+refuted 18,凡 partly 一律
# 用更正版)+ 对照本项目自己的 chat 子图 agent loop。
