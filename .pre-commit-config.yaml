repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: commit-msg-layer
        name: commit-msg layer validator (impl/plan/spec)
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        always_run: true
      - id: check-cassette-sanitize
        name: Check that cassettes contain no live credentials
        entry: uv run python scripts/check_cassette_sanitize.py
        language: system
        files: ^backend/tests/fixtures/cassettes/.*\.ya?ml$
        pass_filenames: true
