repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: commit-msg-layer
        name: commit-msg layer validator (impl/plan/spec)
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        always_run: true
