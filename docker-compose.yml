# Run Control Plane services are opt-in: use --profile run-control. The
# default postgres/redis services remain available for the rest of the project.
services:
  run-control-init:
    profiles: ["run-control"]
    labels: &run-control-labels
      com.openai.run-control-plane: "true"
    build:
      context: .
      dockerfile: Dockerfile.run-control
      args: &run-control-build-args
        PYTHON_IMAGE: ${RUN_CONTROL_PYTHON_IMAGE:-python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7}
        PIP_INDEX_URL: ${RUN_CONTROL_PIP_INDEX_URL:-https://pypi.org/simple}
    image: &run-control-image ${RUN_CONTROL_IMAGE:-financial-research-run-control:latest}
    command: ["python", "-m", "app.processes.run_control_init"]
    environment: &run-control-environment
      POSTGRES_USER: ${RUN_CONTROL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RUN_CONTROL_POSTGRES_PASSWORD:-postgres123}
      POSTGRES_HOST: ${RUN_CONTROL_POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${RUN_CONTROL_POSTGRES_PORT:-5432}
      POSTGRES_DB: ${RUN_CONTROL_POSTGRES_DB:-industry_assistant}
      REDIS_URL: ${RUN_CONTROL_REDIS_URL:-redis://redis:6379/0}
      RUN_HEARTBEAT_TTL_SECONDS: ${RUN_HEARTBEAT_TTL_SECONDS:-3}
      RUN_HEARTBEAT_INTERVAL_SECONDS: ${RUN_HEARTBEAT_INTERVAL_SECONDS:-0.5}
      RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-3}
      RUN_RENEW_INTERVAL_SECONDS: ${RUN_RENEW_INTERVAL_SECONDS:-0.5}
      RUN_POLL_INTERVAL_SECONDS: ${RUN_POLL_INTERVAL_SECONDS:-0.2}
      RUN_WORKER_CAPACITY: ${RUN_WORKER_CAPACITY:-1}
      # Phase 2 failure-injection suites retain the deterministic default;
      # Phase 3 live/cassette acceptance opts into the production chat executor.
      RUN_EXECUTOR_MODE: ${RUN_EXECUTOR_MODE:-simulated}
      RUN_SIMULATED_DELAY_SECONDS: ${RUN_SIMULATED_DELAY_SECONDS:-0.5}
      RUN_TOOL_RISK_CATALOG: ${RUN_TOOL_RISK_CATALOG:-v1}
      RUN_SAFE_IDEMPOTENT_TOOLS: ${RUN_SAFE_IDEMPOTENT_TOOLS:-search_tools,memory_search,read_cached_result,get_stock_quote,get_portfolio_positions,approval,get_paper_account,list_paper_orders,get_paper_order,manage_watchlist}
      RUN_CONTROL_MINIMAL_IMPORTS: "1"
      RUN_HEALTH_MAX_AGE_SECONDS: ${RUN_HEALTH_MAX_AGE_SECONDS:-3}
      RUN_HEALTH_DEPENDENCY_MAX_AGE_SECONDS: ${RUN_HEALTH_DEPENDENCY_MAX_AGE_SECONDS:-2}
      JWT_SECRET_KEY: ${RUN_CONTROL_JWT_SECRET_KEY:-run-control-isolated-secret-not-for-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - industry_network

  run-scheduler-a:
    profiles: ["run-control"]
    labels: *run-control-labels
    build:
      context: .
      dockerfile: Dockerfile.run-control
      args: *run-control-build-args
    image: *run-control-image
    command: ["python", "-m", "app.processes.run_scheduler"]
    environment: *run-control-environment
    depends_on:
      run-control-init:
        condition: service_completed_successfully
    healthcheck: &run-control-healthcheck
      test: ["CMD", "python", "-S", "/opt/run-control/backend/app/processes/health_probe.py"]
      interval: 2s
      timeout: 3s
      retries: 3
    stop_grace_period: 10s
    restart: unless-stopped
    networks: [industry_network]

  run-scheduler-b:
    profiles: ["run-control"]
    labels: *run-control-labels
    build:
      context: .
      dockerfile: Dockerfile.run-control
      args: *run-control-build-args
    image: *run-control-image
    command: ["python", "-m", "app.processes.run_scheduler"]
    environment: *run-control-environment
    depends_on:
      run-control-init:
        condition: service_completed_successfully
    healthcheck: *run-control-healthcheck
    stop_grace_period: 10s
    restart: unless-stopped
    networks: [industry_network]

  run-dispatcher:
    profiles: ["run-control"]
    labels: *run-control-labels
    build:
      context: .
      dockerfile: Dockerfile.run-control
      args: *run-control-build-args
    image: *run-control-image
    command: ["python", "-m", "app.processes.run_dispatcher"]
    environment: *run-control-environment
    depends_on:
      run-control-init:
        condition: service_completed_successfully
    healthcheck: *run-control-healthcheck
    stop_grace_period: 10s
    restart: unless-stopped
    networks: [industry_network]

  run-worker-a:
    profiles: ["run-control"]
    labels: *run-control-labels
    build:
      context: .
      dockerfile: Dockerfile.run-control
      args: *run-control-build-args
    image: *run-control-image
    command: ["python", "-m", "app.processes.run_worker"]
    environment: *run-control-environment
    depends_on:
      run-control-init:
        condition: service_completed_successfully
    healthcheck: *run-control-healthcheck
    stop_grace_period: 10s
    restart: unless-stopped
    networks: [industry_network]

  run-worker-b:
    profiles: ["run-control"]
    labels: *run-control-labels
    build:
      context: .
      dockerfile: Dockerfile.run-control
      args: *run-control-build-args
    image: *run-control-image
    command: ["python", "-m", "app.processes.run_worker"]
    environment: *run-control-environment
    depends_on:
      run-control-init:
        condition: service_completed_successfully
    healthcheck: *run-control-healthcheck
    stop_grace_period: 10s
    restart: unless-stopped
    networks: [industry_network]

  run-api:
    profiles: ["run-control"]
    labels: *run-control-labels
    build:
      context: .
      dockerfile: Dockerfile.run-control
      args: *run-control-build-args
    image: *run-control-image
    command: ["uvicorn", "app.processes.run_api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *run-control-environment
      RUN_CONTROL_MINIMAL_IMPORTS: "1"
    depends_on:
      run-control-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    ports:
      - "${RUN_CONTROL_API_PUBLISHED_PORT:-18080}:8000"
    networks: [industry_network]

  # ==================== PostgreSQL 数据库 ====================
  postgres:
    labels: *run-control-labels
    image: postgres:15-alpine
    container_name: ${RUN_CONTROL_POSTGRES_CONTAINER_NAME:-industry_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RUN_CONTROL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${RUN_CONTROL_POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${RUN_CONTROL_POSTGRES_DB:-industry_assistant}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUN_CONTROL_POSTGRES_USER:-postgres} -d ${RUN_CONTROL_POSTGRES_DB:-industry_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - industry_network

  # ==================== Redis 缓存 ====================
  redis:
    labels: *run-control-labels
    image: redis:7-alpine
    container_name: ${RUN_CONTROL_REDIS_CONTAINER_NAME:-industry_redis}
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - industry_network

  # ==================== Milvus 向量数据库 ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: industry_etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - industry_network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: industry_minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - industry_network

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: industry_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - industry_network

  # ==================== Elasticsearch (可选，用于全文检索) ====================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: industry_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "1200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - industry_network

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  es_data:

networks:
  industry_network:
    driver: bridge
