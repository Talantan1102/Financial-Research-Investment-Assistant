# C.5 Plan 4 ship — multi-profile MCP server config.
#
# PR #39 ship 'chat_tools' as embedded default (StdioServerParameters command
# array in app.services.mcp_client.MCPClient.from_subprocess).
# C.5 加 'memory' independent profile (HierarchicalMemory 6 tools).
#
# Launched via:
#   python -m app.mcp_server.server --profile chat_tools  # PR #39 default
#   python -m app.mcp_server.server --profile memory      # C.5 Plan 4
servers:
  - name: chat_tools
    transport: stdio
    command: ["python", "-m", "app.mcp_server.server", "--profile", "chat_tools"]
    description: "PR #39 chat tools (tushare / bocha / kb / compare)"

  - name: memory
    transport: stdio
    command: ["python", "-m", "app.mcp_server.server", "--profile", "memory"]
    description: "C.5 cross-session memory (3-tier hierarchical, 6 tools)"
