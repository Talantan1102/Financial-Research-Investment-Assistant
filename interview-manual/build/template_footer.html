<button id="totop" aria-label="回到顶部">↑</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
  /* code highlight (graceful if CDN missing) */
  if (window.hljs) { try { hljs.highlightAll(); } catch(e){} }

  /* progress bar */
  var prog = document.getElementById('progress');
  function onScroll(){
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    prog.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    totop.classList.toggle('show', h.scrollTop > 600);
  }
  var totop = document.getElementById('totop');
  totop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  /* sidebar: mobile drawer + desktop fold-left/right */
  var sb = document.getElementById('sidebar');
  var root = document.documentElement;
  function saveNav(v){ try{ localStorage.setItem('asm-nav', v); }catch(e){} }
  document.getElementById('side-toggle').addEventListener('click', function(){
    if (window.innerWidth > 1100) { root.classList.remove('nav-collapsed'); saveNav('open'); }
    else { sb.classList.toggle('open'); }
  });
  document.getElementById('nav-collapse').addEventListener('click', function(){
    if (window.innerWidth > 1100) { root.classList.add('nav-collapsed'); saveNav('collapsed'); }
    else { sb.classList.remove('open'); }
  });
  document.getElementById('nav').addEventListener('click', function(e){
    if (e.target.closest('a') && window.innerWidth <= 1100) sb.classList.remove('open');
  });

  /* collapsible nav (accordion: one category open at a time) */
  var navCats = Array.prototype.slice.call(document.querySelectorAll('.nav-cat'));
  function openCat(cat, exclusive){
    if (!cat) return;
    if (exclusive) navCats.forEach(function(c){ if (c !== cat) c.classList.remove('open'); });
    cat.classList.add('open');
  }
  navCats.forEach(function(cat){
    var head = cat.querySelector('a');
    head.addEventListener('click', function(){ openCat(cat, true); });
  });
  if (navCats[0]) navCats[0].classList.add('open'); /* default: first open until scroll-spy decides */

  /* active nav highlight + auto-expand current category */
  var links = {};
  document.querySelectorAll('#nav li a').forEach(function(a){
    links[a.getAttribute('href').slice(1)] = a;
  });
  var current = null;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting) {
        if (current) current.classList.remove('active');
        var a = links[en.target.id];
        if (a) { a.classList.add('active'); current = a;
          if (!document.getElementById('search').value.trim()) openCat(a.closest('.nav-cat'), true);
          var nav = document.getElementById('nav');
          var ar = a.getBoundingClientRect(), nr = nav.getBoundingClientRect();
          if (ar.top < nr.top + 40 || ar.bottom > nr.bottom - 40) {
            nav.scrollTop += (ar.top - nr.top) - nr.height / 2 + 20;
          }
        }
      }
    });
  }, {rootMargin:'-12% 0px -70% 0px'});
  document.querySelectorAll('.question-card').forEach(function(c){ io.observe(c); });

  /* reveal on scroll */
  if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
    var ro = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) { en.target.classList.add('in'); ro.unobserve(en.target); }
      });
    }, {rootMargin:'0px 0px -6% 0px'});
    document.querySelectorAll('.question-card').forEach(function(c){
      c.classList.add('reveal'); ro.observe(c);
    });
  }

  /* search filter */
  var input = document.getElementById('search');
  var cards = Array.prototype.map.call(document.querySelectorAll('.question-card'), function(c){
    return {el:c, text:(c.querySelector('.q-title').textContent + ' ' +
      Array.prototype.map.call(c.querySelectorAll('.tag'), function(t){return t.textContent;}).join(' ')).toLowerCase()};
  });
  input.addEventListener('input', function(){
    var q = input.value.trim().toLowerCase();
    var anyVisible = {};
    cards.forEach(function(c){
      var show = !q || c.text.indexOf(q) >= 0;
      c.el.style.display = show ? '' : 'none';
      var navA = links[c.el.id];
      if (navA) navA.parentElement.style.display = show ? '' : 'none';
      if (show) anyVisible[c.el.closest('.category').id] = true;
    });
    document.querySelectorAll('.category').forEach(function(cat){
      var show = !q || anyVisible[cat.id];
      cat.style.display = show ? '' : 'none';
      var navA = document.querySelector('#nav a[href="#' + cat.id + '"]');
      if (navA) {
        var navCat = navA.closest('.nav-cat');
        navCat.style.display = show ? '' : 'none';
        if (q) navCat.classList.toggle('open', !!anyVisible[cat.id]); /* expand matches while searching */
      }
    });
    if (!q) { /* search cleared: back to accordion, reopen the category in view */
      navCats.forEach(function(c){ c.classList.remove('open'); });
      openCat((current && current.closest('.nav-cat')) || navCats[0], true);
    }
  });
})();
</script>
</body>
</html>
