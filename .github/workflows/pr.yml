name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # PR-A 2026-05-17: 全 L0/L1/L2/e2e 都用真 PG。
      # 测试 db (industry_assistant_test) 由 conftest._ensure_test_db_exists 在
      # session 启动时 CREATE。pg_test_engine fixture DROP SCHEMA + create_all。
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          # Default db = industry_assistant (matches local dev + 01-init.sql).
          # Test db (industry_assistant_test) is created by 00-create-test-db.sql
          # init script. Tests connect to test db via step-level POSTGRES_DB env.
          POSTGRES_DB: industry_assistant
          # NOTE: services init scripts (docker/init-db/) do NOT run on bare
          # service containers. conftest._ensure_test_db_exists creates the
          # test db at session start.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps
        run: uv sync --extra dev --extra kb
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Tests (L0 + L1 + L2 cassette)
        env:
          LLM_MODE: cassette
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: industry_assistant_test
        run: uv run pytest backend/tests -m "not slow and not live_only" -v
