name: Nightly

on:
  schedule:
    - cron: "0 19 * * *"  # 19:00 UTC = 03:00 北京
  workflow_dispatch:  # manual trigger

permissions:
  contents: read
  issues: write  # Open issue on nightly failure

jobs:
  full-tests-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      # PR-A 2026-05-17: 全测试用真 PG。同 pr.yml services.postgres 形态。
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          # Default db = industry_assistant (matches local dev + 01-init.sql).
          # Test db (industry_assistant_test) is created by 00-create-test-db.sql.
          POSTGRES_DB: industry_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: industry_assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps
        run: uv sync --extra dev --extra kb

      - name: L2 full (e2e cassettes)
        env:
          LLM_MODE: cassette
        run: uv run pytest backend/tests/e2e -v

      - name: L3 eval (live LLM, cost-budgeted)
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
          LLM_MODE: live
          EVAL_COST_LIMIT_CNY: "20"
        run: uv run poe eval

      - name: Cassette drift detection
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
          EVAL_COST_LIMIT_CNY: "20"
        run: uv run python -m backend.tests.eval.cassette_validation

      - name: Dependency security audit
        # Every CVE suppressed below is UNREACHABLE in our usage and carries a
        # documented re-eval trigger. pip-audit still FAILS the build on any other
        # (new / reachable / fixable) vuln — targeted risk-acceptance, not a
        # disabled gate. idna CVE-2026-45409 is deliberately NOT listed: it was
        # actually fixed by pinning idna>=3.15 (now 3.17) via
        # [tool.uv] constraint-dependencies in pyproject.toml.
        #
        # GHSA-69w3-r845-3855 (CVE-2026-1839): transformers Trainer RCE — we use
        #   transformers only via mineru[core] for PDF inference, never the Trainer
        #   class. Attack surface 0. Re-eval when mineru bumps transformers >=5.0.
        # PYSEC-2025-217 (CVE-2025-14929): transformers X-CLIP checkpoint-conversion
        #   deserialization RCE — same mineru-only path; we never convert X-CLIP
        #   checkpoints. No 4.x fix exists (needs transformers 5.0). Re-eval when
        #   mineru bumps transformers >=5.0.
        # PYSEC-2026-161 (CVE-2026-48710): starlette BadHost host-header path auth
        #   bypass — our auth is cryptographic JWT (app/core/security.py), never
        #   request.url.path-derived, so unreachable. Upstream fix (starlette 1.0.1)
        #   is blocked: mineru -> gradio caps starlette <1.0. Re-eval when gradio
        #   (via mineru) permits starlette >=1.0.1.
        run: >-
          uv run pip-audit
          --ignore-vuln GHSA-69w3-r845-3855
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2026-161

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[nightly] ${today} failure`,
              body: `Nightly job failed. See [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['nightly-failure']
            })
