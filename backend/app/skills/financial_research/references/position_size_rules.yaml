# 仓位计算规则
# Formula: position_pct = base_pct[rec] * risk_multiplier[tol] * (small_cap_haircut if mc < threshold else 1.0)
# 上限 max_position_pct.

base_pct:  # by recommendation
  recommend_buy: 15.0
  recommend_overweight: 10.0
  recommend_hold: 5.0
  recommend_underweight: 2.0
  recommend_sell: 0.0

risk_multiplier:  # by user persona tolerance
  conservative: 0.5
  moderate: 1.0
  balanced: 1.2
  aggressive: 1.6
  very_aggressive: 2.0

small_cap_threshold_cny: 50000000000.0  # 500 亿
small_cap_haircut: 0.7
max_position_pct: 30.0
