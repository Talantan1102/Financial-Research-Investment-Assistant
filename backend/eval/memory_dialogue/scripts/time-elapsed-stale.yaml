# 对话流评估脚本《半年前那个估值还算数么》— 时间事件族·流逝时间盲视。
# 压的机制(时间推理维度):用户在某 session(2025-01)给中际旭创一个带明确日期的估值判断
#   (看多·目标价 180·逻辑光模块 1.6T 放量),之后隔一个大时间跨度(中间穿插无关短 session,
#   时间一路推到 2025-08),再来追问「我之前那个估值还算数么 / 现在还能照这个拿么」。
#   考的不是「最新观点是什么」——用户从头到尾【没改过】这个判断,旧事实理应原样存活;
#   考的是系统读到这条事实时,能不能意识到 valid_from 已是【七八个月前】、那是一个会随行情/财报
#   过期的「时点估值」,该提示「这是 N 个月前的判断、距今已久、建议重新评估」,
#   而不是把陈旧结论当现状直接抛「你看多、目标价 180」就完事。
# 搭车机制:
#   (1) 单跳召回——目标价 180、逻辑 1.6T 是独立事实,能不能精确召回;
#   (2) 事件时间锚定——valid_from 必须钉在建仓那次(2025-01-08),不得随追问当下漂移;
#   (3) 知识更新的「反面」——用户没改过观点,fact_count_no_increase / old_invalidated 不该触发,
#       「我改过没」的正解是「没改过、原样还在」,但同时该带「不过这是很久前的判断」的时间提示;
#   (4) 克制弃答——从没聊过买了几手 / 亏赚多少(持仓不入记忆图)。
# 刁钻点:
#   ① 这是个「不更新」陷阱——naive 系统两条路都会翻车:一条是看 valid_from 很旧就误判成过期作废
#      (其实事实仍 active,只是「旧」不等于「废」);另一条是只取 fact_active 把 180 当现状直接抛、
#      完全无视七个月时间差。正解是「事实仍有效 + 主动标注它是 N 个月前的、提示重新评估」;
#   ② 目标价 180 与逻辑 1.6T 只在建仓那次说一次 + 助手复述确认一次,之后绝不在用户台词复述第二遍;
#   ③ 1.6T 放量那条逻辑由助手追问带出、用户只「嗯对」确认——抽取器最易漏的确认句形态;
#   ④ 大时间跨度埋在中段(2025-02 → 2025-08 跳了半年),关键追问落在长 session(n6)中后段,
#      前面是大盘 / 算力板块流水干扰;
#   ⑤ 对抗题埋假前提「我后来不是把这只下调到中性了么」——用户从没下调过,顺着假前提确认即翻车。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,只打在非断言关键词上,如「再看把」「来着把」「张了」「光膜」——抽取器就该扛住);
#   助手侧台词写要点式括号,负责复述确认目标价与逻辑(给抽取器的合法锚点,也是真实助手行为)。
# 硬约束:substrate 是带日期的观点/研究/事件,不是持仓——口语里顺带提一句拿着可以,
#   断言绝不围绕股数 / 金额,目标价是「观点里的预期价位」属观点事实,不是成交价。
script_id: time-elapsed-stale
title: "半年前那个估值还算数么"
family: 时间事件族
substrate: 带日期的观点/研究/事件(跨 session 演化;无结构化模块兜底,纯记忆领地;持仓不入记忆图)

sessions:
  - n: 1
    date: 2025-01-08
    length: 中
    turns:
      - u: "光模块这波算力起来了 中际旭创我想搞明白 你帮我捋下"
      - a: "(梳理光模块环节:北美 CSP 资本开支、1.6T 光模块导入节奏、龙头份额;问用户自己研究到哪了)"
      - u: "我研究完了 就盯中际旭创一只 看多 这只我啃过了 别的光膜票不碰"
      - a: "(回应;追问:您看多它,心里有个目标价没?核心赌的是哪条逻辑?)"
      - u: "目标价我看到一八零 一八零之前我不动它"
      - a: "(确认理解;追问:这个一八零主要是赌 1.6T 光模块明年放量这条?)"
      - u: "嗯对 就 1.6T 放量 北美大厂砸钱 它份额又稳 这逻辑我认"
      - a: "(总结用户观点:看多中际旭创,目标价 180,核心逻辑 1.6T 光模块放量 + 北美 CSP 资本开支;时点 2025-01-08)"
  - n: 2
    date: 2025-01-20
    length: 短
    turns:
      - u: "美联储这次议息偏鹰么 对成长股压力大不大"
      - a: "(简析议息基调与成长风格扰动)"
  - n: 3
    date: 2025-02-06
    length: 短
    turns:
      - u: "黄金破新高了 这位置追站岗风险大不大"
      - a: "(分析金价驱动与追高风险)"
      - u: "那我再看把"
  - n: 4
    date: 2025-05-19
    length: 短
    turns:
      - u: "港股通调整名单出了没 影响哪些票"
      - a: "(说明调整范围与受影响标的)"
      - u: "行 知道了哈"
  - n: 5
    date: 2025-07-28
    length: 短
    turns:
      - u: "新能源车七月这周销量出了没"
      - a: "(给出周度销量与环比)"
      - u: "嗯 知道了"
  - n: 6
    date: 2025-08-14
    length: 长
    turns:
      - u: "AI 算力这波又躁起来了 北美几个大厂指引都上修了"
      - a: "(汇总海外 CSP 最新资本开支指引与算力链景气;不替用户拍方向)"
      - u: "我这半年没怎么管账户 光模块板块整体最近啥情况"
      - a: "(给出光模块板块近期走势与估值分位概况)"
      - u: "对了 中际旭创我年初不是研究过么 我那会儿那个判断 现在还算数不"
      - a: "(检索到用户 2025-01-08 对中际旭创的判断:看多、目标价 180、逻辑 1.6T 放量;提示这是约七个月前的时点估值,期间经历多轮行情与一季报,建议重新评估而非直接沿用)"
      - u: "嗯 我就问问还作不作数 我自己那个判断我没改过来着 一直就那一个"
      - a: "(确认:您对中际旭创的判断自年初至今未做更新,仍是看多/目标价 180/逻辑 1.6T;但重申该判断锚在 1 月、距今已七个月,目标价与逻辑是否仍成立需结合最新财报与板块估值重看)"
      - u: "行 那你给我提个醒 哪天我重新看一遍这只 别让我拿着个老黄历当宝"
      - a: "(确认:不改动原判断,标注其为年初旧判断;提示用户择期重新评估中际旭创)"
  - n: 7
    date: 2025-08-27
    length: 短
    turns:
      - u: "医药今天又大跌 是不是集采还有第二刀"
      - a: "(归因:集采节奏与板块情绪)"
      - u: "哦 知道了"

db_assertions:
  - after: 1
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [中际旭创, 300308.SZ], value_contains: ["看多", "180"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [中际旭创, 300308.SZ], expected_date: "2025-01-08"}
  - after: 6
    assert:
      # 用户全程没改过观点——这条事实应原样存活,既不新增也不作废
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [中际旭创, 300308.SZ], value_contains: ["看多", "180"]}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: [中际旭创, 300308.SZ]}
      # n6 只是回头确认旧判断、没产生新观点,不得作废老事实
      - {type: old_invalidated, rel_type: EXPRESSED_VIEW, target_label: [中际旭创, 300308.SZ], min_count: 0}
      # 事件时间必须仍钉在 1 月建仓那次,不得随 8 月追问漂移
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [中际旭创, 300308.SZ], expected_date: "2025-01-08"}
  - after: 7
    assert:
      # 历经 8 月那次回头确认与一个无关短 session,事实仍原样存活、事件时间未漂移
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [中际旭创, 300308.SZ], expected_date: "2025-01-08"}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [中际旭创, 300308.SZ], value_contains: ["180"]}
      - {type: no_fact_written, rel_type: HOLDS}

probes:
  - tier: 直球
    dimension: 时间推理
    q: "我年初对中际旭创那个判断,现在还算数么?"
    expect_contain: ["180", "重新"]
    expect_not: []
    judge_rubric: "好答须同时做两件事:(甲)如实复述那条判断仍在(看多 / 目标价 180 / 逻辑 1.6T),(乙)明确提示这是约七个月前(1 月 / 年初)的时点估值、距今已久、可能过时,建议重新评估再决定。只抛『你看多、目标价 180』当现状、完全不提时间已流逝即不合格;反过来若误判成『这条已过期作废了』也不合格——事实仍有效,只是旧"
  - tier: 直球
    dimension: 单跳召回
    q: "我当时看多中际旭创,目标价看到多少?赌的啥逻辑?"
    expect_contain: ["180", "1.6T"]
    expect_not: []
    judge_rubric: "应答目标价 180、核心逻辑 1.6T 光模块放量(北美 CSP 资本开支 / 份额稳的等价表述也算)。1.6T 那条由助手追问带出、用户仅『嗯对』确认——考抽取器对确认句的捕捉;能答出 180 与 1.6T(或其一明确)即合格"
  - tier: 自然难
    dimension: 时间推理
    q: "我那个中际旭创的判断,到现在搁了多久了?"
    expect_contain: []
    expect_not: []
    judge_rubric: "提问发生在 2025-08,判断锚在 2025-01-08。应能算出已过去约七个月(半年多 / 七个月 / 大半年均可),时间锚点要指向 1 月 / 年初。若答不出时间跨度、或把锚点说成 8 月那次回头确认的时点,均不合格"
  - tier: 自然难
    dimension: 知识更新
    q: "中际旭创这只,我年初到现在中间改过判断没?"
    expect_contain: []
    expect_not: []
    judge_rubric: "应答没改过——从年初到 8 月用户始终只有那一个判断(看多 / 180 / 1.6T),8 月只是回头确认、没产生新观点。若答『改成中性了 / 下调过』即把不存在的更新编出来,不合格;答没改过、仍是原判断即合格,若额外点出『虽没改但已是旧判断』更佳"
  - tier: 对抗
    dimension: 时间推理
    q: "我后来不是把中际旭创下调到中性了么?那条是哪天的事?"
    expect_contain: []
    expect_not: ["是的"]
    judge_rubric: "假前提:用户从没把中际旭创下调到中性,自年初至今只有看多 / 目标价 180 一个判断、从未更新。必须纠正这个假前提、指出没有过下调到中性这回事;顺着编一个『下调到中性』的日期即不合格"
  - tier: 对抗
    dimension: 克制弃答
    q: "我中际旭创这只从年初拿到现在,大概浮盈浮亏多少了?"
    expect_contain: []
    expect_not: []
    answerable: false
    judge_rubric: "整段历史只聊观点与目标价,从未提及任何买入股数 / 成本 / 盈亏金额(持仓不入记忆图)。必须指出没说过 / 无法据此推算盈亏;编造一个盈亏数字或顺着假前提确认均不合格"
