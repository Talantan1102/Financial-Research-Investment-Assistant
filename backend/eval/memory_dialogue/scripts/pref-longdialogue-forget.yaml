# 对话流评估脚本《二十段闲聊后还记不记得我不碰周期》— 偏好画像族·长程段(20+ session)。
# 压的机制(偏好一致维度,长程深干扰):有效偏好只在第 2 个 session 出现一次
#   (AVOIDS 周期:钢铁/煤炭/有色都不碰,逻辑——周期我看不懂、不会择时;搭车 PREFERS 现金流稳的消费),
#   之后 15+ 个全是各色短干扰(行情/政策/黄金/汇率/段子/转债/猪价/AI...),逐字真实但与断言无关。
#   末尾让用户开口要选股——考的是抽取器能不能在 18 个对话之后,还把第 2 个 session 那条"不碰周期"的回避偏好捞回来,
#   并让选股回答真的避开周期股,而不是被一路噪声里反复出现的钢铁/煤炭/有色带着推一只周期票上去。
# 搭车机制:深埋单跳召回(回避哪三个细分+为什么)、PREFERS 正向偏好(现金流稳的消费)、
#   事件时间推理(几月说的不碰周期)、克制弃答(从没聊过具体亏损金额)、对抗假前提(把干扰里的有色当成用户在追的方向)。
# 刁钻点:(甲)干扰 session 里钢铁/煤炭/有色作为大盘热点反复被用户随口问起(n7 问煤炭分红、n13 问有色异动、n19 问钢铁涨价),
#   是"看起来在关注周期"的同名噪声;抽取器若按"最近聊得多"就误判用户在追周期,正确答案是 n2 的明确回避,而随口问行情 ≠ WATCHES、更 ≠ 想买;
#   (乙)"钢铁煤炭有色都不碰"这条由助手复述兜回、用户只"对 就这意思"确认(抽取器最易漏的确认句形态);
#   (丙)有效偏好距选股问询点隔了 16+ 个 session,远超一般记忆窗口,逼真考长程保持;
#   (丁)末尾选股是行为级考核——不光要数据库里 AVOIDS 周期还活着,助手的实际选股输出也不许出现钢铁/煤炭/有色/周期。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,如「再看把」「张了」「迟到肉」「控机不住」——抽取器就该扛住这种真实输入,错字只打非断言关键词);
#   助手侧台词写要点,负责复述确认(给抽取器的合法锚点,也是真实助手行为)。
# 硬约束:substrate 是偏好画像(风险偏好/投资风格/讨厌的板块),不是持仓——散户口语里顺带提一句操作可以,断言绝不围绕股数/金额。
script_id: pref-longdialogue-forget
title: "二十段闲聊后还记不记得我不碰周期"
family: 偏好画像族
substrate: 偏好画像(风险偏好/投资风格/回避板块;无结构化模块兜底,纯记忆领地;持仓走独立模块不入图)

sessions:
  # ===== 有效信息段(回避偏好埋在第 2 个 session 中后段,之后全是干扰)=====
  - n: 1
    date: 2025-02-12
    length: 短
    turns:
      - u: "节后这盘子乱糟糟的 我想把自己的路子理一理 你帮我捋"
      - a: "(回应;问用户想先从风险偏好还是行业范围聊起)"
      - u: "都行 先从我不碰啥说起把 省得你瞎推"
      - a: "(收到;约定下次系统过一遍用户的回避清单与偏好风格)"
  - n: 2
    date: 2025-02-24
    length: 长
    turns:
      - u: "在不 接着上回的聊 我把我的框框定死给你"
      - a: "(在;请用户说要点,逐条记下)"
      - u: "我求稳的人 不喜欢大起大落 心脏受不了"
      - a: "(确认风险偏好:低波动、求稳型;追问:那行业上有明确不碰的吗?)"
      - u: "有 我跟你说重点 周期我一概不碰"
      - a: "(请用户说清「周期」具体指哪些,免得理解偏)"
      - u: "钢铁 煤炭 有色 这仨都不要 大宗那套我看不懂 也不会择时 老被埋"
      - a: "(复述确认:行业上明确回避周期股——钢铁、煤炭、有色金属一概不碰,原因是看不懂大宗、不会择时、易被套)"
      - u: "对 就这意思 你以后给我看东西 这几个直接划掉"
      - a: "(记录回避偏好:回避周期板块(钢铁/煤炭/有色);追问:那您偏好往哪个方向看?)"
      - u: "我就爱现金流稳的 能分红的 消费里那种闷头赚钱的 我踏实"
      - a: "(确认正向偏好:偏好现金流稳定、分红型、消费类标的;追问:这是长期风格还是阶段性?)"
      - u: "长期就这风格 改不了 我这人就图个睡得着"
      - a: "(总结画像:风险偏好求稳低波;明确回避周期(钢铁/煤炭/有色);正向偏好现金流稳的分红型消费;为长期固定风格)"
      - u: "嗯 就这么定 别给我整那些上蹿下跳的"
      - a: "(确认画像已记录,后续推荐将据此过滤)"
  - n: 3
    date: 2025-03-05
    length: 短
    turns:
      - u: "美联储点阵图偏鹰 A股北向会不会跑啊"
      - a: "(简析点阵图与北向资金传导)"
  # ===== 干扰段开始(各色短干扰,周期同名词混在行情噪声里反复出现)=====
  - n: 4
    date: 2025-03-13
    length: 短
    turns:
      - u: "黄金又新高了 这位置还敢追么"
      - a: "(分析金价驱动与回调风险)"
      - u: "那我再看把"
  - n: 5
    date: 2025-03-20
    length: 短
    turns:
      - u: "新能源车三月销量出了没 比亚迪那数 群里吵翻了 都说要起飞了把"
      - a: "(给出三月销量与环比)"
  - n: 6
    date: 2025-03-27
    length: 短
    turns:
      - u: "可转债打新现在还有肉么 中签率低成这样"
      - a: "(说明近期转债打新供给与中签概况)"
  - n: 7
    date: 2025-04-02
    length: 中
    turns:
      - u: "煤炭今天大涨 群里说分红率挺香的 你瞅瞅啥情况"
      - a: "(说明煤炭上涨成因与高股息属性;不就此推荐,仅作行情归因)"
      - u: "哦 就问问 看个热闹"
      - a: "(回应;识别为随口问行情,非买入意向,亦非纳入关注)"
  - n: 8
    date: 2025-04-09
    length: 短
    turns:
      - u: "今天大盘跌好不好啊 跌得我控机不住想割"
      - a: "(解释下跌与情绪面、是否恐慌盘)"
      - u: "哦行"
  - n: 9
    date: 2025-04-16
    length: 短
    turns:
      - u: "日元跌成这样 出海那些公司是不是要吃汇兑亏"
      - a: "(说明日元贬值对出口与汇兑损益的影响)"
  - n: 10
    date: 2025-04-23
    length: 短
    turns:
      - u: "听懂掌声 今天还不亏的是高手"
      - a: "(回应大跌日情绪;简述全市场普跌成因)"
  - n: 11
    date: 2025-04-30
    length: 中
    turns:
      - u: "军工最近有点东西啊 你看好不"
      - a: "(分析军工催化:订单与地缘;给出节奏判断)"
      - u: "就随口问问 我不追这种 太燥了"
      - a: "(回应;识别为闲聊问行情,非偏好变更)"
  - n: 12
    date: 2025-05-08
    length: 短
    turns:
      - u: "原油跌这么狠 是不是衰退要来了"
      - a: "(解释油价回落的供需与宏观含义)"
  - n: 13
    date: 2025-05-15
    length: 中
    turns:
      - u: "有色今天集体异动 是不是庄在洗盘子"
      - a: "(归因:流动性与商品价格题材;说明异动成因)"
      - u: "懂了懂了 我就看个戏 反正这玩意儿跟我没关系"
      - a: "(回应;识别为旁观行情,与用户既定回避偏好一致,不作变更)"
  - n: 14
    date: 2025-05-22
    length: 短
    turns:
      - u: "比特币又站上来了 这玩意儿跟A股有关系么"
      - a: "(说明加密资产与A股相关性弱、风险偏好间接传导)"
  - n: 15
    date: 2025-05-29
    length: 短
    turns:
      - u: "猪价起来了 养猪股是不是该看一眼"
      - a: "(说明猪周期位置与板块弹性)"
      - u: "先放观察里把"
  - n: 16
    date: 2025-06-05
    length: 短
    turns:
      - u: "港股今天为啥单独张 跟A股脱钩了么"
      - a: "(解释港股独立行情成因:南向与外资结构)"
  - n: 17
    date: 2025-06-12
    length: 中
    turns:
      - u: "宽基ETF我想定投一个 沪深300跟中证500选哪个"
      - a: "(对比两个宽基的成分与风格;不替用户拍板)"
      - u: "那我就大的那个吧 省心"
      - a: "(回应;提示定投纪律)"
  - n: 18
    date: 2025-06-19
    length: 短
    turns:
      - u: "半导体设备今天集体杀跌 利空是啥"
      - a: "(归因:消息面与估值消化)"
  - n: 19
    date: 2025-06-26
    length: 中
    turns:
      - u: "钢铁这两天张得凶 群里喊涨价周期来了 真的假的"
      - a: "(说明钢铁上涨成因:供给收缩与涨价预期;作行情归因,不就此推荐)"
      - u: "我也就看看热闹 别当真哈"
      - a: "(回应;识别为随口看行情,与既定回避偏好一致,不作变更)"
  - n: 20
    date: 2025-07-03
    length: 短
    turns:
      - u: "今天负的有点多 安慰安慰我。。。。。。"
      - a: "(共情;简述普跌环境、避免追加情绪化操作)"
  - n: 21
    date: 2025-07-10
    length: 短
    turns:
      - u: "央行又降准了 利好谁啊"
      - a: "(说明降准传导与受益方向)"
  - n: 22
    date: 2025-07-17
    length: 短
    turns:
      - u: "光伏跌跌不休 是不是产能太多了 想抄底又怕迟到肉"
      - a: "(说明光伏供给过剩与价格战现状)"
      - u: "那不碰了"
  - n: 23
    date: 2025-07-24
    length: 短
    turns:
      - u: "印度那市场是不是比我们强好多 兄弟们都在说"
      - a: "(对比海外市场表现与可投性约束)"
  # ===== 长程问询点:让用户开口要选股,考行为级回避一致 =====
  - n: 24
    date: 2025-07-31
    length: 中
    turns:
      - u: "好久没正经聊了 你照我的路子 给我挑几个能拿的票呗"
      - a: "(基于用户既有画像选股:回避周期(钢铁/煤炭/有色),围绕求稳低波、现金流稳的分红型消费方向给候选;并复述据以选股的回避与偏好依据)"
      - u: "嗯 就这风格 你懂我"
      - a: "(确认选股口径与用户长期画像一致:已排除周期,聚焦现金流稳的分红型消费)"

db_assertions:
  # 第2个session后:回避周期 active(三个细分写候选列表容实体规整),正向偏好消费 active,事件时间锚在表达日
  - after: 2
    assert:
      - {type: fact_active, rel_type: AVOIDS, target_label: [周期, 钢铁, 煤炭, 有色], value_contains: ["周期"]}
      - {type: valid_from_is_event_time, rel_type: AVOIDS, target_label: [周期, 钢铁, 煤炭, 有色], expected_date: "2025-02-24"}
      - {type: fact_active, rel_type: PREFERS, target_label: 消费, value_contains: ["消费"]}
  # 第7个session(随口问煤炭分红):随口问行情不得反转回避偏好,也不得新增 WATCHES——AVOIDS 仍 active、版本不增
  - after: 7
    assert:
      - {type: fact_active, rel_type: AVOIDS, target_label: [周期, 钢铁, 煤炭, 有色], value_contains: ["周期"]}
      - {type: fact_count_no_increase, rel_type: AVOIDS, target_label: [周期, 钢铁, 煤炭, 有色]}
      - {type: no_fact_written, rel_type: WATCHES}
  # 第19个session(随口看钢铁涨价):历经十余个干扰后,回避偏好原样存活、未被作废、事件时间未漂移
  - after: 19
    assert:
      - {type: fact_active, rel_type: AVOIDS, target_label: [周期, 钢铁, 煤炭, 有色], value_contains: ["周期"]}
      - {type: fact_count_no_increase, rel_type: AVOIDS, target_label: [周期, 钢铁, 煤炭, 有色]}
      - {type: valid_from_is_event_time, rel_type: AVOIDS, target_label: [周期, 钢铁, 煤炭, 有色], expected_date: "2025-02-24"}
  # 第24个session(选股)后:回避偏好与正向偏好仍 active,选股环节未污染既有画像
  - after: 24
    assert:
      - {type: fact_active, rel_type: AVOIDS, target_label: [周期, 钢铁, 煤炭, 有色], value_contains: ["周期"]}
      - {type: fact_active, rel_type: PREFERS, target_label: 消费, value_contains: ["消费"]}
      - {type: fact_count_no_increase, rel_type: AVOIDS, target_label: [周期, 钢铁, 煤炭, 有色]}

probes:
  # 直球 · 偏好一致:核心长程保持——选股不得推周期股(行为级断言)
  - tier: 直球
    dimension: 偏好一致
    q: "照我的风格 给我挑几个能长期拿的方向 简单说说就行"
    expect_contain: ["消费"]
    expect_not: ["钢铁", "煤炭", "有色", "周期"]
    judge_rubric: "应基于用户既有画像选股,围绕现金流稳的分红型消费方向给候选,且绝不出现钢铁/煤炭/有色/周期。这是长程保持的行为级考核:历经 16+ 干扰 session(中间反复随口问起煤炭/有色/钢铁行情)后仍能避开周期方可合格;选股里推出任一周期细分,即长程回避偏好失守,判不合格"
  # 直球 · 单跳召回:回避哪三个细分 + 为什么
  - tier: 直球
    dimension: 单跳召回
    q: "我明确说过不碰的是哪几个板块?为啥不碰?"
    expect_contain: ["钢铁", "煤炭", "有色"]
    expect_not: []
    judge_rubric: "应答回避周期股,具体是钢铁、煤炭、有色三个细分;原因为看不懂大宗、不会择时、易被套(命中其中任一原因即可)。三个细分能答出且方向正确即合格"
  # 自然难 · 单跳召回:正向偏好(由助手追问带出、用户口语作答)
  - tier: 自然难
    dimension: 偏好一致
    q: "那我偏爱往哪个方向看?我自己是咋形容的?"
    expect_contain: ["消费"]
    expect_not: ["周期"]
    judge_rubric: "应答正向偏好为现金流稳、能分红的消费类(用户原话'闷头赚钱的''睡得着'等口语描述也算佐证)。能答出消费/分红/现金流稳方向即合格;若把回避的周期当成偏好方向则不合格"
  # 自然难 · 时间推理:几月定下不碰周期
  - tier: 自然难
    dimension: 时间推理
    q: "我是啥时候跟你定下不碰周期的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "时间应指向 2025 年 2 月(2月/二月/年初均可),对应回避偏好成形的事件时间 2025-02-24;不应错锚到后面随口聊煤炭(4月)/有色(5月)/钢铁(6月)的干扰 session 月份。能答出 2 月即合格"
  # 对抗 · 偏好一致:假前提——把干扰里随口问的有色当成用户在追的方向
  - tier: 对抗
    dimension: 偏好一致
    q: "我不是挺关注有色的么 前阵子还老问你有色行情 给我看看有色里哪只能买?"
    expect_contain: []
    expect_not: ["是的", "建议买入"]
    judge_rubric: "假前提:用户问有色异动只是随口看热闹(n13 还明说'跟我没关系'),从未把有色当作要买的方向——恰恰相反,有色属于其明确回避的周期。必须纠正:有色是您回避的板块、随口看行情不等于想买;若顺着假前提推一只有色票即不合格"
  # 对抗 · 克制弃答:从没聊过具体亏损金额
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前不是说过在周期股上亏了多少钱、被套了几手么 你还记得不?"
    expect_contain: []
    expect_not: []
    answerable: false
    judge_rubric: "整段历史只聊回避偏好与风格,用户说过'老被埋'是泛指、从未提及任何具体亏损金额或持仓手数(持仓不入记忆)。必须指出没说过具体数字;编造金额/手数或顺着假前提确认均不合格"