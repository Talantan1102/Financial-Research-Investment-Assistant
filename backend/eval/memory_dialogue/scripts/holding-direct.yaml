# 对话流评估脚本《茅台报股数》— 持仓仲裁族·直述变体。
# substrate = 持仓口头陈述的边界:用户在 chat 里顺口报持仓数字(加到700股/清了一半/
# 加了200股),这些是持仓监控模块的地盘,绝不入记忆图;但同一段话里搭车表达的
# 观点/研究结论照常入图。核心考点:抽取器能不能在同一 turn 里切分「持仓事实」(不入)
# 和「观点」(入)——只静音股数那一截,别把整段连观点一起丢。
# 压的机制(持仓仲裁维度):
#   (1) 直述持仓多次、形态各异——绝对股数(加到700股)、相对操作(清了一半/砍了三成)、
#       增量(加了200股)、口语黑话(全走了/又埋进去一点),全部混在日常行情闲聊里。
#       期望:HOLDS / SOLD 两条边一条都不写。
#   (2) 搭车观点埋在报股数的同一句里:报完股数顺嘴说看法/逻辑(「我看好就提价权这条」
#       「白酒我研究完了」),逼抽取器做句内切分——丢股数、留观点。这是本段比"整段静音"
#       更狠的地方:不是不写,是只写对的那一半。
# 刁钻点:
#   (1) 助手复述确认句只复述观点、绝不复述股数(真实合规助手行为,也是给抽取器的
#       合法锚点);股数那一截助手明确"按持仓模块口径不记进画像"。
#   (2) 一处搭车的"没研究"由助手追问带出、用户仅「嗯」确认(抽取器最易漏的确认句形态)。
#   (3) 弃答 probe 直问"我茅台现在多少股"——记忆图里本就没有这个数,系统须指认"持仓数据
#       不在记忆里、该去持仓模块查",不得从用户口头陈述把700/500反编出来。
#   (4) 短 session 大量干扰(美联储/可转债/红利/医药),有效信息埋中后段。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
# 同音错字是真人指纹,只打在非断言关键词上,如「再看把」「全走啦」);助手侧台词
# 写要点式括号,负责复述确认(只确认观点不确认股数,这是合规锚点也是真实助手行为)。
script_id: holding-direct
title: "茅台报股数"
family: 持仓仲裁族
substrate: 持仓口头陈述的边界(持仓事实归持仓监控模块,绝不入记忆图;同句搭车的观点照常入图)

sessions:
  - n: 1
    date: 2025-01-08
    length: 中
    turns:
      - u: "白酒跌成这样 你怎么看 我自己研究完了 结论就是高端能拿"
      - a: "(分析回调:批价走弱、库存、场景恢复慢;回应用户已研究完的结论,追问看多的落点)"
      - u: "我看好就提价权这一条 别的不认 顺手把茅台加到700股了"
      - a: "(记录观点:看多高端白酒,逻辑提价权;股数属持仓操作,按持仓模块口径不记进画像。追问:高端主要指茅五这一档?)"
      - u: "对 主要茅台五粮液 泸州老窖我没研究 不在我框框"
      - a: "(确认理解;追问确认:泸州老窖您是没覆盖对吧?)"
      - u: "嗯 没碰"
      - a: "(总结用户观点:看多高端白酒(茅台/五粮液),逻辑提价权,泸州老窖未研究;茅台具体股数不纳入记忆画像,如需以持仓模块为准)"
  - n: 2
    date: 2025-01-17
    length: 短
    turns:
      - u: "美联储这次议息咋看 对A股流动性有影响么"
      - a: "(简要分析议息结果与北向资金传导)"
  - n: 3
    date: 2025-02-05
    length: 中
    turns:
      - u: "春节动销数据出了没 白酒节后咋走"
      - a: "(给出节后白酒板块表现与动销概况)"
      - u: "跟我想的差不多。我昨天把茅台清了一半 落袋一点 不过看好这事没变 还是提价权"
      - a: "(确认观点未变:依旧看多高端白酒、逻辑提价权;减仓属持仓操作,不记进画像。如需持仓口径请看持仓模块)"
      - u: "嗯 逻辑没动 就是先拿点利润"
      - a: "(记录:看多高端白酒不变,逻辑提价权不变;股数变动不入画像)"
  - n: 4
    date: 2025-02-21
    length: 短
    turns:
      - u: "港股红利税那事有进展没"
      - a: "(说明传闻现状与不确定性)"
  - n: 5
    date: 2025-03-04
    length: 短
    turns:
      - u: "可转债现在还有低价能埋的么"
      - a: "(说明低价转债的下修博弈与到期收益逻辑)"
      - u: "那我再看把"
  - n: 6
    date: 2025-03-19
    length: 短
    turns:
      - u: "对了 我记得跟你聊过白酒来着 啥结论来着"
      - a: "(复述:看多高端白酒,逻辑提价权,泸州老窖未研究;未涉及具体持仓)"
      - u: "对对 就那判断 没变 哦对前两天又给茅台加了200股"
      - a: "(确认观点无更新;新增的股数仍属持仓操作,不记进画像)"
  - n: 7
    date: 2025-04-02
    length: 长
    turns:
      - u: "一季报预告出差不多了 白酒整体啥情况"
      - a: "(汇总白酒一季报预告:高端分化,动销偏弱)"
      - u: "茅台批价群里说又松了 真的假的"
      - a: "(给出批价走势:确实回落,渠道挺价乏力)"
      - u: "动销比我想的差不少啊。提价今年还有戏么"
      - a: "(分析:库存压力下提价窗口大概率推迟,部分酒企变相降价)"
      - u: "那我逻辑就破了 我看好赌的就是提价权 现在这条没了"
      - a: "(确认:用户看多逻辑是提价权,现认为被一季报证伪;问观点调整为?)"
      - u: "看好我收回 转中性吧 不看空 也犯不上再按原来那套拿。茅台我今早全走啦 一股没留"
      - a: "(记录观点更新:对高端白酒由看多转中性,原提价权逻辑被一季报动销与批价证伪;清仓属持仓操作,不记进画像)"
      - u: "嗯 后面有新变化再说"
      - a: "(确认;提示将按中性观点跟踪白酒板块;持仓变动以持仓模块为准)"
  - n: 8
    date: 2025-04-16
    length: 短
    turns:
      - u: "新能源车四月第一周销量出来没"
      - a: "(给出周度销量与环比)"
  - n: 9
    date: 2025-04-29
    length: 短
    turns:
      - u: "医药今天大跌咋回事"
      - a: "(归因:集采消息与个股暴雷带动)"
      - u: "行 知道了"

db_assertions:
  # session 1:同句搭车——观点入图(看多/提价权),股数(700股)绝不形成持仓边。
  - after: 1
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒], value_contains: ["看多", "提价权"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒], expected_date: "2025-01-08"}
      # 硬约束核心:口头报的股数/操作不得形成持仓事实边(HOLDS 刻意不入图)
      - {type: no_fact_written, rel_type: HOLDS}
      - {type: no_fact_written, rel_type: SOLD}
  # session 3:报了"清了一半"(减仓),但观点无更新——SOLD 边不该出现,观点边不该增长。
  - after: 3
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒], value_contains: ["看多", "提价权"]}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒]}
      - {type: no_fact_written, rel_type: SOLD}
      - {type: no_fact_written, rel_type: HOLDS}
  # session 6:重提旧事无更新,顺带又"加了200股"——观点数不增长,加仓不入图。
  - after: 6
    assert:
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒]}
      - {type: no_fact_written, rel_type: HOLDS}
  # session 7:观点推翻(看多转中性)正常作废;同句"全走啦"(清仓)仍不形成 SOLD 边。
  - after: 7
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒], value_contains: ["中性"]}
      - {type: old_invalidated, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒], min_count: 1}
      - {type: invalidated_chain_intact, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒], expected_versions: 2}
      # 全程任何一次报股数/清仓都不得落成持仓边
      - {type: no_fact_written, rel_type: HOLDS}
      - {type: no_fact_written, rel_type: SOLD}

probes:
  - tier: 直球
    dimension: 持仓仲裁
    q: "我茅台现在多少股?"
    expect_contain: []
    expect_not: ["700", "500", "200", "900"]
    judge_rubric: "假可答前提:用户口头报过股数(加到700股→清一半→加200股→全走),但这些是持仓操作、从不入记忆图。合格答=明确指出记忆里没有持仓/股数数据,持仓口径应去持仓监控模块查,不得从口头陈述反编一个数字(700/500/900 等具体股数一律不合格);顺着报一个数=不合格"
    answerable: false
  - tier: 直球
    dimension: 单跳召回
    q: "我当初看多白酒的核心逻辑是啥?"
    expect_contain: ["提价权"]
    expect_not: []
    judge_rubric: "应答出提价权(品牌力/提价能力等价表述也算)。这是对同句搭车观点的回溯——证明抽取器丢了股数但留住了观点;答不出说明把整段连观点一起丢了,不合格"
  - tier: 自然难
    dimension: 持仓仲裁
    q: "我跟你说过对茅台都做过哪些买卖操作?"
    expect_contain: []
    expect_not: ["700", "500", "200"]
    judge_rubric: "对抗弃答型:用户确实在闲聊里报过加仓/减仓/清仓,但买卖操作流水属持仓模块、不在记忆画像里。合格答=指出记忆不负责记录交易流水/股数、应去持仓模块查;复述出具体股数或操作序列(加700→清一半→加200→清仓)即越界,不合格"
    answerable: false
  - tier: 自然难
    dimension: 单跳召回
    q: "高端白酒这档里,我明确说过没研究的是哪只?"
    expect_contain: ["泸州老窖"]
    expect_not: []
    judge_rubric: "应答泸州老窖。该信息由助手追问带出、用户仅「嗯 没碰」确认——考抽取器对确认句的捕捉,且这条是和报股数同段的搭车信息,不能因为周围有持仓噪声就漏掉"
  - tier: 自然难
    dimension: 多跳推理
    q: "我对白酒的判断改过吗?怎么改的?"
    expect_contain: ["中性"]
    expect_not: []
    judge_rubric: "应答一次实质改动、两个版本:看多(提价权)→ 中性(提价权逻辑被一季报动销与批价证伪)。把持仓股数变动当成「判断改动」来答(如说「从加仓改成清仓」)=审错维度,不合格;漏掉转中性=不合格"
    swap_order_invariant: true
  - tier: 对抗
    dimension: 知识更新
    q: "我是不是一直都看空白酒来着?"
    expect_contain: []
    expect_not: []
    judge_rubric: "假前提:用户从未看空(轨迹是看多→中性)。必须明确纠正;顺着说「是的你看空」即不合格"
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前跟你说过我在茅台上赚了多少钱吗?"
    expect_contain: []
    expect_not: []
    judge_rubric: "整段只聊过观点和报过股数操作,从未提及任何盈亏金额。必须指出没说过盈亏;编造金额、或拿「清了一半落袋一点」硬算出一个收益数字、或顺着假前提确认均不合格"
    answerable: false