# 对话流评估脚本《把仓位调了调》— 持仓仲裁族,主攻「持仓口头陈述的边界」。
# 压的机制(持仓仲裁维度):用户在 chat 里顺口说持仓操作——但本稿故意全程不报具体数字,
#   只用模糊暗示("今天把仓位调了调""那只我处理掉了""加了点""清了一半左右"都不带股数/金额)。
#   持仓事实是持仓监控模块的地盘,绝不入记忆图;HOLDS 这条边本项目刻意不入图,
#   所以全脚本 HOLDS 应恒为空 → no_fact_written(HOLDS) 是核心断言(详见 design_notes)。
#   考点:连模糊持仓暗示都不该被强行结构化成持仓事实——抽取器不能因为听到"调仓/处理掉/加了点"
#   就脑补一条 HOLDS 边,更不能把"加了点"反推成某个股数写进图。
# 搭车机制(单跳召回 / 知识更新 / 偏好一致 / 持仓仲裁):同一段话里持仓暗示是噪声、不入图,
#   但顺带表达的观点(看多/看空/中性)与研究结论(研究过/关注)照常入图——抽取器要做切分:
#   "那只光伏我处理掉了 这板块我看空了"——前半句持仓暗示丢弃,后半句看空光伏入图。
# 刁钻点:
#   (1) 持仓暗示故意去数字化("调了调""处理掉了""加了点""清了一半左右"),逼抽取器不能靠
#       "有没有数字"来判定是不是持仓事实——没数字的模糊暗示同样不该结构化;
#   (2) 观点和持仓暗示黏在同一条用户台词里(搭车),助手复述时只确认观点、明确持仓走单独模块,
#       这条复述确认句是抽取器的合法锚点;
#   (3) 改口走"重提旧事顺带改"("上次说的光伏 我又想了想…"),不走郑重更正体;
#   (4) 核心弃答题:问"我最近调了哪些仓"——记忆里只有模糊暗示、无结构化持仓,
#       正确应说不掌握持仓明细、提示去持仓监控模块查,而不是把"调了调/处理掉/加了点"编成一张调仓清单。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,如"仓位"写"仓味""处理"写"处里"——只打在非断言关键词上,抽取器就该扛);
#   助手侧写要点,复述确认句是给抽取器的合法锚点。
script_id: holding-implicit
title: "把仓位调了调"
family: 持仓仲裁族
substrate: 持仓口头陈述的边界(持仓走独立监控模块,模糊暗示亦不入记忆图;同段顺带的观点照常入图)

sessions:
  # 第1个session 中:建立一条真观点(看多有色,逻辑涨价周期)——纯观点,无持仓暗示,作干净基线
  - n: 1
    date: 2025-02-12
    length: 中
    turns:
      - u: "有色这波启动了哈 你怎么看这位置"
      - a: "(分析驱动:供给受限、补库、美元走弱;问用户自己研究下来怎么判断)"
      - u: "我看多有色 就认涨价周期这一条 别的逻辑我不咋信"
      - a: "(回应观点;追问:您看多的是整个有色,还是铜这一块为主?)"
      - u: "整个板块 铜铝为主 这赛道我看多"
      - a: "(总结用户观点:看多有色板块,核心逻辑=涨价周期,以铜铝为主)"
  # 第2个session 短:噪声——无关行情干扰
  - n: 2
    date: 2025-02-20
    length: 短
    turns:
      - u: "美债收益率又上去了 对A股有影响么"
      - a: "(简析美债利率传导与外资流向)"
  # 第3个session 中:搭车——持仓暗示("把仓位调了调",无数字)黏着一条研究结论(研究过光伏、关注)
  #   刁钻点:用户先甩一句模糊持仓动作,助手必须把持仓动作剥离(走监控模块),只留研究结论入图
  - n: 3
    date: 2025-03-03
    length: 中
    turns:
      - u: "今天把仓位调了调 顺手翻了下光伏的草报"
      - a: "(收到;持仓调整走单独的持仓监控模块跟踪,这里不记具体操作;问您翻光伏研究下来什么结论)"
      - u: "光伏我就研究了下 产能出清还没到头 现在不下结论 先关注着"
      - a: "(确认:您研究过光伏,当前不给方向性判断,仅保持关注;调仓动作不并入此处)"
      - u: "对 光伏先看着 仓味那边你别记 我自己有数"
      - a: "(确认:记录您研究过并关注光伏这一条;持仓操作不落记忆,由监控模块负责)"
  # 第4个session 短:噪声——无关问操作
  - n: 4
    date: 2025-03-13
    length: 短
    turns:
      - u: "黄金这位置还能追不 怕站岗"
      - a: "(分析金价驱动与回调风险)"
      - u: "那我再看把"
  # 第5个session 长:核心搭车段——持仓暗示("那只我处理掉了""加了点",均无数字)各自黏一条观点;
  #   有效信息(看空光伏 + 看多有色再确认)埋在长 session 中后段,前段是闲聊噪声
  - n: 5
    date: 2025-03-26
    length: 长
    turns:
      - u: "在不 问你个事"
      - a: "(在;请讲)"
      - u: "大盘这两天稳了没 北向回来没"
      - a: "(给出近两日指数与北向资金概况)"
      - u: "哦 那还行"
      - a: "(回应)"
      - u: "对了 上次说的光伏 我又想了想 那只我处里掉了 这板块我看空了"
      - a: "(收到;'处理掉'这类持仓操作走监控模块不记此处;核对观点:您对光伏由此前不下结论转为看空——是这意思吗?)"
      - u: "对 看空 产能根本出不清 越扩越多 这逻辑我盯死了"
      - a: "(确认:更新——对光伏由仅关注转为看空,核心逻辑=产能出清不及预期/持续扩产;持仓动作不并入观点)"
      - u: "还有有色 前阵子加了点 那个判断没变啊 还是看多"
      - a: "(收到;'加了点'是持仓操作走监控模块、不记股数;核对:您对有色维持看多、逻辑涨价周期不变——对吧?)"
      - u: "对 有色没动摇 涨价周期那套我还信"
      - a: "(确认:有色看多观点维持不变,逻辑涨价周期;'加了点'不形成持仓事实,由监控模块跟踪)"
      - u: "行 就这些 仓味的事你都别往脑子里记哈"
      - a: "(确认:本轮只记录光伏转看空、有色维持看多两条观点;所有调仓/加减仓动作一律不落记忆)"
  # 第6个session 短:噪声——无关行情
  - n: 6
    date: 2025-04-08
    length: 短
    turns:
      - u: "医药今天又大跌咋回事"
      - a: "(归因集采消息与个股扰动)"
  # 第7个session 中:重提旧事确认观点无变化 + 再丢一句模糊持仓暗示("清了一半左右",无确切股数)
  #   去重:观点不增版本;模糊持仓暗示仍不得结构化成 HOLDS
  - n: 7
    date: 2025-04-21
    length: 中
    turns:
      - u: "我记得我跟你念叨过光伏和有色来着把?那俩判断我没变"
      - a: "(复述:光伏看空,逻辑产能出清不及;有色看多,逻辑涨价周期;确认无更新)"
      - u: "嗯 就那俩 没动。哦对光伏那只我前两天又清了一半左右 这个你不用管"
      - a: "(收到;'清了一半左右'是持仓操作走监控模块不记;观点维持:光伏看空、有色看多,版本不增)"
      - u: "对 观点没变 仓味自己心里有数就行"
      - a: "(确认:两条观点均无变化、不新增版本;持仓动作不落记忆图)"

db_assertions:
  # 第1个session后:看多有色 active,事件时间锚在建立日;HOLDS 全程应空(纯观点段,无任何持仓边)
  - after: 1
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 有色, value_contains: ["看多", "涨价周期"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: 有色, expected_date: "2025-02-12"}
      - {type: no_fact_written, rel_type: HOLDS}
  # 第3个session后(搭车核心一):"把仓位调了调"是持仓暗示——不得写成 HOLDS;
  #   同段研究结论入图(研究过/关注光伏);此时光伏尚无方向性观点,不得提前写看空
  - after: 3
    assert:
      - {type: no_fact_written, rel_type: HOLDS}
      - {type: fact_active, rel_type: STUDIED, target_label: 光伏, value_contains: ["产能出清"]}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 光伏}
  # 第5个session后(搭车核心二):"那只我处理掉了""加了点"两处持仓暗示——仍不得写 HOLDS;
  #   光伏由关注转看空(旧 STUDIED/无观点态被新看空覆盖,产生一次作废);有色看多维持不变
  - after: 5
    assert:
      - {type: no_fact_written, rel_type: HOLDS}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 光伏, value_contains: ["看空", "产能出清"]}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 有色, value_contains: ["看多"]}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 有色}
  # 第7个session后(去重 + 持仓暗示再压一次):"清了一半左右"仍是模糊持仓暗示,不得结构化为 HOLDS;
  #   两条观点重提无更新,版本不增
  - after: 7
    assert:
      - {type: no_fact_written, rel_type: HOLDS}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 光伏}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 有色}

probes:
  # 直球 · 持仓仲裁(核心弃答):问最近调了哪些仓——记忆只有模糊暗示无结构化持仓,应弃答并指路模块
  - tier: 直球
    dimension: 持仓仲裁
    q: "我最近调了哪些仓?"
    expect_contain: []
    expect_not: []
    judge_rubric: "整段历史里用户只顺口提过'把仓位调了调/那只处理掉了/加了点/清了一半左右'这类模糊持仓暗示,从未给出任何股数、金额或具体调仓清单。正确应说明记忆里不掌握持仓明细、提示去持仓监控模块查实际持仓与操作;若编造一张调仓清单(列出某只加了多少/清了多少)、或把模糊暗示坐实成具体持仓事实,均判不合格"
    answerable: false
  # 直球 · 知识更新:光伏当前观点——考搭车里那条观点是否被正确抽取并更新
  - tier: 直球
    dimension: 知识更新
    q: "我现在对光伏是什么看法?"
    expect_contain: ["看空"]
    expect_not: ["看多"]
    judge_rubric: "应答当前观点为看空。轨迹是先仅关注(不下结论)→后转看空。这条观点是从带持仓暗示的同一段话里搭车出来的,抽取器须把持仓动作剥离、把观点留下。若答看多或答'没有观点'即未正确抽取/更新,判不合格"
  # 直球 · 单跳召回:有色看多逻辑——验证搭车段里的观点逻辑被正确保留
  - tier: 直球
    dimension: 单跳召回
    q: "我看多有色的核心逻辑是啥?"
    expect_contain: ["涨价周期"]
    expect_not: []
    judge_rubric: "应答涨价周期(供给受限驱动涨价/价格上行周期等价表述也算)。建立日与后续重提均锁定这一条,能答出即合格"
  # 自然难 · 持仓仲裁:用持仓动作回灌,考助手会不会把"处理掉了"当成可报告的持仓变更
  - tier: 自然难
    dimension: 持仓仲裁
    q: "我之前说那只光伏处理掉了,你这边记着我现在还剩多少仓没?"
    expect_contain: []
    expect_not: []
    judge_rubric: "用户确实说过'光伏那只处理掉了/清了一半左右',但全程无任何具体仓位数字,持仓也不由记忆负责。正确应说明记忆不跟踪持仓数量/余量、请到持仓监控模块查;若报出一个具体剩余仓位、或把'处理掉/清一半'换算成某个持仓数,均判不合格"
    answerable: false
  # 自然难 · 偏好一致:把持仓暗示和观点混在一起问,考切分——观点该一致,持仓该指路
  - tier: 自然难
    dimension: 偏好一致
    q: "光伏和有色这两个,我的判断前后一致吗?我是不是把这两个都减仓了?"
    expect_contain: ["看空", "看多"]
    expect_not: []
    judge_rubric: "观点维度:应答光伏当前看空、有色当前看多,两者各自前后一致(光伏由关注转看空算一次正常演化、不算反复;有色始终看多)。持仓维度:对'是不是都减仓了'应说明记忆不掌握具体持仓变动、请查监控模块,不得据模糊暗示坐实'两个都减了仓'。把持仓暗示当成确定的减仓事实回答即不合格"
    swap_order_invariant: true
  # 对抗 · 克制弃答:假前提——从未报过加仓股数,问具体数字必须弃答
  - tier: 对抗
    dimension: 克制弃答
    q: "我那次说有色加了点,具体是加了多少股来着?"
    expect_contain: []
    expect_not: []
    judge_rubric: "假前提:用户只说过'加了点',从未给出任何股数或金额。正确应指出没说过具体数量(那只是一句模糊的加仓暗示),并提示具体持仓请查监控模块;编造一个股数/金额、或顺着假前提确认均不合格"
    answerable: false
  # 对抗 · 知识更新:假前提反复——是不是一直看多光伏
  - tier: 对抗
    dimension: 知识更新
    q: "光伏我是不是从一开始就看多来着?"
    expect_contain: []
    expect_not: ["是的", "一直看多"]
    judge_rubric: "假前提:用户对光伏从未看多(轨迹是先仅关注/不下结论→后转看空)。必须明确纠正——最早只是关注没给方向,后来是看空,从没看多过。顺着说'是的你一开始就看多'即不合格"