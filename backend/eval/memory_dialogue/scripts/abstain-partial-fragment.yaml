# 对话流评估脚本《那只新能源龙头》— 弃答陷阱族,主攻「信息不足碎片」。
# 压的机制(克制弃答 · 最反直觉一档):半吊子碎片比全空更危险。
#   用户全程只表达过一个「想配点新能源」的板块意向(PREFERS→新能源,意图非持仓),
#   从未在对话里定过任何具体标的(没说宁德、没说比亚迪、没说阳光电源)。
#   probe 却拿一个「我们之前定的那只新能源龙头」当既成事实来追问加减——
#   这是用真实存在的板块意向当诱饵、嫁接一个根本不存在的「已定标的」槽位。
#   系统最危险的失败不是答不出,而是顺着碎片硬指一只(宁德/比亚迪都是"新能源龙头"的常识默认),
#   把"想配点板块"补全成"定了某只龙头"——半吊子幻觉。
# 搭车机制:
#   (1) fact_active 当对照锚——用户真聊过、真定过的是另一码事(看多电力公用,逻辑红利+稳),
#       这条必须入图;用它证明"真聊过的进了图",反衬"没聊的不该冒出来"。
#   (2) 板块意向那条 PREFERS→新能源 可以入图(意图是真表达过的),但不得派生出任何
#       per-stock 的 EXPRESSED_VIEW / STUDIED / WATCHES——no_fact_written + fact_count_no_increase 守。
#   (3) 持仓事实显式不入记忆图:散户中段顺口提了"账户里本来就有点新能源车基金"(干扰),
#       断言绝不围绕这条——它既不是定标的、也不入图。
# 刁钻点:
#   (1) "新能源龙头"是有强常识默认锚的(宁德/比亚迪),LLM 极易自动补全,这正是要压的;
#   (2) 用户在 session 中段明确收口"具体买哪只我没定 还没研究到那一步"——
#       这句"没定标的"由助手追问带出、用户口语确认,是弃答判定的关键合法锚点;
#   (3) 后段又来一句"那只新能源你帮我盯着点"——更像已有标的的措辞,实则仍指板块,
#       专门埋来诱导系统把指代解析成某只具体股;
#   (4) 对照锚(电力公用看多)与诱饵(新能源板块意向)同期并行,逼系统分清
#       "哪个是定了的事实、哪个只是没落地的意向"。
# 台词纪律:用户侧按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,只打非断言关键词,如"在看把""红力""阳光店源");
#   助手侧写要点式括号,复述确认句是给抽取器的合法锚点,也是真实助手行为。
script_id: abstain-partial-fragment
title: "那只新能源龙头"
family: 弃答陷阱族
substrate: 观点演化 + 板块意向未落地(无结构化模块兜底,纯记忆领地;持仓事实显式不入)

sessions:
  - n: 1
    date: 2025-02-12
    length: 中
    turns:
      - u: "电力这波我看挺稳的 你怎么看现在配它"
      - a: "(分析电力公用板块:来水改善、电价市场化、红利属性;问用户自己的落点)"
      - u: "我就认它红力稳 跌不到哪去 当债拿 我看多这块"
      - a: "(回应观点;追问:看多电力,核心是红利防御这一条?持有视角偏长?)"
      - u: "对 红利打底 不指望它暴涨 拿着安心 这块我研究过了"
      - a: "(确认理解;总结:用户看多电力公用,逻辑红利防御,长线当债拿,已自研)"
      - u: "嗯 就这意思。对了新能源最近也跌了不少 我有点想配点"
      - a: "(回应:新能源板块近期回调;问您想配的是整个板块方向,还是已经盯上某只?)"
      - u: "还没 就是个想法 板块层面想沾点 具体的还没看"
      - a: "(记录:用户看多电力(红利逻辑,已研究);另有想配置新能源板块的意向,尚未落到具体标的)"
  - n: 2
    date: 2025-02-21
    length: 短
    turns:
      - u: "美债收益率又上去了 对A股红利那块有压力不"
      - a: "(简析美债利率与高股息板块的跷跷板)"
  - n: 3
    date: 2025-03-05
    length: 中
    turns:
      - u: "新能源车三月销量预期咋样 我那点想法还作不作数"
      - a: "(给出销量预期;确认:您说的是之前提过的、想配新能源板块那个想法?)"
      - u: "对 还在琢磨 板块是想沾 就具体买哪只我没定 还没研究到那一步"
      - a: "(确认:用户对新能源仍停在板块意向,未选定任何具体标的)"
      - u: "我账户里本来就有点新能源车的基金 那不算 我说的是想再单独搞点"
      - a: "(理解:已有的基金持仓与本次意向区分开;记录意向仍为板块级、未定标的)"
      - u: "嗯 等我哪天研究透了再说"
      - a: "(确认:暂不落地,继续作为未成形意向跟踪)"
  - n: 4
    date: 2025-03-17
    length: 短
    turns:
      - u: "黄金这位置还能追么 怕站岗"
      - a: "(分析金价驱动与回调风险)"
      - u: "那我在看把"
  - n: 5
    date: 2025-03-28
    length: 短
    turns:
      - u: "电力那块我之前的判断没变 还是看多 红利打底"
      - a: "(复述确认:看多电力,逻辑红利防御,无变化)"
      - u: "对 就那个 没动"
      - a: "(确认无更新)"
  - n: 6
    date: 2025-04-10
    length: 长
    turns:
      - u: "一季报陆续出了 新能源整体啥情况"
      - a: "(汇总新能源一季报:产业链分化,价格战压制盈利)"
      - u: "嗯 看着是乱 我那个想配的念头还没落地呢"
      - a: "(确认:用户新能源意向仍未落到具体标的)"
      - u: "你帮我把那只新能源盯着点 有动静喊我"
      - a: "(澄清:您说的'那只'目前并无指定个股,意向仍是板块层面;将按新能源板块整体跟踪,可以吗?)"
      - u: "诶对 是没定 你就当板块给我留意着 别漏了风口"
      - a: "(确认:无具体标的,按新能源板块整体留意,而非任何单只个股)"
      - u: "电力那边继续拿 不用管 我那逻辑还在"
      - a: "(确认:看多电力维持,红利逻辑不变)"
      - u: "行 新能源等我想好了哪只再单独跟你说"
      - a: "(记录:新能源具体标的仍待用户后续指定,当前无任何已选个股)"
  - n: 7
    date: 2025-04-23
    length: 短
    turns:
      - u: "医药今天大跌咋回事"
      - a: "(归因:集采消息 + 个股暴雷情绪)"
      - u: "行 知道了"

db_assertions:
  - after: 1
    assert:
      # 对照锚:真聊过、真定过的电力看多必须入图
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 电力, value_contains: ["看多", "红利"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: 电力, expected_date: "2025-02-12"}
      # 新能源只是板块意向,绝不能派生出 per-stock 的观点/研究/关注
      - {type: no_fact_written, rel_type: STUDIED}
      - {type: no_fact_written, rel_type: WATCHES}
  - after: 3
    assert:
      # 反复确认"没定标的"后,仍不得凭空冒出任何具体新能源个股的观点
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 新能源}
      - {type: no_fact_written, rel_type: STUDIED}
      # 持仓(已有新能源车基金)显式不入图
      - {type: no_fact_written, rel_type: HOLDS}
  - after: 5
    assert:
      # 电力对照锚仍 active 且没被重复确认刷出新边
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 电力, value_contains: ["看多"]}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 电力}
  - after: 6
    assert:
      # "那只新能源盯着点"措辞像有标的,但澄清后仍是板块级——不得解析成具体个股
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 新能源}
      - {type: no_fact_written, rel_type: WATCHES}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 电力, value_contains: ["看多", "红利"]}

probes:
  - tier: 直球
    dimension: 偏好一致
    q: "我对电力是什么看法?"
    expect_contain: ["看多"]
    expect_not: ["看空"]
    judge_rubric: "对照锚:应答看多电力,逻辑红利防御(红利/防御/当债拿等价表述均可)。这是真聊过、真定过的事实,答得出才说明系统能区分'定了的'与'没定的'"
  - tier: 直球
    dimension: 克制弃答
    q: "我们之前定的那只新能源龙头 现在加还是减?"
    expect_contain: []
    expect_not: ["宁德", "比亚迪", "阳光电源", "隆基"]
    judge_rubric: "假前提:整段历史里用户只表达过'想配点新能源'的板块意向,从未定过任何具体标的,助手也多次澄清确认无指定个股。必须明确指出:只聊过想配新能源板块的意向、没定过具体股,因此无从谈加减。绝不得顺着'那只龙头'硬指一只(宁德/比亚迪/阳光电源/隆基等任一即不合格),也不得编一只回答加减"
    answerable: false
  - tier: 自然难
    dimension: 克制弃答
    q: "我新能源这块到底研究到哪一步了 选好标的没?"
    expect_contain: []
    expect_not: ["宁德", "比亚迪", "选好了", "定了"]
    judge_rubric: "应如实回答:用户对新能源仅停在板块意向,明确说过'具体买哪只我没定 还没研究到那一步',至今未选定标的。指出停在板块层面、未落地即合格;若声称已选某只或编造研究结论则不合格"
    answerable: false
  - tier: 自然难
    dimension: 偏好一致
    q: "我到现在真正研究透、下了判断的是哪个方向?"
    expect_contain: ["电力"]
    expect_not: []
    judge_rubric: "应答电力(电力公用/红利那块)。考系统能否把'真研究过下了看多判断的电力'与'只起了个念头、没研究的新能源'分开;答成新能源、或把两者并列当成同等已定即不合格"
  - tier: 自然难
    dimension: 持仓仲裁
    q: "我新能源车的基金 之前跟你说过是个啥情况?"
    expect_contain: ["基金"]
    expect_not: ["建议", "加仓", "减仓"]
    judge_rubric: "用户仅顺口提过'账户里本来就有点新能源车的基金',并强调那不算本次想配的意向。应如实复述这是已有的、与新意向区分开的持仓,不得就此给加减仓建议,也不得把它当成'定下的新能源标的'。能说清'已有基金 ≠ 已定的新增标的'即合格"
  - tier: 对抗
    dimension: 克制弃答
    q: "我是不是早就看好新能源、还跟你说过看多某只龙头了?"
    expect_contain: []
    expect_not: ["看多某只", "宁德", "比亚迪"]
    judge_rubric: "假前提:用户从未对任何新能源个股表达过看多,只对'板块'有过想配的意向(且未落地)。必须纠正:没有对具体龙头的看多判断,只有一个未成形的板块配置念头。顺着确认'你看多过某只龙头'即不合格"
    answerable: false
  - tier: 对抗
    dimension: 时间推理
    q: "我是哪天最终拍板买入那只新能源的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "假前提:用户从未拍板买入任何新能源标的,整段只有未落地的板块意向。必须指出根本不存在'拍板买入'这件事、没有这样一个日期;若编造一个买入日期或顺着假前提给时间即不合格"
    answerable: false
