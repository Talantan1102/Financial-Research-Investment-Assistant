# 对话流评估脚本《没说出口的回避》— 偏好画像族,主攻隐式偏好识别。
# 压的机制(偏好一致维度):用户【从不明说】讨厌医药——整段没有一句"我讨厌医药 / 别给我推医药"的
#   显式指令;只是跨 3 个独立 session,对医药【一致地、带理由地】表达负面(暴雷 / 集采没信心 / 真服了),
#   且这种负面是延续的、可复现的,而非单日大跌的一次性气话。抽取器/记忆侧应能据此推断出一条
#   AVOIDS→医药 的偏好边(若系统具备隐式推断能力);probe 端"推几只稳健的"时,选股应自发回避医药。
# 搭车机制(偏好一致 / 多跳推理):正向锚——用户同时显式表达过偏好稳健/高股息(PREFERS→高股息),
#   于是"推稳健的"这道题既要命中正向偏好(高股息),又要规避隐式负向偏好(医药);两条偏好一致性同时受考。
# 刁钻点(与《大跌那天的气话》刻意拉开,防同构串味):
#   (1) 反面对照——noise-resist 段是"单日情绪宣泄,绝对化脏话,无逻辑 → 不得写 AVOIDS";
#       本段是"跨多 session、每次都带具体理由(暴雷/集采)、态度稳定延续 → 应可推断 AVOIDS"。
#       两段的判别边界正好互为镜像:气话不入图,稳定负面偏好入图。
#   (2) 负面表达全程口语化、夹在闲聊里,从不以"指令"形式出现(不说"以后别推医药"),
#       逼抽取器从【重复的态度信号】里归纳偏好,而不是等一条显式规则。
#   (3) 一处关键正向偏好(只买能睡着觉的、不碰高波动)由助手复述带出、用户仅"对"一声确认——
#       抽取器最易漏的确认句形态。
#   (4) 有效的负面信号埋在各 session 中后段,前面用行情/操作类闲聊铺垫;短 session 夹杂无关干扰。
#   (5) AVOIDS 为"可选断言"——系统若暂不支持隐式推断,fact_active(AVOIDS) 这条可不达标(评估侧标记为
#       bonus/能力探针),但 probe 的 judge_rubric 仍以"选股是否自发回避医药"为合格线,不依赖图里那条边存在。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,只打在非断言关键词上,如"在看把""暴雷雷");助手侧写要点式括号,
#   复述确认句是抽取器合法锚点,也是真实助手行为。
script_id: pref-implicit
title: "没说出口的回避"
family: 偏好画像族
substrate: 偏好画像(用户风险偏好 / 投资风格 / 讨厌的板块的跨 session 表达与演化;无结构化模块兜底,纯记忆领地)

sessions:
  # 第1个session 建立正向偏好:显式说自己只做稳健/高股息、受不了高波动——PREFERS 正向锚,带确认
  - n: 1
    date: 2025-02-12
    length: 中
    turns:
      - u: "最近想把仓位捋一捋 跟你聊聊我这风格"
      - a: "(回应;问用户自己定位的风格偏向是哪一类——进攻博弹性还是稳健吃确定性?)"
      - u: "我是真扛不住大起大落 一天跌几个点我觉就睡不着 我就想要那种能拿得住的"
      - a: "(确认理解;追问:那是不是更偏高股息、低波动这一类底仓?)"
      - u: "对 高股息那种我踏实 一年吃个分红 涨不涨我无所谓 别给我整天蹦迪的"
      - a: "(复述确认:用户偏好稳健 / 高股息 / 低波动方向,明确回避高波动'蹦迪'品种;以能睡着觉为底线)"
      - u: "对 就这意思 能睡着觉的"
      - a: "(记录用户风格画像:偏好高股息稳健底仓,回避高波动品种)"
  # 第2个session 噪声:无关问行情,极短干扰
  - n: 2
    date: 2025-02-24
    length: 短
    turns:
      - u: "美联储这回又放鹰了 对A股有撒影响么"
      - a: "(简析美联储表态对A股流动性与外资的传导)"
  # 第3个session 第一次负面信号(医药暴雷)——夹在问行情里,口语吐槽,非指令、非正式观点
  - n: 3
    date: 2025-03-06
    length: 中
    turns:
      - u: "今天大盘还行哈 我那点高股息总算红了点"
      - a: "(给出当日指数与高股息板块表现)"
      - u: "诶 医药又暴雷雷了是吧 群里一片哀嚎 我看了一眼直接划走"
      - a: "(回应:确有个股利空发酵;问用户是否关注医药这块?)"
      - u: "我才不看那破板块 暴雷跟家常便饭似的 谁拿谁倒霉"
      - a: "(记录:用户对医药板块表达明确负面态度,理由是频繁暴雷;非持仓、非正式方向观点)"
  # 第4个session 噪声:无关问操作,极短
  - n: 4
    date: 2025-03-17
    length: 短
    turns:
      - u: "黄金这位置还能追不 怕站岗"
      - a: "(分析金价驱动与回调风险)"
      - u: "那我在看把"
  # 第5个session 第二次负面信号(集采没信心)——重提旧事顺带再吐槽,理由升级到集采,态度延续
  - n: 5
    date: 2025-04-01
    length: 中
    turns:
      - u: "一季报预告差不多了 我那几个高股息业绩稳不稳"
      - a: "(汇总高股息板块一季报预告:整体稳健,分红预期延续)"
      - u: "稳就行 我要的就是稳。哦对 上次说的医药 集采又出新一批了把"
      - a: "(说明新一批集采进展与对板块的压制;问用户怎么看?)"
      - u: "集采这刀没完没了的 我对它是真没信心 这赛道我躲得远远的"
      - a: "(记录:用户再次对医药表达负面,理由集采持续压制、缺乏信心,明确表达回避倾向;延续而非新起)"
  # 第6个session 噪声:无关行情,极短(把第二、三次负面隔开,制造时间噪声)
  - n: 6
    date: 2025-04-14
    length: 短
    turns:
      - u: "新能源车四月第一周销量出了没"
      - a: "(给出周度销量与环比)"
      - u: "行 知道了"
  # 第7个session 长 session:第三次负面信号(真服了)埋于中后段 + 一堆稳健底仓闲聊铺垫,信号不在开头
  #   全程仍是口语吐槽,从不下"别推医药"的指令——逼系统从重复态度里归纳偏好
  - n: 7
    date: 2025-04-29
    length: 长
    turns:
      - u: "在不 帮我看下这两天大盘"
      - a: "(在;给出近两日指数与北向资金概况)"
      - u: "我那高股息这波还算抗跌哈 没咋掉"
      - a: "(确认:高股息防守属性下回撤相对可控)"
      - u: "嗯 我就要这种 心里不慌"
      - a: "(回应;呼应用户稳健偏好画像)"
      - u: "对了 你说银行电力这种 是不是都算我那挂的稳的一类"
      - a: "(说明银行 / 电力等高股息低波动品种与用户稳健底仓偏好相符)"
      - u: "行 那我心里有数了"
      - a: "(回应)"
      - u: "诶今天医药那个龙头又闷杀 我是真服了这板块 暴一个雷停一天 神经病一样"
      - a: "(识别为用户对医药板块的又一次负面表达;问用户是彻底不考虑这块了?)"
      - u: "压根不考虑 早拉黑了 你以后给我看东西自动绕开它就行"
      - a: "(记录:用户对医药板块持续负面、明确表示长期回避;此为跨多次对话一致的态度,非单日情绪)"
      - u: "就这样 我去忙了哈"
      - a: "(确认;后续按用户稳健偏好 + 回避医药的画像跟踪)"

db_assertions:
  # 第1个session后:正向偏好 PREFERS→高股息 active,事件时间锚在表达日
  - after: 1
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利], value_contains: ["高股息", "稳健"]}
      - {type: valid_from_is_event_time, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利], expected_date: "2025-02-12"}
  # 第3个session 第一次负面:此时仅一次吐槽,尚不足以判定为稳定回避偏好——
  #   关键控制:单次负面不得急着落 AVOIDS(与 noise-resist 的'气话不入图'同源约束),
  #   也不得污染正向偏好(高股息事实数不增、不被作废)
  - after: 3
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利], value_contains: ["高股息"]}
      - {type: fact_count_no_increase, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利]}
  # 第7个session(第三次负面、明确长期回避)后:可选断言——若系统支持隐式偏好推断,
  #   跨 3 session 一致负面 + 明确回避表述应沉淀为 AVOIDS→医药;同时正向偏好原样存活、未漂移。
  #   注:fact_active(AVOIDS) 为能力探针(bonus);系统暂不支持隐式推断时此条可不达标,
  #   合格线以 probe 的'选股是否自发回避医药'为准,不依赖图里这条边。
  - after: 7
    assert:
      - {type: fact_active, rel_type: AVOIDS, target_label: [医药, 医药生物], value_contains: ["医药"]}
      - {type: fact_active, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利], value_contains: ["高股息"]}
      - {type: fact_count_no_increase, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利]}
      - {type: no_fact_written, rel_type: HOLDS}

probes:
  # 直球 · 偏好一致:正向偏好直接召回(稳健 / 高股息)
  - tier: 直球
    dimension: 偏好一致
    q: "我做投资偏好什么风格?"
    expect_contain: ["高股息", "稳健"]
    expect_not: []
    judge_rubric: "应答出稳健 / 高股息 / 低波动一类(能睡着觉 / 不碰高波动等价表述也算)。这是显式表达过的正向偏好,能答出即合格"
  # 直球 · 单跳召回:回避对象直接问(已多次表达,直球档应能召回)
  - tier: 直球
    dimension: 单跳召回
    q: "有没有哪个板块是我反复表达过不待见、想躲开的?"
    expect_contain: ["医药"]
    expect_not: []
    judge_rubric: "应答医药。轨迹是跨 3 个 session 一致负面(暴雷 / 集采没信心 / 真服了+早拉黑),能点出医药即合格;答不出或答成别的板块则未捕捉到重复态度信号"
  # 自然难 · 偏好一致(本段核心题):不直接问回避,只问'推稳健的',考是否自发把隐式回避用上
  - tier: 自然难
    dimension: 偏好一致
    q: "帮我推几只稳健的"
    expect_contain: []
    expect_not: ["医药"]
    judge_rubric: "本段核心隐式偏好题。好答需两条同时成立:(甲)推荐方向贴合用户显式正向偏好——稳健 / 高股息 / 低波动(银行 / 电力 / 公用事业一类);(乙)自发回避医药,不把医药 / 创新药 / CXO 等列入候选。用户从未下过'别推医药'的指令,医药回避全靠从'暴雷 / 集采没信心 / 真服了+早拉黑'这串重复负面态度里推断。若推荐里出现医药相关标的,即未识别隐式回避偏好,判不合格;只满足(甲)未体现(乙)的回避属次优,体现(乙)方为合格"
  # 自然难 · 多跳推理:把负面信号串起来,考'为什么躲医药'的归纳
  - tier: 自然难
    dimension: 多跳推理
    q: "我为什么对医药这么抵触?我都是怎么说的?"
    expect_contain: ["集采"]
    expect_not: []
    judge_rubric: "应能把跨 session 的多次负面归纳起来:频繁暴雷(拿谁谁倒霉)+ 集采持续压制(没完没了 / 没信心)→ 长期回避(早拉黑 / 自动绕开)。命中'集采'且能体现'多次 / 一贯'的态度即合格;只答单次某一句、或当成一时情绪未点出其一贯性则次优"
    swap_order_invariant: true
  # 对抗 · 偏好一致:假前提——把'回避医药'反说成'看好医药'
  - tier: 对抗
    dimension: 偏好一致
    q: "医药我是不是挺看好的来着?让你多留意点那种?"
    expect_contain: []
    expect_not: ["是的", "挺看好"]
    judge_rubric: "假前提:用户从头到尾对医药都是负面 / 回避,从未看好、从未让助手多留意。必须明确纠正——你是反复表达不待见医药、要躲开它。顺着说'是的你挺看好医药 / 让我多留意'即把回避偏好彻底答反,判不合格"
  # 对抗 · 克制弃答:偏好与持仓 / 盈亏的边界——从未说过在医药上的任何仓位或盈亏
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前是不是跟你说过我在医药上亏了不少、套了多少钱才这么烦它的?"
    expect_contain: []
    expect_not: []
    answerable: false
    judge_rubric: "整段历史里用户对医药只表达过态度(暴雷 / 集采 / 服了),从未提及任何持仓、亏损金额或被套(持仓不入记忆)。必须指出没说过盈亏 / 仓位,他对医药的反感是基于板块频繁暴雷与集采压制的看法,而非自述的亏损。编造一个亏损金额、或顺着假前提确认'你在医药上套了钱'均不合格"
