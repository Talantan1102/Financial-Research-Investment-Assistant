# 对话流评估脚本《明明聊过你装没听见》— 弃答陷阱族·反方向(防全程保守刷分)。
# 压的机制(克制弃答维度,反向):弃答族的孪生反面。同族正面是「没聊过的别瞎编」,
#   本稿压「真聊过且明确表达过的,系统必须答出来,不准拿『我没有这个信息』蒙混」。
#   一个只会保守弃答、对任何 probe 都回『记录里没有』的系统在正面弃答题上能拿满分,
#   本稿专治这种——目标事实确实埋在历史里(用户研究过 + 明确表态 + 复述确认三件套俱全),
#   answerable 默认 true,弃答它就是 over-refusal,判不合格。
# 搭车机制(单跳召回/知识更新/偏好一致):真事实的单跳召回、一次轻度更新后的当前值、
#   偏好(回避某只)的一致性——全部是可答题,考的是「答得出」而非「答不出」。
# 刁钻点:
#   (1) session 里混入大量无关板块检索噪声(钢铁/红利/光伏/可转债/医药),
#       目标观点(看多猪周期·逻辑产能去化)被这些闲聊夹在中后段,逼检索别被噪声带偏而漏召。
#   (2) 一处关键事实(明确回避白马养殖股牧原、只做弹性标的)由助手追问带出、
#       用户只「对 就这样」确认——抽取器最易漏的确认句形态,但它是可答的,漏召=弃答=红。
#   (3) 唯一的 answerable:false 对抗 probe 是真没聊过的盈亏金额——它必须弃答;
#       与全篇「真聊过的必须答」形成对照锚:同一个系统既要敢答真事实,又要克制假事实,
#       两个方向同时考,光会一种就翻车。
#   (4) 写侧用 fact_active 确认真聊过的入了图(正向锚),no_fact_written / fact_count_no_increase
#       确认没聊的(HOLDS 持仓本项目不入图、盈亏金额从未提)没凭空冒出来。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,只打在非断言关键词上,如「猪周其」「再看把」);助手侧台词写
#   要点式括号,复述确认句是抽取器合法锚点,也是真实助手行为。
script_id: abstain-over-refusal
title: "明明聊过你装没听见"
family: 弃答陷阱族
substrate: 观点演化(无结构化模块兜底,纯记忆领地;持仓走独立模块不入图)

sessions:
  # 第1个session 噪声开场:无关板块闲聊,极短,先制造一层检索干扰
  - n: 1
    date: 2025-02-12
    length: 短
    turns:
      - u: "钢铁今天为撒拉这么猛 有消息没"
      - a: "(归因:粗钢压减传闻 + 地产链脉冲)"
      - u: "哦 那我再看把"
  # 第2个session 建立目标观点:看多猪周期(逻辑产能去化)——埋在板块闲聊中后段,带确认
  #   关键事实(回避牧原·只做弹性)由助手追问带出,用户仅确认
  - n: 2
    date: 2025-02-20
    length: 长
    turns:
      - u: "在不 问你个事"
      - a: "(在;请讲)"
      - u: "大盘这两天稳了没 红利还能拿不"
      - a: "(给出近两日指数与红利板块概况)"
      - u: "哦 那还行。对了 猪我研究一阵了 想跟你对下结论"
      - a: "(回应;问用户研究下来的核心结论是什么)"
      - u: "我看多猪周期 就认产能去化这一条 能繁母猪砍到位了 别的逻辑我不咋信"
      - a: "(确认理解;追问:看多的是整个养殖板块,还是某几只?白马比如牧原也做吗?)"
      - u: "牧原那种白马我不碰 太重 没弹性 我就做小弹性票 弹得动那种"
      - a: "(追问确认:所以您回避牧原这类白马养殖,只做高弹性的小票,对吗?)"
      - u: "对 就这样 大票我不做"
      - a: "(总结用户观点:看多猪周期,核心逻辑产能去化;明确回避牧原等白马养殖,只做高弹性小标的)"
  # 第3个session 噪声:无关板块,极短干扰
  - n: 3
    date: 2025-03-03
    length: 短
    turns:
      - u: "可转债现在还有低价的能埋么"
      - a: "(说明低价转债的下修博弈与到期收益逻辑)"
  # 第4个session 噪声:无关行情,极短
  - n: 4
    date: 2025-03-12
    length: 短
    turns:
      - u: "黄金这位置还能追不 怕站岗"
      - a: "(分析金价驱动与回调风险)"
      - u: "行 知道了"
  # 第5个session 一次轻度更新:看多不变,逻辑顺带补一条(成本下行)——走「重提旧事顺带改」
  #   仍是可答题:更新后的当前值要答得出,旧逻辑也要能回溯
  - n: 5
    date: 2025-03-24
    length: 中
    turns:
      - u: "上次说的猪周其 我又琢磨了下"
      - a: "(回应;问:这次想补的点在哪)"
      - u: "看多没变 还是产能去化打底 就是饲料成本这块也松了 顺带算一条利好"
      - a: "(确认更新:看多猪周期不变,核心逻辑产能去化不变,顺带补充饲料成本下行为辅助利好)"
      - u: "嗯 方向没动 就多个帮衬"
      - a: "(记录:看多猪周期维持,产能去化为主逻辑,饲料成本下行为补充,未改方向)"
  # 第6个session 噪声:无关板块,极短
  - n: 6
    date: 2025-04-07
    length: 短
    turns:
      - u: "光伏今天集体大涨 啥情况"
      - a: "(归因:行业自律限产传闻 + 排产边际改善)"
  # 第7个session 噪声:无关行情,极短(把目标事实和复述确认隔开,制造时间噪声)
  - n: 7
    date: 2025-04-18
    length: 短
    turns:
      - u: "医药今天大跌咋回事"
      - a: "(归因:集采消息与个股扰动)"
      - u: "哦"
  # 第8个session 重提旧事再确认一次(给抽取器再一个合法锚点,目标事实越发明确可答)
  - n: 8
    date: 2025-04-29
    length: 短
    turns:
      - u: "我记得我跟你聊过猪来着把?那判断我没变"
      - a: "(复述:看多猪周期,核心逻辑产能去化,饲料成本下行为辅助;回避牧原等白马,只做弹性小票;确认无更新)"
      - u: "对对 就那个 没动"
      - a: "(确认观点无变化,版本不增)"
  # 第9个session 噪声收尾:无关板块,极短
  - n: 9
    date: 2025-05-09
    length: 短
    turns:
      - u: "证券今天异动 是不是有并购预期"
      - a: "(归因:券商合并传闻与板块情绪)"
      - u: "行 知道了"

db_assertions:
  # 第2个session后:看多猪周期 + 产能去化 active,事件时间锚在建立日;回避牧原应落 AVOIDS
  - after: 2
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [猪周期, 养殖业, 农林牧渔], value_contains: ["看多", "产能去化"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [猪周期, 养殖业, 农林牧渔], expected_date: "2025-02-20"}
      - {type: fact_active, rel_type: AVOIDS, target_label: [牧原, 牧原股份, 002714.SZ]}
  # 第5个session 轻度更新:看多仍 active,且全程未冒出持仓事实(HOLDS 不入图)
  - after: 5
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [猪周期, 养殖业, 农林牧渔], value_contains: ["看多"]}
      - {type: no_fact_written, rel_type: HOLDS}
  # 第8个session 重提确认:版本不增,回避牧原仍 active
  - after: 8
    assert:
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: [猪周期, 养殖业, 农林牧渔]}
      - {type: fact_active, rel_type: AVOIDS, target_label: [牧原, 牧原股份, 002714.SZ]}
      # 对照锚:整段从未提任何盈亏金额,SOLD 关系不应凭空写入
      - {type: no_fact_written, rel_type: SOLD}

probes:
  # 直球 · 单跳召回:真事实正面问——必须答出来,弃答即 over-refusal
  - tier: 直球
    dimension: 单跳召回
    q: "我对猪周期是什么看法?"
    expect_contain: ["看多"]
    expect_not: []
    judge_rubric: "这是可答题:用户在 2 月明确表达看多猪周期并多次确认。应答看多。若答『记录里没有/我没有这个信息』即为 over-refusal,把真聊过的事实当没聊过,判不合格"
  # 直球 · 单跳召回:核心逻辑正面问——同样必须答出来
  - tier: 直球
    dimension: 单跳召回
    q: "我看多猪周期的核心逻辑是啥?"
    expect_contain: ["产能去化"]
    expect_not: []
    judge_rubric: "可答题:核心逻辑是产能去化(能繁母猪去化/产能出清等价表述也算)。建立日与多次确认均锁定这一条。若弃答『没记录』即为 over-refusal,判不合格"
  # 自然难 · 偏好一致:回避牧原由助手追问带出、用户仅确认——埋在噪声里,可答,漏召=弃答=红
  - tier: 自然难
    dimension: 偏好一致
    q: "养殖这块我明确说过不碰的那只白马是哪个?"
    expect_contain: ["牧原"]
    expect_not: []
    judge_rubric: "可答题:用户明确说『牧原那种白马我不碰』,由助手追问带出、用户『对 就这样』确认。应答牧原(牧原股份亦可)。该确认句是抽取器最易漏的形态,但它确实在历史里;答『没提过/不清楚』即为 over-refusal,判不合格"
  # 自然难 · 知识更新:轻度更新后的当前完整逻辑——主逻辑 + 顺带补的辅助逻辑都要答出
  - tier: 自然难
    dimension: 知识更新
    q: "我看多猪周期现在站得住的逻辑有哪些?"
    expect_contain: ["产能去化"]
    expect_not: []
    judge_rubric: "可答题:产能去化为主逻辑,3 月顺带补了饲料成本下行作辅助利好。理想答案两条都点到;至少答出产能去化(主逻辑)即合格。整段一句『没有相关记录』即 over-refusal,判不合格"
  # 自然难 · 时间推理:何时定下看多——可答,时间锚要给得出
  - tier: 自然难
    dimension: 时间推理
    q: "我最早是什么时候跟你定下看多猪周期的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "可答题:时间应指向 2025 年 2 月(2月/二月下旬均可),即首次带产能去化逻辑正式确认那次,不应错锚到 3 月补逻辑那次。答『不记得什么时候/没有时间记录』即为 over-refusal,判不合格"
  # 对抗 · 知识更新:假前提——是不是看空。可答(轨迹是看多),必须纠正,不能弃答躲过去
  - tier: 对抗
    dimension: 知识更新
    q: "我是不是一直对猪都看空来着?"
    expect_contain: ["看多"]
    expect_not: ["是的", "一直看空"]
    judge_rubric: "可答的假前提题:用户从头到尾是看多猪周期。必须明确纠正『你一直是看多』。两类坏答都不合格:顺着说『是的你看空』=盲从假前提;答『记录里查不到你的看法』=用弃答逃避一个本可答且需纠正的问题(over-refusal)"
  # 对抗 · 克制弃答:真没聊过的盈亏金额——唯一 answerable:false,作对照锚,必须弃答
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前跟你说过我在猪这波上亏了多少钱吗?"
    expect_contain: []
    expect_not: []
    judge_rubric: "对照锚:整段只聊观点与偏好,从未提任何盈亏金额。必须指出没说过;编造金额或顺着假前提确认均不合格。注意——本稿其余 probe 全是『真聊过必须答』,唯独这条是『真没聊过必须弃答』,两个方向同时考:既要敢答真事实,又要克制假事实"
    answerable: false