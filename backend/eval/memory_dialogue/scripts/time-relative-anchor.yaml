# 对话流评估脚本《上周让你盯的那个位》— 时间事件族·相对时间锚定段。
# 压的机制(时间推理维度):用户从不报绝对日期,全用相对表述定事——
#   「上周让你盯的那个止损位」(陈述当日往回一周指向某事件)、「三个月前我说看好的那条线」(往回三个月指向另一事件)。
#   substrate = 带日期的观点/研究/事件,跨 session 演化;每条事实的事件时间(valid_from)必须锚到「用户陈述当日」,
#   而不是用户嘴里那句相对话的字面("上周"不是写入日期,陈述那天才是)。
# 考的是:抽取器写入时把相对时间正确折算成绝对事件日期落库;读取时追问("我那条线是几月看好的")
#   能把相对表述还原成当初的绝对日期作答,而不是按"提问当下"重新往回数三个月。
# 搭车机制:单跳召回(止损位盯的是哪个标的)、多跳推理(止损位事件 vs 看好那条线 两件事谁先谁后)、
#   作废历史可问(看好那条线后来证伪转看空,旧版本留链)、克制弃答(从没说过的盈亏)、对抗假前提(把两个相对锚张冠李戴)。
# 刁钻点:
#   (甲)probe 在最后一个 session 追问,距两个事件已隔多日;若抽取器按"现在往回三个月"重算,会指错月份——
#        正确答案恒等于事件发生那天的绝对日期(2025-02-12),不随提问时间漂移(swap_order_invariant 守这个稳定性);
#   (乙)止损位由助手复述带出、用户只"对"一声确认(抽取器最易漏的确认句形态);
#   (丙)"上周"和"三个月前"两个相对锚指向两件不同的事、不同的标的,对抗题故意把它俩对调,必须纠正不能顺。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,如「在看把」「房向」「迟到肉」——抽取器就该扛住这种真实输入);
#   错别字只打在非断言、非时间词上(时间词"上周/三个月前/上礼拜"绝不打错,否则锚定逻辑被污染)。
#   助手侧台词写要点,负责复述确认(给抽取器的合法锚点,也是真实助手行为)。
# 硬约束:substrate 是观点/研究/事件,不是持仓——止损位是用户让助手"盯"的一个价格关注位(WATCHES),
#   不入持仓图;散户口语顺带提操作可以,断言绝不围绕股数/金额。
script_id: time-relative-anchor
title: "上周让你盯的那个位"
family: 时间事件族
substrate: 带日期的观点/研究/事件(相对时间锚定;无结构化模块兜底,纯记忆领地)

sessions:
  - n: 1
    date: 2025-02-12
    length: 长
    turns:
      - u: "恒生科技这波我研究了挺久 想跟你正式说下我的判断"
      - a: "(回应;请用户把判断讲清楚)"
      - u: "我看好它 就一条线 互联网平台降本增效 利润修复这条 我赌的就是这个"
      - a: "(确认理解:看好恒生科技,核心逻辑是平台降本增效带来利润修复?)"
      - u: "对 就这条线 别的我不碰 AI 那些噱头我不信"
      - a: "(追问:这条线您打算拿多久?当长线跟还是短打?)"
      - u: "长线跟 起码到年底 中途震我也不下车"
      - a: "(记录:看好恒生科技,逻辑利润修复,定位长线持有跟踪)"
      - u: "还有个事 你帮我盯个位 跌破我就得重新想想"
      - a: "(请用户给出这个关注的价格位)"
      - u: "就盯这条线的那个关键支撑 破了说明逻辑先崩了一半 你给我盯紧点"
      - a: "(复述确认:在恒生科技上设一个关键支撑作为观察止损位,跌破则触发逻辑复核,我会帮您盯)"
      - u: "对 就这么定 破了第一时间叫我"
      - a: "(确认:已记录恒生科技的看好逻辑与该止损观察位,跌破即提示)"
  - n: 2
    date: 2025-02-25
    length: 短
    turns:
      - u: "美联储这次纪要偏鹰么 对港股流动性压不压"
      - a: "(简析纪要基调与港股流动性传导)"
  - n: 3
    date: 2025-03-14
    length: 短
    turns:
      - u: "黄金又张上去了 这位置还能追不 怕站岗"
      - a: "(分析金价驱动与回调风险)"
      - u: "那我在看把"
  - n: 4
    date: 2025-04-10
    length: 中
    turns:
      - u: "新能源车四月第一周销量出了没 群里吵翻了"
      - a: "(给出周度销量与环比)"
      - u: "哦行 知道了。对了 上周让你盯的那个止损位 现在啥情况了"
      - a: "(复述确认锚点:您指的是 2 月在恒生科技上设的那个关键支撑观察位;给出当前价距该位的位置关系)"
      - u: "嗯就那个 还没破吧 那我先不动"
      - a: "(确认:止损位未触发,维持原看好观点不变)"
  - n: 5
    date: 2025-05-16
    length: 长
    turns:
      - u: "恒生科技这阵子我有点动摇 想跟你过一遍"
      - a: "(复述用户已有观点:看好恒生科技、逻辑利润修复、长线;问哪里动摇)"
      - u: "三个月前我说看好的那条线 利润修复那条 我现在觉得不成立了"
      - a: "(确认锚点:您指的是 2 月那次定下的、看好恒生科技利润修复这条线?)"
      - u: "对就那条 财报出来降本是降了 可收入也塌了 利润根本没修复 这房向我看错了"
      - a: "(说明:近期平台财报确实呈现降本但营收承压、利润修复证伪的特征)"
      - u: "那我看好就收回 转看空吧 这条线我认栽了 不是震仓那种 是逻辑本身废了"
      - a: "(确认更新:对恒生科技由看好转看空,触发因素是财报显示利润修复逻辑被证伪)"
      - u: "那个止损位也别盯了 都看空了还盯啥 撤了把"
      - a: "(确认:撤下原止损观察位;记录观点由看好翻为看空,原利润修复逻辑作废)"
      - u: "嗯 后面真有反转再说"
      - a: "(确认;提示后续按看空跟踪,若基本面反转再复盘)"
  - n: 6
    date: 2025-06-06
    length: 中
    turns:
      - u: "医药今天大跌咋回事 是不是又集采了"
      - a: "(归因:集采消息与个股情绪)"
      - u: "行知道了。我再问你个事 我恒生科技现在到底啥态度来着 自己有点记岔"
      - a: "(复述:当前为看空,因利润修复逻辑被财报证伪;最早 2 月是看好、逻辑利润修复)"
      - u: "对对 就这样 没记错"
      - a: "(确认无更新)"

db_assertions:
  - after: 1
    assert:
      # 事件时间锚到陈述当日 2025-02-12,不是用户后面会说的"上周/三个月前"那种相对字面
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [恒生科技, 恒生科技指数], value_contains: ["看好", "利润修复"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [恒生科技, 恒生科技指数], expected_date: "2025-02-12"}
      # 止损位是 WATCHES(让助手盯的观察位),由助手复述、用户确认带出;同样锚到陈述当日
      - {type: fact_active, rel_type: WATCHES, target_label: [恒生科技, 恒生科技指数], value_contains: ["支撑"]}
      - {type: valid_from_is_event_time, rel_type: WATCHES, target_label: [恒生科技, 恒生科技指数], expected_date: "2025-02-12"}
  - after: 4
    assert:
      # n4 只是用相对话"上周让你盯的"回指旧锚 + 确认未触发,不得新增/作废任何事实
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: [恒生科技, 恒生科技指数]}
      - {type: fact_count_no_increase, rel_type: WATCHES, target_label: [恒生科技, 恒生科技指数]}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [恒生科技, 恒生科技指数], value_contains: ["看好"]}
  - after: 5
    assert:
      # 看好→看空翻转:新看空 active,旧看好作废留链;翻转事件时间锚到陈述当日 2025-05-16
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [恒生科技, 恒生科技指数], value_contains: ["看空"]}
      - {type: old_invalidated, rel_type: EXPRESSED_VIEW, target_label: [恒生科技, 恒生科技指数], min_count: 1}
      - {type: invalidated_chain_intact, rel_type: EXPRESSED_VIEW, target_label: [恒生科技, 恒生科技指数], expected_versions: 2}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [恒生科技, 恒生科技指数], expected_date: "2025-05-16"}
  - after: 6
    assert:
      # n6 纯复述确认,事实数不增;看空仍 active
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: [恒生科技, 恒生科技指数]}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [恒生科技, 恒生科技指数], value_contains: ["看空"]}

probes:
  - tier: 直球
    dimension: 知识更新
    q: "我现在对恒生科技是什么态度?"
    expect_contain: ["看空"]
    expect_not: ["看好"]
    judge_rubric: "应答当前为看空;若答看好即旧事实未作废,判不合格"
  - tier: 直球
    dimension: 时间推理
    q: "我那条看好恒生科技的线,是几月定下的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "应把相对表述锚成绝对日期作答:指向 2025 年 2 月(2月/二月/年初均可),对应首次成形的事件时间 2025-02-12。关键考点——不得按提问当下(6月)往回数三个月去算成 3 月;若答 3 月或晚于 2 月即把相对锚按当前时间重算了,判不合格"
  - tier: 自然难
    dimension: 单跳召回
    q: "我之前让你帮我盯的那个止损位,是盯哪只/哪条线的?"
    expect_contain: ["恒生科技"]
    expect_not: []
    judge_rubric: "应答恒生科技(那条利润修复线的关键支撑位)。该止损位由助手复述带出、用户仅'对'一声确认——考抽取器对确认句的捕捉;答成黄金/新能源等随口问过的干扰项即不合格"
  - tier: 自然难
    dimension: 多跳推理
    q: "我让你盯止损位，和我说看好那条线，是同一次说的还是分两次?哪个在前?"
    expect_contain: []
    expect_not: []
    judge_rubric: "应答:都在 2 月那同一次对话里定下(看好利润修复这条线在前、紧接着才让助手盯止损位),是同一天同一次。能锚到同为 2025-02-12 这一天、且看好在前止损位在后即合格;若把两者拆成不同月份(说明被相对锚误导成两个时点)则不合格"
    swap_order_invariant: true
  - tier: 自然难
    dimension: 时间推理
    q: "我是什么时候把恒生科技从看好翻成看空的?为什么?"
    expect_contain: []
    expect_not: []
    judge_rubric: "时间应指向 2025 年 5 月(五月/5月均可),对应翻转事件时间 2025-05-16;原因应答财报显示降本但收入塌、利润修复逻辑被证伪。时点答成 2 月(初始看好)即时间线错位,不合格"
  - tier: 对抗
    dimension: 时间推理
    q: "我上周不是刚跟你说看好恒生科技、还让你新盯一个止损位么?"
    expect_contain: []
    expect_not: ["是的"]
    judge_rubric: "假前提:'上周'根本没有这回事——看好与设止损位都在 2 月(2025-02-12)那次,且最近一次(5月)是翻成看空、撤掉止损位。必须纠正这个被错按当前时间挪到'上周'的相对锚;顺着说'是的你上周看好并新设了止损位'即不合格"
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前跟你说过我在恒生科技这波上亏了多少个点吗?"
    expect_contain: []
    expect_not: []
    answerable: false
    judge_rubric: "整段历史只聊观点演化、止损观察位与时间锚,从未提及任何盈亏点数或金额(持仓盈亏不入记忆)。必须指出没说过;编造点数或顺着假前提确认均不合格"
