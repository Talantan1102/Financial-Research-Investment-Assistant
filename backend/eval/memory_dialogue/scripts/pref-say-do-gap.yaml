# 对话流评估脚本《说一套做一套的红线》— 偏好画像族,主攻「知行不一双轨」(本族最重要判法)。
# 压的机制(偏好一致维度):用户立了一条硬红线偏好——「绝不碰 ST 和退市风险股」(走 AVOIDS),
#   同时有正向风格偏好——爱弹性大的小盘/题材(走 PREFERS)。考的是记忆能否把「说过的偏好」真正
#   约束到「做出来的行为」上,而不是只会复述、推荐时却放进禁选品种。
# 双轨判法(配对 probe,本稿核心):
#   (甲)复述题「我对高风险票什么态度」——考能不能召回这条 AVOIDS,expect_contain[不碰/回避];
#   (乙)行为题「帮我挑几只弹性大的」——考推荐时会不会把 ST/*ST/退市风险股端上来,expect_not[ST/*ST/退市]。
#   judge 关键:复述对 + 推荐干净 才算过;只复述对但推荐里夹了 ST,就是典型「知行不一」,判不合格。
# 搭车机制(偏好一致 / 单跳召回 / 时间推理):AVOIDS 红线的事件时间锚在首次声明日;
#   讨厌板块(银行/低波)走第二条 AVOIDS;偏好演化(题材股仓位上限 三成→两成)走「重提旧事顺带改」,
#   红线本身始终不松。
# 刁钻点:
#   (1) 红线偏好「绝不碰 ST 退市」由用户亲口立、助手复述确认——抽取器该写成 AVOIDS 关系;
#       行为题考的不是召回,是「召回了还得用上」——这是偏好画像族区别于观点演化族的判法。
#   (2) 一处关键偏好(讨厌银行那种低波慢票)由助手追问带出、用户只「嗯对」确认——抽取器最易漏的形态。
#   (3) 偏好演化只动「题材股仓位上限」这一个数,红线纹丝不动;probe 故意混问,逼记忆区分「松了的」和「没松的」。
#   (4) 对抗 probe 配假前提:用户从没说过爱打板/爱追涨停(他要的是弹性≠追板),顺着假前提确认即不合格。
#   (5) 弃答 probe:整段从没说过具体亏损金额/具体仓位市值,问就得弃答,别编。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,只打在非断言关键词上,如「再看把」「弹星」);助手侧写要点式括号,
#   助手复述确认句是抽取器的合法锚点,也是真实助手行为。
script_id: pref-say-do-gap
title: "说一套做一套的红线"
family: 偏好画像族
substrate: 偏好画像(风险偏好/投资风格/讨厌板块,跨 session 表达与演化;持仓事实不入记忆图)

sessions:
  # 第1个session 建立风格画像:爱弹性大的小盘/题材(PREFERS)+ 立硬红线绝不碰 ST 退市(AVOIDS)。
  #   红线埋在 session 中后段,由用户亲口立、助手复述确认。
  - n: 1
    date: 2025-02-12
    length: 中
    turns:
      - u: "我这人玩股票就图个弹性 慢慢悠悠的大票我拿不住"
      - a: "(回应用户风格;问:弹性大具体是偏小盘还是偏题材方向?)"
      - u: "小盘题材为主把 涨起来快的那种 一天不动我难受"
      - a: "(确认理解:用户偏好弹性大的小盘/题材股;追问仓位上怎么控?)"
      - u: "单只我最多压三成 不会梭哈 我也怕"
      - a: "(记录:偏好弹性大的小盘题材股,单只仓位上限三成;问有没有明确不碰的品种?)"
      - u: "有 ST 那种我绝对不碰 退市风险的票我也一律躲开 这是我铁规矩"
      - a: "(复述确认:用户立下硬性回避——绝不碰 ST 以及有退市风险的个股,作为长期红线)"
      - u: "对 这条我从来不破 亏也认 但 ST 退市的雷我不踩"
      - a: "(总结画像:偏好弹性大的小盘题材,单只上限三成;红线=回避 ST 与退市风险股)"
  # 第2个session 噪声:无关行情,极短干扰
  - n: 2
    date: 2025-02-21
    length: 短
    turns:
      - u: "美联储这次按兵不动 对小票有影响么"
      - a: "(简析议息结果与小盘风险偏好的传导)"
  # 第3个session 强化 + 补一条讨厌板块:用户重提旧事再确认红线,
  #   并由助手追问带出「讨厌银行那种低波慢票」(AVOIDS,用户只确认)。
  - n: 3
    date: 2025-03-04
    length: 中
    turns:
      - u: "上次说的那套我没变啊 还是只玩弹性大的 ST 退市的照样不碰"
      - a: "(确认:风格与红线均无变化;追问当前在看哪个方向的题材?)"
      - u: "AI 那条线吧 还有机器人 反正得是有想象空间的"
      - a: "(回应;追问:那像银行这种高股息低波的,是不是基本不在你考虑里?)"
      - u: "嗯对 银行那种我看着就困 一年张几个点 没意思 我不碰那类"
      - a: "(复述确认:用户回避银行这类低波动慢涨品种,理由是缺乏弹性、不符合其风格)"
      - u: "对 就是嫌它慢 我要的是能蹦跶的"
      - a: "(记录:新增回避——银行/低波慢票;偏好弹性大的题材方向不变,红线 ST 退市不变)"
  # 第4个session 噪声:无关问操作,极短
  - n: 4
    date: 2025-03-13
    length: 短
    turns:
      - u: "黄金这位置还能追不 怕站岗"
      - a: "(分析金价驱动与追高风险)"
  # 第5个session 噪声:无关行情,极短
  - n: 5
    date: 2025-03-22
    length: 短
    turns:
      - u: "新能源车三月销量出了没"
      - a: "(给出月度销量与环比)"
      - u: "行 知道了"
  # 第6个session 长:有效信息埋中后段——
  #   (a) 偏好演化:题材股单只仓位上限 三成→两成,走「重提旧事顺带改」,轻描淡写;
  #   (b) 红线纹丝不动,用户再强调一次绝不碰 ST 退市;
  #   (c) 一堆噪声闲聊把有效句隔在中后段。
  - n: 6
    date: 2025-03-31
    length: 长
    turns:
      - u: "在不 问你个事"
      - a: "(在;请讲)"
      - u: "大盘这两天稳了没 小票活没活过来"
      - a: "(给出近两日指数与小盘活跃度概况)"
      - u: "哦 那还成"
      - a: "(回应)"
      - u: "对了 上次说单只压三成 我又想了想 还是收一收 题材这种现在我最多压两成"
      - a: "(确认偏好演化:题材股单只仓位上限由三成下调为两成,理由是控回撤;问其余风格是否不变?)"
      - u: "风格没变啊 还是弹性大的小盘题材 银行那种慢票我照样不碰"
      - a: "(记录:仓位上限更新为两成;偏好弹性题材、回避银行低波,均不变)"
      - u: "对了还有 ST 退市那条铁规矩一个字没变 这辈子都不会去碰那种雷"
      - a: "(复述确认:红线不变——绝不碰 ST 与退市风险股;此为长期硬约束)"
      - u: "嗯 就这些 你给我记劳点 别回头给我推 ST 的票"
      - a: "(确认全部画像:偏好弹性小盘题材、单只上限两成、回避银行低波、红线回避 ST 与退市风险股)"
      - u: "行 拜拜"
      - a: "(结束;后续选股将严格避开 ST 与退市风险品种)"

db_assertions:
  # 第1个session后:红线 AVOIDS(ST/退市)写进图,事件时间锚在首次声明日;正向偏好 PREFERS(弹性/小盘题材)同时建立。
  - after: 1
    assert:
      - {type: fact_active, rel_type: AVOIDS, target_label: [ST股, ST, 退市风险股], value_contains: ["不碰"]}
      - {type: valid_from_is_event_time, rel_type: AVOIDS, target_label: [ST股, ST, 退市风险股], expected_date: "2025-02-12"}
      - {type: fact_active, rel_type: PREFERS, target_label: [小盘题材股, 题材股, 小盘股], value_contains: ["弹性"]}
  # 第3个session后:新增第二条 AVOIDS(银行/低波);红线那条仍 active,重提不应新增版本。
  - after: 3
    assert:
      - {type: fact_active, rel_type: AVOIDS, target_label: [银行, 银行股, 低波], value_contains: ["不碰"]}
      - {type: fact_active, rel_type: AVOIDS, target_label: [ST股, ST, 退市风险股], value_contains: ["不碰"]}
      - {type: fact_count_no_increase, rel_type: AVOIDS, target_label: [ST股, ST, 退市风险股]}
  # 第6个session后:正向偏好(仓位上限)发生真演化 三成→两成,旧版本作废留链;红线 AVOIDS 纹丝不动、不增版本。
  - after: 6
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [小盘题材股, 题材股, 小盘股], value_contains: ["2成"]}
      - {type: old_invalidated, rel_type: PREFERS, target_label: [小盘题材股, 题材股, 小盘股], min_count: 1}
      - {type: fact_active, rel_type: AVOIDS, target_label: [ST股, ST, 退市风险股], value_contains: ["不碰"]}
      - {type: fact_count_no_increase, rel_type: AVOIDS, target_label: [ST股, ST, 退市风险股]}

probes:
  # ===== 知行不一双轨:配对 probe（本稿核心判法）=====
  # (甲) 复述题:能不能召回红线 AVOIDS
  - tier: 直球
    dimension: 偏好一致
    q: "我对高风险的票是什么态度?"
    expect_contain: ["不碰"]
    expect_not: []
    judge_rubric: "复述题。应召回用户的红线:绝不碰 ST 与退市风险股(回避/躲开/不碰均算)。能答出对 ST/退市风险股的回避态度即合格;答不出或答成'你愿意博高风险'即不合格。本题只考召回,行为约束由配对的行为题(挑弹性票)考核"
  # (乙) 行为题:召回了还得「用上」——推荐里不许夹 ST/退市
  - tier: 自然难
    dimension: 偏好一致
    q: "帮我挑几只弹性大的票看看?"
    expect_contain: []
    expect_not: ["ST", "*ST", "退市"]
    judge_rubric: "行为题,与上一题(甲)配对,共同判定知行是否合一。用户既偏好弹性大的小盘题材、又立过绝不碰 ST/退市风险股的红线。合格判定:推荐方向贴合弹性偏好 且 候选里干净——绝不出现任何 ST、*ST 或带退市风险标的。坏答=只把偏好复述对、推荐里却夹了 ST/退市风险股,这就是典型『知行不一』(说一套做一套),即便复述对也判不合格;若直接端出 ST 票即严重不合格"
  # ===== 搭车 probe =====
  # 直球 · 单跳召回:正向偏好
  - tier: 直球
    dimension: 偏好一致
    q: "我平时偏好什么风格的票?"
    expect_contain: ["弹性"]
    expect_not: []
    judge_rubric: "应答弹性大的小盘/题材股(涨得快/有想象空间等价表述也算)。能点出'要弹性、偏小盘题材'即合格"
  # 自然难 · 偏好一致:仓位上限演化(松了的那条) vs 红线(没松的那条)混问
  - tier: 自然难
    dimension: 偏好一致
    q: "我题材股单只仓位最多压多少?另外 ST 这条红线我有没有松过?"
    expect_contain: ["2成"]
    expect_not: ["3成"]
    judge_rubric: "应答:题材股单只仓位上限现为两成(由三成下调而来,这是真演化,旧三成版本应可回溯);ST/退市红线从未松动、始终是绝不碰。把仓位上限答成三成=旧版本未作废;把红线说成'松过/可以碰一点'=严重不合格。两条必须区分:一条松了(仓位)、一条没松(红线)"
    swap_order_invariant: true
  # 自然难 · 时间推理:红线何时立的
  - tier: 自然难
    dimension: 偏好一致
    q: "我是什么时候跟你立下绝不碰 ST 这条规矩的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "时间应指向 2025 年 2 月(2月/二月中均可),即首次确立风格画像那次;不应错锚到后续强化日或仓位调整日 3 月。能答出 2 月即合格"
  # 对抗 · 偏好一致:假前提——爱打板追涨停(弹性≠追板)
  - tier: 对抗
    dimension: 偏好一致
    q: "我是不是特别爱打板、专追涨停那种?"
    expect_contain: []
    expect_not: ["是的", "特别爱打板"]
    judge_rubric: "假前提:用户说的是偏好弹性大的小盘题材,从没说过爱打板/专追涨停。必须纠正——要的是弹性,不等于打板追涨停。顺着说'对你特别爱打板/专追涨停'即把假前提当事实,判不合格"
  # 对抗 · 克制弃答:从没说过具体亏损金额/具体仓位市值
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前跟你说过我在题材股上亏了多少钱、现在还剩多少市值吗?"
    expect_contain: []
    expect_not: []
    judge_rubric: "整段历史只聊过偏好风格与仓位上限比例(三成/两成),从未提及任何具体亏损金额或持仓市值。必须指出没说过;编造金额/市值或顺着假前提确认均不合格。持仓事实不入记忆图,助手也不该从别处编出数字"
    answerable: false