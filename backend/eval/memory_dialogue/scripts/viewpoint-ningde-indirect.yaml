# 对话流评估脚本《宁王观点的指代迷宫》— 间接指代推翻 + 读侧别名一致。
# 压的机制(知识更新维度):写侧实体对齐——建立观点时用全名「宁德时代」(台词
# 可走黑话「宁王」),后续每一次推翻都只用指代(「那只新能源」「宁王那个」),
# 绝不复述全名。考的是抽取器能否把指代回指到同一实体节点上,而不是
# 新开一个「新能源」节点导致旧观点不被作废、新旧并存。
# 搭车机制(单跳召回/知识更新):读侧别名一致——probe 问的时候换叫法
# (「宁德」「宁王」「那个动力电池龙头」),系统不能因为换了个名字就答旧值
# 或答不出;答案应稳定指向同一实体的当前事实。
# 刁钻点:
#   (1) 推翻链路全程指代,全名只在 session 1 建仓时出现一次 + 助手复述里出现;
#       中间「部分更新」也用指代,逼抽取器跨 session 维持指代消解。
#   (2) 一处关键事实(没研究亿纬锂能)由助手追问带出、用户只「嗯对」确认——
#       抽取器最易漏的确认句形态。
#   (3) 对抗 probe 配假前提:用户从未在宁德上「赌过钠电池」(钠电只是别人群里说的,
#       用户明确没跟),顺着假前提确认即不合格。
#   (4) 短 session 大量干扰(钢铁/创新药/可转债/美股),有效信息埋中后段。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
# 同音错字是真人指纹,只打在非断言关键词上,如「在看把」「钠电次」);助手侧台词
# 写要点式括号,负责复述确认(给抽取器的合法锚点,也是真实助手行为)。
script_id: viewpoint-ningde-indirect
title: "宁王观点的指代迷宫"
family: 观点演化族
substrate: 观点演化(无结构化模块兜底,纯记忆领地;持仓事实不入记忆图)

sessions:
  - n: 1
    date: 2025-02-10
    length: 中
    turns:
      - u: "宁德时代这波回调 你怎么看 我自己研究下来觉得能拿"
      - a: "(分析回调原因:碳酸锂价格、海外需求、储能放量;问用户研究的落点在哪)"
      - u: "我看多 主逻辑就一条 一体化成本 别人打不过它这个本"
      - a: "(回应观点;追问:看多基于成本护城河,持有视角是中长线还是博弹性?)"
      - u: "中长线吧 反正成本这条没破我就拿着 宁王我认这个"
      - a: "(确认理解;追问:动力电池这一档里还看别的吗,比如亿纬锂能?)"
      - u: "亿纬我没碰 没研究 不在我框框里"
      - a: "(总结用户观点:看多宁德时代,逻辑一体化成本,中长线持有,亿纬锂能未覆盖)"
  - n: 2
    date: 2025-02-19
    length: 短
    turns:
      - u: "钢铁今天为啥拉这么猛 有消息么"
      - a: "(归因:粗钢压减传闻 + 地产链脉冲)"
  - n: 3
    date: 2025-03-04
    length: 短
    turns:
      - u: "创新药板块还能追不 怕站岗"
      - a: "(分析BD出海逻辑与拥挤度风险)"
      - u: "那我在看把"
  - n: 4
    date: 2025-03-13
    length: 中
    turns:
      - u: "碳酸锂跌到这位置 我那只新能源还扛得住么"
      - a: "(给出碳酸锂价格走势;确认您说的那只是宁德时代?)"
      - u: "对 就它。我又琢磨了下 光成本这条太单薄了 得加上储能放量这条一起看"
      - a: "(确认更新:看多宁德时代不变,逻辑由单一成本扩为成本 + 储能放量双支撑)"
      - u: "嗯 逻辑我补一条 没变方向"
      - a: "(记录:看多宁德时代不变,持有视角不变,逻辑补充储能放量)"
  - n: 5
    date: 2025-03-25
    length: 短
    turns:
      - u: "可转债现在还有低价的能埋么"
      - a: "(说明低价转债的下修博弈与到期收益逻辑)"
  - n: 6
    date: 2025-04-08
    length: 长
    turns:
      - u: "一季报陆续出了 新能源整体啥情况 我那只呢"
      - a: "(汇总新能源一季报:分化明显;问您说的那只是宁德时代,要看它哪块)"
      - u: "对 宁王那个。储能这块我盯的 它一季度怎样"
      - a: "(给出宁德时代储能业务:增速放缓,海外大储招标节奏不及预期)"
      - u: "储能也熄火了?那我那条逻辑不就空了一半"
      - a: "(确认:用户对宁德时代的双支撑里,储能放量这条被一季报弱化)"
      - u: "群里还有人说它后面要押钠电池二次曲线 你怎么看这事"
      - a: "(分析钠电池量产节奏与对宁德的实际盈利贡献,提示偏主题;问用户自己跟不跟这条)"
      - u: "钠电次我没跟 群里嗨的 我不进这种叙事"
      - a: "(明确记录:用户未将钠电池纳入自身逻辑,仅为他人群聊观点)"
      - u: "成本这条还在 但就剩这一条撑着了 我有点虚"
      - a: "(确认:储能逻辑弱化后,仅存成本一条支撑,用户信心下降)"
      - u: "再等等看二季度吧 先别动"
      - a: "(确认无观点变更,继续按看多 + 仅成本支撑跟踪)"
  - n: 7
    date: 2025-04-21
    length: 短
    turns:
      - u: "美股昨晚纳指又跳水 对A股科技有传导不"
      - a: "(分析隔夜美股对A股成长板块的情绪传导)"
  - n: 8
    date: 2025-05-06
    length: 中
    turns:
      - u: "宁王那个我想清楚了 成本一条独苗撑不住估值 看多我收回"
      - a: "(确认:用户拟下调对宁德时代的观点;问调整为中性还是看空?)"
      - u: "转中性 不看空它 就是不值得照原来那么拿了"
      - a: "(记录观点更新:对宁德时代由看多转中性,储能逻辑被一季报弱化、仅存成本不足以支撑原判断)"
      - u: "嗯 后面真有拐点再说"
      - a: "(确认;提示后续按中性观点跟踪宁德时代)"
  - n: 9
    date: 2025-05-19
    length: 短
    turns:
      - u: "对了 我之前跟你念叨的那只新能源 现在是啥结论来着"
      - a: "(复述:对宁德时代当前为中性,原看多逻辑中储能弱化、仅存成本)"
      - u: "对 就这判断 没再变"
      - a: "(确认无更新)"
  - n: 10
    date: 2025-06-02
    length: 短
    turns:
      - u: "光伏今天集体大涨 啥情况"
      - a: "(归因:行业自律限产传闻 + 排产边际改善)"
      - u: "行 知道了"

db_assertions:
  - after: 1
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [宁德时代, 300750.SZ], value_contains: ["看多", "成本"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [宁德时代, 300750.SZ], expected_date: "2025-02-10"}
      - {type: no_fact_written, rel_type: STUDIED}
  - after: 4
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [宁德时代, 300750.SZ], value_contains: ["看多", "储能"]}
      - {type: old_invalidated, rel_type: EXPRESSED_VIEW, target_label: [宁德时代, 300750.SZ], min_count: 1}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 新能源}
  - after: 6
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [宁德时代, 300750.SZ], value_contains: ["看多"]}
      - {type: no_fact_written, rel_type: AVOIDS}
  - after: 8
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [宁德时代, 300750.SZ], value_contains: ["中性"]}
      - {type: old_invalidated, rel_type: EXPRESSED_VIEW, target_label: [宁德时代, 300750.SZ], min_count: 2}
      - {type: invalidated_chain_intact, rel_type: EXPRESSED_VIEW, target_label: [宁德时代, 300750.SZ], expected_versions: 3}
  - after: 9
    assert:
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: [宁德时代, 300750.SZ]}

probes:
  - tier: 直球
    dimension: 知识更新
    q: "我现在对宁德时代是什么看法?"
    expect_contain: ["中性"]
    expect_not: ["看多"]
    judge_rubric: "应答当前为中性;若答看多(无论成本独苗版还是双支撑版)即旧事实未作废,判不合格"
  - tier: 直球
    dimension: 单跳召回
    q: "我当初看多宁王的核心逻辑是什么?"
    expect_contain: ["成本"]
    expect_not: []
    judge_rubric: "应答出一体化成本(成本护城河/成本优势等价表述也算)。注意 q 用黑话「宁王」,系统须对齐到宁德时代;这是对已作废观点的历史回溯,能答出即合格"
  - tier: 自然难
    dimension: 单跳召回
    q: "动力电池这一档里,我明确说过没研究的是哪只?"
    expect_contain: ["亿纬锂能"]
    expect_not: []
    judge_rubric: "应答亿纬锂能(亿纬亦可)。该信息由助手追问带出、用户仅「没碰没研究」确认——考抽取器对确认句的捕捉"
  - tier: 自然难
    dimension: 多跳推理
    q: "我对宁德的判断前后改过几次?分别是怎么改的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "应答两次实质改动、三个版本:看多(仅成本)→ 看多(成本 + 储能放量双支撑)→ 中性(储能被一季报弱化、仅存成本不足以撑原判断)。q 用别名「宁德」,须对齐同一实体;漏任何一次改动或顺序错均不合格"
    swap_order_invariant: true
  - tier: 自然难
    dimension: 时间推理
    q: "我是什么时候把那只动力电池龙头转成中性的?当时为什么?"
    expect_contain: []
    expect_not: []
    judge_rubric: "q 用描述性指代「那只动力电池龙头」,须对齐到宁德时代。时间应指向 2025 年 5 月初(5月/五月初均可);原因应答储能逻辑被一季报弱化、仅剩成本一条不足以支撑"
  - tier: 对抗
    dimension: 知识更新
    q: "宁王这只 我是不是从头到尾都看空的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "假前提:用户从未看空(轨迹是看多→中性)。必须明确纠正;顺着说「是的你看空」即不合格"
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前是不是在宁德上押了钠电池二次曲线那条逻辑?"
    expect_contain: []
    expect_not: []
    judge_rubric: "假前提:钠电池是 session 6 群里别人说的、用户明确「我没跟、不进这种叙事」,从未纳入自身逻辑。必须指出用户没押钠电、那是他人观点;顺着确认「你押了钠电」即不合格"
    answerable: false