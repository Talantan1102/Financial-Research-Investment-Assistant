# 对话流评估脚本《二季度新能源四张时间切片》— 时间事件族 · 多事实整合难度轴。
# 压的机制(时间推理 × 单事实 vs 多事实整合):用户在二季度不同时间点,对四个新能源细分
#   (光伏/储能/锂电/新能源车)各表过一次态,每条带各自的事件时间(valid_from = 说出口那天)。
#   单事实召回("我四月对光伏什么看法")业界 89% 能答对——同 target 单跳取值,easy;
#   多事实整合("把二季度对所有新能源细分的看法按时间排个序")业界只有 24-36%——
#   要把四条散落在不同 session、不同 target_label 上的事实,各自取出事件时间、再跨实体按时间归并排序。
#   崩点不在召回单条,而在"跨四个实体同时取时间 + 全局排序"这一步。
# 搭车机制:四条事件时间各自锚定(valid_from_is_event_time ×4)、单事实直球召回、
#   一条由助手复述带出用户只"嗯"确认(储能,抽取器最易漏的确认句形态)、
#   对抗假前提(把储能的看多按到光伏头上=张冠李戴)、克制弃答(从没聊过仓位金额)。
# 刁钻点:① 四个细分是四个不同 target_label,不是同一事实改值——naive "同 target 覆盖"思路根本
#   碰不到整合题;② 排序要用事件时间(说出口那天)而非写入/规整时间,光伏4月初<储能4月底<
#   锂电5月中<新能源车6月初,月份咬得近,抽取器若把时间糊成一团就排错;③ 锂电那条是"中性",
#   既不看多也不看空,排序时最容易被漏(没有强情绪锚);④ 有效信息全埋在各 session 中后段,
#   前面是行情/政策/黄金式干扰流水。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,如「再看把」「张了」「迟到肉」——只打在非断言关键词上,抽取器就该扛住);
#   助手侧台词写要点 + 复述确认句(给抽取器的合法锚点,也是真实助手行为)。
# 硬约束:substrate 是带时间的观点,不是持仓——口语里顺带提一句操作可以,断言绝不围绕股数/金额。
script_id: time-multifact-integration
title: "二季度新能源四张时间切片"
family: 时间事件族
substrate: 带日期的观点/研究/事件(跨 session 时间演化;无结构化模块兜底,纯记忆领地)

sessions:
  - n: 1
    date: 2025-04-03
    length: 中
    turns:
      - u: "新能源这一坨最近咋样啊 想从里头扒拉点机会出来"
      - a: "(概述新能源大类几个细分的近况分化:光伏价格战、储能招标、锂电磨底、整车以旧换新;问用户想先看哪条)"
      - u: "先说光伏把 群里天天有人喊抄底 我又怕迟到肉"
      - a: "(给出光伏供给侧现状:硅料硅片价格战、组件价跌破成本;问用户自己的判断)"
      - u: "我自己看就是不行 产能太多了 杀价杀到见骨 这玩意儿我看空 短期别碰"
      - a: "(确认理解;复述:您四月初对光伏的判断是看空,核心是产能过剩、价格战打到亏现金成本)"
      - u: "对 就这意思 看空 先躲着"
      - a: "(记录:2025-04-03 用户表达对光伏看空,逻辑产能过剩/价格战)"
  - n: 2
    date: 2025-04-14
    length: 短
    turns:
      - u: "美联储这次会议怎么看 对A股流动性有影响么"
      - a: "(简析议息结果与北向资金传导)"
  - n: 3
    date: 2025-04-27
    length: 中
    turns:
      - u: "对了 新能源里我又翻了个东西 储能这块我看跟光伏不是一路货"
      - a: "(回应;问:储能这条您看好的逻辑是什么?)"
      - u: "大储招标放量啊 数据我看了 国内加中东订单都起来了 这条我看多 跟光伏反着"
      - a: "(确认要点;复述:在新能源大类里,您四月底对储能的判断是看多,核心是大储招标放量、国内+中东订单驱动)"
      - u: "嗯"
      - a: "(记录:2025-04-27 用户表达对储能看多,逻辑大储招标放量/订单驱动;与光伏看空形成对照)"
  - n: 4
    date: 2025-05-06
    length: 短
    turns:
      - u: "黄金这位置还能追么 有点怕站岗"
      - a: "(分析金价驱动因素与回调风险)"
      - u: "那我再看把"
  - n: 5
    date: 2025-05-16
    length: 中
    turns:
      - u: "碳酸锂价格最近是不是在地板上磨啊 锂电这条我有点拿不准"
      - a: "(给出碳酸锂价格底部震荡与锂电产业链现状;问用户倾向)"
      - u: "说不好 我现在对锂电就中性 不看多也不看空 价格没出清呢 等个信号再说"
      - a: "(确认;复述:您五月中对锂电的判断是中性——既不看多也不看空,等碳酸锂价格出清信号)"
      - u: "对 就中性 走一步看一步"
      - a: "(记录:2025-05-16 用户表达对锂电中性,等价格出清;这是二季度第三个新能源细分判断)"
  - n: 6
    date: 2025-05-23
    length: 短
    turns:
      - u: "港股红利税那事有进展没"
      - a: "(说明传闻现状与不确定性)"
  - n: 7
    date: 2025-05-30
    length: 短
    turns:
      - u: "今天大盘跌好不好啊 跌得我控机不住想割"
      - a: "(解释下跌成因与情绪面、是否恐慌盘)"
      - u: "哦行 知道了"
  - n: 8
    date: 2025-06-04
    length: 长
    turns:
      - u: "新能源车五月销量出来了吧 比亚迪那个数 群里又吵翻了"
      - a: "(给出五月新能源车批零销量与环比;说明以旧换新与出海拉动)"
      - u: "我感觉整车这条今年能行 以旧换新顶着 出海又是新增量"
      - a: "(回应;追问:这是整车环节,跟您之前看的光伏储能锂电是分开的细分?)"
      - u: "对 整车单算 这条我看多 跟储能一样我都偏乐观 就光伏我一直嫌它产能过剩"
      - a: "(确认;复述:您六月初对新能源车(整车)的判断是看多,核心以旧换新+出海;并重申您二季度对四个细分各自的态度有别)"
      - u: "嗯 就这样 整车看多"
      - a: "(记录:2025-06-04 用户表达对新能源车看多,逻辑以旧换新/出海;至此二季度四个新能源细分各落一条带时间的观点)"
      - u: "后面有新变化再说把"
      - a: "(确认;提示将按四条细分各自的当前观点跟踪)"
  - n: 9
    date: 2025-06-12
    length: 短
    turns:
      - u: "医药今天大跌咋回事"
      - a: "(归因:集采消息与个股暴雷带动)"
      - u: "行 知道了"

db_assertions:
  - after: 1
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [光伏, 光伏设备, 电力设备], value_contains: ["看空", "产能过剩"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [光伏, 光伏设备, 电力设备], expected_date: "2025-04-03"}
  - after: 3
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [储能, 电力设备], value_contains: ["看多"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [储能, 电力设备], expected_date: "2025-04-27"}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [光伏, 光伏设备, 电力设备], value_contains: ["看空"]}
  - after: 5
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [锂电, 电池, 电力设备], value_contains: ["中性"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [锂电, 电池, 电力设备], expected_date: "2025-05-16"}
  - after: 8
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 新能源车, value_contains: ["看多"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: 新能源车, expected_date: "2025-06-04"}
      # 四个细分是四条独立事实,谁都没把谁覆盖作废(不同 target_label,无版本叠加)
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: [光伏, 光伏设备, 电力设备]}
      - {type: no_fact_written, rel_type: HOLDS}

probes:
  - tier: 直球
    dimension: 单跳召回
    q: "我四月对光伏是什么看法?"
    expect_contain: ["看空"]
    expect_not: ["看多"]
    judge_rubric: "单事实召回(业界约 89% 能答对的 easy 形态):应答四月初看空光伏,理由产能过剩/价格战(杀价/亏成本等价表述也算)。只要单条光伏观点取值正确即合格;答看多或中性均不合格"
  - tier: 直球
    dimension: 时间推理
    q: "我是几月对光伏表的态?"
    expect_contain: []
    expect_not: []
    judge_rubric: "应指向 2025 年 4 月(4月/四月/二季度初均可),对应光伏观点的事件时间 2025-04-03。用事件时间作答即可;答成 5 月之后或糊成'最近'不合格"
  - tier: 自然难
    dimension: 时间推理
    q: "新能源里我说过没研究透、只给了个中性的是哪条?当时啥时候说的?"
    expect_contain: ["锂电"]
    expect_not: []
    judge_rubric: "应答锂电,中性(等碳酸锂价格出清信号),时间 2025 年 5 月中(5月/五月均可)。锂电是无强情绪锚的那条,最易在整合时被漏——能单独捞出它且时间对即合格"
  - tier: 自然难
    dimension: 知识更新
    q: "我二季度对新能源整条线是不是从头到尾都看多来着?"
    expect_contain: ["光伏"]
    expect_not: ["都看多"]
    judge_rubric: "假前提:用户并非整条线都看多——光伏看空、锂电中性,只有储能和新能源车看多。必须纠正假前提,至少点出光伏看空(或锂电中性)这条反例;顺着说'对你全程看多新能源'即不合格"
  - tier: 对抗
    dimension: 多跳推理
    q: "把我二季度对所有新能源细分的看法,按我表态的先后时间排个序。"
    expect_contain: ["光伏", "储能", "锂电", "新能源车"]
    expect_not: []
    judge_rubric: "多事实整合排序(业界仅 24-36% 能答对的 hard 形态):须按事件时间列全四条且顺序正确——光伏(4/初·看空)→ 储能(4/底·看多)→ 锂电(5/中·中性)→ 新能源车(6/初·看多)。判定:漏任一细分、顺序颠倒、或把某条观点的多空态贴错(尤其漏中性的锂电、或把储能/整车的看多张冠李戴到光伏)均不合格;四条齐、顺序对、态度各自贴对才合格"
    swap_order_invariant: false
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前跟你说过我在光伏上亏了多少、还剩几手没?"
    expect_contain: []
    expect_not: []
    answerable: false
    judge_rubric: "整段历史只聊各细分的观点与时间,从未提及任何盈亏金额或持仓手数(持仓不入记忆)。必须指出没说过;编造金额/手数或顺着假前提确认均不合格"
