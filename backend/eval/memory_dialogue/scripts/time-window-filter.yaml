# 对话流评估脚本《上个月聊的那只》— 时间事件族·相对时间窗过滤。
# 压的机制(时间推理维度):三个相邻月份各聊一只不同新能源标的、各给一个不同目标价
#   (三月 阳光电源 目标价 120 / 四月 比亚迪 目标价 380 / 五月 隆基绿能 目标价 35),
#   六月初问「上个月我们聊的那只新能源 当时说的目标价是多少」。考的是相对时间表达
#   「上个月」必须先锚到提问当下(2025-06)再回推到 5 月,然后只取五月那只(隆基绿能/35),
#   绝不能答成三月(阳光电源/120)或四月(比亚迪/380)那只——三只都是「新能源」+「目标价」,
#   同 rel_type 同语义的近义噪声,靠事件时间区分。
# 搭车机制:
#   (1) 单跳召回——每只标的的目标价是独立事实,能不能各自精确召回;
#   (2) 知识更新——三只是三个独立实体三条独立事实,谁都不该作废谁(并存,不是演化链),
#       fact_count_no_increase / 各自 fact_active 守「不互相覆盖」;
#   (3) 克制弃答——从没在六月聊过新标的,「这个月又看了哪只」无答案。
# 刁钻点:
#   (1) 三只标的的目标价(120/380/35)绝不在用户台词里复述第二遍,只在建仓那次说一次
#       + 助手复述确认一次,逼抽取器把「目标价」这个数值事实牢牢挂在对的事件月上;
#   (2) 五月那只(隆基)的目标价 35 由助手追问带出、用户只「嗯对」确认——抽取器最易漏的确认句形态;
#   (3) 「上个月」是相对锚——若系统把「上个月」理解成相对脚本里最后一条信息消息(可能落到别的月)
#       或干脆取最近一次聊的标的,都会翻车;正解必须 提问时点(6月)减一 = 5月;
#   (4) 对抗题埋假前提「上个月那只我们是不是还聊过要清仓」——整段从没聊过任何买卖操作,只聊目标价,
#       顺着假前提确认即不合格。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,只打在非断言关键词上,如「在看把」「逆变气」「张了」——抽取器就该扛住这种真实输入);
#   助手侧台词写要点式括号,负责复述确认目标价数值(给抽取器的合法锚点,也是真实助手行为)。
# 硬约束:substrate 是带日期的观点/研究/事件,不是持仓——散户口语顺带提一句操作可以,
#   断言绝不围绕持仓股数/金额,目标价是「观点里的预期价位」属观点事实,不是成交价。
script_id: time-window-filter
title: "上个月聊的那只"
family: 时间事件族
substrate: 带日期的观点/研究/事件(跨 session 演化;无结构化模块兜底,纯记忆领地;持仓不入记忆图)

sessions:
  - n: 1
    date: 2025-03-11
    length: 中
    turns:
      - u: "光伏跌到这位置 逆变气这条我想搞明白 你帮我捋捋"
      - a: "(梳理光伏逆变器环节:储能配套放量、海外大储招标、毛利韧性;问用户自己盯哪只)"
      - u: "我就盯阳光电源一只 别的不碰 这只我研究过了"
      - a: "(回应;追问:您对阳光电源是看多?有没有个心里的价位?)"
      - u: "看多啊 我心里有个数 目标价我看到一二零"
      - a: "(确认理解;复述:您看多阳光电源,目标价 120,核心是储能 + 海外大储这条逆变器逻辑?)"
      - u: "对 就这个 一二零之前我不动它"
      - a: "(总结用户观点:看多阳光电源,目标价 120,逻辑储能 + 海外大储)"
  - n: 2
    date: 2025-03-24
    length: 短
    turns:
      - u: "美联储这次点阵图偏鹰 北向会不会跑路"
      - a: "(简析点阵图与北向资金传导)"
  - n: 3
    date: 2025-04-15
    length: 中
    turns:
      - u: "新能源车四月头一周销量出了没 比亚迪那个数群里吵翻了"
      - a: "(给出周度销量与环比;问用户怎么看比亚迪这波)"
      - u: "我这个月把比亚迪重新看了一遍 出海加高端化 我觉得能往上走"
      - a: "(回应;追问:您看多比亚迪,心里有个目标价吗?)"
      - u: "有 三八零 我盯着这个数 高端那块只要起来就够得着"
      - a: "(确认理解;复述:您看多比亚迪,目标价 380,逻辑出海 + 高端化?)"
      - u: "嗯 就三八零 到了再说后面"
      - a: "(记录用户观点:看多比亚迪,目标价 380,逻辑出海 + 高端化)"
  - n: 4
    date: 2025-04-27
    length: 短
    turns:
      - u: "黄金破新高了 这位置追站岗风险大不大"
      - a: "(分析金价驱动与回调风险)"
      - u: "那我在看把"
  - n: 5
    date: 2025-05-13
    length: 长
    turns:
      - u: "组件这块最近惨啊 价格战打到家了 我想再看一只"
      - a: "(说明光伏组件供给过剩与一体化龙头的成本身位;问用户看哪只)"
      - u: "隆基绿能 我这个月一直在啃它的年报 跟阳光电源那只不是一回事 这是组件"
      - a: "(确认:您本月研究的是隆基绿能,组件环节,与三月那只阳光电源是两只不同标的)"
      - u: "对 别搞混 阳光是逆变器 隆基是组件 我分得清"
      - a: "(确认区分;追问:您对隆基绿能是看多吗?目标价心里有数没?)"
      - u: "看多 它 BC 电池那条要是兑现 现在这价就是地板了"
      - a: "(回应;追问:那您心里这只的目标价大概看到多少?)"
      - u: "嗯 三五吧 三十五 BC 放量加成本压下来 我觉得够得着"
      - a: "(复述确认:您看多隆基绿能,目标价 35,核心逻辑 BC 电池放量 + 成本下行?)"
      - u: "嗯对 就三十五 这只我这个月才正经研究的 跟前面那两只都不一样"
      - a: "(记录用户观点:看多隆基绿能,目标价 35,逻辑 BC 电池 + 成本下行;明确与阳光电源、比亚迪为三只不同标的)"
      - u: "行 你给我记牢了 别回头给我搞串了"
      - a: "(确认:三只标的三个目标价分别记录,事件月份各自独立,不混淆)"
  - n: 6
    date: 2025-05-26
    length: 短
    turns:
      - u: "港股通调整名单出了没 影响哪些票"
      - a: "(说明调整范围与受影响标的)"
      - u: "行 知道了哈"
  - n: 7
    date: 2025-06-03
    length: 短
    turns:
      - u: "今天大盘缩量横在这 没啥方向 烦"
      - a: "(简述缩量震荡的量能与情绪面;不替用户拍方向)"
      - u: "哦 那先趴着把"

db_assertions:
  - after: 1
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [阳光电源, 300274.SZ], value_contains: ["看多", "120"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [阳光电源, 300274.SZ], expected_date: "2025-03-11"}
  - after: 3
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [比亚迪, 002594.SZ], value_contains: ["看多", "380"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [比亚迪, 002594.SZ], expected_date: "2025-04-15"}
      # 四月这只不得把三月那只作废——三只是并存的独立事实,不是演化链
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [阳光电源, 300274.SZ], value_contains: ["120"]}
  - after: 5
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [隆基绿能, 601012.SH], value_contains: ["看多", "35"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [隆基绿能, 601012.SH], expected_date: "2025-05-13"}
      # 三只各自存活、互不覆盖
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [阳光电源, 300274.SZ], value_contains: ["120"]}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [比亚迪, 002594.SZ], value_contains: ["380"]}
  - after: 7
    assert:
      # 历经 6 月两个无关短 session,三条目标价事实仍原样存活、事件时间未漂移
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [隆基绿能, 601012.SH], expected_date: "2025-05-13"}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [隆基绿能, 601012.SH], value_contains: ["35"]}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: [隆基绿能, 601012.SH]}
      - {type: no_fact_written, rel_type: HOLDS}

probes:
  - tier: 直球
    dimension: 时间推理
    q: "上个月我们聊的那只新能源,当时说的目标价是多少?"
    expect_contain: ["隆基", "35"]
    expect_not: ["120", "380"]
    judge_rubric: "提问发生在 2025-06-03(六月初),『上个月』须先锚到提问当下再回推到 5 月,只取五月那只=隆基绿能、目标价 35。若答成三月那只(阳光电源/120)或四月那只(比亚迪/380),即相对时间窗解析错或取了最近一次以外的标的,判不合格。能答对标的即合格,目标价 35 答对加分"
  - tier: 直球
    dimension: 单跳召回
    q: "我三月那会儿看的阳光电源,目标价是看到多少?"
    expect_contain: ["120"]
    expect_not: ["380", "35"]
    judge_rubric: "应答 120(阳光电源三月那条)。这是按事件月份精确取目标价数值,答成 380(比亚迪)或 35(隆基)即把别的月的目标价张冠李戴,不合格"
  - tier: 自然难
    dimension: 单跳召回
    q: "五月那只组件票,我心里的目标价是怎么来的?基于啥逻辑?"
    expect_contain: ["BC"]
    expect_not: []
    judge_rubric: "应答隆基绿能 35 这个目标价基于 BC 电池放量 + 成本下行。目标价 35 由助手追问带出、用户仅『嗯对』确认——考抽取器对确认句的捕捉;逻辑能答出 BC 电池(或成本下行)即合格"
  - tier: 自然难
    dimension: 时间推理
    q: "我这三个月分别聊的哪三只?各自的目标价是多少?按时间给我捋一遍"
    expect_contain: ["阳光电源", "比亚迪", "隆基"]
    expect_not: []
    judge_rubric: "应按时间顺序答全三只及对应目标价:三月 阳光电源 120 → 四月 比亚迪 380 → 五月 隆基绿能 35。漏任一只、张冠李戴(把某只的目标价安到别只头上)、或月份顺序错均不合格"
    swap_order_invariant: true
  - tier: 自然难
    dimension: 知识更新
    q: "我三月看的阳光电源那个目标价,后来改过没?现在还算数不?"
    expect_contain: ["120"]
    expect_not: []
    judge_rubric: "应答没改过、仍是 120——三月、四月、五月聊的是三只不同标的,后两只不构成对阳光电源那条的更新或作废,三条并存。若答『被 380/35 取代了』即误把并存当演化链,不合格"
  - tier: 对抗
    dimension: 时间推理
    q: "上个月那只,我们当时是不是还聊过要清仓?"
    expect_contain: []
    expect_not: ["是的"]
    judge_rubric: "假前提:整段历史只聊观点与目标价,从没聊过任何买卖/清仓操作。必须指出没聊过清仓那回事;顺着说『对你说过要清仓』即不合格(『上个月』指向五月隆基这点可不必纠结,重点是纠正清仓假前提)"
  - tier: 对抗
    dimension: 克制弃答
    q: "这个月我又新看上了哪只新能源?目标价多少来着?"
    expect_contain: []
    expect_not: []
    answerable: false
    judge_rubric: "提问在 2025-06,而六月两个 session 只聊了大盘和港股通、从没聊过任何新标的或新目标价。必须指出这个月没聊过新的新能源标的;编造一只标的/目标价或顺着假前提确认均不合格"