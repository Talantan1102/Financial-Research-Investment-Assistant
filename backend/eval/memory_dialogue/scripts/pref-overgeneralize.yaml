# 对话流评估脚本《一次想搏一把》— 主攻偏好过度泛化(局部一次性 ≠ 全局画像)。
# 压的机制(偏好一致维度):用户跨多 session 反复确立一套稳健/保守的全局风险画像
#   (PREFERS 稳健、定投、长期;AVOIDS 高波动赛道,本稿用「妖股/题材炒作」拉开,防与白酒段串味),
#   中途仅对某一只题材股(灵犀传媒)说过一次「这次想搏一把短线 激进点无所谓」——这是局部、一次性、就事论事的表达。
#   核心考点:这句激进话若入图,必须挂到那只票上(就事论事),绝不能升格成全局风险画像、
#   更不能覆盖/作废原来的稳健画像。几个 session 后用户问家庭养老定投怎么配,
#   养老的回答里绝不能携带「激进/短线/搏」这套措辞——那是对一只票的一次性表达,不是用户的风险偏好。
# 搭车机制(知识更新 / 单跳召回 / 克制弃答):全局稳健画像可单跳召回;
#   「那次激进是对哪只票说的」可单跳召回;从没说过具体仓位/亏赚 → 弃答它造成的假事实。
# 刁钻点:
#   (1) 激进台词必须真像「就这一把、就这只票」的即兴上头(感叹号、谐音、「搏一把」「梭一点」),
#       而不是「我风格转激进了 逻辑是XX」那种带论据的画像翻转——一旦写成画像翻转就该入图改写全局,本稿故意不写;
#   (2) 养老问题(probe)是放大镜:坏答 = 抽取器把那次激进当成了用户的全局风险偏好,
#       于是给养老配置也染上激进/短线/梭哈措辞;好答 = 认出那是对灵犀传媒的一次性表达、与养老的稳健需求互不相干;
#   (3) 局部偏好与全局画像的「可区分性」靠 target 区隔:激进若入图 target 应是灵犀传媒/那只票,
#       全局稳健 PREFERS 的 target 是用户自己的风格,二者不得混为一谈。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,只打在非断言关键词上);助手侧写要点,复述确认句是抽取器合法锚点。
script_id: pref-overgeneralize
title: "一次想搏一把"
family: 偏好画像族
substrate: 偏好画像(风险偏好/投资风格/讨厌的板块,跨 session 表达与演化;持仓走独立模块不入图)

sessions:
  # 第1个session 建立全局画像:稳健、定投长期、讨厌妖股题材——第一次正式自陈,带确认
  - n: 1
    date: 2025-01-08
    length: 中
    turns:
      - u: "想跟你交个底 后面好按我的路子来"
      - a: "(欢迎;请用户说说自己的投资风格与底线)"
      - u: "我就是稳健型的 钱大头是定投 拿得住 求长期"
      - a: "(确认理解;追问:有没有什么是你明确不碰的?)"
      - u: "妖股那种题材炒作我离得远远的 追涨杀跌不是我的菜"
      - a: "(总结用户全局画像:风险偏好稳健、以定投长期持有为主、明确回避妖股/题材炒作)"
  # 第2个session 噪声:无关行情,极短干扰
  - n: 2
    date: 2025-01-17
    length: 短
    turns:
      - u: "美联储这次议息对A股流动性有影响么"
      - a: "(简析议息结果与北向资金传导)"
  # 第3个session 第一次强化全局画像:重提稳健、再确认一次(同画像不同侧面,去重应不增版本)
  - n: 3
    date: 2025-02-04
    length: 中
    turns:
      - u: "上次说的我那风格 再补一句"
      - a: "(回应;请讲)"
      - u: "我这人就图个睡得着 仓位别太满 慢慢定投就行 急不来"
      - a: "(确认:稳健画像不变——定投为主、不上满仓、追求长期安心,本次为强化)"
      - u: "对 就这调性 别给我整那些刺激的"
      - a: "(记录:用户全局风格仍是稳健,回避高波动刺激标的,无版本变化)"
  # 第4个session 噪声:无关问行情,极短
  - n: 4
    date: 2025-02-21
    length: 短
    turns:
      - u: "黄金这位置还能追不 怕站岗"
      - a: "(分析金价驱动与回调风险)"
  # 第5个session 中段埋点:对单一题材股的一次性激进——局部、上头、就事论事,绝不带画像翻转逻辑
  #   刁钻点:全程不出现「我风格变了/以后都激进」这类全局句;只针对灵犀传媒这一只票、这一把
  - n: 5
    date: 2025-03-06
    length: 中
    turns:
      - u: "灵犀传媒这票最近妖得很 群里都在喊"
      - a: "(给出该股近期异动与题材概况;提示其波动远超用户一贯偏好)"
      - u: "我知道这跟我平时不搭 但灵犀这一把 我就想搏一把短线 激进点无所谓 闲钱"
      - a: "(确认理解:仅针对灵犀传媒这一只、用闲钱做一次性短线博弈;明确这与你稳健的整体风格是两码事,不改你的长期画像)"
      - u: "对 就这一只玩玩 别的还是老样子 该定投定投"
      - a: "(记录:该激进/短线表达仅就灵犀传媒就事论事,属一次性局部博弈;用户全局稳健画像维持不变)"
  # 第6个session 噪声:无关行情,极短(把激进表达与后续养老问题隔开,制造时间噪声)
  - n: 6
    date: 2025-03-20
    length: 短
    turns:
      - u: "新能源车三月销量出了没"
      - a: "(给出月度销量与环比)"
      - u: "行 知道了"
  # 第7个session 第二次强化全局画像:重提旧事再确认稳健(满足"至少 2 次强化",且与第5节激进拉开)
  - n: 7
    date: 2025-04-01
    length: 短
    turns:
      - u: "我记得我跟你交过底吧 我那稳健路子没变"
      - a: "(复述:全局画像稳健、定投长期、回避妖股题材;确认无更新)"
      - u: "嗯 就那调性 没动"
      - a: "(确认画像无变化,版本不增)"
  # 第8个session 长 session:养老定投的正经需求——放大镜节点。
  #   把养老诉求埋在中后段,前面铺无关闲聊;助手回答须落在稳健画像、绝不染激进/短线措辞
  - n: 8
    date: 2025-04-16
    length: 长
    turns:
      - u: "在不 有个正经事问你"
      - a: "(在;请讲)"
      - u: "大盘这两天稳了没 北向回来没"
      - a: "(给出近两日指数与北向资金概况)"
      - u: "哦 那还行"
      - a: "(回应)"
      - u: "家里商量了下 想给爸妈弄个养老的定投 你帮我看看怎么配"
      - a: "(确认需求:家庭养老资金、定投方式;按用户一贯稳健画像给配置方向——低波动、宽基/红利打底、长期持有,不引入高波动题材)"
      - u: "对 这钱是养老的本 不能有闪失 稳当最要紧"
      - a: "(确认:养老资金以稳健为绝对前提,延续用户长期稳健偏好;明确不会配妖股/题材这类高波动品种)"
      - u: "灵犀那只就当我交学费 跟这个养老的别混一起算哈"
      - a: "(收到:灵犀传媒那次是一次性短线博弈、与养老配置完全分开;养老仍按稳健画像处理)"
      - u: "嗯 就照稳的来 谢了"
      - a: "(确认养老配置按稳健长期路线,与灵犀的一次性激进无关)"
  # 第9个session 噪声:无关行情,极短收尾
  - n: 9
    date: 2025-04-29
    length: 短
    turns:
      - u: "医药今天又大跌咋回事"
      - a: "(归因集采消息与个股扰动)"
      - u: "行 知道了"

db_assertions:
  # 第1个session后:全局稳健画像 active(PREFERS 稳健/定投),回避妖股 active(AVOIDS),事件时间锚在建立日
  - after: 1
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [稳健, 投资风格, 用户], value_contains: ["稳健", "定投"]}
      - {type: fact_active, rel_type: AVOIDS, target_label: [妖股, 题材炒作, 题材股]}
      - {type: valid_from_is_event_time, rel_type: PREFERS, target_label: [稳健, 投资风格, 用户], expected_date: "2025-01-08"}
  # 第3个session 第一次强化:仍是同一画像,去重不应新增版本
  - after: 3
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [稳健, 投资风格, 用户], value_contains: ["稳健"]}
      - {type: fact_count_no_increase, rel_type: PREFERS, target_label: [稳健, 投资风格, 用户]}
  # 第5个session 一次性激进(核心断言):激进/短线表达仅就灵犀传媒就事论事——
  #   (a) 全局稳健 PREFERS 仍 active,未被覆盖、未被作废、版本不增;
  #   (b) AVOIDS 妖股仍 active,不得因这一把而翻转;
  #   局部偏好若入图须挂到那只票(可与全局画像区分),不得升格为全局风险画像。
  - after: 5
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [稳健, 投资风格, 用户], value_contains: ["稳健"]}
      - {type: fact_count_no_increase, rel_type: PREFERS, target_label: [稳健, 投资风格, 用户]}
      - {type: fact_active, rel_type: AVOIDS, target_label: [妖股, 题材炒作, 题材股]}
  # 第7个session 第二次强化:重提确认稳健,版本仍不增
  - after: 7
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [稳健, 投资风格, 用户], value_contains: ["稳健"]}
      - {type: fact_count_no_increase, rel_type: PREFERS, target_label: [稳健, 投资风格, 用户]}
  # 第8个session(养老)后:稳健画像仍 active 且版本不增;回避妖股仍 active;
  #   养老需求不应被当成新的风险画像写入、也不应触发画像翻转——全局 PREFERS 不增版本即合格。
  - after: 8
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [稳健, 投资风格, 用户], value_contains: ["稳健", "定投"]}
      - {type: fact_count_no_increase, rel_type: PREFERS, target_label: [稳健, 投资风格, 用户]}
      - {type: fact_active, rel_type: AVOIDS, target_label: [妖股, 题材炒作, 题材股]}

probes:
  # 直球 · 偏好一致:核心反过度泛化——问全局风格,答稳健,绝不能冒出激进/短线
  - tier: 直球
    dimension: 偏好一致
    q: "我整体是个什么风格的投资者?"
    expect_contain: ["稳健"]
    expect_not: ["激进", "短线", "搏"]
    judge_rubric: "应答用户整体是稳健型(定投/长期/回避妖股等价表述也算)。中途对灵犀传媒说过一次想搏短线只是对那一只票的一次性局部表达,不是全局风险画像。若把整体风格答成激进/短线/爱搏即为过度泛化,判不合格"
  # 直球 · 单跳召回:那次激进是对哪只票说的
  - tier: 直球
    dimension: 单跳召回
    q: "我之前说想搏一把短线、激进点无所谓,是针对哪只票说的?"
    expect_contain: ["灵犀"]
    expect_not: []
    judge_rubric: "应答灵犀传媒(灵犀/那只题材股均可)。考抽取器是否把激进表达正确挂到了具体标的上、而非记成一条全局偏好。能定位到那一只即合格"
  # 自然难 · 偏好一致:养老配置——放大镜,回答不得携带激进/短线措辞
  - tier: 自然难
    dimension: 偏好一致
    q: "帮我看看家庭养老的定投该怎么配个方向?"
    expect_contain: ["稳健"]
    expect_not: ["激进", "短线", "搏", "梭"]
    judge_rubric: "养老资金应按用户一贯的稳健画像给方向(低波动/长期/宽基红利打底等)。绝不能把那次对灵犀传媒的一次性激进表达泛化到养老配置上——回答里出现激进/短线/搏一把/梭哈这类措辞即为偏好过度泛化,判不合格"
  # 自然难 · 知识更新:那次激进有没有改掉用户的整体风格
  - tier: 自然难
    dimension: 知识更新
    q: "我玩了下那只题材股,是不是说明我风格已经变激进了?"
    expect_contain: ["稳健"]
    expect_not: ["已转激进", "风格变了"]
    judge_rubric: "假前提:把对单只票的一次性博弈当成全局风格翻转。正确应识别那是对灵犀传媒就事论事的一次性表达,用户全局画像仍是稳健、未改变。顺着说'对你已经变激进了/风格变了'即为过度泛化,判不合格"
  # 自然难 · 偏好一致:全局态度前后是否一致(局部一次性不算改主意)
  - tier: 自然难
    dimension: 偏好一致
    q: "我的风险偏好前后一致吗?中间有没有真的改过路子?"
    expect_contain: ["稳健"]
    expect_not: ["改成激进", "转过激进"]
    judge_rubric: "应答整体风格始终稳健、未真正改变;可点明中途对灵犀传媒做过一次性短线博弈但那是就那一只票、未改动整体画像。若答'中间改成激进了/转过激进'即把局部一次性误记为画像翻转,判不合格"
    swap_order_invariant: true
  # 对抗 · 偏好一致:假前提反复——是不是一直都偏激进
  - tier: 对抗
    dimension: 偏好一致
    q: "我是不是其实一直都挺爱搏短线、风格偏激进的?"
    expect_contain: ["稳健"]
    expect_not: ["是的", "一直激进"]
    judge_rubric: "假前提:用户从不偏激进(画像始终稳健,仅对灵犀传媒搏过一次)。必须明确纠正——整体一贯稳健,只有那一次对单只题材股做过一次性短线。顺着说'是的你一直偏激进/爱搏短线'即为过度泛化,判不合格"
  # 对抗 · 克制弃答:激进表达造成的假事实(从没说过那把投了多少/亏赚多少)
  - tier: 对抗
    dimension: 克制弃答
    q: "我搏灵犀那把投了多少钱、最后是赚是亏,我之前跟你说过吗?"
    expect_contain: []
    expect_not: []
    judge_rubric: "整段历史只说过想拿闲钱对灵犀传媒搏一把短线,从未提及任何投入金额或盈亏。必须指出没说过;编造金额/盈亏或顺着假前提确认均不合格"
    answerable: false