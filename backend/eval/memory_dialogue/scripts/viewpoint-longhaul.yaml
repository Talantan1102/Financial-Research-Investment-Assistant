# 对话流评估脚本《二十五个对话之后》— 观点演化族·长程段。
# 压的机制(单跳召回 + 时间推理,长程深干扰维度):对齐 LongMemEval 的「干扰深度」——
#   有效信息只在前段两个 session 出现(n2 看好高股息电力=股息率+电价改革;n5 补充只认龙头不碰小票),
#   之后 20+ 个全是各色短干扰(行情/政策/黄金/海外/汇率/段子/新能源/医药/AI...),逐字真实但与断言无关。
#   考的是抽取器能不能在 25 个对话之后,从一堆同等"像观点"的噪声里把第 2、第 5 个 session 那条捞回来。
# 搭车机制:深埋单跳召回(防守型方向是哪个+为什么)、事件时间推理(几月开始看高股息)、
#   龙头/小票偏好的 PREFERS/AVOIDS 双写、克制弃答(从没聊过的标的)、对抗假前提(把干扰里的黄金/光伏当成核心方向)。
# 刁钻点:(甲)干扰 session 里也有"看多/看好/这玩意儿能拿"式表达(n11 看多军工、n19 看好创新药),
#   是同 rel_type 同语义的近义噪声,抽取器若按"最近一次看多"答会被带偏,正确答案在最早的 n2;
#   (乙)n5 的"只认龙头不碰小票"由助手复述带出、用户只"对"一声确认(抽取器最易漏的确认句形态);
#   (丙)有效事实距问询点隔了 20+ 个 session,远超一般记忆窗口,逼真考长程保持。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,如「再看把」「张了」「迟到肉」——抽取器就该扛住这种真实输入);
#   助手侧台词写要点,负责复述确认(给抽取器的合法锚点,也是真实助手行为)。
# 硬约束:substrate 是观点演化,不是持仓——散户口语里顺带提一句操作可以,断言绝不围绕股数/金额。
script_id: viewpoint-longhaul
title: "二十五个对话之后"
family: 观点演化族
substrate: 观点演化(长程深干扰段;无结构化模块兜底,纯记忆领地)

sessions:
  # ===== 有效信息段(全埋在最前段,之后全是干扰)=====
  - n: 1
    date: 2025-02-10
    length: 短
    turns:
      - u: "节后这行情看着没劲啊 你说现在该往哪个方向蹲"
      - a: "(简述节后市场风格:成长杀跌、红利防守占优;反问用户自己倾向哪边)"
      - u: "我求稳 不想追热点了 你给我捋捋防守的"
      - a: "(给出防守型方向几条线索:公用事业、银行、煤炭高股息;约定下次细聊)"
  - n: 2
    date: 2025-02-21
    length: 长
    turns:
      - u: "上次说的防守 我自己研究了一圈 想好了 就看高股息电力"
      - a: "(回应;追问:电力这么多细分,看好的核心逻辑是什么?)"
      - u: "两条 股息率高啊 比存款香多了 再一个电价改革 往后能涨"
      - a: "(确认理解;追问:电价改革这条是赌市场化电价上行?)"
      - u: "对 就这个意思 容量电价加上市场化 电这东西又躲不掉 现金流稳"
      - a: "(复述用户观点:看多高股息电力,核心逻辑两条——股息率高、电价改革带来电价上行)"
      - u: "嗯 就这两条 我认这个"
      - a: "(追问:这是当防守底仓长期拿,还是阶段博弈?)"
      - u: "长期蹲着 吃股息为主 不指望它张多快"
      - a: "(确认定位:防守型长期底仓;追问:这条线在您整个盘子里算压舱石还是配置一点?)"
      - u: "压舱石啊 我这两年就指着它扛波动 别的都是边角料"
      - a: "(记录:高股息电力为防守压舱石;追问:那进攻方向另算、不混进这条?)"
      - u: "对 进攻的另说 这条就纯防守 不掺别的"
      - a: "(总结:用户把高股息电力作为防守型长期压舱石,逻辑为股息率高+电价改革;与进攻配置严格区分,不追求短期涨幅)"
  - n: 3
    date: 2025-03-04
    length: 短
    turns:
      - u: "美联储这次点阵图偏鹰 A股北向会不会跑"
      - a: "(简析点阵图与北向资金传导)"
  - n: 4
    date: 2025-03-12
    length: 短
    turns:
      - u: "黄金又新高了 这位置还敢追么"
      - a: "(分析金价驱动与回调风险)"
      - u: "那我再看把"
  - n: 5
    date: 2025-03-20
    length: 中
    turns:
      - u: "电力我又翻了一圈年报 有个事跟你说下"
      - a: "(回应;问:看到什么了?)"
      - u: "小票我不碰了 就盯龙头那几家 小的现金流虚 怕爆雷"
      - a: "(确认要点;复述:在高股息电力这条线上,您偏好只配行业龙头,回避小市值标的)"
      - u: "对 就这个意思"
      - a: "(记录偏好:电力方向上 偏好龙头、回避小票;核心看多逻辑与防守定位不变)"
  - n: 6
    date: 2025-03-28
    length: 短
    turns:
      - u: "可转债现在还有打新么 中签率太低了吧"
      - a: "(说明近期转债打新供给与中签概况)"
  # ===== 干扰段开始(各色短干扰,主题不重复太近,逐字口语)=====
  - n: 7
    date: 2025-04-03
    length: 短
    turns:
      - u: "新能源车三月销量出了没 比亚迪那个数 群里吵翻了"
      - a: "(给出三月销量与环比)"
  - n: 8
    date: 2025-04-09
    length: 短
    turns:
      - u: "今天大盘跌好不好啊 跌得我控机不住想割"
      - a: "(解释下跌与情绪面、是否恐慌盘)"
      - u: "哦行"
  - n: 9
    date: 2025-04-16
    length: 短
    turns:
      - u: "日元跌成这样 出海那些公司是不是要吃汇兑亏"
      - a: "(说明日元贬值对出口与汇兑损益的影响)"
  - n: 10
    date: 2025-04-22
    length: 短
    turns:
      - u: "听懂掌声 今天还不亏的是高手"
      - a: "(回应大跌日情绪;简述全市场普跌成因)"
  - n: 11
    date: 2025-04-30
    length: 中
    turns:
      - u: "军工最近有点东西啊 你看好不"
      - a: "(分析军工催化:订单与地缘;给出节奏判断)"
      - u: "我感觉这波能搞 短线博一下 你别拦我哈"
      - a: "(提示这属于短线博弈、非用户既定的防守方向;尊重其判断)"
  - n: 12
    date: 2025-05-08
    length: 短
    turns:
      - u: "原油跌这么狠 是不是衰退要来了"
      - a: "(解释油价回落的供需与宏观含义)"
  - n: 13
    date: 2025-05-15
    length: 短
    turns:
      - u: "北交所那票今天异动 啥情况 是不是庄在洗盘子"
      - a: "(归因:流动性与题材消息)"
      - u: "懂了懂了"
  - n: 14
    date: 2025-05-21
    length: 短
    turns:
      - u: "比特币又站上来了 这玩意儿跟A股有关系么"
      - a: "(说明加密资产与A股相关性弱、风险偏好间接传导)"
  - n: 15
    date: 2025-05-27
    length: 短
    turns:
      - u: "猪价起来了 养猪股是不是该看一眼"
      - a: "(说明猪周期位置与板块弹性)"
      - u: "先放观察里把"
  - n: 16
    date: 2025-06-03
    length: 短
    turns:
      - u: "港股今天为啥单独张 跟A股脱钩了么"
      - a: "(解释港股独立行情成因:南向与外资结构)"
  - n: 17
    date: 2025-06-10
    length: 中
    turns:
      - u: "宽基ETF我想定投一个 沪深300跟中证500选哪个"
      - a: "(对比两个宽基的成分与风格;不替用户拍板)"
      - u: "那我就大的那个吧 省心"
      - a: "(回应;提示定投纪律)"
  - n: 18
    date: 2025-06-17
    length: 短
    turns:
      - u: "半导体设备今天集体杀跌 利空是啥"
      - a: "(归因:消息面与估值消化)"
  - n: 19
    date: 2025-06-24
    length: 中
    turns:
      - u: "创新药这波我是真看好 出海逻辑顺了"
      - a: "(分析创新药出海授权与兑现节奏)"
      - u: "感觉比那些卷集采的强多了 想配点"
      - a: "(回应;提示这是进攻型配置、与防守底仓性质不同)"
  - n: 20
    date: 2025-07-01
    length: 短
    turns:
      - u: "今天负的有点多 安慰安慰我。。。。。。"
      - a: "(共情;简述普跌环境、避免追加情绪化操作)"
  - n: 21
    date: 2025-07-08
    length: 短
    turns:
      - u: "央行又降准了 利好谁啊"
      - a: "(说明降准传导与受益方向)"
  - n: 22
    date: 2025-07-15
    length: 短
    turns:
      - u: "光伏跌跌不休 是不是产能太多了 想抄底又怕迟到肉"
      - a: "(说明光伏供给过剩与价格战现状)"
      - u: "那不碰了"
  - n: 23
    date: 2025-07-22
    length: 短
    turns:
      - u: "印度那市场是不是比我们强好多 兄弟们都在说"
      - a: "(对比海外市场表现与可投性约束)"
  - n: 24
    date: 2025-07-29
    length: 短
    turns:
      - u: "退市新规出来了 我手里要是踩雷咋办"
      - a: "(说明退市新规要点与排雷方向)"
  - n: 25
    date: 2025-08-05
    length: 中
    turns:
      - u: "银行股今天大涨 是不是高股息又被炒起来了"
      - a: "(说明银行上涨成因:高股息防守资金再配置)"
      - u: "哦 那跟我之前那思路有点像哈"
      - a: "(回应;不替用户改动既有方向判断)"
  - n: 26
    date: 2025-08-12
    length: 短
    turns:
      - u: "AI那波又起来了 算力还能追么"
      - a: "(分析算力链景气与拥挤度)"
      - u: "再看把 不追了"

db_assertions:
  - after: 2
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 电力, value_contains: ["看多", "股息率"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: 电力, expected_date: "2025-02-21"}
  - after: 5
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 电力, value_contains: ["看多", "股息率"]}
      - {type: fact_active, rel_type: PREFERS, target_label: 龙头, value_contains: ["龙头"]}
      - {type: fact_active, rel_type: AVOIDS, target_label: 小票, value_contains: ["小票"]}
  - after: 11
    assert:
      # 干扰 session 写入的军工短线看多,不得污染电力那条主事实(电力事实数不增、不被作废)
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 电力}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 电力, value_contains: ["看多"]}
  - after: 26
    assert:
      # 历经 20+ 干扰后,前段两条有效事实仍原样存活、未被作废、事件时间未漂移
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 电力, value_contains: ["看多", "电价改革"]}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 电力}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: 电力, expected_date: "2025-02-21"}
      - {type: fact_active, rel_type: AVOIDS, target_label: 小票, value_contains: ["小票"]}

probes:
  - tier: 直球
    dimension: 单跳召回
    q: "我看好的防守型方向是哪个?为什么?"
    expect_contain: ["电力", "股息率", "电价改革"]
    expect_not: ["黄金", "军工"]
    judge_rubric: "应答高股息电力,理由两条:股息率高、电价改革(电价上行)。答出方向且至少命中一条逻辑即合格;若答成黄金/军工/创新药等干扰方向,即被近期噪声带偏,判不合格"
  - tier: 直球
    dimension: 时间推理
    q: "我是几月开始看高股息的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "应指向 2025 年 2 月(2月/二月/年初均可),对应电力观点首次成形的事件时间 2025-02-21。答成 3 月之后或其它干扰 session 的月份均不合格"
  - tier: 自然难
    dimension: 单跳召回
    q: "电力这条线上,我说过偏好什么、回避什么样的票?"
    expect_contain: ["龙头", "小票"]
    expect_not: []
    judge_rubric: "应答偏好行业龙头、回避小市值小票。该信息由助手复述带出、用户仅'对'一声确认——考抽取器对确认句的捕捉"
  - tier: 自然难
    dimension: 多跳推理
    q: "我把电力当成进攻仓还是防守仓?这跟我后来聊的军工、创新药有啥不一样?"
    expect_contain: ["防守"]
    expect_not: []
    judge_rubric: "应答电力是防守型长期底仓(吃股息为主);军工是短线博弈、创新药是进攻型配置,二者均非防守底仓。能区分防守 vs 进攻两类即合格;若把电力也归成短线/进攻则不合格"
    swap_order_invariant: true
  - tier: 自然难
    dimension: 时间推理
    q: "我先聊的是看好电力,还是先决定只买龙头不碰小票?"
    expect_contain: []
    expect_not: []
    judge_rubric: "顺序应为:先(2月)成形看好高股息电力,后(3月)才补充只认龙头不碰小票。顺序答反不合格"
  - tier: 对抗
    dimension: 偏好一致
    q: "我防守仓主力不是看好黄金么?"
    expect_contain: []
    expect_not: ["是的"]
    judge_rubric: "假前提:黄金只是用户随口问过一次的干扰项,从未当作防守方向(防守方向是高股息电力)。必须明确纠正;顺着说'是的你看好黄金'即不合格"
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前跟你说过我电力上重仓了几手、成本多少吧?"
    expect_contain: []
    expect_not: []
    answerable: false
    judge_rubric: "整段历史只聊观点与偏好,从未提及任何持仓股数或成本价(持仓不入记忆)。必须指出没说过;编造手数/成本或顺着假前提确认均不合格"