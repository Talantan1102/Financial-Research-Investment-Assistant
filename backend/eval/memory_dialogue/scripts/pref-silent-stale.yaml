# 对话流评估脚本《快退休了转保守》— 偏好画像族,主攻「沉默式作废」。
# 压的机制(偏好一致维度):风险偏好画像的隐式翻转——
#   用户从不说「我作废之前那条偏好」,只在某次重提旧事时顺带一句「我快退休了 转保守」;
#   旧的激进偏好(能扛大回撤/上杠杆)没有任何显式撤回信号,必须被【静默作废】。
#   坑点:抽取器/记忆层最容易的偷懒是「新偏好也写进去,但旧的激进那条不标作废」——
#   于是图里同时 active 着「能扛大回撤」和「要保守」两条互相打架的偏好,
#   下游配置建议时要么撞车、要么默认抓到先写入的激进那条(recency 没生效)。
# 搭车机制(去重):session 6 用户又把保守口径复述确认一次(「别给我整高波动的」),
#   纯复核不产生新偏好,PREFERS 边数不得增(fact_count_no_increase)。
# 刁钻点:
#   1) 激进偏好(session 1)由用户亲口说+助手复述确认,一定进图;转保守(session 4)藏在
#      「重提旧事顺带改口」里(「上次让你按我能扛跌那套来 现在不行了」),禁郑重更正体——
#      改口锚点埋在散户口语里(「转保守」「别给我高波动的」),抽取器要在噪声里抓到这是偏好翻转。
#   2) 有效信息埋 session 中后段:转保守那句不在 session 4 开头,前面先扯了一段无关行情。
#   3) 关键 probe 不只考「答没答当前=保守」,还考【冲突要主动点明而非静默选旧】:
#      好答=用当前保守画像配置 + 主动说「你早先说能扛大回撤,现在改保守了,我按保守来」;
#      坏答=闷头按激进那条给高波动建议(expect_not 激进/高波动)。
#   4) 顺带埋一条 AVOIDS(明说讨厌的板块=妖股/题材股),与 PREFERS 风格偏好双轨,
#      转保守后这条 AVOIDS 不该被连带误作废(它是独立偏好,不随风险档位变)。
# 台词纪律:用户侧按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,同音错字是真人指纹);
#   助手侧写要点,负责复述确认(给抽取器的合法锚点,也是真实助手行为)。
script_id: pref-silent-stale
title: "快退休了转保守"
family: 偏好画像族
substrate: 偏好画像(风险承受/投资风格/讨厌板块,跨 session 表达与演化;持仓事实不入图)

sessions:
  - n: 1
    date: 2025-01-08
    length: 中
    turns:
      - u: "你帮我看组合的时候 有个底色你得先知道"
      - a: "(请用户说明这个底色是什么——风险偏好还是投资风格?)"
      - u: "我现在风险承受能力强 能扛大回撤 别给我整那种稳稳当当一年三个点的"
      - a: "(确认理解;追问:能扛大回撤具体到什么量级?回撤三成、五成您也拿得住?)"
      - u: "三成内我眼都不眨 真到五成我也不慌 我这人就好高波动 涨得猛我才有感觉"
      - a: "(复述确认:用户当前风险偏好为激进——可承受大回撤(三成以内无压力),偏好高波动品种;不接受低波动稳健型)"
      - u: "对 就这调性 配的时候按这个来"
      - a: "(记录:风险偏好=激进/高波动可承受,作为后续配置的画像底色)"
  - n: 2
    date: 2025-01-20
    length: 短
    turns:
      - u: "今天大盘怎么又绿了 没啥消息把"
      - a: "(简析当日普跌的情绪面与成交量,无重大利空)"
  - n: 3
    date: 2025-02-04
    length: 中
    turns:
      - u: "对了还有个事 我有个东西是真烦 那种纯炒题材的妖股 一分钱业绩没有就靠故事拉的"
      - a: "(确认:用户明确回避纯题材妖股/无业绩支撑的概念炒作;问是否要把这条写进配置约束?)"
      - u: "写进去 这类东西你以后别往我组合里塞 看着就燥"
      - a: "(复述确认:用户回避无业绩支撑的题材股/妖股,作为配置硬约束)"
      - u: "嗯 业绩是底线 故事我不买单"
      - a: "(记录:AVOIDS 题材股/妖股,逻辑无业绩支撑)"
  - n: 4
    date: 2025-03-05
    length: 长
    turns:
      - u: "美债收益率这两天上得有点凶 对A股压力大不大"
      - a: "(分析美债上行对成长股估值的传导与北向情绪)"
      - u: "嗯 这种宏观的我也就听个响 主要还得看自己仓位"
      - a: "(回应;问是否需要就当前持仓结构做一次梳理?)"
      - u: "梳理倒不急 不过有个事我得跟你说一声 上次让你按我能扛跌那套来配的 现在不行了"
      - a: "(请用户说明哪里要调整)"
      - u: "我快退休了 心态不一样了 往后转保守 别给我整高波动的东西了"
      - a: "(确认要点:用户风险偏好发生转变——因临近退休转为保守,不再接受高波动品种;此前激进/能扛大回撤的口径不再适用)"
      - u: "对 之前那套能扛大回撤的就翻篇了 现在求稳 回撤大的我睡不着"
      - a: "(复述确认:用户当前风险偏好=保守/低波动优先;此前激进偏好已不适用,后续配置改按保守画像;问保守到什么程度——能接受年化几个点的稳健收益?)"
      - u: "稳就行 一年跑赢存款我就知足 别让我大起大落"
      - a: "(记录偏好更新:风险偏好由激进转为保守,触发因素临近退休,优先低波动/稳健;原激进偏好作废)"
      - u: "妖股那条不用动啊 我还是不碰 那个跟保守不保守没关系"
      - a: "(确认:回避题材妖股这条独立偏好不变,仍然有效)"
  - n: 5
    date: 2025-03-22
    length: 短
    turns:
      - u: "黄金这位置还能追么 有点怕站岗"
      - a: "(分析金价驱动与追高风险)"
      - u: "那我再看把"
  - n: 6
    date: 2025-04-10
    length: 短
    turns:
      - u: "我怕你记串 再跟你确认下 我现在是要稳的 别给我整高波动的"
      - a: "(复述:当前风险偏好为保守/低波动优先,此前激进口径已作废;仅复核,不新增偏好)"
      - u: "对对 就这意思 别又按我以前那套激进的来"
      - a: "(确认无新增偏好,仅复核;保守画像维持,不写入新事实)"
  - n: 7
    date: 2025-04-25
    length: 短
    turns:
      - u: "医药今天大跌咋回事"
      - a: "(归因:集采消息与个股暴雷带动)"
      - u: "行 知道了"

db_assertions:
  # 第1个session 后:激进偏好被写进图(能扛大回撤/高波动)——这是后面要被静默作废的对象。
  - after: 1
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [风险偏好, 风险承受], value_contains: ["激进", "高波动"]}
      - {type: valid_from_is_event_time, rel_type: PREFERS, target_label: [风险偏好, 风险承受], expected_date: "2025-01-08"}
  # 第3个session 后:讨厌的板块写成 AVOIDS(题材股/妖股),与风险偏好双轨并存,互不干扰。
  - after: 3
    assert:
      - {type: fact_active, rel_type: AVOIDS, target_label: [题材股, 妖股], value_contains: ["业绩"]}
  # 第4个session 后(沉默式作废核心):转保守没有显式撤回信号,但旧激进偏好必须被作废、
  #   新保守偏好立起来。坑=只写新不作废旧 → 两条 PREFERS 同时 active 打架。
  #   同时:AVOIDS 妖股那条独立偏好不该被连带误作废(它跟风险档位无关)。
  - after: 4
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [风险偏好, 风险承受], value_contains: ["保守"]}
      - {type: old_invalidated, rel_type: PREFERS, target_label: [风险偏好, 风险承受], min_count: 1}
      - {type: invalidated_chain_intact, rel_type: PREFERS, target_label: [风险偏好, 风险承受], expected_versions: 2}
      - {type: fact_active, rel_type: AVOIDS, target_label: [题材股, 妖股], value_contains: ["业绩"]}
  # 第6个session 后(去重搭车):又把保守口径确认一次,纯复核不产生新偏好——PREFERS 边数不得增。
  - after: 6
    assert:
      - {type: fact_count_no_increase, rel_type: PREFERS, target_label: [风险偏好, 风险承受]}
      - {type: fact_active, rel_type: PREFERS, target_label: [风险偏好, 风险承受], value_contains: ["保守"]}

probes:
  # 关键 probe(偏好一致):问配置,好答=用当前保守画像 + 新旧冲突时主动点明,而非静默选旧。
  - tier: 自然难
    dimension: 偏好一致
    q: "现在帮我配个组合的话,你会按什么风格来?"
    expect_contain: ["保守"]
    expect_not: ["激进", "高波动"]
    judge_rubric: "好答=按当前保守/低波动画像来配,且最好主动点明『你早先说能扛大回撤偏激进,后来因临近退休改成保守了,我按现在的保守来』。坏答=闷头按激进那条给高波动/能扛大回撤的建议(静默选了已作废的旧偏好,recency 没生效)。命中『激进』或『高波动』作为当前应采用的风格即不合格;只要落到保守/稳健/低波动即合格"
  - tier: 直球
    dimension: 知识更新
    q: "我现在的风险偏好是激进还是保守?"
    expect_contain: ["保守"]
    expect_not: ["激进"]
    judge_rubric: "应答当前为保守/求稳/低波动;若答激进(或『能扛大回撤』那套)即旧偏好未作废,判不合格"
  - tier: 直球
    dimension: 单跳召回
    q: "我明说过讨厌、让你别往组合里塞的是哪类票?"
    expect_contain: ["题材"]
    expect_not: []
    judge_rubric: "应答题材股/妖股(无业绩支撑的概念炒作)。点出题材/妖股/没业绩靠故事任一等价表述即合格;答成别的板块或答不上来即不合格"
  - tier: 自然难
    dimension: 时间推理
    q: "我是什么时候、因为啥把风险偏好从能扛跌改成求稳的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "时间应指向 2025 年 3 月初(3月/三月/美债那次聊天均可);原因应答临近退休、心态变了、求稳怕大回撤。时间答成 1 月(那是激进口径成形时)或原因答不出退休因素均不合格"
  - tier: 自然难
    dimension: 多跳推理
    q: "我转保守之后,那条不碰题材妖股的要求还算不算数?"
    expect_contain: ["题材"]
    expect_not: []
    judge_rubric: "应答仍然算数——回避题材妖股是独立偏好,跟风险档位无关,没随转保守一起取消(用户在 session 4 还专门交代过『妖股那条不用动』)。若答成『转保守后这条也不重要了/已取消』即把独立偏好连带误作废,不合格"
    swap_order_invariant: true
  - tier: 对抗
    dimension: 偏好一致
    q: "我一直都是那种求稳、受不了波动的性子吧?"
    expect_contain: []
    expect_not: ["是的", "一直"]
    judge_rubric: "假前提:用户并非一直保守——轨迹是先激进(能扛大回撤/好高波动)、后因临近退休才转保守。必须纠正这个『一直求稳』的假设,点出早先是激进偏好、是后来才改的;顺着说『对你一直都求稳』即不合格"
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前是不是跟你说过 我能拿来配置的本金大概多少?"
    expect_contain: []
    expect_not: []
    answerable: false
    judge_rubric: "整段历史只聊风险偏好与讨厌的板块,从未提及任何本金/资金量/仓位金额(持仓与资金不入记忆图)。必须指出没说过;编造金额或顺着假前提确认均不合格"