# 对话流评估脚本《半导体逻辑破掉之后》— 观点演化族,主攻「涟漪传播」。
# 压的机制(涟漪传播):一个原子观点(看好半导体周期反转)派生出一条计划
#   (「科技这块打算提到三成」)——计划的成立依赖于原子观点这个前提。
#   后来原子观点被推翻(「半导体这逻辑我不认了」),按理派生计划应当联动作废/挂红。
#   db 断言写「期望联动」——但当前写管线大概率只作废原子观点那条边、不会沿派生关系传播,
#   所以 after:8 那条 old_invalidated(min_count:2) 大概率红灯。**这正是本脚本的评估目的**:
#   红灯=系统确实不做涟漪传播,是真信号不是脚本 bug(详见 design_notes)。
# 搭车机制:原子观点的「直接推翻」单跳更新(知识更新)、作废历史可回溯(单跳召回)、
#   弃答(从没说过亏多少 / 从没说过具体目标价)顺带压。
# 刁钻点:
#   (1) 派生计划的边用 PREFERS→Strategy(「科技加仓」当成策略倾向),原子观点用
#       EXPRESSED_VIEW→Industry(半导体)——两条边语义不同、target 不同,联动需要跨标签推理,
#       系统几乎必然漏;
#   (2) 计划是「打算提到三成」=意图,不是「已经买了多少股」=持仓事实——持仓有独立模块不入记忆图,
#       脚本里散户顺口提了一句操作(干扰),但断言绝不围绕股数;
#   (3) 推翻句用「重提旧事顺带改口」(「上次那个半导体…我不认了」),不走郑重更正体,
#       考抽取器在松散口语里认出这是对旧观点的否定。
# 台词纪律:用户侧按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,如「反转」写「反砖」「逻辑」写「罗辑」——抽取器就该扛);
#   助手侧写要点,复述确认句是给抽取器的合法锚点。
script_id: viewpoint-ripple
title: "半导体逻辑破掉之后"
family: 观点演化族
substrate: 观点演化 + 派生计划联动(无结构化模块兜底,纯记忆领地;持仓事实显式不入)

sessions:
  - n: 1
    date: 2025-02-10
    length: 中
    turns:
      - u: "半导体最近动起来了哈 你怎么看这波"
      - a: "(分析驱动:设备国产化、库存见底、AI 拉动需求;问用户自己怎么判断)"
      - u: "我觉得这轮是周期反砖 不是炒一波就完 我看好半导体往上走"
      - a: "(回应观点;追问:您看好半导体,核心是赌周期反转这个判断?)"
      - u: "对 就赌周期底部起来 设备和存储这块最先动"
      - a: "(总结用户观点:看好半导体,核心逻辑=周期反转;关注设备/存储环节)"
  - n: 2
    date: 2025-02-19
    length: 短
    turns:
      - u: "今天大盘缩量了 是不是要变盘"
      - a: "(简析量能与变盘概率)"
  - n: 3
    date: 2025-03-04
    length: 长
    turns:
      - u: "顺着半导体那个判断 我想动一动我的盘子"
      - a: "(承接:您之前看好半导体是赌周期反转;问想怎么调整)"
      - u: "我科技这块仓位太轻了 就想往上加 加到三成左右"
      - a: "(确认理解:基于看好半导体的判断,计划把科技仓位提升至三成左右——这是一条由观点派生出的加仓计划)"
      - u: "嗯 不是一把梭 慢慢加 看着半导体的脸色加"
      - a: "(确认:分批加,加仓节奏跟随半导体周期验证;记录:计划把科技仓位提到三成,前提是半导体周期反转成立)"
      - u: "对了我今天先挂了点中芯 试个水"
      - a: "(注:这是一笔具体操作,持仓由独立模块跟踪;此处只记录加仓计划与其前提观点)"
      - u: "哈对 持仓你别管 我就要你记着我这个加科技的盘算"
      - a: "(确认:记录加仓计划本身,不记具体股数;计划绑定半导体周期反转这个前提)"
  - n: 4
    date: 2025-03-17
    length: 短
    turns:
      - u: "黄金又新高了 这还能上车么"
      - a: "(分析金价驱动与追高风险)"
      - u: "那我再看把"
  - n: 5
    date: 2025-03-28
    length: 短
    turns:
      - u: "光伏跌成这样了 有没有机会"
      - a: "(分析光伏供需与产能出清进度)"
  - n: 6
    date: 2025-04-09
    length: 短
    turns:
      - u: "对了 我记得我跟你念叨过半导体来着把?"
      - a: "(复述:看好半导体,核心逻辑=周期反转;并有一条派生计划=把科技仓位提到三成)"
      - u: "对对 就那个 还没变"
      - a: "(确认无更新)"
  - n: 7
    date: 2025-04-22
    length: 长
    turns:
      - u: "费城半导体昨晚又杀了一根 我有点慌"
      - a: "(给出外盘半导体走弱与传导;问您担心的是周期判断本身?)"
      - u: "存储涨价说了半天没兑现 设备订单也不及预期 群里都说这波是假反砖"
      - a: "(汇总:存储涨价证伪、设备订单走弱;问对您的周期反转判断意味着什么)"
      - u: "那我那罗辑不就站不住了 我赌的就是周期反转 这事我现在不认了"
      - a: "(确认:您当初看好半导体的核心逻辑是周期反转,现在认为该前提被证伪;问观点调整为?)"
      - u: "看好我收回 转中性 这逻辑我不认了 别再按看好那套来"
      - a: "(记录观点更新:对半导体由看好转为中性,原周期反转逻辑被存储/设备数据证伪)"
      - u: "嗯 后面有反砖的真凭据再说"
      - a: "(确认;按中性跟踪半导体)"
  - n: 8
    date: 2025-05-06
    length: 中
    turns:
      - u: "存储这两天反弹了 是不是又有戏了"
      - a: "(给出反弹幅度与持续性存疑;提示这与您已转中性的判断需要新证据才推翻)"
      - u: "戏不戏的我先不动 反正看好那套我撤了"
      - a: "(确认半导体维持中性,无更新)"
  - n: 9
    date: 2025-05-20
    length: 短
    turns:
      - u: "军工今天为啥集体大涨"
      - a: "(归因:订单与地缘消息催化)"
      - u: "行 知道了"

db_assertions:
  # 原子观点在 session 1 落地:看好 + 周期反转(value 取短词,抗规整)
  - after: 1
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 半导体, value_contains: ["看好", "周期反转"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: 半导体, expected_date: "2025-02-10"}
  # session 3:派生计划落地——加科技仓位的倾向,用 PREFERS→Strategy 语义("科技加仓"=策略)
  - after: 3
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: 科技加仓, value_contains: ["三成"]}
      # 硬约束:计划是意图不是持仓事实,股数不入图 → 不应写出持仓类事实(HOLDS 不在白名单断言里,
      # 这里用 no_fact_written 守 STUDIED 这种最易被中芯"试水"误触发的边)
      - {type: no_fact_written, rel_type: STUDIED}
  # session 6:重提旧事但无更新,事实数不应增长
  - after: 6
    assert:
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 半导体}
      - {type: fact_count_no_increase, rel_type: PREFERS, target_label: 科技加仓}
  # session 7:原子观点被推翻——看好转中性,旧观点作废
  - after: 7
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 半导体, value_contains: ["中性"]}
      - {type: old_invalidated, rel_type: EXPRESSED_VIEW, target_label: 半导体, min_count: 1}
      - {type: invalidated_chain_intact, rel_type: EXPRESSED_VIEW, target_label: 半导体, expected_versions: 2}
  # session 8(涟漪传播断言核心):原子观点已作废,派生计划理应联动作废/挂红。
  # 期望:科技加仓这条 PREFERS 边也被标作废(min_count:1 的派生作废)。
  # **当前系统大概率不做这种跨标签的派生联动 → 此条预期红灯,是真信号(见 design_notes)**
  - after: 8
    assert:
      - {type: old_invalidated, rel_type: PREFERS, target_label: 科技加仓, min_count: 1}

probes:
  - tier: 直球
    dimension: 知识更新
    q: "我现在对半导体是什么看法?"
    expect_contain: ["中性"]
    expect_not: ["看好"]
    judge_rubric: "应答当前观点为中性;若答看好即旧事实未作废,判不合格"
  - tier: 直球
    dimension: 单跳召回
    q: "我当初看好半导体,赌的核心逻辑是什么?"
    expect_contain: ["周期反转"]
    expect_not: []
    judge_rubric: "应答周期反转(周期底部反转/周期向上的等价表述也算);对已作废观点的历史回溯,能答出即合格"
  - tier: 自然难
    dimension: 多跳推理
    q: "我科技仓位提到三成的那个加仓计划,现在还作数吗?"
    expect_contain: []
    expect_not: []
    judge_rubric: "好答=识别出该计划是从『看好半导体/周期反转』派生的,而那个前提已被用户在 4 月推翻转中性,因此计划的依据已不成立、需要重审,不能直接说还作数。只复述『计划是提三成』而不点出前提已变=不合格;直接说『计划照旧有效』=不合格(顺着失效前提确认)。这是涟漪传播的端到端检验:即便 db 未做边联动,强模型也应在回答层做出这个推理"
    swap_order_invariant: true
  - tier: 自然难
    dimension: 时间推理
    q: "我是什么时候、因为什么把半导体从看好转成中性的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "时间应指向 2025 年 4 月下旬(四月/4月/费城半导体杀跌后均可);原因应答存储涨价没兑现、设备订单不及预期、周期反转逻辑被证伪。漏时间或漏原因均扣"
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前是不是给科技仓位定了个明确的目标价位才加的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "假前提:用户只说过加到三成『仓位比例』,从未提过任何目标价位。必须指出没设过目标价(可顺带说当时设的是三成仓位比例);编造一个价位或顺着假前提确认均不合格"
    answerable: false
  - tier: 对抗
    dimension: 知识更新
    q: "半导体我是不是从头到尾都看空来着?"
    expect_contain: []
    expect_not: []
    judge_rubric: "假前提:用户从未看空(轨迹是看好→中性)。必须明确纠正;顺着说『是的你一直看空』即不合格"