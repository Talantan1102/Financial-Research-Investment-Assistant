# 对话流评估脚本《观点与持仓混说》— 持仓仲裁族,仿首段范本 viewpoint-baijiu.yaml 结构与注释。
# 压的机制(持仓仲裁维度):最刁钻形态——用户一句话同时表观点 + 报持仓数字
#   (「我看好高端白酒所以上周加到500股了」「逻辑变了我把它减到200」)。
#   考点:抽取器能不能在同一句里切分「观点」(入图 EXPRESSED_VIEW)和「持仓事实」
#   (绝不入图,这是持仓监控模块的地盘)。HOLDS 是写管线刻意拉黑的 rel_type。
# 搭车:观点演化(看好→中性)正常入链;同时全程必须 no_fact_written(HOLDS) 守住边界。
# 刁钻点:数字(500股/200股/三成/清掉)永远黏在观点旁边一起说,诱导抽取器把仓位
#   连同观点一起落库;助手复述只确认观点、把仓位部分明确划给监控模块(合法锚点 +
#   边界声明)。改口走「逻辑变了顺带把它减到200」——观点改 + 持仓动作同句,双重诱导。
# 台词纪律:用户侧按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字如「加到」误「家到」、「再看把」是真人指纹);助手侧写要点 + 复述确认 +
#   持仓划归声明(给抽取器的合法锚点,也是真实助手行为:观点入记忆、仓位走监控)。
script_id: holding-mixed-view
title: "观点与持仓混说"
family: 持仓仲裁族
substrate: 持仓口头陈述的边界(加仓/减仓/清仓/股数走持仓监控模块,绝不入记忆图;同句顺带的观点照常入图)

sessions:
  - n: 1
    date: 2025-02-11
    length: 中
    turns:
      - u: "高端白酒这位置 我越看越想下手"
      - a: "(回应当前估值与批价位置;问用户研究到什么结论了)"
      - u: "研究透了 就一条 高端白酒我看好 提价权这逻辑还在"
      - a: "(确认观点:看好高端白酒,核心逻辑提价权;追问看好的是哪一档)"
      - u: "茅五这一档 所以我上周加到500股了 这把我有信心"
      - a: "(记录观点:看好高端白酒(茅五),逻辑提价权;持仓动作『加到500股』归持仓监控模块单独跟踪,不并入观点记忆)"
  - n: 2
    date: 2025-02-19
    length: 短
    turns:
      - u: "美联储议息这次对A股流动性啥影响"
      - a: "(简析议息与北向传导)"
  - n: 3
    date: 2025-03-04
    length: 短
    turns:
      - u: "黄金这位置还追么 怕站岗"
      - a: "(分析金价驱动与回调风险)"
      - u: "那我再看把"
  - n: 4
    date: 2025-03-20
    length: 长
    turns:
      - u: "白酒一季报预告出得差不多没 高端啥情况"
      - a: "(汇总高端白酒一季报预告:分化、动销偏弱)"
      - u: "茅台批价群里说又松了 真的假的"
      - a: "(给出批价走势:确有回落,渠道挺价乏力)"
      - u: "动销比我想的差不少啊。。。提价今年还有戏么"
      - a: "(分析:库存压力下提价窗口大概率推迟,部分酒企变相降价)"
      - u: "那我逻辑就有问题了 我看好白酒赌的就是提价权 现在这逻辑悬了"
      - a: "(确认:用户当初看好逻辑是提价权,现认为被一季报动销/批价证伪;问观点调整为)"
      - u: "看好我先收了 转中性吧 不看空 逻辑变了我把它减到200了"
      - a: "(记录观点更新:高端白酒由看好转中性,原提价权逻辑被一季报证伪;持仓动作『减到200股』归持仓监控模块,不并入观点记忆)"
      - u: "嗯 后面有新变化再说"
      - a: "(确认;按中性观点跟踪白酒板块;仓位变动已交监控侧)"
  - n: 5
    date: 2025-04-02
    length: 短
    turns:
      - u: "新能源车四月第一周销量出来没"
      - a: "(给出周度销量与环比)"
  - n: 6
    date: 2025-04-16
    length: 短
    turns:
      - u: "对了 我记得我跟你聊过白酒来着把?"
      - a: "(复述:对高端白酒由看好转中性,逻辑提价权已被一季报证伪)"
      - u: "对对 就那个 没变"
      - a: "(确认无更新)"

db_assertions:
  # 第1个session后:观点入图(看好+提价权)、事件时间锚建立日;持仓『加到500股』被切掉——HOLDS 不入图
  - after: 1
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒], value_contains: ["看好", "提价权"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒], expected_date: "2025-02-11"}
      - {type: no_fact_written, rel_type: HOLDS}
  # 第4个session后:观点演化(看好→中性)正常入链、旧版本作废;同句的『减到200股』再次被切掉——HOLDS 仍不入图
  - after: 4
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒], value_contains: ["中性"]}
      - {type: old_invalidated, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒], min_count: 1}
      - {type: no_fact_written, rel_type: HOLDS}
  # 第6个session后:重提确认,观点版本不增;持仓边界全程守住——HOLDS 始终为空
  - after: 6
    assert:
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: [白酒, 高端白酒]}
      - {type: no_fact_written, rel_type: HOLDS}

probes:
  # 直球 · 持仓仲裁:同句里的观点正确召回(被混说的500股/200股不该污染观点提取)
  - tier: 直球
    dimension: 持仓仲裁
    q: "我现在对高端白酒整体是什么看法?"
    expect_contain: ["中性"]
    expect_not: ["看好", "看多", "500", "200"]
    judge_rubric: "应答当前观点为中性。观点全程都是和持仓数字混在一句里说的(加到500股/减到200股),抽取器须只取观点部分。若答看好/看多即旧观点未作废;若把仓位数字(500/200股)当观点内容答出即未切分混说,均判不合格"
  # 直球 · 单跳召回:看好逻辑(从混说句里抽出的观点理由)
  - tier: 直球
    dimension: 单跳召回
    q: "我当初看好高端白酒的核心逻辑是什么?"
    expect_contain: ["提价权"]
    expect_not: []
    judge_rubric: "应答提价权(品牌力/提价能力等价表述也算)。这是对已作废观点的历史回溯,理由埋在『高端白酒我看好 提价权这逻辑还在』这句混说里,能干净答出即合格"
  # 自然难 · 持仓仲裁:观点演化是否被正确记成两版(看好→中性),不被同句仓位动作干扰
  - tier: 自然难
    dimension: 持仓仲裁
    q: "我对高端白酒的判断改过没?怎么改的?"
    expect_contain: ["看好", "中性"]
    expect_not: []
    judge_rubric: "应答由看好(逻辑提价权)转为中性(一季报动销差/批价回落证伪提价权)。两次表达都和加减仓动作混在一句,正确切分后观点链应清晰呈现这一次改动;若把『减到200』之类仓位动作混进观点改动描述即不合格"
    swap_order_invariant: true
  # 对抗 · 持仓仲裁(弃答):直接问持仓股数——持仓事实从不入记忆图,必须弃答
  - tier: 对抗
    dimension: 持仓仲裁
    q: "我高端白酒现在手里还剩多少股来着?当初加到多少?"
    expect_contain: []
    expect_not: ["500", "200", "500股", "200股"]
    judge_rubric: "假前提:把持仓股数当记忆可查项。用户确实在对话里顺口说过『加到500股』『减到200』,但持仓事实刻意不入记忆图(归持仓监控模块)。助手必须指出记忆里不记仓位/股数、应去持仓监控侧查,不得从对话里把500/200当事实复述出来。答出任何股数即越界,判不合格"
    answerable: false
  # 对抗 · 克制弃答:从未提过的盈亏金额,不得编造
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前跟你说过我在白酒这波上赚了还是亏了多少么?"
    expect_contain: []
    expect_not: []
    judge_rubric: "整段历史只聊过观点和顺口报的仓位动作,从未提及任何盈亏金额。必须指出没说过;编造金额或顺着假前提确认均不合格"
    answerable: false
