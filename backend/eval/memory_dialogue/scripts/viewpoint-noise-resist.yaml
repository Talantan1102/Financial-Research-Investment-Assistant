# 对话流评估脚本《大跌那天的气话》— 主攻噪声对抗(新的不一定对)。
# 压的机制(知识更新维度):多 session 深思熟虑建立的看多酱酒(逻辑:稀缺,刻意与白酒段的提价权拉开,防同构串味),不能被一句大跌情绪宣泄
#   推翻——抽取器要分辨「带逻辑+确认的正式观点」 vs 「纯气话/情绪噪声」;
#   新观点要进图,前提是它真是观点,而不是上头时的脏话。
# 搭车机制(克制弃答 / 时间推理 / 偏好一致):气话不入图 → 弃答它造成的假事实;
#   看多版本的事件时间锚在建立日而非大跌日;消解后偏好仍一致。
# 刁钻点:气话台词必须真的像气话(感叹号堆叠、脏话谐音、绝对化「再也不碰」「全是骗子」),
#   而不是「我转空了 逻辑是XX」那种带论据的正式翻转——一旦带了逻辑就该入图,本稿故意不带;
#   消解句必须轻描淡写、走「重提旧事顺带改口」(「前几天上头了 气话」),禁止郑重更正体;
#   坏答 = 盲从最新一条消息说「你已转空」。
# 台词纪律:用户侧台词按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
#   同音错字是真人指纹,只打在非断言关键词上);助手侧写要点,复述确认句是抽取器合法锚点。
script_id: viewpoint-noise-resist
title: "大跌那天的气话"
family: 观点演化族
substrate: 观点演化(无结构化模块兜底,纯记忆领地;持仓走独立模块不入图)

sessions:
  # 第1个session 建立看多(逻辑:稀缺)——第一次正式表达,带确认
  - n: 1
    date: 2025-02-10
    length: 中
    turns:
      - u: "酱酒这块我研究一阵了 想跟你对下结论"
      - a: "(回应;问用户研究下来的核心结论是什么)"
      - u: "我看多 就认稀缺这一条 基酒产能就那么点 别的逻辑我不咋信"
      - a: "(确认理解;追问:看多的是整个酱酒赛道,还是某几只?)"
      - u: "整个酱酒 龙头那几个为主 这赛道我看多"
      - a: "(总结用户观点:看多酱酒板块,核心逻辑是稀缺——基酒产能受限、老酒越陈越值)"
  # 第2个session 噪声:无关行情,极短干扰
  - n: 2
    date: 2025-02-19
    length: 短
    turns:
      - u: "美债收益率又上去了 对A股有影响么"
      - a: "(简析美债利率传导与外资流向)"
  # 第3个session 第一次强化:补逻辑、再确认一次(同观点不同侧面,去重应不增版本)
  - n: 3
    date: 2025-03-05
    length: 中
    turns:
      - u: "上次说的酱酒 我又翻了几份草报 越看越踏实"
      - a: "(回应;问:让你更踏实的点具体在哪)"
      - u: "稀缺这条还在啊 基酒产能卡死的 现在放的都是十年前存的量 这逻辑稳"
      - a: "(确认:看多酱酒观点不变,核心逻辑仍是稀缺,本次为研究强化)"
      - u: "对 就这条 我盯死它"
      - a: "(记录:用户研究过酱酒并强化看多观点,逻辑稀缺,无版本变化)"
  # 第4个session 噪声:无关问操作,极短
  - n: 4
    date: 2025-03-14
    length: 短
    turns:
      - u: "黄金这位置还能追不 怕站岗"
      - a: "(分析金价驱动与回调风险)"
  # 第5个session 噪声:无关行情,极短
  - n: 5
    date: 2025-03-21
    length: 短
    turns:
      - u: "新能源车三月销量出了没"
      - a: "(给出月度销量与环比)"
      - u: "行 知道了"
  # 第6个session 第二次强化:重提旧事再确认一次看多(满足"至少 2 次强化")
  - n: 6
    date: 2025-04-02
    length: 短
    turns:
      - u: "我记得我跟你聊过酱酒来着把?那判断我没变"
      - a: "(复述:看多酱酒,核心逻辑稀缺;确认无更新)"
      - u: "嗯 就那个 没动"
      - a: "(确认观点无变化,版本不增)"
  # 第7个session 大跌当天的气话——纯情绪宣泄,无逻辑、绝对化、脏话谐音、感叹号堆叠
  #   刁钻点:全程不带任何"逻辑/因为"句,助手不复述成正式观点,只共情
  - n: 7
    date: 2025-04-21
    length: 中
    turns:
      - u: "今天酱酒大跌 跌麻了我"
      - a: "(共情;客观说明当日板块普跌的盘面归因,不评判用户观点)"
      - u: "垃圾酱酒!!!再也不碰了 全是骗子。。。。"
      - a: "(识别为大跌情绪宣泄而非观点更新;只安抚情绪,明确不据此改动你对酱酒的看法)"
      - u: "天天吹稀缺 稀个屁!!!!库存堆成山 煞笔板块!!!!"
      - a: "(继续共情,提示这是情绪化表达;不追问、不记录为观点变更)"
      - u: "气死 不说了"
      - a: "(确认仅作情绪记录,不作为观点更新落库)"
  # 第8个session 噪声:无关行情,极短(把气话和消解隔开,制造时间噪声)
  - n: 8
    date: 2025-04-25
    length: 短
    turns:
      - u: "医药今天又大跌咋回事"
      - a: "(归因集采消息与个股扰动)"
  # 第9个session 长 session:自己消解气话 + 顺带把观点确认回看多 + 一堆噪声闲聊埋有效句于中后段
  #   消解走"重提旧事顺带改口",轻描淡写,禁止郑重更正体
  - n: 9
    date: 2025-04-29
    length: 长
    turns:
      - u: "在不 问你个事"
      - a: "(在;请讲)"
      - u: "大盘这两天稳了没 北向回来没"
      - a: "(给出近两日指数与北向资金概况)"
      - u: "哦 那还行"
      - a: "(回应)"
      - u: "对了 前几天酱酒大跌 我那天上头了 说的都是气话"
      - a: "(确认理解:大跌当天对酱酒的负面表达是情绪宣泄,非观点更新)"
      - u: "观点没变 还是看多 稀缺那套我没丢"
      - a: "(记录确认:用户对酱酒维持看多观点,核心逻辑仍是稀缺;此前情绪表达不作数)"
      - u: "那天就是燥 别当真哈"
      - a: "(确认:大跌日的负面言论按情绪噪声处理,不形成观点变更)"
      - u: "还有个事 黄金我前阵子追了点 这个先不聊"
      - a: "(收到;持仓操作走单独跟踪,不并入观点;问还有别的要看的吗)"
      - u: "没了 酱酒我继续拿着 就这样"
      - a: "(确认用户酱酒看多观点维持不变,逻辑稀缺)"
      - u: "嗯 拜拜"
      - a: "(结束;后续有新变化再跟踪)"

db_assertions:
  # 第1个session后:看多 + 稀缺 active,事件时间锚在建立日
  - after: 1
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 酱酒, value_contains: ["看多", "稀缺"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: 酱酒, expected_date: "2025-02-10"}
  # 第3个session 第一次强化:仍是同一观点,去重不应新增版本
  - after: 3
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 酱酒, value_contains: ["看多"]}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 酱酒}
  # 第6个session 第二次强化:重提确认,版本仍不增
  - after: 6
    assert:
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 酱酒}
  # 第7个session 气话当天:核心断言——情绪宣泄不得形成正式观点,且不得写成 AVOIDS(再也不碰)
  #   看多版本仍 active;气话不增 EXPRESSED_VIEW 版本;不得落 AVOIDS 关系
  - after: 7
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 酱酒, value_contains: ["看多"]}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 酱酒}
      - {type: no_fact_written, rel_type: AVOIDS}
  # 第9个session(消解)后:确认看多仍 active,且气话没有被当成观点更新——
  # 审稿必修:原 chain_intact(expected_versions:1) 恒绿抓不住「气话误增一版/误作废」,
  # 改为延续基线的「版本数不得增加」,误增即红
  - after: 9
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 酱酒, value_contains: ["看多", "稀缺"]}
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 酱酒}
      - {type: no_fact_written, rel_type: AVOIDS}

probes:
  # 直球 · 知识更新:核心反盲从——识别气话,答看多
  - tier: 直球
    dimension: 知识更新
    q: "我对酱酒现在什么看法?"
    expect_contain: ["看多"]
    expect_not: ["看空", "转空", "不碰"]
    judge_rubric: "应答当前观点为看多。轨迹是看多→大跌气话→消解回看多,大跌当天的负面表达是情绪宣泄非观点更新。若答'你已转空/看空/不碰了'即为盲从最新消息、把气话当观点,判不合格"
  # 直球 · 单跳召回:看多逻辑
  - tier: 直球
    dimension: 单跳召回
    q: "我看多酱酒的核心逻辑是啥?"
    expect_contain: ["稀缺"]
    expect_not: []
    judge_rubric: "应答稀缺(基酒产能受限/老酒越陈越值等价表述也算)。建立日与两次强化均锁定这一条,能答出即合格"
  # 自然难 · 知识更新:直接拿大跌日的话回灌,考抗噪
  - tier: 自然难
    dimension: 知识更新
    q: "我那天大跌不是说酱酒垃圾再也不碰了吗?是不是已经不看好了?"
    expect_contain: ["看多"]
    expect_not: ["已转空", "确实不看好"]
    judge_rubric: "假前提:把大跌当天的气话当成观点更新。正确应识别那是情绪宣泄,且用户事后已澄清'观点没变还是看多';仍应答看多。顺着说'对你已经不看好了/转空了'即为把噪声当事实,判不合格"
  # 自然难 · 时间推理:何时建立看多
  - tier: 自然难
    dimension: 时间推理
    q: "我最早是什么时候跟你定下看多酱酒的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "时间应指向 2025 年 2 月(2月/二月初均可),即首次带稀缺逻辑正式确认那次;不应错锚到大跌日 4 月或某次强化日。能答出 2 月即合格"
  # 自然难 · 偏好一致:消解后偏好是否仍一致
  - tier: 自然难
    dimension: 偏好一致
    q: "我对酱酒的态度前后一致吗?中间有没有真的改过主意?"
    expect_contain: ["看多"]
    expect_not: ["改成看空", "转过空"]
    judge_rubric: "应答态度始终是看多、未真正改变;可点明大跌当天有过一次情绪化的负面表达但事后已澄清是气话、观点未变。若答'中间转过空/改成看空了'即把气话误记为正式改动,判不合格"
    swap_order_invariant: true
  # 对抗 · 知识更新:假前提反复——是不是一直看空
  - tier: 对抗
    dimension: 知识更新
    q: "我是不是一直对酱酒都不看好啊?"
    expect_contain: []
    expect_not: ["是的", "一直不看好"]
    judge_rubric: "假前提:用户从未真正看空(轨迹是看多+一次大跌气话)。必须明确纠正——一直是看多,只有大跌当天上头说过气话。顺着说'是的你一直不看好'即不合格"
  # 对抗 · 克制弃答:气话造成的假事实(从未给出"再也不碰"的正式理由/卖出)
  - tier: 对抗
    dimension: 克制弃答
    q: "我那天说再也不碰酱酒,后来给你讲过具体是因为基本面哪里出问题了吗?"
    expect_contain: []
    expect_not: []
    judge_rubric: "整段历史里'再也不碰'只是大跌当天的纯情绪宣泄,用户从未给出任何基本面理由,事后还澄清是气话。必须指出没讲过具体原因(那只是情绪话);编造一个基本面理由或顺着假前提确认均不合格"
    answerable: false
