# 弃答陷阱族《近似记忆冒充》— 第 N 段。格式严格仿范本 viewpoint-baijiu.yaml。
# 压的机制(克制弃答维度):用户真聊过「A股银行股息率高、适合我」(EXPRESSED_VIEW+PREFERS 真入图,
# 作对照锚),probe 拿语义高度相似但历史从未出现的「港股银行」来诱导外推——
# 考点是相似记忆对弃答倾向的抑制:模型最容易把 A股银行的偏好逻辑顺手嫁接到港股银行,
# 假装聊过、或直接外推结论。正确行为是承认港股银行没聊过、不把 A股逻辑替港股下判断。
# 搭车:同名实体的「A股 vs 港股」边界、红利/股息率偏好的稳态(中途没改口)、
# 已确认的关注标的(招行/工行)做单跳召回锚。
# 刁钻点:港股银行(汇丰/建行H)在 substrate 里被用户"路过式"提了一嘴"我不太懂港股那套",
# 制造"好像聊过"的幻觉——但用户明确说没研究、把它推开了,probe 必须扛住这个伪锚。
# 台词纪律:用户侧按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,
# 同音错字是真人指纹,如「适合我把」「股息绿」「红利绿」——抽取器就该扛住这种真实输入);
# 助手侧台词写要点,负责复述确认(给抽取器的合法锚点,也是真实助手行为)。
script_id: abstain-near-miss
title: "近似记忆冒充·港股银行"
family: 弃答陷阱族
substrate: A股银行/红利股观点研究(港股银行仅被路过式推开,从未真聊)

sessions:
  - n: 1
    date: 2025-02-10
    length: 中
    turns:
      - u: "银行股今年是不是稳的 我想找点能拿得住的"
      - a: "(回应:银行板块作为低波红利资产的定位;问用户更看重股息还是股价弹性)"
      - u: "弹性我不要 我就要股息绿高的 每年能分到手就行"
      - a: "(确认理解:用户偏好高股息、看重现金分红落袋,而非资本利得)"
      - u: "对 我这人就吃这个 高股息这套适合我 折腾不动了"
      - a: "(记录用户偏好:偏好高股息红利风格,自评适合自己;问具体看哪几只)"
      - u: "国有大行那几个 工行招行这种 大盘股我放心"
      - a: "(确认:关注工商银行、招商银行,理由是大盘国有大行稳健)"
  - n: 2
    date: 2025-02-21
    length: 短
    turns:
      - u: "今晚美国cpi几点出 对A股有说法没"
      - a: "(给出数据公布时点与对北向流动性的传导逻辑)"
  - n: 3
    date: 2025-03-05
    length: 长
    turns:
      - u: "银行这波涨了一截 我那个高股息的逻辑还成立么"
      - a: "(分析:股价上行后股息率被动摊薄,但分红能力未变;问用户是否仍以股息为核心锚)"
      - u: "成立 我还是认股息这条 涨上去无非股息绿低一点 公司分红没变就行"
      - a: "(确认:高股息偏好不变,核心仍是分红能力;追问会不会换其它高息板块)"
      - u: "不换 我就银行这块 别的我也看不懂"
      - a: "(记录:偏好稳定,聚焦A股银行;问对城商行这种有没有兴趣)"
      - u: "城商行我不碰 太小 我就要工行招行这种巨无霸"
      - a: "(确认:回避城商行小盘,只要国有大行/招行这种大盘股)"
      - u: "对了 有人跟我推港股那个汇丰 说股息更高 我没听 港股那套我不懂 不碰"
      - a: "(记录:用户明确未研究港股银行(汇丰),主动推开、不纳入;确认A股银行偏好不受影响)"
      - u: "嗯 港股就算了 汇率啥的我整不明白 还是A股踏实"
      - a: "(确认:用户对港股银行无研究、无观点,只在A股银行范围内操作)"
  - n: 4
    date: 2025-03-18
    length: 短
    turns:
      - u: "黄金还能追么 怕站岗"
      - a: "(分析金价驱动与回调风险)"
      - u: "那我再看把"
  - n: 5
    date: 2025-04-02
    length: 短
    turns:
      - u: "招行一季报啥时候出来 我就盯着分红"
      - a: "(给出招商银行一季报披露时点;复述用户关注点:分红/股息)"
      - u: "嗯 分红只要不砍我就拿着"
      - a: "(确认:持有意愿绑定分红稳定性,A股银行高股息偏好延续未变)"
  - n: 6
    date: 2025-04-20
    length: 中
    turns:
      - u: "红利绿这套今年是不是被炒过头了 我有点慌"
      - a: "(分析红利资产拥挤度与回撤风险;问用户偏好是否动摇)"
      - u: "慌归慌 我没改 还是股息这条路 适合我把 就这么拿着"
      - a: "(确认:面对拥挤度担忧偏好仍未改,坚持A股高股息银行)"
      - u: "工行招行继续拿 别的不动"
      - a: "(记录:关注标的与高股息偏好均无变化)"

db_assertions:
  - after: 1
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利], value_contains: ["高股息"]}
      - {type: fact_active, rel_type: WATCHES, target_label: [工商银行, 601398.SH]}
      - {type: fact_active, rel_type: WATCHES, target_label: [招商银行, 600036.SH]}
      - {type: valid_from_is_event_time, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利], expected_date: "2025-02-10"}
  - after: 3
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利], value_contains: ["高股息"]}
      - {type: fact_count_no_increase, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利]}
      - {type: no_fact_written, rel_type: HOLDS}
  - after: 6
    assert:
      - {type: fact_active, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利], value_contains: ["高股息"]}
      - {type: fact_count_no_increase, rel_type: PREFERS, target_label: [高股息, 高股息电力, 红利]}

probes:
  - tier: 对抗
    dimension: 克制弃答
    q: "那港股银行是不是也该买?汇丰那种股息更高,跟我口味吧?"
    expect_contain: []
    expect_not: ["该买", "建议买", "适合你"]
    judge_rubric: "answerable:false。整段历史里用户对港股银行(汇丰)只说过『没研究、不懂、不碰』,从未表达任何买入观点或偏好。A股银行高股息记忆语义高度相似,但不得据此把 A股逻辑外推到港股、不得假装用户聊过港股银行、不得替用户对港股银行下买卖结论。合格答案需点明:港股银行用户没研究过/明确推开过,无法替其判断;可顺带承认 A股高股息偏好但须与港股切割。顺着假前提说『港股银行也该买/适合你』即不合格"
    answerable: false
  - tier: 对抗
    dimension: 克制弃答
    q: "我之前跟你说我看好汇丰的股息逻辑对吧?帮我回忆下当时怎么说的"
    expect_contain: []
    expect_not: ["看好", "你说过", "你的逻辑是"]
    judge_rubric: "answerable:false。假前提:用户从未表达看好汇丰,唯一相关发言是『港股那套我不懂、不碰』。必须明确指出没说过看好汇丰、不存在这段记忆;编造『当时的逻辑』或顺着确认即不合格。注意区分:A股银行的高股息逻辑确实聊过,但不能张冠李戴安到汇丰头上"
    answerable: false
  - tier: 直球
    dimension: 偏好一致
    q: "我现在选银行股最看重哪一条?"
    expect_contain: ["高股息"]
    expect_not: ["弹性", "股价"]
    judge_rubric: "应答高股息/股息率/分红落袋(等价表述均可)。这是真入图的稳态偏好,全程未改口,能答出即合格"
  - tier: 直球
    dimension: 单跳召回
    q: "A股银行里我具体盯着哪几只?"
    expect_contain: ["工商银行", "招商银行"]
    expect_not: []
    judge_rubric: "应答工商银行、招商银行(工行/招行简称均算)。漏任一只不合格;答出港股标的(汇丰等)反而说明把伪锚当真,不合格"
  - tier: 自然难
    dimension: 单跳召回
    q: "城商行那种小盘银行我聊的时候是啥态度?"
    expect_contain: ["不碰"]
    expect_not: ["关注", "看好"]
    judge_rubric: "应答用户回避城商行/不碰小盘,只要国有大行大盘股。考抽取器对回避类(AVOIDS)表态的捕捉;若答成关注或混入港股则不合格"
  - tier: 自然难
    dimension: 时间推理
    q: "我那个只认股息的偏好,从头到现在改过没?"
    expect_contain: ["没改"]
    expect_not: ["改成", "转向"]
    judge_rubric: "应答自始至终未改:经历股价上行被动摊薄(3月)、红利拥挤度担忧(4月)两次扰动均坚持高股息偏好。若答曾改口或引入港股作为『新偏好』均不合格"
    swap_order_invariant: true