# 对话流评估脚本《说错板块的乌龙》— 观点演化族,主攻「撤回更正」。
# 压的机制(知识更新维度):区分两种作废——
#   (甲)事务性作废:这话本身就说错了(口误/说岔板块),旧事实是噪声,该被「撤回」,不是历史观点;
#   (乙)演化性作废:观点后来真的变了(有时间演进的合法历史),旧版本要留在作废链上可回溯。
#   同一脚本里两条线并行:消费(口误→撤回)走甲,银行(看多→中性,基本面真变了)走乙;
#   probe 专门考「我曾经看空过消费吗」——好答=没有(口误已撤回),坏答=把口误当历史观点翻出来。
# 搭车机制(重复去重):更正后用户又重提确认一次「消费我没动过」,边数不得增(fact_count_no_increase)。
# 刁钻点:
#   1) 口误那条(消费看空)由用户亲口说出、助手也复述确认了——抽取器一定会写进图;考的是「撤回」能不能把它
#      标成事务性作废而非演化作废(撤回后查 no_fact_written / 当前无 active 看空消费,而 valid 链不该把口误当一个历史版本展示)。
#   2) 更正走「重提旧事顺带改口」(「我那天说岔了」),禁郑重更正体;改口锚点埋在散户口语里,抽取器要扛。
#   3) 真演化(银行)和假演化(消费口误)在同一段历史里交错,probe 故意混问,逼记忆区分两类作废。
#   4) 医药才是用户真正看空的板块——口误的「真身」;考多跳:用户把口误从消费改到医药,医药那条要立得住。
# 台词纪律:用户侧按 .claude/skills/retail-investor-voice 生成(短/断/错/燥/黏,同音错字是真人指纹);
#   助手侧写要点,负责复述确认(给抽取器的合法锚点,也是真实助手行为)。
script_id: viewpoint-mistake-correction
title: "说错板块的乌龙"
family: 观点演化族
substrate: 观点演化(无结构化模块兜底,纯记忆领地;持仓事实不入图)

sessions:
  - n: 1
    date: 2025-02-10
    length: 中
    turns:
      - u: "今年这行情 哪个板块你觉得最难做"
      - a: "(分析当前几个高低切板块的位置与分歧;问用户自己有没有偏空的方向)"
      - u: "我有个板块是真不看好 消费 我看空消费"
      - a: "(回应;追问:看空消费是基于哪条逻辑——需求、估值还是别的?)"
      - u: "需求起不来呗 大家都没钱花了 这逻辑我觉得短期翻不了身"
      - a: "(复述确认:用户当前对消费板块持看空观点,逻辑是需求疲弱、短期难修复)"
      - u: "嗯就这意思 这个我盯了挺久了"
      - a: "(记录:看空消费,逻辑需求疲弱)"
  - n: 2
    date: 2025-02-19
    length: 短
    turns:
      - u: "银行最近这波红利是不是又要起动了"
      - a: "(分析高股息银行的资金面与红利逻辑)"
      - u: "我也觉得银行能拿 高股息这条我认 起码当个底仓"
      - a: "(复述确认:用户对银行持看多观点,逻辑高股息)"
      - u: "对 就冲分红"
      - a: "(记录:看多银行,逻辑高股息)"
  - n: 3
    date: 2025-03-04
    length: 短
    turns:
      - u: "美股昨晚跌成那样 今天A股会不会跟着杀"
      - a: "(简析外盘传导与情绪面)"
  - n: 4
    date: 2025-03-13
    length: 中
    turns:
      - u: "集采那个新一批名单出来了没 影响哪些"
      - a: "(说明集采新一批进度与受影响子赛道)"
      - u: "我最近专门翻了下医药 集采这刀一年比一年狠 这赛道我研究下来心是凉的"
      - a: "(确认:用户近期研究过医药板块,关注点为集采压制;问是否形成方向性判断?)"
      - u: "判断还没下死 就是先研究着 心里有素"
      - a: "(记录:用户研究过医药,聚焦集采,暂未给出方向性观点)"
  - n: 5
    date: 2025-03-25
    length: 短
    turns:
      - u: "黄金又新高了 这位置还敢追么"
      - a: "(分析金价驱动与追高风险)"
      - u: "那我再看把"
  - n: 6
    date: 2025-04-08
    length: 长
    turns:
      - u: "前段时间咱聊过的板块 我自己掳了一遍 有个地方我得改口"
      - a: "(请用户说明要改的是哪个判断)"
      - u: "我那天说岔了 我看空的是医药 消费我没看空过 当时嘴瓢了"
      - a: "(确认要点:用户澄清此前那句『看空消费』是口误说错板块;真正看空的对象是医药板块,消费从未看空)"
      - u: "对 消费我顶多算中性 真没看空 我盯的是集采那个事 那是医药"
      - a: "(复述确认:撤回此前看空消费的表述;改记为看空医药,逻辑集采压制;消费当前无看空观点)"
      - u: "就是这样 我那天脑子一抽板块都说反了"
      - a: "(确认撤回与改记;问医药看空的持续条件是什么?)"
      - u: "只要集采还在加码 我就看空 这刀不停我不翻"
      - a: "(记录:看空医药,逻辑集采加码;以集采政策为翻空触发条件)"
      - u: "银行那条不动啊 还是看多 高股息"
      - a: "(确认:银行观点不变,仍为看多、逻辑高股息)"
      - u: "嗯 就这些 别给我记串了"
      - a: "(确认三条状态:看空医药、消费无看空、看多银行;提示已按此更新)"
  - n: 7
    date: 2025-04-21
    length: 短
    turns:
      - u: "新能源这波超跌反弹能持续不"
      - a: "(给出反弹的资金面与持续性判断)"
  - n: 8
    date: 2025-05-06
    length: 中
    turns:
      - u: "对了 我怕你记串 再跟你确认下 消费我是不是没看空过"
      - a: "(复述:消费当前无看空观点;此前那句看空消费是口误已撤回,真正看空的是医药)"
      - u: "对对 就这意思 消费我没动过 别又给我记成看空"
      - a: "(确认无新增观点,仅复核;消费仍无看空,不写入新事实)"
      - u: "行 那就这样"
      - a: "(确认:状态无变化)"
  - n: 9
    date: 2025-05-20
    length: 中
    turns:
      - u: "银行张了一波了 这位置我有点犹豫了"
      - a: "(分析银行近期涨幅与股息率收敛、性价比变化)"
      - u: "股息率被买下来了 我这底仓逻辑没原来那么硬了 先收成中性吧"
      - a: "(确认观点演化:银行由看多转中性,原因股息率收敛、性价比下降;逻辑高股息不再支撑看多)"
      - u: "嗯 不看空 就是不像之前那么想拿了"
      - a: "(记录观点更新:银行由看多转为中性,原高股息逻辑因股息率收敛而弱化)"

db_assertions:
  # S1 后:口误那条被当成真观点写进图(看空消费)——抽取器该捕捉,这是后面要撤回的对象。
  - after: 1
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 消费, value_contains: ["看空", "需求"]}
      - {type: valid_from_is_event_time, rel_type: EXPRESSED_VIEW, target_label: 消费, expected_date: "2025-02-10"}
  # S2 后:银行看多(后面走真演化的那条对照线)。
  - after: 2
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 银行, value_contains: ["看多", "高股息"]}
  # S4 后:医药只是 STUDIED(研究过),此时还没有方向性观点——别提前把看空写上去。
  - after: 4
    assert:
      - {type: fact_active, rel_type: STUDIED, target_label: 医药, value_contains: ["集采"]}
      # 审稿必修:原 no_fact_written(EXPRESSED_VIEW) 在消费/银行观点已存在时必然误红;
      # 改为「本 session 不得给医药新增观点边」(基线快照=灌入前,医药此时应为 0)
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 医药}
  # S6 后(撤回更正核心):看空消费这条是口误,被事务性撤回——当前不该有 active 的看空消费;
  #   看空医药立起来;银行看多不变。撤回 != 演化,所以消费侧不留「曾经看空」的合法历史版本。
  - after: 6
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 医药, value_contains: ["看空", "集采"]}
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 银行, value_contains: ["看多"]}
      - {type: old_invalidated, rel_type: EXPRESSED_VIEW, target_label: 消费, min_count: 1}
  # S8 后(去重搭车):又确认一次消费没看空,纯复核不产生新事实——消费边数不得增。
  - after: 8
    assert:
      - {type: fact_count_no_increase, rel_type: EXPRESSED_VIEW, target_label: 消费}
  # S9 后(真演化对照):银行看多→中性是基本面真变,旧版本留在作废链上可回溯(与消费口误撤回形成对照)。
  - after: 9
    assert:
      - {type: fact_active, rel_type: EXPRESSED_VIEW, target_label: 银行, value_contains: ["中性"]}
      - {type: old_invalidated, rel_type: EXPRESSED_VIEW, target_label: 银行, min_count: 1}
      - {type: invalidated_chain_intact, rel_type: EXPRESSED_VIEW, target_label: 银行, expected_versions: 2}

probes:
  # 关键 probe:口误已撤回,好答=没看空过消费。
  - tier: 对抗
    dimension: 知识更新
    q: "我曾经看空过消费吗?"
    expect_contain: []
    expect_not: ["看空"]
    judge_rubric: "好答=没有/那是口误已更正/曾说错板块。坏答=把口误当历史观点翻出来,确认『你看空过消费』。轨迹是:S1 说看空消费实为口误,S6 已撤回并澄清真正看空的是医药——必须答出消费从未真正看空(或那是说岔了已纠正),不得把撤回的口误当作一段曾经成立的历史观点"
  - tier: 直球
    dimension: 单跳召回
    q: "我现在看空的板块是哪个?"
    expect_contain: ["医药"]
    expect_not: ["消费"]
    judge_rubric: "应答医药(逻辑集采)。答消费即把口误当真;只要点出医药即合格"
  - tier: 直球
    dimension: 知识更新
    q: "我现在对银行是什么看法?"
    expect_contain: ["中性"]
    expect_not: ["看多"]
    judge_rubric: "应答当前为中性;若答看多即银行那条真演化的旧版本未作废,判不合格"
  - tier: 自然难
    dimension: 多跳推理
    q: "我那天说看空消费,后来是怎么回事?现在我真正看空的到底是哪个板块?"
    expect_contain: ["医药"]
    expect_not: []
    judge_rubric: "应答:那句看空消费是说错板块的口误(嘴瓢/说岔),后来已改口撤回;真正看空的是医药,逻辑集采压制。能把『口误→撤回→改记医药』讲通即合格;若把消费当成一段真被推翻的历史观点(演化作废)则不合格"
    swap_order_invariant: true
  - tier: 自然难
    dimension: 时间推理
    q: "银行这条我是什么时候、为什么从看多收成中性的?"
    expect_contain: []
    expect_not: []
    judge_rubric: "时间应指向 2025 年 5 月下旬(五月/5月/涨过一波后均可);原因应答股息率被买下来/收敛、性价比下降,高股息逻辑不再支撑看多。这是真演化,旧看多版本应可回溯"
  - tier: 自然难
    dimension: 多跳推理
    q: "消费这条和银行这条,作废的性质一样吗?"
    expect_contain: []
    expect_not: []
    judge_rubric: "应能区分两类:消费那条是『话本身说错了』(口误/说岔板块)被撤回,不算一段曾经成立的观点;银行那条是观点真的随基本面演化(看多→中性),旧版本是合法历史。混为一谈或答『都是观点变了』不合格"
  - tier: 对抗
    dimension: 克制弃答
    q: "我当初看空消费的时候,跟你说过我消费仓位有多重吗?"
    expect_contain: []
    expect_not: []
    judge_rubric: "假前提叠加:其一消费本就没真看空(口误已撤回);其二整段历史从未提及任何持仓数量/仓位轻重。必须指出没说过仓位,不得编造仓位数字或顺着『你看空消费时』的假前提确认。持仓不入记忆图,助手也不该从别处编出仓位"
    answerable: false
