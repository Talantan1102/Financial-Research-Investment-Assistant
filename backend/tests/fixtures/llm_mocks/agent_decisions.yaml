entries:
  - pattern: "^你是金融研究助手 critic_"
    response:
      content: '{"score": 8.0, "evidence": "数据准确,结构清晰,符合预期。"}'
      prompt_tokens: 200
      completion_tokens: 30

  - pattern: "^SANITY_WRONG_"
    response:
      content: "你好,我是助手。"
      prompt_tokens: 10
      completion_tokens: 8

  - pattern: "^你是金融研究助手的输出评审员[\\s\\S]*你好,我是助手"
    response:
      content: "__recorded__:judge_4dim_obvious_wrong"
      prompt_tokens: 10
      completion_tokens: 80

  - exact: "What is the price of 600519.SH?"
    response:
      content: "The current price of 600519.SH (Kweichow Moutai) is 1680.00 CNY."
      prompt_tokens: 15
      completion_tokens: 20

  # Judge with report_markdown_quality (ResearchAgent SUT path, 5-dim) — most specific,
  # must precede the 4-dim with-tools and generic judge patterns.
  - pattern: "^你是金融研究助手的输出评审员[\\s\\S]*研报 Markdown:"
    response:
      content: "__recorded__:judge_5dim_with_report_markdown"
      prompt_tokens: 400
      completion_tokens: 100

  # Judge with tool_calls section (ChatAgent SUT path) — must precede generic judge pattern.
  - pattern: "^你是金融研究助手的输出评审员[\\s\\S]*实际 tool_calls"
    response:
      content: "__recorded__:judge_4dim_with_tools"
      prompt_tokens: 380
      completion_tokens: 90

  - pattern: "^你是金融研究助手的输出评审员"
    response:
      content: "__recorded__:judge_4dim_response"
      prompt_tokens: 350
      completion_tokens: 80

  # Responder: matched by the system-role prefix injected by build_responder_prompt.
  # Must appear BEFORE generic patterns so it wins on responder prompts.
  # Pattern is DISTINCT from ChatPlanner's "planner" prefix to avoid first-match shadowing.
  - pattern: "^你是金融研究助手 responder"
    response:
      content: "根据查询,茅台(600519.SH)当前股价 1820.5 元。"
      prompt_tokens: 80
      completion_tokens: 20

  # Writer (v0.8.2): matched by the system-role prefix injected by build_credit_report_prompt.
  # Returns a valid CreditInvestigationReport JSON (schema-conformant).
  # Must appear BEFORE Analyst/ResearchPlanner/ChatPlanner patterns.
  - pattern: "^你是银行公司金融部"
    response:
      content: '{"company_name":"600519.SH","request_id":"req-mock","generated_at":"2026-05-03T00:00:00","company_overview":{"narrative":"茅台为中国白酒龙头企业,主营飞天茅台等高端白酒产品。","main_business":"高端白酒生产销售","evidence":["c1::0"]},"legal_qualification":{"narrative":"主体资格完备,无重大不良记录。","legal_status":"正常","business_qualifications":["白酒生产许可证"],"adverse_records":[],"evidence":["c1::1"]},"financial_analysis":{"narrative":"资产负债率偏低,经营性现金流充裕,盈利能力强劲。","key_metrics":[{"name":"营收","value":"1276亿元","period":"2023","yoy_change":null}],"solvency_analysis":"资产负债率约19%,偿债能力极强。","profitability_analysis":"净利润率约51%,高于行业平均水平。","cash_flow_analysis":"经营性现金流净额约700亿元,健康充裕。","year_over_year_summary":null,"evidence":["c1::2"]},"industry_analysis":{"narrative":"高端白酒行业景气度高,竞争格局稳固。","industry_name":"白酒","industry_outlook":"稳定增长","competitive_position":"市场龙头","key_competitors":["五粮液","洋河股份"],"policy_impact":"消费税政策存在调整风险","evidence":["c1::3"]},"risk_assessment":{"narrative":"整体风险可控,主要关注消费税政策变化及高端消费需求波动。","operational_risks":[{"title":"品牌管理风险","description":"品牌声誉下滑可能影响销售","severity":"low","mitigations":[]}],"financial_risks":[],"industry_risks":[{"title":"消费税政策风险","description":"消费税调整可能影响利润","severity":"medium","mitigations":[]}],"compliance_risks":[],"overall_risk_level":"low","evidence":["c1::4"]},"credit_recommendation":{"narrative":"综合评估,建议批准信贷申请。","decision":"approve","recommended_credit_limit":null,"recommended_term":null,"recommended_rate_range":null,"guarantee_requirements":[],"conditions":[],"evidence":["c1::5"]}}'
      prompt_tokens: 100
      completion_tokens: 200

  # Analyst: matched by the system-role prefix injected by build_analyst_prompt.
  # Must appear BEFORE ResearchPlanner and ChatPlanner patterns.
  - pattern: "^你是金融研究助手 analyst"
    response:
      content: '{"insights":[{"subtask_id":"overview","finding":"茅台当前股价 1820.5 元,处于高位震荡","supporting_data":[{"price":1820.5}],"confidence":"high"},{"subtask_id":"financial_health","finding":"营收稳健增长","supporting_data":[],"confidence":"medium"}]}'
      prompt_tokens: 120
      completion_tokens: 80

  # ResearchPlanner: matched by the system-role prefix injected by build_planner_prompt.
  # Must appear BEFORE ChatPlanner's "planner" prefix so more-specific match wins.
  - pattern: "^你是金融研究助手 research_planner"
    response:
      content: '{"subtasks":[{"subtask_id":"overview","description":"公司概况","required_tools":["get_stock_quote"],"rationale":"行情基线"},{"subtask_id":"financial_health","description":"财务健康度","required_tools":["get_financials"],"rationale":"基本面"}],"target_entity":"600519.SH","research_style":"comprehensive","reasoning":"双子任务拆分"}'
      prompt_tokens: 120
      completion_tokens: 60

  # ChatPlanner: matched by the system-role prefix injected by build_planner_prompt
  # Must appear BEFORE the generic ts_code pattern below so it wins on planner prompts.
  - pattern: "^你是金融研究助手 planner"
    response:
      content: '{"tool_calls":[{"tool_name":"get_stock_quote","args":{"ts_code":"600519.SH"},"rationale":"user asked"}],"direct_response":false,"reasoning":"single tool"}'
      prompt_tokens: 120
      completion_tokens: 45

  - pattern: "(\\d{6}\\.(SH|SZ))"
    response:
      content: "The quote for {group_1} has been retrieved successfully."
      prompt_tokens: 18
      completion_tokens: 15
