entries:
  # PlanCorrectnessScorer mock removed: v1.x dropped this scorer (commit 1dca0af);
  # 6-dim critic stack lives in test_critic_subgraph_6dim.py.

  - pattern: "^你是金融研究助手 critic_"
    response:
      content: '{"score": 8.0, "evidence": "数据准确,结构清晰,符合预期。"}'
      prompt_tokens: 200
      completion_tokens: 30

  - pattern: "^SANITY_WRONG_"
    response:
      content: "你好,我是助手。"
      prompt_tokens: 10
      completion_tokens: 8

  - pattern: "^你是金融研究助手的输出评审员[\\s\\S]*你好,我是助手"
    response:
      content: "__recorded__:judge_4dim_obvious_wrong"
      prompt_tokens: 10
      completion_tokens: 80

  - exact: "What is the price of 600519.SH?"
    response:
      content: "The current price of 600519.SH (Kweichow Moutai) is 1680.00 CNY."
      prompt_tokens: 15
      completion_tokens: 20

  # Judge with report_markdown_quality (ResearchAgent SUT path, 5-dim) — most specific,
  # must precede the 4-dim with-tools and generic judge patterns.
  - pattern: "^你是金融研究助手的输出评审员[\\s\\S]*研报 Markdown:"
    response:
      content: "__recorded__:judge_5dim_with_report_markdown"
      prompt_tokens: 400
      completion_tokens: 100

  # Judge with tool_calls section (ChatAgent SUT path) — must precede generic judge pattern.
  - pattern: "^你是金融研究助手的输出评审员[\\s\\S]*实际 tool_calls"
    response:
      content: "__recorded__:judge_4dim_with_tools"
      prompt_tokens: 380
      completion_tokens: 90

  - pattern: "^你是金融研究助手的输出评审员"
    response:
      content: "__recorded__:judge_4dim_response"
      prompt_tokens: 350
      completion_tokens: 80

  # Responder: matched by the system-role prefix injected by build_responder_prompt.
  # Must appear BEFORE generic patterns so it wins on responder prompts.
  # Pattern is DISTINCT from ChatPlanner's "planner" prefix to avoid first-match shadowing.
  - pattern: "^你是金融研究助手 responder"
    response:
      content: "根据查询,茅台(600519.SH)当前股价 1820.5 元。"
      prompt_tokens: 80
      completion_tokens: 20

  # Writer (v0.8.4): matched by the system-role prefix injected by build_investment_dd_prompt.
  # Returns a valid InvestmentDueDiligenceReport JSON (schema-conformant).
  # Must appear BEFORE Analyst/ResearchPlanner/ChatPlanner patterns.
  - pattern: "^你是专业投资研究分析师"
    response:
      content: '{"target_name":"贵州茅台酒股份有限公司","target_ts_code":"600519.SH","request_id":"req-mock","generated_at":"2026-05-04T00:00:00","target_close_price_at_gen":null,"target_market_cap_at_gen":null,"target_overview":{"narrative":"茅台为中国白酒龙头企业,主营飞天茅台等高端白酒产品。","registered_capital":null,"main_business":"高端白酒生产销售","controlling_shareholder":null,"listing_status":null,"current_pe":null,"current_pb":null,"current_market_cap":null,"dividend_yield":null,"evidence":["c1::0"]},"legal_qualification":{"narrative":"主体资格完备,无重大不良记录。","legal_status":"正常","business_qualifications":["白酒生产许可证"],"adverse_records":[],"evidence":["c1::1"]},"financial_analysis":{"narrative":"资产负债率偏低,经营性现金流充裕,盈利能力强劲。","key_metrics":[{"name":"营收","value":"1276亿元","period":"2023","yoy_change":null}],"profitability_analysis":"净利润率约51%,高于行业平均水平。","growth_analysis":"营收同比增长15%。","return_analysis":"ROE约33%,行业领先。","cash_flow_analysis":"经营性现金流净额约700亿元,健康充裕。","valuation_analysis":{"narrative":"当前估值处于历史中低位。","pe_historical_percentile":null,"dcf_valuation":null,"peer_comparison":null},"year_over_year_summary":null,"evidence":["c1::2"]},"industry_analysis":{"narrative":"高端白酒行业景气度高,竞争格局稳固。","industry_name":"白酒","industry_outlook":"稳定增长","competitive_position":"市场龙头","key_competitors":["五粮液","洋河股份"],"policy_impact":"消费税政策存在调整风险","evidence":["c1::3"]},"risk_assessment":{"narrative":"整体风险可控,主要关注消费税政策变化及高端消费需求波动。","market_risk":[{"title":"市场系统性风险","description":"大盘下跌带动回调","severity":"low","mitigations":[]}],"growth_risk":[],"event_risk":[],"valuation_risk":[{"title":"估值风险","description":"当前PE偏高","severity":"medium","mitigations":[]}],"overall_risk_level":"low","evidence":["c1::4"]},"investment_recommendation":{"narrative":"综合评估,建议增持。","recommendation":"recommend_overweight","recommended_position_size_pct":5.0,"recommended_holding_period":"medium_term","recommended_entry_price_range":{"low":1700.0,"high":1800.0},"recommended_stop_loss_price":1600.0,"estimated_target_price_range":{"low":2000.0,"high":2200.0},"position_management_conditions":["市场系统性回调5%时加仓"],"evidence":["c1::5"]}}'
      prompt_tokens: 100
      completion_tokens: 200

  # Analyst: matched by the system-role prefix injected by build_analyst_prompt.
  # Must appear BEFORE ResearchPlanner and ChatPlanner patterns.
  - pattern: "^你是金融研究助手 analyst"
    response:
      content: '{"insights":[{"subtask_id":"overview","finding":"茅台当前股价 1820.5 元,处于高位震荡","supporting_data":[{"price":1820.5}],"confidence":"high"},{"subtask_id":"financial_health","finding":"营收稳健增长","supporting_data":[],"confidence":"medium"}]}'
      prompt_tokens: 120
      completion_tokens: 80

  # ResearchPlanner (v1.x A4): outputs (rationale, subtasks[]). 4-required-dim coverage:
  # 财务全景 (≥2 tools), 估值, 行业地位, 风险底线 (each ≥1 tool from candidates).
  # dim name must appear verbatim in description or rationale (plan_validator
  # _dim_keyword_match). tool names must be in DD_PLAN_TEMPLATE palette.
  # Must appear BEFORE ChatPlanner's "planner" prefix so more-specific match wins.
  - pattern: "^你是金融研究助手 research_planner"
    response:
      content: '{"rationale":"v1.x mock — DD 4 required dim 全覆盖","subtasks":[{"subtask_id":"st_finance","description":"评估财务全景 — 三表完整 + ROE","required_tools":["get_financials","get_balance_sheet"],"rationale":"财务基础"},{"subtask_id":"st_valuation","description":"评估估值 — PE 历史分位","required_tools":["get_pe_history"],"rationale":"估值锚定"},{"subtask_id":"st_industry","description":"评估行业地位 — 行业研报","required_tools":["web_search"],"rationale":"行业地位"},{"subtask_id":"st_risk","description":"评估风险底线 — 大股东动作 + 负面新闻","required_tools":["get_news"],"rationale":"风险底线"}]}'
      prompt_tokens: 120
      completion_tokens: 200

  # ChatPlanner (v0.9 chat mode): matched by _PLANNER_PROMPT_TEMPLATE prefix.
  # Also matches legacy build_planner_prompt prefix for research-mode step().
  # Must appear BEFORE the generic ts_code pattern below so it wins on planner prompts.
  # Note: uses non-capturing group (?:...) so template.format(group_1=...) is not triggered.
  - pattern: "^你是金融研究助手 (?:chat 模式的 )?planner"
    response:
      content: '{"tool_calls":[{"tool_name":"get_stock_quote","args":{"ts_code":"600519.SH"},"rationale":"user asked"}],"direct_response":false,"reasoning":"single tool"}'
      prompt_tokens: 120
      completion_tokens: 45

  - pattern: "(\\d{6}\\.(SH|SZ))"
    response:
      content: "The quote for {group_1} has been retrieved successfully."
      prompt_tokens: 18
      completion_tokens: 15
