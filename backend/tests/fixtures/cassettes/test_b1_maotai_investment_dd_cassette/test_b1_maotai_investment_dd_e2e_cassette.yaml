      + \u6210\u672C\u63A7\u5236.\\n- \u51C0\u5229\u7387 = `\u51C0\u5229\u6DA6 / \u8425\u4E1A\u6536\u5165`
      \u2014 \u5254\u9664\u8D39\u7528 / \u7A0E\u540E\u7684\u6700\u7EC8\u8D5A\u94B1\u80FD\u529B.\\n-
      \u51C0\u5229\u6DA6 yoy = `(\u672C\u671F\u51C0\u5229\u6DA6 - \u53BB\u5E74\u540C\u671F)
      / \u53BB\u5E74\u540C\u671F` (\u6D3E\u751F\u5B57\u6BB5, `GetFinancialsTool.net_profit`).\\n\\n**\u5224\u65AD\u9608\u503C**
      (\u5F15\u7528 `references/industry_benchmarks.json` \u2014 \u5FC5\u987B\u7528
      `lookup_industry_benchmark`):\\n\\n| \u6307\u6807 | \u5065\u5EB7 (DEFAULT) |
