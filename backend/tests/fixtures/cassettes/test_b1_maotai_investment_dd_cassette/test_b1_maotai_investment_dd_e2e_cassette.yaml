      |\\n#                  \\\"recommend_underweight\\\" | \\\"recommend_sell\\\"\\n```\\n\\n`metrics_dict`
      \u5B57\u6BB5 (Analyst \u5728 evidence \u9636\u6BB5\u586B):\\n- `pe_percentile`:
      0..1 (\u6765\u81EA `get_pe_history`).\\n- `roe`: e.g. 0.18 (\u6765\u81EA `get_financials`).\\n-
