      \u6765\u81EA get_stock_quote / daily_basic\\n)\\n# returns float (e.g. 12.0
      = 12% \u4ED3\u4F4D)\\n```\\n\\n**\u516C\u5F0F** (\u89C1 `references/position_size_rules.yaml`):\\n\\n```\\nposition_pct
      = base_pct[rec] \xD7 risk_multiplier[tol] \xD7 small_cap_factor\\n\u5176\u4E2D
      small_cap_factor = small_cap_haircut (0.7) if market_cap < 500 \u4EBF else 1.0\\n\u6700\u7EC8
      capped at max_position_pct (30%)\\n```\\n\\n`base_pct` \u8868 (\u6309\u8BC4\u7EA7):\\n-
      recommend_buy = 15%\\n- recommend_overweight = 10%\\n- recommend_hold = 5%\\n-
      recommend_underweight = 2%\\n- recommend_sell = 0%\\n\\n`risk_multiplier` \u8868
      (\u6309 user persona):\\n- conservative = 0.5x\\n- moderate = 1.0x\\n- balanced
      = 1.2x\\n- aggressive = 1.6x\\n- very_aggressive = 2.0x\\n\\n\u4F8B: recommend_buy
      + moderate + 1000 \u4EBF\u5927\u5E02\u503C \u2192 15 \xD7 1.0 \xD7 1.0 = 15%.\\n\u4F8B:
      recommend_overweight + aggressive + 200 \u4EBF\u5C0F\u5E02\u503C \u2192 10 \xD7
      1.6 \xD7 0.7 = 11.2%.\\n\\n## \xA7 4.3 \u4E3A\u4EC0\u4E48\u7528 Python helper
      \u800C\u4E0D\u8BA9 LLM \u7B97\\n\\n1. **\u53EF\u590D\u73B0\u6027**: \u540C\u4E00\u4EFD
      evidence \u6C38\u8FDC\u5F97\u540C\u4E00\u4EFD\u8BC4\u7EA7 / \u4ED3\u4F4D \u2014
      \u4E0D\u53D7 LLM temperature / sampling \u5F71\u54CD.\\n2. **\u5BA1\u8BA1\u6027**:
      YAML \u89C4\u5219\u662F spec \u7684\u4E00\u90E8\u5206, \u53EF review / version
      / diff; LLM \u81EA\u7531\u53D1\u6325\u5219\u9ED1\u7BB1.\\n3. **avoiding hallucination**:
      LLM \u7B97\u767E\u5206\u6BD4\u7ECF\u5E38\u7B97\u9519 (10% \xD7 1.6 = \u5199\u6210
      18% \u662F\u5E38\u89C1\u9519), Python \u7B97\u4FDD\u6B63\u786E.\\n4. **\u884C\u4E1A
      benchmark \u5F15\u7528**: `lookup_industry_benchmark(industry, indicator)` \u4FDD\u6570\u636E\u5951\u7EA6\u4E00\u81F4,
      methodology \u9608\u503C = references \u6570\u503C.\\n\\n**\u5199\u5165 narrative
