      | \\\"neutral\\\" | \\\"negative\\\"` (\u6765\u81EA `get_forecast`).\\n- `pledge_ratio`:
      0..1 (\u6765\u81EA `get_holder_change`).\\n- `asset_liability_warning`: bool.\\n\\n**5
      \u6863\u89E6\u53D1\u6761\u4EF6** (\u89C1 `references/recommendation_rules.yaml`,
