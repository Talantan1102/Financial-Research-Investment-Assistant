      = bundle.scripts.compute_position_size_pct(\\n    recommendation=recommendation,
      \       # \u6765\u81EA \xA7 4.1 classify\\n    risk_tolerance=\\\"moderate\\\",
      \           # \u6765\u81EA user persona\\n    market_cap_cny=8e10,                  #
      \u6765\u81EA get_stock_quote / daily_basic\\n)\\n# returns float (e.g. 12.0
