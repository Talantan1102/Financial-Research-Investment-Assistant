      \u540C\u4E1A\u5BF9\u6BD4:\u7F3A\u5C11\u540C\u4E1A\uFF08\u4E94\u7CAE\u6DB2\u7B49\uFF09\u4F30\u503C\u6570\u636E\uFF0C\u65E0\u6CD5\u8FDB\u884C\u4F30\u503C\u6BD4\u8F83\u3002\u6570\u636E\u7F3A\u5931\uFF0C\u5EFA\u8BAE\u8865\u5145\u6750\u6599\u3002\\n###
      \u540C\u6BD4\u53D8\u5316\\n\u8425\u6536\u540C\u6BD4+15.4%\uFF0C\u51C0\u5229\u6DA6\u540C\u6BD4+14.8%\uFF0C\u53CC\u589E\u957F\uFF0C\u6210\u957F\u7A33\u5065\u3002\\n\\n\\n##
      \xA7 4 \u884C\u4E1A\u5206\u6790\\n\\n\u8D35\u5DDE\u8305\u53F0\u6240\u5C5E\u884C\u4E1A\u4E3A\u767D\u9152\u884C\u4E1A\uFF0C\u5177\u4F53\u5904\u4E8E\u9AD8\u7AEF\u767D\u9152\u7EC6\u5206\u8D5B\u9053\u3002\u5F53\u524D\u884C\u4E1A\u666F\u6C14\u5EA6\u5904\u4E8E\u7ED3\u6784\u6027\u5206\u5316\u9636\u6BB5\uFF1A\u9AD8\u7AEF\u767D\u9152\uFF08\u8305\u53F0\u3001\u4E94\u7CAE\u6DB2\u3001\u6CF8\u5DDE\u8001\u7A96\uFF09\u51ED\u501F\u54C1\u724C\u529B\u548C\u793E\u4EA4\u5C5E\u6027\u9700\u6C42\u97E7\u6027\u8F83\u5F3A\uFF0C\u589E\u901F\u76F8\u5BF9\u7A33\u5065\uFF1B\u6B21\u9AD8\u7AEF\u53CA\u5927\u4F17\u767D\u9152\u53D7\u7ECF\u6D4E\u5468\u671F\u548C\u5C45\u6C11\u6D88\u8D39\u4FE1\u5FC3\u5F71\u54CD\u8F83\u5927\uFF0C\u7ADE\u4E89\u52A0\u5267\u3002\u8305\u53F0\u5728\u9AD8\u7AEF\u767D\u9152\u5E02\u573A\u4EFD\u989D\u7EA615%\uFF0C\u54C1\u724C\u62A4\u57CE\u6CB3\u6DF1\u539A\uFF08\u5386\u53F2\u5E95\u8574\u3001\u7A00\u7F3A\u6027\u3001\u793E\u4EA4\u5C5E\u6027\uFF09\uFF0C\u884C\u4E1A\u96C6\u4E2D\u5EA6\u6301\u7EED\u63D0\u5347\uFF0C\u8305\u53F0\u4F5C\u4E3A\u7EDD\u5BF9\u9F99\u5934\u7684\u5730\u4F4D\u7A33\u56FA\u3002\u4E3B\u8981\u7ADE\u4E89\u5BF9\u5BF9\u624B\u5305\u62EC\u4E94\u7CAE\u6DB2\u3001\u6CF8\u5DDE\u8001\u7A96\u7B49\uFF0C\u4F46\u8305\u53F0\u5728\u54C1\u724C\u6EA2\u4EF7\u3001\u6E20\u9053\u638C\u63A7\u529B\u65B9\u9762\u5177\u6709\u663E\u8457\u4F18\u52BF\u3002\u653F\u7B56\u7AEF\uFF0C\u767D\u9152\u6D88\u8D39\u7A0E\u6539\u9769\u3001\u9650\u5236\u4E09\u516C\u6D88\u8D39\u7B49\u5386\u53F2\u6027\u538B\u5236\u5DF2\u57FA\u672C\u6D88\u5316\uFF0C\u5F53\u524D\u653F\u7B56\u73AF\u5883\u76F8\u5BF9\u4E2D\u6027\uFF0C\u65E0\u65B0\u7684\u91CD\u5927\u5229\u7A7A\u653F\u7B56\u51FA\u53F0\u3002\u8FD16\u4E2A\u6708\u653F\u7B56\u9762\u5E73\u7A33\uFF0C\u9F99\u5934\u516C\u53F8\u8305\u53F02024\u5E74\u4E1A\u7EE9\u4F1A\u8868\u6001\u7A33\u4E2D\u6709\u8FDB\uFF0C\u672A\u63D0\u53CA\u53BB\u5E93\u5B58\u6216\u9700\u6C42\u75B2\u8F6F\u3002\u6574\u4F53\u884C\u4E1A\u5C55\u671B\uFF1A\u9AD8\u7AEF\u767D\u9152\u7EF4\u6301\u7A33\u5065\uFF0C\u8305\u53F0\u51ED\u501F\u7A00\u7F3A\u6027\u548C\u54C1\u724C\u529B\u589E\u957F\u786E\u5B9A\u6027\u9AD8\uFF0C\u4F46\u9700\u8B66\u60D5\u7ECF\u6D4E\u4E0B\u884C\u5BF9\u9AD8\u7AEF\u6D88\u8D39\u7684\u6F5C\u5728\u51B2\u51FB\u3002[^s3][^s5]\\n\\n-
      \u6240\u5C5E\u884C\u4E1A:\u767D\u9152\u884C\u4E1A\uFF08\u9AD8\u7AEF\u767D\u9152\uFF09\\n-
      \u666F\u6C14\u5EA6:\u7ED3\u6784\u6027\u5206\u5316\uFF0C\u9AD8\u7AEF\u767D\u9152\u7A33\u5065\uFF0C\u8305\u53F0\u9F99\u5934\u5730\u4F4D\u7A33\u56FA\uFF0C\u4F46\u9700\u5173\u6CE8\u7ECF\u6D4E\u589E\u957F\u653E\u7F13\u5BF9\u6D88\u8D39\u7684\u6F5C\u5728\u5F71\u54CD\u3002\\n-
      \u7ADE\u4E89\u5730\u4F4D:\u7EDD\u5BF9\u9F99\u5934\uFF0C\u54C1\u724C\u62A4\u57CE\u6CB3\u6781\u6DF1\uFF0C\u5E02\u573A\u4EFD\u989D\u7EA615%\uFF0C\u5B9A\u4EF7\u6743\u5F3A\uFF0C\u7ADE\u4E89\u683C\u5C40\u7A33\u56FA\u3002\\n-
      \u4E3B\u8981\u7ADE\u4E89\u5BF9\u624B:\u4E94\u7CAE\u6DB2\uFF08000858.SZ\uFF09
      / \u6CF8\u5DDE\u8001\u7A96\uFF08000568.SZ\uFF09\\n- \u653F\u7B56\u5F71\u54CD:\u653F\u7B56\u73AF\u5883\u4E2D\u6027\uFF0C\u65E0\u91CD\u5927\u65B0\u7684\u538B\u5236\u6027\u653F\u7B56\uFF0C\u6D88\u8D39\u7A0E\u6539\u9769\u957F\u671F\u5F71\u54CD\u9700\u6301\u7EED\u8DDF\u8E2A\u3002\\n\\n##
      \xA7 5 \u98CE\u9669\u8BC4\u4F30\\n\\n\u9274\u4E8E\u5BA2\u6237\u6295\u8D44\u76EE\u6807\u4E3Acapital_preservation\uFF08\u4FDD\u672C\u4FDD\u503C\uFF09\u3001\u98CE\u9669\u627F\u53D7\u80FD\u529B\u4E3Aconservative\uFF0C\u672C\u62A5\u544A\u5BF9\u6F5C\u5728\u672C\u91D1\u635F\u5931\u98CE\u9669\u8FDB\u884C\u4E25\u683C\u5BA1\u89C6\u3002\u8D35\u5DDE\u8305\u53F0\u57FA\u672C\u9762\u6781\u5F3A\uFF0C\u4F46\u5E76\u975E\u65E0\u98CE\u9669\u3002\u4E3B\u8981\u98CE\u9669\u5305\u62EC\uFF1A\u2460\u5B8F\u89C2\u7ECF\u6D4E\u4E0B\u884C\u98CE\u9669\u2014\u2014\u9AD8\u7AEF\u767D\u9152\u6D88\u8D39\u4E0E\u7ECF\u6D4E\u589E\u957F\u9AD8\u5EA6\u76F8\u5173\uFF0C\u82E5\u7ECF\u6D4E\u6301\u7EED\u75B2\u8F6F\u5C06\u51B2\u51FB\u7EC8\u7AEF\u9700\u6C42\uFF0C\u53EF\u80FD\u5F71\u54CD\u8305\u53F0\u91CF\u4EF7\uFF1B\u2461\u4F30\u503C\u98CE\u9669\u2014\u2014\u5F53\u524DPE\u6570\u636E\u7F3A\u5931\uFF0C\u4F46\u8305\u53F0\u5386\u53F2\u4F30\u503C\u4E2D\u67A2\u7EA635-40\u500D\uFF0C\u82E5\u5E02\u573A\u7ED9\u4E88\u4F30\u503C\u6EA2\u4EF7\u6536\u7F29\uFF08\u5982\u56E0\u589E\u901F\u653E\u7F13\uFF09\uFF0C\u80A1\u4EF7\u4ECD\u6709\u56DE\u64A420%-30%\u7684\u53EF\u80FD\uFF0C\u8FD9\u5BF9\u4FDD\u672C\u6295\u8D44\u8005\u662F\u91CD\u5927\u98CE\u9669\uFF1B\u2462\u4EA7\u80FD\u4E0E\u4EF7\u683C\u5929\u82B1\u677F\u2014\u2014\u8305\u53F0\u9152\u4EA7\u80FD\u53D7\u9650\uFF0C\u63D0\u4EF7\u7A7A\u95F4\u53D7\u653F\u7B56\u548C\u5E02\u573A\u627F\u53D7\u529B\u5236\u7EA6\uFF0C\u957F\u671F\u589E\u957F\u53EF\u80FD\u653E\u7F13\uFF1B\u2463\u653F\u7B56\u98CE\u9669\u2014\u2014\u6D88\u8D39\u7A0E\u6539\u9769\u6216\u53CD\u8150\u8D25\u653F\u7B56\u518D\u73B0\u53EF\u80FD\u5F71\u54CD\u9700\u6C42\u3002\u4EE5\u4E0A\u98CE\u9669\u82E5\u96C6\u4E2D\u7206\u53D1\uFF0C\u5B58\u5728\u672C\u91D1\u53D7\u635F\u7684\u53EF\u80FD\u6027\u3002\u516C\u53F8\u6574\u4F53\u57FA\u672C\u9762\u98CE\u9669\u6781\u4F4E\uFF0C\u4F46\u4F30\u503C\u4E0E\u5B8F\u89C2\u98CE\u9669\u5BF9\u4FDD\u672C\u6295\u8D44\u8005\u800C\u8A00\u4E0D\u5BB9\u5FFD\u89C6\uFF0C\u6574\u4F53\u98CE\u9669\u7B49\u7EA7\u8BC4\u4F30\u4E3A\u4E2D\u7B49\u504F\u4E0A\u3002[^s1][^s2][^s3][^s5][^s4]\\n\\n**\u6574\u4F53\u98CE\u9669\u7B49\u7EA7:\u4E2D**\\n\\n###
      \u5E02\u573A\u98CE\u9669\\n- **\u5B8F\u89C2\u7ECF\u6D4E\u4E0B\u884C\u538B\u5236\u9AD8\u7AEF\u6D88\u8D39**(\u4E25\u91CD\u5EA6:\u4E2D)
      \u2014 \u8305\u53F0\u4F5C\u4E3A\u9AD8\u7AEF\u6D88\u8D39\u54C1\uFF0C\u9700\u6C42\u5BF9\u7ECF\u6D4E\u666F\u6C14\u5EA6\u654F\u611F\u3002\u82E5\u56FD\u5185\u7ECF\u6D4E\u589E\u901F\u6301\u7EED\u653E\u7F13\u3001\u5C45\u6C11\u6536\u5165\u9884\u671F\u4E0B\u964D\uFF0C\u53EF\u80FD\u5BFC\u81F4\u91CF\u4EF7\u53CC\u627F\u538B\uFF0C\u5F71\u54CD\u516C\u53F8\u4E1A\u7EE9\u4E0E\u80A1\u4EF7\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u8305\u53F0\u54C1\u724C\u7A00\u7F3A\u6027\u548C\u793E\u4EA4\u5C5E\u6027\u63D0\u4F9B\u9700\u6C42\u97E7\u6027\uFF0C\u5386\u53F2\u4E0A\u7ECF\u6D4E\u4E0B\u884C\u671F\u4E1A\u7EE9\u6CE2\u52A8\u76F8\u5BF9\u8F83\u5C0F
      / \u516C\u53F8\u4EA7\u54C1\u7ED3\u6784\u8986\u76D6\u8D85\u9AD8\u7AEF\u81F3\u6B21\u9AD8\u7AEF\uFF0C\u6709\u4E00\u5B9A\u7F13\u51B2\u80FD\u529B\\n-
      **\u884C\u4E1A\u9700\u6C42\u89C1\u9876\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4E2D)
      \u2014 \u4E2D\u56FD\u767D\u9152\u603B\u6D88\u8D39\u91CF\u5448\u957F\u671F\u4E0B\u964D\u8D8B\u52BF\uFF0C\u9AD8\u7AEF\u5316\u9A71\u52A8\u4E0B\u4F01\u4E1A\u901A\u8FC7\u63D0\u4EF7\u7EF4\u6301\u589E\u957F\uFF0C\u4F46\u82E5\u6D88\u8D39\u5347\u7EA7\u8D8B\u52BF\u9006\u8F6C\u6216\u4EBA\u53E3\u7ED3\u6784\u53D8\u5316\u5BFC\u81F4\u996E\u9152\u7FA4\u4F53\u840E\u7F29\uFF0C\u957F\u671F\u9700\u6C42\u9762\u4E34\u5929\u82B1\u677F\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u8305\u53F0\u5DF2\u5F62\u6210\u91D1\u878D\u5C5E\u6027\u548C\u6536\u85CF\u5C5E\u6027\uFF0C\u90E8\u5206\u8D85\u8D8A\u666E\u901A\u6D88\u8D39\u54C1\u5468\u671F
      / \u56FD\u9645\u5316\u6218\u7565\u53EF\u80FD\u5F00\u8F9F\u65B0\u589E\u957F\u7A7A\u95F4\\n\\n###
      \u6210\u957F\u98CE\u9669\\n- **\u4EA7\u80FD\u74F6\u9888\u5236\u7EA6\u957F\u671F\u589E\u957F**(\u4E25\u91CD\u5EA6:\u4E2D)
      \u2014 \u8305\u53F0\u9152\u53D7\u9650\u4E8E\u8305\u53F0\u9547\u6838\u5FC3\u4EA7\u533A\u7A7A\u95F4\u548C\u917F\u9020\u5DE5\u827A\uFF08\u4E94\u5E74\u51FA\u9152\uFF09\uFF0C\u4EA7\u80FD\u6269\u5F20\u6709\u5929\u7136\u4E0A\u9650\uFF0C\u672A\u6765\u589E\u957F\u66F4\u591A\u4F9D\u8D56\u63D0\u4EF7\u548C\u4EA7\u54C1\u7ED3\u6784\u8C03\u6574\uFF0C\u589E\u901F\u53EF\u80FD\u4ECE15%\u9010\u6B65\u653E\u7F13\u81F3\u4E2A\u4F4D\u6570\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u516C\u53F8\u901A\u8FC7\u7CFB\u5217\u9152\uFF08\u8305\u53F01935\u7B49\uFF09\u57F9\u80B2\u7B2C\u4E8C\u589E\u957F\u66F2\u7EBF
      / \u63D0\u4EF7\u7A7A\u95F4\u867D\u6536\u7A84\u4F46\u4ECD\u5B58\u5728\uFF08\u51FA\u5382\u4EF7\u4E0E\u6279\u4EF7\u95F4\u4ECD\u6709\u4EF7\u5DEE\uFF09\\n\\n###
      \u4E8B\u4EF6\u98CE\u9669\\n- **\u653F\u7B56\u76D1\u7BA1\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4E2D)
      \u2014 \u767D\u9152\u884C\u4E1A\u66FE\u53D7\u9650\u5236\u4E09\u516C\u6D88\u8D39\u3001\u6D88\u8D39\u7A0E\u6539\u9769\u3001\u53CD\u5784\u65AD\u8C03\u67E5\u7B49\u653F\u7B56\u51B2\u51FB\u3002\u672A\u6765\u82E5\u51FA\u73B0\u9488\u5BF9\u9AD8\u7AEF\u6D88\u8D39\u7684\u9650\u5236\u653F\u7B56\uFF08\u5982\u5962\u4F88\u7A0E\u3001\u6D88\u8D39\u7A0E\u7387\u4E0A\u8C03\uFF09\u6216\u53CD\u8150\u8D25\u529B\u5EA6\u52A0\u5F3A\uFF0C\u53EF\u80FD\u5BFC\u81F4\u9700\u6C42\u77ED\u671F\u5927\u5E45\u4E0B\u8DCC\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u8305\u53F0\u4E3B\u8981\u6D88\u8D39\u7FA4\u4F53\u5DF2\u8F6C\u5411\u6C11\u95F4\u5546\u52A1\u548C\u4E2A\u4EBA\u6D88\u8D39\uFF0C\u5BF9\u516C\u52A1\u6D88\u8D39\u4F9D\u8D56\u5EA6\u964D\u4F4E
      / \u516C\u53F8\u4E3A\u5730\u65B9\u56FD\u8D44\u6838\u5FC3\u4F01\u4E1A\uFF0C\u653F\u7B56\u98CE\u9669\u6709\u4E00\u5B9A\u7F13\u51B2\\n\\n###
      \u4F30\u503C\u98CE\u9669\\n- **\u9AD8\u4F30\u503C\u56DE\u64A4\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u9AD8)
      \u2014 \u8305\u53F0\u5386\u53F2\u4F30\u503C\u4E2D\u67A2\u7EA635-40\u500DPE\uFF0C\u82E5\u5E02\u573A\u98CE\u9669\u504F\u597D\u4E0B\u964D\u6216\u4E1A\u7EE9\u589E\u901F\u653E\u7F13\uFF0C\u4F30\u503C\u53EF\u80FD\u6536\u7F29\u81F325-30\u500D\u533A\u95F4\uFF0C\u5BF9\u5E94\u80A1\u4EF7\u56DE\u64A420%-30%\u3002\u8FD9\u5BF9\u4FDD\u672C\u6295\u8D44\u8005\u662F\u6838\u5FC3\u98CE\u9669\u2014\u2014\u5373\u4F7F\u957F\u671F\u4EF7\u503C\u4E0D\u53D8\uFF0C\u77ED\u671F\u672C\u91D1\u53EF\u80FD\u627F\u53D7\u660E\u663E\u4E8F\u635F\u3002\\n
