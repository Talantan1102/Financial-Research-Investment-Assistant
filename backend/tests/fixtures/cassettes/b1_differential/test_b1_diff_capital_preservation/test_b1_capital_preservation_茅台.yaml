      \xA7 5 \u98CE\u9669\u8BC4\u4F30\\n\\n\u9274\u4E8E\u5BA2\u6237\u6295\u8D44\u76EE\u6807\u4E3Acapital_preservation\uFF08\u4FDD\u672C\u4FDD\u503C\uFF09\u4E14\u98CE\u9669\u627F\u53D7\u80FD\u529B\u4FDD\u5B88\uFF0C\u672C\u62A5\u544A\u91CD\u70B9\u8BC4\u4F30\u4EFB\u4F55\u53EF\u80FD\u5BFC\u81F4\u672C\u91D1\u53D7\u635F\u7684\u98CE\u9669\u3002\u8D35\u5DDE\u8305\u53F0\u57FA\u672C\u9762\u6781\u4E3A\u5065\u5EB7\uFF0C\u786C\u6027\u98CE\u9669\uFF08\u9AD8\u8D28\u62BC\u3001\u4E1A\u7EE9\u66B4\u96F7\u3001\u8BC9\u8BBC\u7B49\uFF09\u5747\u672A\u89E6\u53D1\u3002\u4F46\u9700\u5173\u6CE8\u4EE5\u4E0B\u98CE\u9669\uFF1A\u5E02\u573A\u98CE\u9669\u65B9\u9762\uFF0C\u4F30\u503C\u6570\u636E\u7F3A\u5931\uFF0C\u82E5\u5F53\u524DPE\u5904\u4E8E\u5386\u53F2\u9AD8\u4F4D\uFF0C\u5219\u6709\u4F30\u503C\u56DE\u8C03\u5BFC\u81F4\u672C\u91D1\u635F\u5931\u7684\u98CE\u9669\uFF0C\u4F46\u516C\u53F8\u57FA\u672C\u9762\u4F18\u79C0\u53EF\u90E8\u5206\u5BF9\u51B2\u3002\u6210\u957F\u98CE\u9669\u65B9\u9762\uFF0C\u8425\u6536/\u51C0\u5229\u6DA6\u589E\u901F\u653E\u7F13\u81F315%\u4EE5\u4E0B\uFF0C\u82E5\u672A\u6765\u4E1A\u7EE9\u589E\u901F\u6301\u7EED\u4F4E\u4E8E\u9884\u671F\uFF0C\u53EF\u80FD\u5F15\u53D1\u80A1\u4EF7\u91CD\u4F30\u3002\u653F\u7B56\u4E0E\u884C\u4E1A\u98CE\u9669\u65B9\u9762\uFF0C\u6D88\u8D39\u7A0E\u6539\u9769\u6216\u7ECF\u6D4E\u4E0B\u884C\u53EF\u80FD\u538B\u5236\u9700\u6C42\u3002\u6574\u4F53\u98CE\u9669\u6C34\u5E73\u8F83\u4F4E\uFF0C\u4F46\u7531\u4E8E\u4F30\u503C\u6570\u636E\u7F3A\u5931\uFF0C\u4FDD\u672C\u5BA2\u6237\u5E94\u8B66\u60D5\u4F30\u503C\u4E0D\u786E\u5B9A\u6027\u5E26\u6765\u7684\u56DE\u64A4\u53EF\u80FD\u3002[^s1][^s2][^s5][^s7]\\n\\n**\u6574\u4F53\u98CE\u9669\u7B49\u7EA7:\u4E2D**\\n\\n###
      \u5E02\u573A\u98CE\u9669\\n- **\u4F30\u503C\u56DE\u8C03\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4E2D)
      \u2014 \u5F53\u524DPE\u5386\u53F2\u5206\u4F4D\u6570\u636E\u7F3A\u5931\uFF0C\u65E0\u6CD5\u5224\u65AD\u4F30\u503C\u5B89\u5168\u8FB9\u9645\u3002\u82E5PE\u5904\u4E8E\u5386\u53F2\u9AD8\u4F4D\uFF0C\u5E02\u573A\u60C5\u7EEA\u8F6C\u53D8\u53EF\u80FD\u5F15\u53D1\u80A1\u4EF7\u4E0B\u8DCC\uFF0C\u5BFC\u81F4\u672C\u91D1\u53D7\u635F\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u8865\u5145PE\u5386\u53F2\u5206\u4F4D\u6570\u636E\u4EE5\u8BC4\u4F30\u5B89\u5168\u8FB9\u9645
      / \u516C\u53F8\u57FA\u672C\u9762\u5F3A\u52B2\uFF0C\u4E1A\u7EE9\u786E\u5B9A\u6027\u9AD8\uFF0C\u53EF\u7F13\u51B2\u4F30\u503C\u4E0B\u884C\u5E45\u5EA6\\n\\n###
      \u6210\u957F\u98CE\u9669\\n- **\u4E1A\u7EE9\u589E\u901F\u653E\u7F13\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4F4E)
      \u2014 \u8425\u6536\u4E0E\u51C0\u5229\u6DA6\u589E\u901F\u5747\u4ECE20%\u4EE5\u4E0A\u653E\u7F13\u81F315%\u5DE6\u53F3\uFF0C\u82E5\u672A\u6765\u51FA\u73B0\u4E2A\u4F4D\u6570\u589E\u957F\u6216\u4E0B\u6ED1\uFF0C\u80A1\u4EF7\u53EF\u80FD\u627F\u538B\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u9AD8\u7AEF\u767D\u9152\u9700\u6C42\u97E7\u6027\u8F83\u5F3A
      / \u516C\u53F8\u63D0\u4EF7\u80FD\u529B\u53CA\u4EA7\u54C1\u7ED3\u6784\u5347\u7EA7\u53EF\u7EF4\u6301\u76C8\u5229\u589E\u957F\\n\\n###
      \u4E8B\u4EF6\u98CE\u9669\\n- **\u653F\u7B56\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4F4E)
      \u2014 \u6D88\u8D39\u7A0E\u6539\u9769\u6216\u66F4\u4E25\u5389\u7684\u53CD\u94FA\u5F20\u6D6A\u8D39\u653F\u7B56\u53EF\u80FD\u5F71\u54CD\u9AD8\u7AEF\u767D\u9152\u9700\u6C42\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u516C\u53F8\u4E3A\u56FD\u8D44\u9F99\u5934\uFF0C\u653F\u7B56\u5F71\u54CD\u76F8\u5BF9\u53EF\u63A7
      / \u9700\u6C42\u57FA\u7840\u624E\u5B9E\uFF0C\u4E0B\u884C\u7A7A\u95F4\u6709\u9650\\n\\n###
      \u4F30\u503C\u98CE\u9669\\n- **\u4F30\u503C\u6570\u636E\u7F3A\u5931\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4E2D)
      \u2014 \u65E0\u6CD5\u5224\u65AD\u5F53\u524D\u4F30\u503C\u662F\u5426\u5408\u7406\uFF0C\u4FDD\u672C\u6295\u8D44\u8005\u9762\u4E34\u4FE1\u606F\u4E0D\u5BF9\u79F0\u98CE\u9669\u3002\\n
