      / \u516C\u53F8\u57FA\u672C\u9762\u5F3A\u52B2\uFF0C\u4E1A\u7EE9\u786E\u5B9A\u6027\u9AD8\uFF0C\u53EF\u7F13\u51B2\u4F30\u503C\u4E0B\u884C\u5E45\u5EA6\\n\\n###
      \u6210\u957F\u98CE\u9669\\n- **\u4E1A\u7EE9\u589E\u901F\u653E\u7F13\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4F4E)
      \u2014 \u8425\u6536\u4E0E\u51C0\u5229\u6DA6\u589E\u901F\u5747\u4ECE20%\u4EE5\u4E0A\u653E\u7F13\u81F315%\u5DE6\u53F3\uFF0C\u82E5\u672A\u6765\u51FA\u73B0\u4E2A\u4F4D\u6570\u589E\u957F\u6216\u4E0B\u6ED1\uFF0C\u80A1\u4EF7\u53EF\u80FD\u627F\u538B\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u9AD8\u7AEF\u767D\u9152\u9700\u6C42\u97E7\u6027\u8F83\u5F3A
      / \u516C\u53F8\u63D0\u4EF7\u80FD\u529B\u53CA\u4EA7\u54C1\u7ED3\u6784\u5347\u7EA7\u53EF\u7EF4\u6301\u76C8\u5229\u589E\u957F\\n\\n###
      \u4E8B\u4EF6\u98CE\u9669\\n- **\u653F\u7B56\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4F4E)
      \u2014 \u6D88\u8D39\u7A0E\u6539\u9769\u6216\u66F4\u4E25\u5389\u7684\u53CD\u94FA\u5F20\u6D6A\u8D39\u653F\u7B56\u53EF\u80FD\u5F71\u54CD\u9AD8\u7AEF\u767D\u9152\u9700\u6C42\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u516C\u53F8\u4E3A\u56FD\u8D44\u9F99\u5934\uFF0C\u653F\u7B56\u5F71\u54CD\u76F8\u5BF9\u53EF\u63A7
      / \u9700\u6C42\u57FA\u7840\u624E\u5B9E\uFF0C\u4E0B\u884C\u7A7A\u95F4\u6709\u9650\\n\\n###
      \u4F30\u503C\u98CE\u9669\\n- **\u4F30\u503C\u6570\u636E\u7F3A\u5931\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4E2D)
      \u2014 \u65E0\u6CD5\u5224\u65AD\u5F53\u524D\u4F30\u503C\u662F\u5426\u5408\u7406\uFF0C\u4FDD\u672C\u6295\u8D44\u8005\u9762\u4E34\u4FE1\u606F\u4E0D\u5BF9\u79F0\u98CE\u9669\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u5EFA\u8BAE\u901A\u8FC7\u5386\u53F2PE\u5206\u4F4D\u53CADCF\u6A21\u578B\u8865\u5145\u4F30\u503C\u5206\u6790
      / \u4EE5\u957F\u671F\u6301\u6709\u89C6\u89D2\u770B\u5F85\uFF0C\u4F18\u8D28\u516C\u53F8\u53EF\u901A\u8FC7\u4E1A\u7EE9\u6D88\u5316\u4F30\u503C\\n\\n\\n##
      \xA7 6 \u7EFC\u5408\u7814\u5224\\n\\n\u7EFC\u5408\u7814\u5224\uFF1A\u8D35\u5DDE\u8305\u53F0\u662F\u56FD\u5185\u9876\u7EA7\u4F18\u8D28\u8D44\u4EA7\uFF0C\u8D22\u52A1\u6781\u5F3A\u3001\u62A4\u57CE\u6CB3\u6DF1\u539A\u3001\u6210\u957F\u7A33\u5065\uFF0C\u7B26\u5408long-term\u6301\u6709\u5E95\u4ED3\u7279\u5F81\u3002\u4F46\u5BA2\u6237\u6295\u8D44\u76EE\u6807\u4E3Acapital_preservation\uFF08\u4FDD\u672C\u4FDD\u503C\uFF09\uFF0C\u4FDD\u5B88\u578B\u6295\u8D44\u8005\u9700\u9AD8\u5EA6\u5173\u6CE8\u4E0B\u884C\u98CE\u9669\u3002\u5F53\u524D\u6700\u5927\u98CE\u9669\u5728\u4E8E\u4F30\u503C\u6570\u636E\u7F3A\u5931\uFF0C\u65E0\u6CD5\u786E\u8BA4\u5B89\u5168\u8FB9\u9645\uFF1B\u82E5\u9AD8\u4F30\u503C\u4E70\u5165\uFF0C\u5373\u4F7F\u516C\u53F8\u8D28\u5730\u4F18\u79C0\uFF0C\u4E5F\u53EF\u80FD\u9762\u4E34\u8F83\u957F\u56DE\u64A4\u5468\u671F\u3002Bear_case\u9700\u5145\u5206\u5448\u73B0\uFF1A\u82E5\u5E02\u573A\u6574\u4F53\u4E0B\u884C\u6216\u589E\u901F\u653E\u7F13\uFF0C\u80A1\u4EF7\u4E0B\u8DCC20%-30%\u662F\u53EF\u80FD\u7684\uFF0C\u672C\u91D1\u77ED\u671F\u53D7\u635F\u3002Bull_case\u5728\u4E8E\u516C\u53F8\u76C8\u5229\u786E\u5B9A\u6027\u5F3A\uFF0C\u957F\u671F\u6301\u6709\u53EF\u901A\u8FC7\u4E1A\u7EE9\u589E\u957F\u6536\u590D\u5931\u5730\u3002\u5173\u952E\u53D8\u91CF\u4E3A\u4E70\u5165\u4F30\u503C\u6C34\u5E73\u53CA\u672A\u6765\u589E\u901F\u8F68\u8FF9\u3002\u5EFA\u8BAE\u8BFB\u8005\u81EA\u884C\u8BC4\u4F30\u4F30\u503C\u5408\u7406\u6027\u540E\u51B3\u7B56\u3002[^s1][^s2][^s5]\\n\\n-
      \u4F30\u503C\u7814\u5224:\u5F53\u524D\u4F30\u503C\u6570\u636E\u7F3A\u5931\uFF0C\u65E0\u6CD5\u5224\u65AD\u5F53\u524D\u4EF7\u76F8\u5BF9\u5185\u5728\u4EF7\u503C\u533A\u95F4\u7684\u4F4D\u7F6E\u3002\u5EFA\u8BAE\u8865\u5145PE\u5386\u53F2\u5206\u4F4D\u53CADCF\u4F30\u503C\u540E\u8BC4\u4F30\u3002\\n-
