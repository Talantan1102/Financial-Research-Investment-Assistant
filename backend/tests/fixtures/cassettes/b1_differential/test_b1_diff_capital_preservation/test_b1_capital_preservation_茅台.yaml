      \xA7 5 \u98CE\u9669\u8BC4\u4F30\\n\\n\u57FA\u4E8E\u5BA2\u6237\u8D44\u672C\u4FDD\u503C\uFF08capital_preservation\uFF09\u76EE\u6807\u4E0E\u4FDD\u5B88\u578B\u98CE\u9669\u627F\u53D7\u5EA6\uFF0C\u9700\u5BF9\u8D35\u5DDE\u8305\u53F0\u5404\u98CE\u9669\u7EF4\u5EA6\u8FDB\u884C\u5BA1\u614E\u8BC4\u4F30\u3002\u6574\u4F53\u98CE\u9669\u6C34\u5E73\u8F83\u4F4E\uFF0C\u4F46\u4ECD\u5B58\u5728\u4E2D\u7B49\u8BC4\u7EA7\u98CE\u9669\u9700\u5173\u6CE8\uFF1A\u5E02\u573A\u98CE\u9669\u65B9\u9762\uFF0C\u767D\u9152\u884C\u4E1A\u53D7\u5B8F\u89C2\u7ECF\u6D4E\u5F71\u54CD\uFF0C\u9700\u6C42\u53EF\u80FD\u77ED\u671F\u6CE2\u52A8\uFF0C\u5386\u53F2\u6700\u5927\u56DE\u64A4\u7EA630%\uFF0C\u4F46\u8305\u53F0\u4F5C\u4E3A\u9F99\u5934\u6CE2\u52A8\u76F8\u5BF9\u8F83\u5C0F\uFF1B\u4F30\u503C\u98CE\u9669\u4E2D\u7B49\uFF0C\u5F53\u524DPE
      25.7\u500D\u5E76\u975E\u6781\u7AEF\u4F4E\u4F30\uFF0C\u82E5\u5E02\u573A\u60C5\u7EEA\u6076\u5316\u4ECD\u6709\u4E0B\u884C\u7A7A\u95F4\uFF1B\u6210\u957F\u98CE\u9669\u8F83\u4F4E\uFF0C\u63D0\u4EF7\u4E0E\u76F4\u9500\u589E\u957F\u7A7A\u95F4\u660E\u786E\uFF1B\u4E8B\u4EF6\u98CE\u9669\u8F83\u4F4E\uFF0C\u56FD\u4F01\u80CC\u666F\u4E14\u4FE1\u7528\u8BC4\u7EA7AAA\uFF0C\u653F\u7B56\u4E0E\u7ECF\u8425\u98CE\u9669\u53EF\u63A7\u3002\u6240\u6709\u4E2D\u7B49\u53CA\u4EE5\u4E0A\u98CE\u9669\u5747\u5DF2\u5217\u51FA\u7F13\u89E3\u63AA\u65BD\uFF0C\u4EE5\u5339\u914D\u4FDD\u672C\u5BA2\u6237\u5BF9\u5B89\u5168\u6027\u7684\u9AD8\u8981\u6C42\u3002[^downside_protection_and_safety_margin][^risk_and_financial_health][^credit_event_and_news_screening]\\n\\n**\u6574\u4F53\u98CE\u9669\u7B49\u7EA7:\u4F4E**\\n\\n###
      \u5E02\u573A\u98CE\u9669\\n- **\u5B8F\u89C2\u7ECF\u6D4E\u6CE2\u52A8\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4E2D)
      \u2014 \u767D\u9152\u6D88\u8D39\u53D7\u7ECF\u6D4E\u5468\u671F\u5F71\u54CD\uFF0C\u82E5\u7ECF\u6D4E\u4E0B\u884C\u53EF\u80FD\u6291\u5236\u9AD8\u7AEF\u6D88\u8D39\u9700\u6C42\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u8305\u53F0\u54C1\u724C\u7A00\u7F3A\u6027\u63D0\u4F9B\u9700\u6C42\u97E7\u6027
      / \u5EFA\u8BAE\u957F\u671F\u6301\u6709\u4EE5\u5E73\u6ED1\u5468\u671F\u6CE2\u52A8\\n\\n###
      \u6210\u957F\u98CE\u9669\\n- **\u589E\u901F\u653E\u7F13\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4F4E)
      \u2014 \u8425\u6536\u589E\u901F\u4ECE\u8FC7\u53BB20%\u964D\u81F310%\u5DE6\u53F3\uFF0C\u672A\u6765\u63D0\u4EF7\u7A7A\u95F4\u6536\u7A84\\n
