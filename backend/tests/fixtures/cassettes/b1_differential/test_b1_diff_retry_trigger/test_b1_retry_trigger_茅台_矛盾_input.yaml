      \u6295\u8D44\u7814\u7A76\u5458 SOP (\u8DE8 11 \u7EF4\u5EA6\u65B9\u6CD5\u8BBA)\\n\\n##
      \xA7 1.1 \u507F\u503A\u80FD\u529B (Solvency)\\n\\n**\u5173\u952E\u6307\u6807**
      (\u6765\u81EA `get_balance_sheet`, `get_cashflow`):\\n- \u8D44\u4EA7\u8D1F\u503A\u7387
      = `total_liab / total_assets` (\u6765\u81EA `GetBalanceSheetTool`, \u6D3E\u751F\u5B57\u6BB5
      `asset_liability_ratio`).\\n- \u6D41\u52A8\u6BD4\u7387 = `total_cur_assets /
      total_cur_liab` (\u77ED\u671F\u507F\u503A\u80FD\u529B).\\n- \u901F\u52A8\u6BD4\u7387
      = `(total_cur_assets - inventories) / total_cur_liab` (\u5254\u9664\u5B58\u8D27\u540E\u77ED\u671F\u507F\u503A\u80FD\u529B).\\n-
      \u7ECF\u8425\u73B0\u91D1\u6D41\u4E3A\u6B63 = `n_cashflow_act > 0` (\u6765\u81EA
      `GetCashflowTool.positive_ocf`, binary signal).\\n\\n**\u5224\u65AD\u9608\u503C**
      (\u5F15\u7528 `references/industry_benchmarks.json`, **\u884C\u4E1A\u5DEE\u5F02\u6781\u5927**
      \u2014 \u5FC5\u987B\u67E5 `lookup_industry_benchmark`):\\n\\n| \u6307\u6807
      | \u5065\u5EB7 (DEFAULT) | \u4E00\u822C | \u8B66\u6212 | \u9AD8\u98CE\u9669
      |\\n|---|---|---|---|---|\\n| \u8D44\u4EA7\u8D1F\u503A\u7387 | < 0.50 | 0.50\u20130.60
      | 0.60\u20130.70 | > 0.70 |\\n| \u6D41\u52A8\u6BD4\u7387 | > 2.0 | 1.5\u20132.0
      | 1.0\u20131.5 | < 1.0 |\\n| \u901F\u52A8\u6BD4\u7387 | > 1.0 | 0.7\u20131.0
      | 0.5\u20130.7 | < 0.5 |\\n\\n**\u884C\u4E1A\u5DEE\u5F02\u63D0\u9192** (\u5173\u952E
      \u2014 DEFAULT \u9608\u503C\u4E0D\u53EF\u673A\u68B0\u5957\u7528):\\n- **\u767D\u9152**:
      \u5065\u5EB7 < 0.30 (\u4F4E\u6760\u6746\u7ECF\u8425, \u73B0\u91D1\u6D41\u5F3A),
      \u8B66\u6212 > 0.50.\\n- **\u516C\u7528\u4E8B\u4E1A / \u623F\u5730\u4EA7**:
      \u5065\u5EB7 < 0.65, \u8B66\u6212 > 0.80 (\u91CD\u8D44\u4EA7 + \u957F\u5468\u671F,
      \u9AD8\u6760\u6746\u662F\u5E38\u6001).\\n- **\u94F6\u884C\u91D1\u878D**: \u8D44\u4EA7\u8D1F\u503A\u7387\u901A\u5E38
      > 0.92 (\u5438\u6536\u5B58\u6B3E\u672C\u8EAB\u5C31\u662F\u8D1F\u503A), \u672C\u6846\u67B6**\u4E0D\u9002\u7528**,
      \u8BF7\u53C2\u8003\u8D44\u672C\u5145\u8DB3\u7387 (CAR) / \u6838\u5FC3\u4E00\u7EA7\u8D44\u672C\u5145\u8DB3\u7387\u7B49\u76D1\u7BA1\u6307\u6807
      \u2014 \u89C1 `industry_benchmarks.json._note`.\\n- **\u79D1\u6280\u4E92\u8054\u7F51
      / \u533B\u836F\u751F\u7269**: \u5065\u5EB7 < 0.40, \u8B66\u6212 > 0.60 (\u8F7B\u8D44\u4EA7,
      \u9AD8\u6760\u6746\u901A\u5E38\u610F\u5473\u7740\u6269\u5F20\u5931\u63A7).\\n\\n**\u8BC4\u4F30\u6D41\u7A0B**:\\n1.
      \u5148\u67E5\u884C\u4E1A \u2014 \u8C03 `bundle.scripts.lookup_industry_benchmark(industry=...,
      indicator=\\\"\u8D44\u4EA7\u8D1F\u503A\u7387_\u5065\u5EB7\\\")` \u62FF\u884C\u4E1A\u57FA\u51C6.\\n2.
      \u518D\u7B97\u516C\u53F8\u5F53\u524D\u8D44\u4EA7\u8D1F\u503A\u7387, \u8DDF\u884C\u4E1A\u57FA\u51C6\u5BF9\u6BD4
      (\u800C\u975E DEFAULT 50%).\\n3. \u770B\u6D41\u52A8 / \u901F\u52A8\u6BD4\u7387\u5224\u65AD\u77ED\u671F\u652F\u4ED8\u80FD\u529B,
      \u4E8C\u8005\u80CC\u79BB (\u6D41\u52A8 > 2 \u4F46\u901F\u52A8 < 0.7) \u901A\u5E38\u610F\u5473\u5B58\u8D27\u79EF\u538B.\\n4.
      \u6700\u540E\u770B\u7ECF\u8425\u73B0\u91D1\u6D41\u662F\u5426\u4E3A\u6B63, \u5373\u4F7F\u6307\u6807\u597D\u4F46
