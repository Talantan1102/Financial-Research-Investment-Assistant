      \xA7 5 \u98CE\u9669\u8BC4\u4F30\\n\\n\u57FA\u4E8E\u60A8balanced\u5747\u8861\u578B\u6295\u8D44\u76EE\u6807\u4E0Emoderate\u98CE\u9669\u627F\u53D7\u5EA6\uFF0C\u672C\u62A5\u544A\u5BA2\u89C2\u8BC4\u4F30\u8D35\u5DDE\u8305\u53F0\u5404\u7C7B\u98CE\u9669\u3002\u5E02\u573A\u98CE\u9669\u65B9\u9762\uFF0C\u5F53\u524DPE\u5904\u4E8E\u5386\u53F2\u9AD8\u4F4D\uFF08\u8FD15\u5E74\u5206\u4F4D\u6570\u504F\u9AD8\uFF09\uFF0C\u4E14\u77ED\u671F\u6280\u672F\u9762\u53EF\u80FD\u5B58\u5728\u8D85\u4E70\uFF0C\u56DE\u64A4\u98CE\u9669\u4E2D\u7B49\uFF0C\u4F46\u516C\u53F8\u57FA\u672C\u9762\u6781\u4F18\u53EF\u7F13\u51B2\u4E0B\u884C\u3002\u6210\u957F\u98CE\u9669\u65B9\u9762\uFF0C\u8425\u6536\u4E0E\u51C0\u5229\u589E\u901F\u8F83\u5386\u53F2\u9AD8\u70B9\u653E\u7F13\uFF0C\u957F\u671F\u6210\u957F\u7A7A\u95F4\u53D7\u9650\u4E8E\u884C\u4E1A\u5929\u82B1\u677F\uFF0C\u4F46\u786E\u5B9A\u6027\u4F9D\u7136\u8F83\u9AD8\u3002\u4E8B\u4EF6\u98CE\u9669\u65B9\u9762\uFF0C\u672A\u53D1\u73B0\u5927\u80A1\u4E1C\u51CF\u6301\u3001\u8D28\u62BC\u6216\u76D1\u7BA1\u5904\u7F5A\u7B49\u8D1F\u9762\u4E8B\u4EF6\uFF0C\u98CE\u9669\u4F4E\u3002\u4F30\u503C\u98CE\u9669\u65B9\u9762\uFF0C\u5F53\u524D\u4F30\u503C\u5904\u4E8E\u5386\u53F2\u504F\u9AD8\u533A\u57DF\uFF0C\u6EA2\u4EF7\u7387\u8F83\u9AD8\uFF0C\u82E5\u5E02\u573A\u98CE\u683C\u5207\u6362\u6216\u4E1A\u7EE9\u4E0D\u53CA\u9884\u671F\uFF0C\u5B58\u5728\u4F30\u503C\u56DE\u8C03\u538B\u529B\u3002\u603B\u4F53\u8BC4\u4F30\uFF0C\u8305\u53F0\u7684\u7ECF\u8425\u548C\u8D22\u52A1\u98CE\u9669\u5F88\u4F4E\uFF0C\u4E3B\u8981\u98CE\u9669\u96C6\u4E2D\u4E8E\u4F30\u503C\u4E0E\u5E02\u573A\u60C5\u7EEA\uFF0C\u6574\u4F53\u98CE\u9669\u6C34\u5E73\u4E3Amedium\u3002[^capital_preservation_2][^capital_preservation_0][^capital_preservation_3]\\n\\n**\u6574\u4F53\u98CE\u9669\u7B49\u7EA7:\u4E2D**\\n\\n###
      \u5E02\u573A\u98CE\u9669\\n- **\u4F30\u503C\u9AD8\u4F4D\u56DE\u8C03\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4E2D)
      \u2014 \u5F53\u524DPE\u5904\u4E8E\u5386\u53F2\u504F\u9AD8\u4F4D\u7F6E\uFF0C\u82E5\u5E02\u573A\u60C5\u7EEA\u6076\u5316\u6216\u6D41\u52A8\u6027\u6536\u7D27\uFF0C\u53EF\u80FD\u9762\u4E34\u4F30\u503C\u4E0B\u4FEE\u98CE\u9669\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u8BBE\u7F6E\u6B62\u635F\u4F4D\uFF08\u8DDD\u5165\u573A\u4EF78%-15%\uFF09\uFF0C\u6267\u884C\u7EAA\u5F8B\u6B62\u635F\\n\\n###
      \u6210\u957F\u98CE\u9669\\n- **\u6210\u957F\u6027\u653E\u7F13\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4F4E)
      \u2014 \u884C\u4E1A\u8FDB\u5165\u6210\u719F\u671F\uFF0C\u8425\u6536\u4E0E\u51C0\u5229\u6DA6\u589E\u901F\u653E\u7F13\u81F3\u53CC\u4F4D\u6570\u4EE5\u4E0B\uFF0C\u957F\u671F\u6210\u957F\u7A7A\u95F4\u53D7\u9650\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u5173\u6CE8\u8305\u53F0\u76F4\u8425\u5316\u3001\u7CFB\u5217\u9152\u653E\u91CF\u7B49\u7ED3\u6784\u6027\u589E\u957F\u70B9\\n\\n###
      \u4E8B\u4EF6\u98CE\u9669\\n- **\u653F\u7B56\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4F4E)
      \u2014 \u82E5\u6D88\u8D39\u7A0E\u6539\u9769\u843D\u5730\uFF0C\u53EF\u80FD\u5BF9\u9AD8\u7AEF\u767D\u9152\u5229\u6DA6\u9020\u6210\u4E00\u6B21\u6027\u5F71\u54CD\u3002\\n
      \ \u7F13\u91CA\u63AA\u65BD:\u6301\u7EED\u8DDF\u8E2A\u653F\u7B56\u52A8\u6001\uFF0C\u5206\u6563\u884C\u4E1A\u914D\u7F6E\\n\\n###
      \u4F30\u503C\u98CE\u9669\\n- **\u6EA2\u4EF7\u8FC7\u9AD8\u98CE\u9669**(\u4E25\u91CD\u5EA6:\u4E2D)
