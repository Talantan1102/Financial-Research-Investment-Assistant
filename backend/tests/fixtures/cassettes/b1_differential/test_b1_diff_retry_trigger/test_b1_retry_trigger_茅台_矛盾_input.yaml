      33.5%\u8FDC\u8D85\u767D\u9152\u884C\u4E1A\u5E73\u5747\u6C34\u5E73\uFF0820%\uFF09\uFF0C\u6BDB\u5229\u738791.8%\u5904\u4E8E\u884C\u4E1A\u9876\u7AEF\uFF0C\u51C0\u5229\u738752.5%\u4EA6\u4E3A\u884C\u4E1A\u6700\u9AD8\u6C34\u5E73\uFF0C\u53CD\u6620\u6781\u5F3A\u54C1\u724C\u6EA2\u4EF7\u4E0E\u6210\u672C\u63A7\u5236\u3002\u9AD8\u6BDB\u5229\u4E0E\u9AD8\u51C0\u5229\u7EC4\u5408\u8868\u660E\u4EA7\u54C1\u5B9A\u4EF7\u6743\u7A33\u56FA\uFF0C\u8D39\u7528\u7387\u63A7\u5236\u5F97\u5F53\u3002\u76C8\u5229\u8D28\u91CF\u771F\u5B9E\uFF0COCF/\u51C0\u5229\u6DA6\u6BD4\u73871.06\uFF0C\u5229\u6DA6\u542B\u91D1\u91CF\u9AD8\u3002\\n\\n###
      \u6210\u957F\u6027\\n\u8425\u6536\u4E0E\u51C0\u5229\u6DA6\u8FD14\u4E2A\u5B63\u5EA6\u7EF4\u6301\u53CC\u4F4D\u6570\u540C\u6BD4\u589E\u957F\uFF0C\u4F46\u589E\u901F\u8F832020-2021\u5E74\u9AD8\u5CF0\u671F\u6709\u6240\u653E\u7F13\uFF08\u7EA615%\uFF09\uFF0C\u4E0E\u767D\u9152\u884C\u4E1A\u6210\u719F\u671F\u7279\u5F81\u543B\u5408\u3002\u884C\u4E1A\u666F\u6C14\u5EA6\u4E2D\u6027\u504F\u7A33\uFF0C\u9AD8\u7AEF\u767D\u9152\u9700\u6C42\u521A\u6027\uFF0C\u4F46\u77ED\u671F\u6E20\u9053\u5E93\u5B58\u53CA\u7ECF\u6D4E\u9884\u671F\u5BF9\u589E\u901F\u6709\u4E00\u5B9A\u5F71\u54CD\u3002\u4E0B\u671F\u4E1A\u7EE9\u9884\u544A\u6570\u636E\u7F3A\u5931\uFF0C\u5EFA\u8BAE\u8865\u5145\u4E1A\u7EE9\u9884\u544A\u4EE5\u5224\u65AD\u77ED\u671F\u589E\u957F\u50AC\u5316\u5242\u3002\\n\\n###
      \u6295\u8D44\u56DE\u62A5\\n\u9AD8ROE\uFF0833.5%\uFF09\u4E3A\u957F\u671F\u80A1\u4E1C\u63D0\u4F9B\u4F18\u826F\u8D44\u672C\u56DE\u62A5\uFF0C\u4F46\u5F53\u524D\u4F30\u503C\u5904\u4E8E\u5386\u53F2\u9AD8\u4F4D\uFF0C\u77ED\u671F\u80A1\u606F\u7387\u8F83\u4F4E\uFF08\u6570\u636E\u7F3A\u5931\uFF09\uFF0C\u6295\u8D44\u56DE\u62A5\u66F4\u591A\u4F9D\u8D56\u80A1\u4EF7\u4EF7\u5DEE\u3002\u5EFA\u8BAE\u7ED3\u5408\u4F30\u503C\u5206\u4F4D\u6570\u4E0E\u8D44\u91D1\u9762\u4FE1\u53F7\u5224\u65AD\u77ED\u671F\u5165\u573A\u65F6\u673A\u3002\\n\\n###
      \u73B0\u91D1\u6D41\\n\u7ECF\u8425\u73B0\u91D1\u6D41\u6301\u7EED\u5F3A\u52B2\uFF08910\u4EBF\uFF09\uFF0C\u4E0E\u51C0\u5229\u6DA6\u9AD8\u5EA6\u5339\u914D\uFF08OCF/NI=1.06\uFF09\uFF0C\u81EA\u7531\u73B0\u91D1\u6D41\u5145\u6C9B\u3002\u6295\u8D44\u73B0\u91D1\u6D41\u4E3B\u8981\u4E3A\u6280\u6539\u6269\u5EFA\uFF0C\u7B79\u8D44\u73B0\u91D1\u6D41\u4E3A\u8D1F\uFF08\u6301\u7EED\u9AD8\u5206\u7EA2\uFF09\uFF0C\u8BF4\u660E\u516C\u53F8\u4E0D\u4F9D\u8D56\u5916\u90E8\u878D\u8D44\u4E14\u79EF\u6781\u56DE\u9988\u80A1\u4E1C\u3002\u73B0\u91D1\u6D41\u5065\u5EB7\uFF0C\u81EA\u6211\u9020\u8840\u80FD\u529B\u5F3A\u3002\\n\\n###
      \u4F30\u503C\u5206\u6790\\n\u5F53\u524DPE\u6570\u636E\u7F3A\u5931\uFF0C\u4F46\u4ECE\u884C\u4E1A\u6A2A\u5411\u5BF9\u6BD4\u770B\uFF0C\u8D35\u5DDE\u8305\u53F0PE\u957F\u671F\u5904\u4E8E\u9AD8\u7AEF\u767D\u9152\u6EA2\u4EF7\u533A\u95F4\uFF0CROE
      33.5%\u53EF\u652F\u6491\u4E00\u5B9A\u4F30\u503C\u6EA2\u4EF7\u3002\u7ED3\u5408\u7528\u6237\u77ED\u671F\u907F\u9669\u9700\u6C42\uFF0C\u9700\u6CE8\u610F\u9AD8\u4F4D\u56DE\u64A4\u98CE\u9669\u3002\u5EFA\u8BAE\u8865\u5145PE\u5386\u53F2\u5206\u4F4D\u6570\u636E\uFF08pe_historical_percentile_value\uFF09\u4EE5\u7CBE\u51C6\u5224\u65AD\u7EB5\u5411\u4F30\u503C\u4F4D\u7F6E\u3002\\n\\n-
      \u540C\u4E1A\u5BF9\u6BD4:\u9AD8\u7AEF\u767D\u9152\uFF08\u4E94\u7CAE\u6DB2\u3001\u6CF8\u5DDE\u8001\u7A96\uFF09PE\u4E2D\u67A2\u7EA625-35\u500D\uFF0C\u8305\u53F0\u54C1\u724C\u6EA2\u4EF7\u5BFC\u81F4\u4F30\u503C\u9AD8\u4E8E\u540C\u4E1A\uFF0C\u9700\u5173\u6CE8\u6EA2\u4EF7\u6536\u7A84\u98CE\u9669\u3002\\n###
      \u540C\u6BD4\u53D8\u5316\\n\u6570\u636E\u7F3A\u5931\uFF0C\u5EFA\u8BAE\u8865\u5145\u540C\u6BD4\u53D8\u5316\u6570\u636E\\n\\n\\n##
      \xA7 4 \u884C\u4E1A\u5206\u6790\\n\\n\u767D\u9152\u884C\u4E1A\u5F53\u524D\u5904\u4E8E\u6210\u719F\u671F\uFF0C\u9AD8\u7AEF\u767D\u9152\uFF08\u8305\u53F0\u3001\u4E94\u7CAE\u6DB2\u3001\u6CF8\u5DDE\u8001\u7A96\uFF09\u683C\u5C40\u7A33\u5B9A\uFF0C\u8305\u53F0\u4F5C\u4E3A\u884C\u4E1A\u9F99\u5934\u5177\u6709\u6781\u5F3A\u7684\u54C1\u724C\u62A4\u57CE\u6CB3\u548C\u5B9A\u4EF7\u6743\u3002\u884C\u4E1A\u666F\u6C14\u5EA6\u4E2D\u6027\u504F\u7A33\uFF0C\u653F\u7B56\u7AEF\u65E0\u663E\u8457\u538B\u5236\uFF0C\u4F46\u9762\u4E34\u5B8F\u89C2\u7ECF\u6D4E\u653E\u7F13\u4E0E\u6D88\u8D39\u964D\u7EA7\u9884\u671F\u5BF9\u9700\u6C42\u7AEF\u7684\u5F71\u54CD\u3002\u7ADE\u4E89\u5730\u4F4D\u65B9\u9762\uFF0C\u8305\u53F0\u5728\u9AD8\u7AEF\u767D\u9152\u5E02\u573A\u4EFD\u989D\u8D8550%\uFF0C\u5904\u4E8E\u7EDD\u5BF9\u9886\u5148\u5730\u4F4D\uFF0C\u5BF9\u624B\u96BE\u4EE5\u64BC\u52A8\u3002\u5173\u952E\u7ADE\u4E89\u5BF9\u624B\u5305\u62EC\u4E94\u7CAE\u6DB2\u3001\u6CF8\u5DDE\u8001\u7A96\u7B49\u3002\u653F\u7B56\u5F71\u54CD\u65B9\u9762\uFF0C\u8FD1\u5E74\u65E0\u9488\u5BF9\u6027\u6253\u538B\u653F\u7B56\uFF0C\u4F46\u9700\u5173\u6CE8\u6D88\u8D39\u7A0E\u6539\u9769\u5BF9\u884C\u4E1A\u5229\u6DA6\u7684\u6F5C\u5728\u5F71\u54CD\u3002\u7EFC\u5408\u6765\u770B\uFF0C\u884C\u4E1A\u57FA\u672C\u9762\u7A33\u56FA\uFF0C\u4F46\u589E\u957F\u5929\u82B1\u677F\u6E10\u663E\uFF0C\u672A\u6765\u66F4\u591A\u4F9D\u8D56\u4EF7\u5347\u800C\u975E\u91CF\u589E\u3002[^capital_preservation_2][^capital_preservation_0]\\n\\n-
