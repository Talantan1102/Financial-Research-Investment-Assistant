      \u2014 \u89C1 `industry_benchmarks.json._note`.\\n- **\u79D1\u6280\u4E92\u8054\u7F51
      / \u533B\u836F\u751F\u7269**: \u5065\u5EB7 < 0.40, \u8B66\u6212 > 0.60 (\u8F7B\u8D44\u4EA7,
      \u9AD8\u6760\u6746\u901A\u5E38\u610F\u5473\u7740\u6269\u5F20\u5931\u63A7).\\n\\n**\u8BC4\u4F30\u6D41\u7A0B**:\\n1.
      \u5148\u67E5\u884C\u4E1A \u2014 \u8C03 `bundle.scripts.lookup_industry_benchmark(industry=...,
      indicator=\\\"\u8D44\u4EA7\u8D1F\u503A\u7387_\u5065\u5EB7\\\")` \u62FF\u884C\u4E1A\u57FA\u51C6.\\n2.
      \u518D\u7B97\u516C\u53F8\u5F53\u524D\u8D44\u4EA7\u8D1F\u503A\u7387, \u8DDF\u884C\u4E1A\u57FA\u51C6\u5BF9\u6BD4
      (\u800C\u975E DEFAULT 50%).\\n3. \u770B\u6D41\u52A8 / \u901F\u52A8\u6BD4\u7387\u5224\u65AD\u77ED\u671F\u652F\u4ED8\u80FD\u529B,
      \u4E8C\u8005\u80CC\u79BB (\u6D41\u52A8 > 2 \u4F46\u901F\u52A8 < 0.7) \u901A\u5E38\u610F\u5473\u5B58\u8D27\u79EF\u538B.\\n4.
      \u6700\u540E\u770B\u7ECF\u8425\u73B0\u91D1\u6D41\u662F\u5426\u4E3A\u6B63, \u5373\u4F7F\u6307\u6807\u597D\u4F46
      OCF \u6301\u7EED\u4E3A\u8D1F, \u4ECD\u5C5E\\\"\u8D26\u9762\u5065\u5EB7 + \u5B9E\u9645\u7A9F\u7ABF\\\"\u7EA2\u706F.\\n\\n**\u5199\u5165
      narrative \u7684\u6807\u51C6\u53E5\u5F0F**:\\n- \\\"{target_name} \u8D44\u4EA7\u8D1F\u503A\u7387
      {X}% (\u884C\u4E1A\u5E73\u5747 {Y}%, \u6765\u81EA industry_benchmarks.json),
      \u5904\u4E8E{\u5065\u5EB7/\u4E00\u822C/\u8B66\u6212/\u9AD8\u98CE\u9669}\u6C34\u5E73.\\\"\\n-
      \\\"\u7ECF\u8425\u73B0\u91D1\u6D41\u8FDE\u7EED {N} \u5E74\u4E3A\u6B63, \u507F\u503A\u57FA\u7840{\u624E\u5B9E/\u8106\u5F31}.\\\"\\n\\n\\n##
      \xA7 1.2 \u76C8\u5229\u80FD\u529B (Profitability)\\n\\n**\u5173\u952E\u6307\u6807**
      (\u6765\u81EA `get_financials`):\\n- ROE (\u51C0\u8D44\u4EA7\u6536\u76CA\u7387)
      = `\u51C0\u5229\u6DA6 / \u80A1\u4E1C\u6743\u76CA\u5747\u989D` \u2014 \u8861\u91CF\u80A1\u4E1C\u8D44\u672C\u56DE\u62A5,
      \u5DF4\u83F2\u7279\u9996\u9009\u6307\u6807.\\n- ROA (\u603B\u8D44\u4EA7\u62A5\u916C\u7387)
      = `\u51C0\u5229\u6DA6 / \u603B\u8D44\u4EA7\u5747\u989D` \u2014 \u5254\u9664\u6760\u6746\u653E\u5927\u6548\u5E94\u540E\u7684\u771F\u5B9E\u8D5A\u94B1\u80FD\u529B.\\n-
      \u6BDB\u5229\u7387 = `(\u8425\u4E1A\u6536\u5165 - \u8425\u4E1A\u6210\u672C)
      / \u8425\u4E1A\u6536\u5165` \u2014 \u53CD\u6620\u4EA7\u54C1\u5B9A\u4EF7\u6743
      + \u6210\u672C\u63A7\u5236.\\n- \u51C0\u5229\u7387 = `\u51C0\u5229\u6DA6 / \u8425\u4E1A\u6536\u5165`
      \u2014 \u5254\u9664\u8D39\u7528 / \u7A0E\u540E\u7684\u6700\u7EC8\u8D5A\u94B1\u80FD\u529B.\\n-
      \u51C0\u5229\u6DA6 yoy = `(\u672C\u671F\u51C0\u5229\u6DA6 - \u53BB\u5E74\u540C\u671F)
      / \u53BB\u5E74\u540C\u671F` (\u6D3E\u751F\u5B57\u6BB5, `GetFinancialsTool.net_profit`).\\n\\n**\u5224\u65AD\u9608\u503C**
      (\u5F15\u7528 `references/industry_benchmarks.json` \u2014 \u5FC5\u987B\u7528
      `lookup_industry_benchmark`):\\n\\n| \u6307\u6807 | \u5065\u5EB7 (DEFAULT) |
      \u4E00\u822C | \u8B66\u6212 | \u9AD8\u98CE\u9669 |\\n|---|---|---|---|---|\\n|
      ROE | > \u884C\u4E1A\u5E73\u5747 1.5x (= \u9886\u5148) | \u884C\u4E1A\u5E73\u5747
      \xB1 30% | < \u884C\u4E1A\u5E73\u5747 50% | < 0 (\u4E8F\u635F) |\\n| \u6BDB\u5229\u7387
      | > 30% (\u4E2D\u6027) | 15\u201330% | 5\u201315% | < 5% |\\n| \u51C0\u5229\u7387
      | > 10% | 5\u201310% | 0\u20135% | < 0 (\u4E8F\u635F) |\\n\\n**\u884C\u4E1A\u5DEE\u5F02\u63D0\u9192**
      (\u5173\u952E):\\n- **\u767D\u9152**: ROE \u884C\u4E1A\u5E73\u5747 0.20, \u9886\u5148
      0.30 (\u9AD8\u6BDB\u5229 + \u5F3A\u54C1\u724C); ROE < 15% \u901A\u5E38\u5DF2\u662F\u6B21\u68AF\u961F.\\n-
      **\u516C\u7528\u4E8B\u4E1A**: ROE \u884C\u4E1A\u5E73\u5747 0.08, \u9886\u5148
      0.13 (\u5F3A\u76D1\u7BA1 / \u4EF7\u683C\u7BA1\u5236, \u4E0A\u9650\u4F4E); \u770B\u5230
      18% \u53CD\u800C\u8981\u8B66\u60D5.\\n- **\u79D1\u6280\u4E92\u8054\u7F51**:
      ROE \u884C\u4E1A\u5E73\u5747 0.15, \u9886\u5148 0.30 (\u5934\u90E8 / \u957F\u5C3E\u5206\u5316\u5927,
      \u5173\u6CE8\u662F\u5426\u6709 SaaS \u5316\u53D8\u73B0).\\n- **\u533B\u836F\u751F\u7269**:
      ROE \u884C\u4E1A\u5E73\u5747 0.12, \u9886\u5148 0.22 (\u521B\u65B0\u836F\u7BA1\u7EBF
      vs \u4EFF\u5236\u836F\u4EF7\u5DEE\u5DEE\u5F02).\\n- **\u94F6\u884C\u91D1\u878D**:
      ROE \u884C\u4E1A\u5E73\u5747 0.10 (\u5229\u5DEE\u53D7\u76D1\u7BA1\u7EA6\u675F).\\n\\n**\u8BC4\u4F30\u6D41\u7A0B**:\\n1.
      \u5148\u67E5\u884C\u4E1A ROE \u57FA\u51C6 \u2014 `lookup_industry_benchmark(industry=...,
      indicator=\\\"ROE_\u884C\u4E1A\u5E73\u5747\\\")`.\\n2. \u8DDF\\\"\u884C\u4E1A\u5E73\u5747\u7684
      1.5x\\\"\u6BD4\u8F83, > \u8FD9\u4E2A\u500D\u6570 = \u9886\u5148.\\n3. \u518D\u770B\u6BDB\u5229\u7387\u8D8B\u52BF,
      \u8DCC\u7A7F 5pp = \u5B9A\u4EF7\u6743 / \u6210\u672C\u7AEF\u6709\u6076\u5316.\\n4.
      \u6700\u540E\u770B\u51C0\u5229\u7387, \u8DDF\u6BDB\u5229\u7387\u80CC\u79BB (\u6BDB\u5229\u7A33\u4F46\u51C0\u5229\u8DCC)
      \u901A\u5E38\u610F\u5473\u8D39\u7528\u7387\u5931\u63A7.\\n\\n**\u5199\u5165
      narrative \u7684\u6807\u51C6\u53E5\u5F0F**:\\n- \\\"{target_name} ROE {X}% (\u884C\u4E1A\u5E73\u5747
      {Y}%), \u5904\u4E8E{\u9886\u5148/\u4E2D\u6E38/\u843D\u540E}\u6C34\u5E73.\\\"\\n-
      \\\"\u6BDB\u5229\u7387\u8FD1 {N} \u671F {\u4E0A\u5347/\u7A33\u5B9A/\u4E0B\u6ED1}
      {Z}pp, \u53CD\u6620{\u5B9A\u4EF7\u6743/\u6210\u672C\u7AEF}\u53D8\u5316.\\\"\\n\\n\\n##
      \xA7 1.3 \u6210\u957F\u6027 (Growth)\\n\\n**\u5173\u952E\u6307\u6807** (\u6765\u81EA
      `get_financials`, `get_forecast`):\\n- \u8425\u6536 yoy = `(\u672C\u671F\u8425\u4E1A\u6536\u5165
      - \u53BB\u5E74\u540C\u671F) / \u53BB\u5E74\u540C\u671F` (`GetFinancialsTool.revenue_yoy`).\\n-
      \u51C0\u5229\u6DA6 yoy = `(\u672C\u671F\u51C0\u5229\u6DA6 - \u53BB\u5E74\u540C\u671F)
      / \u53BB\u5E74\u540C\u671F` (`GetFinancialsTool.net_profit_yoy`).\\n- \u4E1A\u7EE9\u9884\u544A
      (`GetForecastTool.forecast_signal`): `\\\"positive\\\"` (\u9884\u589E/\u626D\u4E8F/\u7565\u589E)
      / `\\\"negative\\\"` (\u9884\u51CF/\u4E8F\u635F/\u7565\u51CF) / `\\\"neutral\\\"`.\\n-
      \u6301\u7EED\u589E\u957F\u80FD\u529B: \u8FDE\u7EED 3 \u5E74/4 \u4E2A\u5B63\u5EA6\u8425\u6536
      + \u51C0\u5229\u53CC\u5347 = \u5F3A\u6210\u957F\u4FE1\u53F7.\\n\\n**\u5224\u65AD\u9608\u503C**
      (\u901A\u7528 sanity \u6807\u51C6, \u4E2A\u80A1\u4EE5\u884C\u4E1A benchmark
      \u4E3A\u51C6):\\n\\n| \u6307\u6807 | \u5065\u5EB7 | \u4E00\u822C | \u8B66\u6212
      | \u9AD8\u98CE\u9669 |\\n|---|---|---|---|---|\\n| \u8425\u6536 yoy | > 20%
      | 5\u201320% | 0\u20135% | < 0 (\u4E0B\u6ED1) |\\n| \u51C0\u5229\u6DA6 yoy |
      > 25% | 10\u201325% | 0\u201310% | < 0 |\\n| \u4E1A\u7EE9\u9884\u544A | `positive`
      | `neutral` | \u2014 | `negative` |\\n\\n\u6CE8: \\\"\u8425\u6536 + \u51C0\u5229\u53CC\u5347\\\"
      \u662F `recommendation_rules.yaml` \u4E2D `recommend_buy` \u89E6\u53D1\u6761\u4EF6\u4E4B\u4E00
      \u2014 Writer \u8BA1\u7B97\u8BC4\u7EA7\u65F6 Python \u4FA7\u81EA\u52A8\u5957\u7528,
      \u4E0D\u9700 narrative \u91CD\u590D\u9608\u503C\u5224\u65AD.\\n\\n**\u884C\u4E1A\u5DEE\u5F02\u63D0\u9192**:\\n-
      **\u79D1\u6280\u4E92\u8054\u7F51 / \u533B\u836F\u751F\u7269**: \u9AD8\u6210\u957F\u662F\u57FA\u7EBF,
      < 15% \u5C31\u5C5E\\\"\u5931\u901F\\\"; PEG (= PE / \u51C0\u5229 yoy) \u8D85\u8FC7
      1.5 \u901A\u5E38\u5DF2\u504F\u8D35.\\n- **\u767D\u9152 / \u516C\u7528\u4E8B\u4E1A**:
      \u589E\u957F\u7387\u5929\u82B1\u677F\u4F4E (10\u201315% \u5C31\u7B97\u4F18\u79C0),
      \u4F46\u786E\u5B9A\u6027\u9AD8, \u53EF\u627F\u53D7\u66F4\u9AD8 PE.\\n- **\u623F\u5730\u4EA7
      / \u5468\u671F\u80A1**: \u8425\u6536 yoy \u9AD8\u5EA6\u4F9D\u8D56\u5468\u671F\u4F4D\u7F6E,
      \u5355\u5E74 +50% \u4E0D\u80FD\u5916\u63A8 \u2014 \u770B 3 \u5E74\u6EDA\u52A8\u5747\u503C\u66F4\u53EF\u9760.\\n\\n**\u8BC4\u4F30\u6D41\u7A0B**:\\n1.
      \u5148\u770B\u5386\u53F2 yoy \u8D8B\u52BF (\u53D6 4\u20138 \u671F\u6570\u636E),
      \u5224\u65AD\u662F\u5355\u671F\u6CE2\u52A8\u8FD8\u662F\u6301\u7EED\u8D8B\u52BF.\\n2.
      \u518D\u770B\u8425\u6536 vs \u51C0\u5229\u53CC\u6307\u6807\u662F\u5426\u540C\u5411,
      \u8425\u6536\u6DA8\u51C0\u5229\u8DCC = \u5229\u6DA6\u7387\u88AB\u4FB5\u8680,
      \u8B66\u60D5.\\n3. \u8C03 `get_forecast` \u770B\u4E0B\u671F\u9884\u544A\u4FE1\u53F7,
      \u8DDF\u5386\u53F2\u8D8B\u52BF\u662F\u5426\u4E00\u81F4.\\n4. \u6700\u540E\u8DDF\u884C\u4E1A\u666F\u6C14\u5EA6
      (\u89C1 `industry.md`) \u5BF9\u7167, \u533A\u5206\u516C\u53F8 alpha \u8FD8\u662F\u884C\u4E1A
      beta.\\n\\n**\u5199\u5165 narrative \u7684\u6807\u51C6\u53E5\u5F0F**:\\n- \\\"{target_name}
      \u8FD1 4 \u5B63\u8425\u6536 yoy \u5747\u503C {X}% / \u51C0\u5229 yoy \u5747\u503C
      {Y}%, {\u53CC\u5347/\u5355\u5347/\u53CC\u964D}.\\\"\\n- \\\"\u4E0B\u671F\u4E1A\u7EE9\u9884\u544A
      {positive/neutral/negative}, \u8DDF\u5386\u53F2\u8D8B\u52BF{\u4E00\u81F4/\u80CC\u79BB}.\\\"\\n\\n\\n##
      \xA7 1.4 \u73B0\u91D1\u6D41\u8D28\u91CF (Cashflow Quality)\\n\\n**\u5173\u952E\u6307\u6807**
      (\u6765\u81EA `get_cashflow` + `get_financials` \u2014 **\u5FC5\u987B cross-tool**):\\n-
      \u7ECF\u8425\u73B0\u91D1\u6D41 (OCF) = `n_cashflow_act` (\u6765\u81EA `GetCashflowTool`).\\n-
      \u6295\u8D44\u73B0\u91D1\u6D41 (ICF) = `n_cashflow_inv_act`.\\n- \u7B79\u8D44\u73B0\u91D1\u6D41
      (FCF_funding) = `n_cash_flows_fnc_act`.\\n- `positive_ocf`: bool (\u6765\u81EA
      `GetCashflowTool`, **binary signal only**, \u4E0D\u542B\u6BD4\u7387).\\n- \u51C0\u5229\u6DA6
      = `net_profit` (\u6765\u81EA `GetFinancialsTool`).\\n- **OCF / NI \u6BD4\u7387
      (\u73B0\u91D1\u6D41\u771F\u5B9E\u5EA6)** = `n_cashflow_act / net_profit` \u2014
      **\u5FC5\u987B Analyst \u8DE8 tool \u7B97**.\\n\\n**Cross-tool \u7EA6\u5B9A
      (\u91CD\u8981)**:\\n- `GetCashflowTool` \u5355 tool \u53EA\u66B4\u9732 `positive_ocf`
      \u8FD9\u4E2A binary \u4FE1\u53F7 (\u907F\u514D\u5728\u5355 tool \u5185\u505A\u8DE8
      endpoint \u7684\u8D22\u52A1\u6BD4\u7387, \u4FDD tool \u7EAF\u51C0).\\n- \u771F
      OCF/NI \u6BD4\u7387\u9700 Analyst \u5728 evidence \u9636\u6BB5\u4ECE\u4E24\u4E2A
      tool \u7ED3\u679C\u4E2D\u62BD\u6570 self-compute:\\n  ```\\n  ratio = GetCashflowTool.n_cashflow_act
      / GetFinancialsTool.net_profit\\n  ```\\n- \u89C1 Task 2 `app/tools/get_cashflow.py`
      TODO \u6CE8\u91CA \u2014 \u8FD9\u4E2A\u7EA6\u5B9A v0.8.5 \u4E4B\u540E\u7A33\u5B9A.\\n\\n**\u5224\u65AD\u9608\u503C**
      (\u901A\u7528 sanity \u6807\u51C6):\\n\\n| \u6307\u6807 | \u5065\u5EB7 | \u4E00\u822C
      | \u8B66\u6212 | \u9AD8\u98CE\u9669 |\\n|---|---|---|---|---|\\n| OCF / NI \u6BD4\u7387
      | > 0.8 (\u5229\u6DA6\u771F\u5B9E) | 0.5\u20130.8 | 0.2\u20130.5 | < 0.2 (\u5229\u6DA6\u7EB8\u9762\u5316)
      |\\n| \u7ECF\u8425\u73B0\u91D1\u6D41 (\u6301\u7EED\u6027) | \u8FDE\u7EED 3 \u5E74
      + | \u5076\u5C14\u6B63 | \u4E3B\u8981\u4E3A\u8D1F | \u6301\u7EED\u8D1F |\\n|
      FCF \u81EA\u7531\u73B0\u91D1\u6D41 = OCF + ICF | \u6301\u7EED > 0 (\u80FD\u81EA\u6211\u9020\u8840)
      | \u63A5\u8FD1 0 | \u6301\u7EED < 0 | < 0 + \u7B79\u8D44\u4E3A\u6B63 (\u501F\u94B1\u586B\u7A9F\u7ABF)
      |\\n\\n**\u884C\u4E1A\u5DEE\u5F02\u63D0\u9192**:\\n- **\u767D\u9152 / \u516C\u7528\u4E8B\u4E1A
      / \u9AD8\u7AEF\u5236\u9020**: OCF / NI > 1 \u662F\u5E38\u6001 (\u9884\u6536\u6B3E\u591A
      / \u6298\u65E7\u5927).\\n- **\u623F\u5730\u4EA7 / \u91CD\u8D44\u4EA7\u5468\u671F\u80A1**:
      OCF \u77ED\u671F\u53EF\u80FD\u4E3A\u8D1F (\u62FF\u5730\u6295\u5165), \u770B
      3\u20135 \u5E74\u6EDA\u52A8 OCF \u6BD4\u5355\u671F\u66F4\u53EF\u9760.\\n- **\u79D1\u6280\u4E92\u8054\u7F51
      (SaaS)**: \u65E9\u671F ICF \u5927\u989D\u4E3A\u8D1F\u662F\u5408\u7406\u7684,
      \u4F46 OCF \u5FC5\u987B\u8F6C\u6B63; \u6301\u7EED OCF \u4E3A\u8D1F + \u9AD8\u80A1\u6743\u878D\u8D44
      = \u70E7\u94B1\u6A21\u5F0F, \u8B66\u60D5.\\n\\n**\u8BC4\u4F30\u6D41\u7A0B**:\\n1.
      \u5148\u770B `positive_ocf` \u662F\u5426\u4E3A `true` \u2014 \u4E00\u7968\u5426\u51B3\u9879,
      \u6301\u7EED\u4E3A\u8D1F\u76F4\u63A5\u964D\u7EA7.\\n2. \u8DE8 tool \u7B97 OCF
      / NI \u6BD4\u7387, < 0.5 \u65F6\u5373\u4F7F ROE \u9AD8\u4E5F\u8981 narrative
      \u4E2D\u6807\\\"\u5229\u6DA6\u542B\u91D1\u91CF\u4F4E\\\".\\n3. \u770B OCF +
      ICF \u662F\u5426\u80FD\u8986\u76D6 FCF_funding (\u7B79\u8D44) \u7F3A\u53E3,
      \u5426\u5219\u5C5E\\\"\u501F\u94B1\u53D1\u5C55\\\" \u2014 \u9002\u5408\u65E9\u671F\u6210\u957F\u4F46\u6210\u719F\u671F\u8B66\u60D5.\\n4.
      \u8DDF\u540C\u884C\u4E1A OCF / NI \u4E2D\u67A2\u5BF9\u6BD4, \u5355\u7EAF\u7EDD\u5BF9\u503C\u65E0\u610F\u4E49.\\n\\n**\u5199\u5165
      narrative \u7684\u6807\u51C6\u53E5\u5F0F**:\\n- \\\"{target_name} OCF / \u51C0\u5229\u6DA6
      = {X} ({\u4E0E\u5229\u6DA6\u9AD8\u5EA6\u5339\u914D/\u6709\u4E00\u5B9A\u80CC\u79BB/\u5229\u6DA6\u7EB8\u9762\u5316}),
      \u7ECF\u8425\u73B0\u91D1\u6D41\u8FDE\u7EED {N} \u671F\u4E3A\u6B63.\\\"\\n- \\\"\u81EA\u7531\u73B0\u91D1\u6D41
      ({OCF + ICF}) {\u80FD/\u4E0D\u80FD}\u8986\u76D6\u7B79\u8D44\u6D3B\u52A8, \u53CD\u6620{\u81EA\u6211\u9020\u8840\u80FD\u529B\u5F3A/\u9700\u4F9D\u8D56\u5916\u90E8\u878D\u8D44}.\\\"\\n\\n\\n##
      \xA7 2.1 \u4F30\u503C\u6C34\u5E73 (Valuation)\\n\\n**\u5173\u952E\u6307\u6807**
      (\u6765\u81EA `get_daily_basic`, `get_pe_history`):\\n- PE_TTM = \u5F53\u524D\u80A1\u4EF7
      / \u6EDA\u52A8 12 \u4E2A\u6708\u6BCF\u80A1\u51C0\u5229\u6DA6 (`GetDailyBasicTool.pe_ttm`).\\n-
      PB = \u5F53\u524D\u80A1\u4EF7 / \u6BCF\u80A1\u51C0\u8D44\u4EA7 (`GetDailyBasicTool.pb`).\\n-
      \u80A1\u606F\u7387 = \u8FD1 12 \u4E2A\u6708\u80A1\u606F / \u5F53\u524D\u80A1\u4EF7
      (`GetDailyBasicTool.dv_ratio`).\\n- PE \u5386\u53F2\u5206\u4F4D (`GetPeHistoryTool.pe_percentile`):
      \u5F53\u524D PE \u5728\u5386\u53F2 N \u5E74\u4E2D\u7684\u5206\u4F4D\u6570 (0..1).\\n-
      \u4F30\u503C\u5E26 (`GetPeHistoryTool.valuation_band`): \u6D3E\u751F Literal,
      \u53D6\u503C `\\\"underpriced\\\" | \\\"neutral\\\" | \\\"overpriced\\\"`, \u6765\u81EA
      PE \u5206\u4F4D\u7684\u79BB\u6563\u5316 (< 30% / 30\u201370% / > 70%).\\n\\n**\u5224\u65AD\u9608\u503C**
      (\u901A\u7528 sanity \u57FA\u51C6):\\n\\n| \u6307\u6807 | \u4F4E\u4F30 | \u5408\u7406
      | \u504F\u8D35 | \u9AD8\u4F30 |\\n|---|---|---|---|---|\\n| PE \u5386\u53F2\u5206\u4F4D
      (5 \u5E74/3 \u5E74) | < 30% | 30\u201350% | 50\u201370% | > 70% |\\n| \u5F53\u524D
      PE vs \u884C\u4E1A\u4E2D\u4F4D | < \u884C\u4E1A\u4E2D\u4F4D | \u884C\u4E1A\u4E2D\u4F4D
      \xB1 20% | \u9AD8 20\u201350% | > \u884C\u4E1A\u4E2D\u4F4D 1.5x |\\n| PB | <
      1 (\u7834\u51C0) | 1\u20133 | 3\u20135 | > 5 |\\n| \u80A1\u606F\u7387 | > 4%
      | 2\u20134% | 1\u20132% | < 1% |\\n\\n**\u884C\u4E1A\u5DEE\u5F02\u63D0\u9192**
      (`industry_benchmarks.json.PE_\u884C\u4E1A\u4E2D\u4F4D`):\\n- **\u767D\u9152**:
      PE \u884C\u4E1A\u4E2D\u4F4D 35.0 (\u9AD8\u54C1\u724C\u6EA2\u4EF7), 16\u201325
      \u7B97\u4F4E\u4F30.\\n- **\u516C\u7528\u4E8B\u4E1A / \u94F6\u884C\u91D1\u878D**:
      PE \u884C\u4E1A\u4E2D\u4F4D 12.0 / 6.0 (\u786E\u5B9A\u6027\u5F3A, \u589E\u901F\u4F4E),
      PE > 15 \u5DF2\u504F\u8D35.\\n- **\u79D1\u6280\u4E92\u8054\u7F51**: PE \u884C\u4E1A\u4E2D\u4F4D
      50.0 (\u6210\u957F\u671F\u4F30\u503C\u9AD8, \u770B PEG \u6BD4 PE \u66F4\u6709\u6548).\\n-
      **\u533B\u836F\u751F\u7269**: PE \u884C\u4E1A\u4E2D\u4F4D 35.0 (\u521B\u65B0\u836F
      vs \u4EFF\u5236\u836F\u5DEE\u8DDD\u5927, \u5FC5\u987B\u770B\u5B50\u8D5B\u9053).\\n-
      **\u623F\u5730\u4EA7**: PE \u884C\u4E1A\u4E2D\u4F4D 8.0 (\u5468\u671F + \u653F\u7B56\u53CC\u91CD\u538B\u5236,
      \u4F4E PE \u4E0D\u7B49\u4E8E\u4F4E\u4F30).\\n\\n\u6CE8\u610F: `recommendation_rules.yaml`
      \u4E2D `recommend_buy` \u89E6\u53D1\u6761\u4EF6\u4E4B\u4E00\u662F \\\"PE \u5386\u53F2\u5206\u4F4D
      < 0.30\\\", \u89E6\u53D1 `recommend_sell` \u4E4B\u4E00\u662F \\\"> 0.90\\\"
      \u2014 \u8FD9\u662F Python \u4FA7\u786C\u89C4\u5219, narrative \u4E0D\u9700\u91CD\u590D\u9608\u503C,
      \u53EA\u9700\u5F15\u7528 `valuation_band`.\\n\\n**\u8BC4\u4F30\u6D41\u7A0B**:\\n1.
      \u5148\u770B PE \u5386\u53F2\u5206\u4F4D (`pe_percentile`) \u2014 \u540C\u4E00\u53EA\u80A1\u7968\u7EB5\u5411\u6BD4,
      \u6392\u9664\\\"\u884C\u4E1A\u6574\u4F53\u8D35 / \u4FBF\u5B9C\\\"\u7684\u6270\u52A8.\\n2.
      \u518D\u8C03 `lookup_industry_benchmark(industry, \\\"PE_\u884C\u4E1A\u4E2D\u4F4D\\\")`
      \u62FF\u884C\u4E1A\u4E2D\u4F4D, \u6A2A\u5411\u6BD4\u8F83.\\n3. \u770B PB + \u80A1\u606F\u7387\u4F5C\u4E3A\u8F85\u52A9
      \u2014 \u5468\u671F\u80A1 (\u94F6\u884C / \u623F\u5730\u4EA7) \u770B PB \u6BD4
      PE \u66F4\u7A33\u5B9A, \u516C\u7528\u4E8B\u4E1A\u770B\u80A1\u606F\u7387.\\n4.
      \u522B\u7528\u5355\u4E00\u4F30\u503C\u6307\u6807\u4E0B\u5224\u65AD \u2014 PE
      \u5206\u4F4D < 30% \u4F46\u884C\u4E1A\u6574\u4F53\u666F\u6C14\u4E0B\u884C\u65F6,
      \\\"\u4F4E\u4F30\\\"\u4E5F\u53EF\u80FD\u7EE7\u7EED\u6740.\\n\\n**\u5199\u5165
      narrative \u7684\u6807\u51C6\u53E5\u5F0F**:\\n- \\\"{target_name} \u5F53\u524D
      PE_TTM = {X}, \u5904\u4E8E\u8FD1 5 \u5E74 {Y}% \u5206\u4F4D ({underpriced/neutral/overpriced}).\\\"\\n-
      \\\"\u5BF9\u6807\u884C\u4E1A\u4E2D\u4F4D {Z} (\u6765\u81EA industry_benchmarks.json),
      {\u9AD8\u4E8E/\u4F4E\u4E8E/\u63A5\u8FD1}\u884C\u4E1A {N}%.\\\"\\n\\n\\n## \xA7
      2.2 \u884C\u4E1A\u666F\u6C14 (Industry)\\n\\n**\u5173\u952E\u6307\u6807** (\u6765\u81EA
      `web_search` Bocha):\\n- \u884C\u4E1A\u653F\u7B56\u5468\u671F: \u9F13\u52B1
      / \u4E2D\u6027 / \u538B\u5236 (\u67E5\u8FD1 6 \u4E2A\u6708\u4E00\u884C\u4E1A\u653F\u7B56\u6587\u4EF6
      / \u90E8\u59D4\u8868\u6001).\\n- \u7533\u4E07\u884C\u4E1A\u6DA8\u8DCC\u5E45\u5206\u4F4D:
      \u884C\u4E1A\u6307\u6570\u8FD1 30 \u65E5 / \u8FD1 1 \u5E74\u6DA8\u8DCC\u5E45\u76F8\u5BF9\u5168\u5E02\u573A\u5206\u4F4D.\\n-
      \u4E0A\u4E0B\u6E38\u666F\u6C14: \u4E0A\u6E38\u539F\u6750\u6599\u4EF7\u683C +
      \u4E0B\u6E38\u9700\u6C42\u8D8B\u52BF (white-paper / \u884C\u4E1A\u534F\u4F1A\u6570\u636E).\\n-
      \u9F99\u5934\u516C\u53F8\u8868\u6001: \u5934\u90E8 1\u20132 \u5BB6\u516C\u53F8\u4E1A\u7EE9\u4F1A
      / \u516C\u544A\u4E2D\u7684\u9700\u6C42 / \u4EF7\u683C / \u5E93\u5B58\u8BED\u8A00.\\n\\n**\u5224\u65AD\u9608\u503C**
      (\u5B9A\u6027, \u7EFC\u5408 web_search \u8F93\u51FA + \u6587\u672C sentiment):\\n\\n|
      \u7EF4\u5EA6 | \u666F\u6C14\u5411\u4E0A | \u4E2D\u6027 | \u666F\u6C14\u5411\u4E0B
      |\\n|---|---|---|---|\\n| \u653F\u7B56\u65B9\u5411 | \u56FD\u5BB6\u7EA7\u9F13\u52B1
      (\u53CC\u78B3 / \u4FE1\u521B / \u521B\u65B0\u836F etc) | \u7EF4\u6301\u73B0\u72B6
      | \u9650\u4EF7 / \u53CD\u5784\u65AD / \u9650\u8D2D |\\n| \u6DA8\u8DCC\u5E45\u5206\u4F4D
      | > 70% (\u5E02\u573A\u62A2\u7B79) | 30\u201370% | < 30% (\u6301\u7EED\u6740\u8DCC)
      |\\n| \u4E0A\u6E38\u4EF7\u683C | \u5E73\u7A33 / \u6210\u672C\u538B\u529B\u5C0F
      | \u5C0F\u5E45\u6CE2\u52A8 | \u5927\u5E45\u4E0A\u6DA8 (\u538B\u7F29\u6BDB\u5229)
      |\\n| \u9F99\u5934\u8868\u6001 | \\\"\u4F9B\u4E0D\u5E94\u6C42\\\" / \\\"\u63D0\u4EF7\\\"
      | \\\"\u7A33\u5B9A\\\" | \\\"\u53BB\u5E93\u5B58\\\" / \\\"\u9700\u6C42\u75B2\u8F6F\\\"
      |\\n\\n**\u884C\u4E1A\u5DEE\u5F02\u63D0\u9192** (\u666F\u6C14\u8BC4\u4F30\u65B9\u6CD5\u4E0D\u540C):\\n-
      **\u767D\u9152**: \u770B\u7EC8\u7AEF\u52A8\u9500 (\u4E2D\u9AD8\u7AEF vs \u5927\u4F17)
      + \u6625\u8282 / \u4E2D\u79CB\u5F00\u74F6\u7387 \u2014 \u91CF\u6BD4\u4EF7\u66F4\u654F\u611F.\\n-
      **\u516C\u7528\u4E8B\u4E1A**: \u770B\u653F\u7B56 (\u7535\u4EF7 / \u6C34\u4EF7\u6539\u9769)
      + \u7528\u7535\u91CF \u2014 \u5468\u671F\u6027\u6781\u5F31, \u5B63\u5EA6\u53D8\u5316\u5C0F.\\n-
      **\u79D1\u6280\u4E92\u8054\u7F51**: \u770B\u76D1\u7BA1 (\u53CD\u5784\u65AD /
      \u6570\u636E\u5B89\u5168) + AI / \u4E91\u8BA1\u7B97\u6280\u672F\u5468\u671F.\\n-
      **\u94F6\u884C\u91D1\u878D**: \u770B\u8D27\u5E01\u653F\u7B56 + \u4E0D\u826F\u7387
      + \u51C0\u606F\u5DEE (NIM) \u2014 \u8DDF\u5B8F\u89C2\u8D27\u5E01\u9AD8\u5EA6\u76F8\u5173.\\n-
      **\u623F\u5730\u4EA7**: \u770B\u9500\u552E\u9762\u79EF yoy + 70 \u57CE\u623F\u4EF7
      + \u62FF\u5730\u5F3A\u5EA6 \u2014 \u5468\u671F + \u653F\u7B56\u53CC\u91CD\u652F\u914D.\\n-
      **\u533B\u836F\u751F\u7269**: \u770B\u533B\u4FDD\u8C08\u5224 / \u96C6\u91C7\u8F6E\u6B21
      + \u521B\u65B0\u836F\u5BA1\u6279\u8282\u594F \u2014 \u653F\u7B56\u8FB9\u9645\u53D8\u5316\u4E3B\u5BFC.\\n\\n**\u8BC4\u4F30\u6D41\u7A0B**:\\n1.
      \u5148\u7528 `web_search(query=\\\"{\u884C\u4E1A} \u653F\u7B56 \u8FD1 6 \u4E2A\u6708\\\")`
      \u62FF\u653F\u7B56\u6001\u5EA6 (\u538B\u5236 / \u4E2D\u6027 / \u9F13\u52B1).\\n2.
      \u518D `web_search(query=\\\"{\u884C\u4E1A} \u7533\u4E07\u6307\u6570 \u6DA8\u8DCC\u5E45\\\")`
      \u62FF\u5E02\u573A\u8868\u6001.\\n3. \u6700\u540E `web_search(query=\\\"{\u9F99\u5934\u516C\u53F8}
      \u4E1A\u7EE9\u4F1A \u9700\u6C42 \u4EF7\u683C\\\")` \u62FF\u9F99\u5934\u89C6\u89D2\u7684\u5FAE\u89C2\u4FE1\u53F7.\\n4.
      \u7EFC\u5408\u7ED9\u884C\u4E1A\u666F\u6C14\u5B9A\u6027: \u5F3A / \u4E2D\u6027
      / \u5F31 \u2014 \u7528\u4E8E evidence \u4E2D\u6807\u6CE8 `industry_signal`,
      \u5582\u7ED9\u8BC4\u7EA7 DSL \u7684 fallback \u5224\u65AD.\\n\\n**\u5199\u5165
      narrative \u7684\u6807\u51C6\u53E5\u5F0F**:\\n- \\\"{\u884C\u4E1A} \u5F53\u524D\u5904\u4E8E{\u666F\u6C14\u5411\u4E0A/\u4E2D\u6027/\u666F\u6C14\u5411\u4E0B}\u9636\u6BB5,
      \u4E3B\u8981\u9A71\u52A8: [\u653F\u7B56/\u9700\u6C42/\u7ADE\u4E89\u683C\u5C40\u63CF\u8FF0].\\\"\\n-
      \\\"\u8FD1 6 \u4E2A\u6708\u653F\u7B56\u7AEF {\u9F13\u52B1/\u4E2D\u6027/\u538B\u5236},
      \u9F99\u5934\u516C\u53F8 {\u63D0\u4EF7/\u7A33\u5B9A/\u53BB\u5E93\u5B58}, \u5171\u540C\u6307\u5411
      {\u65B9\u5411}.\\\"\\n\\n\\n## \xA7 3.1 \u80A1\u4E1C\u7ED3\u6784\u4E0E\u6CBB\u7406
      (Shareholder & Governance)\\n\\n**\u5173\u952E\u6307\u6807** (\u6765\u81EA `get_holder_change`):\\n-
      \u80A1\u4E1C\u6237\u6570 yoy (`GetHolderChangeTool.holder_change_trend`): Literal
      `\\\"concentrating\\\"` (\u6237\u6570\u51CF\u5C11 = \u7B79\u7801\u96C6\u4E2D)
      / `\\\"dispersing\\\"` (\u6237\u6570\u589E\u52A0 = \u6563\u6237\u5316) / `\\\"stable\\\"`.\\n-
      \u524D\u5341\u5927\u80A1\u4E1C\u6301\u80A1\u6BD4\u4F8B\u96C6\u4E2D\u5EA6 = `top_10_holder_pct`
      (\u673A\u6784\u6301\u4ED3\u96C6\u4E2D\u5EA6).\\n- \u6237\u5747\u6301\u80A1\u6570
      = \u6D41\u901A\u80A1\u672C / \u80A1\u4E1C\u6237\u6570 (\u673A\u6784\u8FDB\u5165\u4FE1\u53F7).\\n-
      \u5927\u80A1\u4E1C\u51CF\u6301 / \u589E\u6301\u516C\u544A: \u8DDF\u76D1\u7BA1\u65F6\u95F4\u7A97\u53E3\u5BF9\u7167.\\n\\n**\u5224\u65AD\u9608\u503C**
      (\u901A\u7528\u57FA\u51C6):\\n\\n| \u6307\u6807 | \u5065\u5EB7 | \u4E00\u822C
      | \u8B66\u6212 | \u9AD8\u98CE\u9669 |\\n|---|---|---|---|---|\\n| \u6237\u6570
      yoy | < -10% (\u96C6\u4E2D) | -10%\u201310% (\u7A33\u5B9A) | 10\u201330% (\u6563\u6237\u5316)
      | > 30% (\u7B79\u7801\u6DA3\u6563) |\\n| \u524D\u5341\u5927\u96C6\u4E2D\u5EA6
      | > 50% (\u673A\u6784 / \u56FD\u8D44\u7262) | 30\u201350% | 15\u201330% | <
      15% (\u9AD8\u5EA6\u6563\u6237\u5316) |\\n| \u5927\u80A1\u4E1C\u884C\u4E3A |
      \u589E\u6301 / \u56DE\u8D2D | \u65E0\u53D8\u52A8 | \u5C0F\u5E45\u51CF\u6301
      | \u5927\u989D\u51CF\u6301 / \u6E05\u4ED3\u5F0F |\\n| \u8D28\u62BC\u6BD4\u4F8B
      | < 30% | 30\u201360% | 60\u201380% | > 80% (\u7206\u4ED3\u98CE\u9669) |\\n\\n\u6CE8:
      `recommendation_rules.yaml` \u4E2D `recommend_sell` \u89E6\u53D1\u5305\u542B
      `pledge_ratio > 0.60`, narrative \u4E0D\u9700\u91CD\u590D\u9608\u503C.\\n\\n**\u884C\u4E1A\u5DEE\u5F02\u63D0\u9192**:\\n-
      **\u767D\u9152 / \u516C\u7528\u4E8B\u4E1A**: \u56FD\u8D44\u80A1\u4E1C\u96C6\u4E2D\u5EA6\u901A\u5E38
      > 50% (\u4E94\u7CAE\u6DB2 / \u957F\u6C5F\u7535\u529B etc), \u6237\u6570\u53D8\u52A8\u5C0F,
      \u770B\u5927\u80A1\u4E1C\u52A8\u4F5C\u5373\u53EF.\\n- **\u79D1\u6280\u4E92\u8054\u7F51
      / \u521B\u4E1A\u677F**: \u521B\u59CB\u56E2\u961F\u6301\u80A1 + \u98CE\u6295\u9000\u51FA\u8282\u594F\u5173\u952E,
      \u5173\u6CE8\u9650\u552E\u89E3\u7981\u65E5\u671F.\\n- **\u623F\u5730\u4EA7**:
      \u5B9E\u63A7\u4EBA\u8D28\u62BC\u6BD4\u4F8B\u666E\u904D\u504F\u9AD8 (> 50%),
      \u653F\u7B56\u677E\u7D27\u671F\u8D28\u62BC\u7206\u96F7\u98CE\u9669\u5927.\\n-
      **\u94F6\u884C\u91D1\u878D**: \u901A\u5E38\u80A1\u6743\u7A33\u5B9A, \u5173\u6CE8\u5B9A\u589E
      / \u914D\u80A1\u7A00\u91CA.\\n\\n**\u8BC4\u4F30\u6D41\u7A0B**:\\n1. \u5148\u770B\u6237\u6570\u8D8B\u52BF
      (`holder_change_trend`) \u2014 concentrating \u662F\u673A\u6784\u8FDB\u5165\u4FE1\u53F7,
      dispersing \u662F\u6563\u6237\u63A5\u76D8\u4FE1\u53F7.\\n2. \u518D\u770B\u524D\u5341\u5927\u96C6\u4E2D\u5EA6\u53D8\u5316,
      \u8DDF\u6237\u6570\u8D8B\u52BF\u4E00\u81F4\u624D\u80FD\u786E\u8BA4\u673A\u6784\u52A8\u4F5C.\\n3.
      \u770B\u5927\u80A1\u4E1C / \u9AD8\u7BA1\u589E\u51CF\u6301\u516C\u544A + \u8D28\u62BC\u6BD4\u4F8B,
      \u4EFB\u610F\u4E00\u9879\u8D85\u9608\u503C\u90FD\u662F\u964D\u7EA7\u4FE1\u53F7.\\n4.
      \u8DDF\u80A1\u4EF7\u8D70\u52BF\u5BF9\u7167 \u2014 \u6237\u6570\u96C6\u4E2D +
      \u80A1\u4EF7\u4E0B\u8DCC = \u673A\u6784\u5728\u4F4E\u4F4D\u6536\u7B79\u7801
      (\u5229\u597D); \u6237\u6570\u96C6\u4E2D + \u80A1\u4EF7\u4E0A\u6DA8 = \u673A\u6784
      hold \u7B79\u7801 + \u6563\u6237\u88AB\u7529\u5F00 (\u5229\u597D); \u6237\u6570\u5206\u6563
      + \u80A1\u4EF7\u4E0A\u6DA8 = \u6563\u6237\u63A5\u76D8 (\u8B66\u60D5).\\n\\n**\u5199\u5165
      narrative \u7684\u6807\u51C6\u53E5\u5F0F**:\\n- \\\"{target_name} \u80A1\u4E1C\u6237\u6570\u8FD1
      {N} \u671F {\u4E0B\u964D/\u4E0A\u5347} {X}% ({\u7B79\u7801\u96C6\u4E2D/\u6563\u6237\u5316}),
      \u524D\u5341\u5927\u96C6\u4E2D\u5EA6 {Y}%.\\\"\\n- \\\"\u5927\u80A1\u4E1C {\u589E\u6301/\u51CF\u6301/\u65E0\u53D8\u52A8},
      \u8D28\u62BC\u6BD4\u4F8B {Z}% \u2014 {\u6CBB\u7406\u98CE\u9669\u4F4E/\u9700\u8B66\u60D5}.\\\"\\n\\n\\n##
      \xA7 3.2 \u77ED\u671F\u8D44\u91D1\u6D41 (Short-term Capital Flow)\\n\\n**\u5173\u952E\u6307\u6807**
      (\u6765\u81EA `get_money_flow`):\\n- \u4E3B\u529B\u51C0\u6D41\u5165 (\u5927\u5355
      + \u7279\u5927\u5355) = `buy_lg_amount + buy_elg_amount - sell_lg_amount - sell_elg_amount`.\\n-
      `dominant_flow_signal`: \u6D3E\u751F Literal `\\\"net_inflow\\\"` / `\\\"net_outflow\\\"`
      / `\\\"balanced\\\"` (\u6765\u81EA `GetMoneyFlowTool` \u5355 tool \u5904\u7406).\\n-
      \u5317\u5411\u8D44\u91D1\u51C0\u6D41\u5165 (\u6CAA\u6DF1\u80A1\u901A\u6301\u80A1\u53D8\u52A8,
      \u673A\u6784 proxy).\\n- \u9F99\u864E\u699C\u4E0A\u699C\u9891\u6B21 (\u8FD1
      30 \u65E5).\\n- \u878D\u8D44\u878D\u5238\u4F59\u989D yoy (\u6760\u6746\u8D44\u91D1\u53C2\u4E0E\u5EA6).\\n\\n**\u5224\u65AD\u9608\u503C**
      (\u77ED\u671F\u4FE1\u53F7, \u770B 5\u201320 \u65E5\u7A97\u53E3):\\n\\n| \u6307\u6807
      | \u5F3A\u4E70\u5165 | \u4E2D\u6027\u504F\u591A | \u4E2D\u6027\u504F\u7A7A |
      \u5F3A\u5356\u51FA |\\n|---|---|---|---|---|\\n| \u4E3B\u529B\u51C0\u6D41\u5165
      (\u8FD1 5 \u65E5\u7D2F\u8BA1) | > 5% \u6D41\u901A\u5E02\u503C | 0\u20135% |
      0\u2013-5% | < -5% |\\n| dominant_flow_signal | net_inflow | balanced | balanced
      | net_outflow |\\n| \u5317\u5411\u6301\u80A1\u53D8\u52A8 | > +0.5% \u6D41\u901A\u80A1
      | -0.1%\u2013+0.5% | -0.5%\u2013-0.1% | < -0.5% |\\n| \u878D\u8D44\u4F59\u989D
      yoy | > +20% (\u60C5\u7EEA\u9AD8) | 0\u201320% | -20%\u20130 | < -20% (\u6760\u6746\u64A4\u9000)
      |\\n\\n**\u884C\u4E1A\u5DEE\u5F02\u63D0\u9192**:\\n- **\u767D\u9152 / \u516C\u7528\u4E8B\u4E1A**:
      \u8D44\u91D1\u6D41\u4E0D\u662F\u6838\u5FC3\u9A71\u52A8, \u4E3B\u8981\u770B\u957F\u671F
      ROE / \u80A1\u606F. \u77ED\u671F\u51C0\u6D41\u51FA\u4E0D\u7B49\u4E8E\u5356\u51FA\u4FE1\u53F7.\\n-
      **\u79D1\u6280\u4E92\u8054\u7F51 / \u521B\u4E1A\u677F**: \u4E3B\u529B\u8D44\u91D1
      + \u5317\u5411\u8D44\u91D1\u5171\u632F\u65F6\u5F80\u5F80\u662F\u9636\u6BB5\u9876
      / \u5E95\u4FE1\u53F7 \u2014 \u77ED\u671F\u9AD8\u9891\u4FE1\u53F7\u6709\u6548.\\n-
      **\u94F6\u884C\u91D1\u878D**: \u6D41\u52A8\u6027\u76D8\u5B50\u5927, \u5355\u65E5
      / \u5355\u5468\u8D44\u91D1\u6D41\u96BE\u4EE5\u9A71\u52A8\u80A1\u4EF7 \u2014
      \u770B\u6708\u5EA6\u66F4\u6709\u6548.\\n- **\u6B21\u65B0\u80A1 / \u9898\u6750\u80A1**:
      \u9F99\u864E\u699C\u9891\u6B21 + \u878D\u8D44\u4F59\u989D yoy \u662F\u6838\u5FC3\u4FE1\u53F7,
      \u4E3B\u529B\u8D44\u91D1\u80FD\u77ED\u671F\u4E3B\u5BFC.\\n\\n**\u8BC4\u4F30\u6D41\u7A0B**:\\n1.
      \u5148\u770B `dominant_flow_signal` \u4E00\u7968\u8868\u51B3 \u2014 net_inflow
      / net_outflow \u7ED9\u77ED\u671F\u65B9\u5411.\\n2. \u518D\u770B\u5317\u5411\u6301\u80A1\u53D8\u52A8,
      \u8DDF\u4E3B\u529B\u51C0\u6D41\u5165\u662F\u5426\u540C\u5411, \u5171\u632F =
      \u5F3A\u4FE1\u53F7.\\n3. \u770B\u9F99\u864E\u699C + \u878D\u8D44\u4F59\u989D,
      \u9F99\u864E\u699C\u4E0A\u699C + \u878D\u8D44\u4F59\u989D\u66B4\u589E\u901A\u5E38\u662F\u9898\u6750\u80A1\u9636\u6BB5\u9876\u90E8\u4FE1\u53F7.\\n4.
      \u6CE8\u610F: \u77ED\u671F\u8D44\u91D1\u6D41\u662F\u8F85\u52A9\u4FE1\u53F7,
      **\u4E0D\u80FD\u53CD\u8F6C\u57FA\u672C\u9762\u5224\u65AD** \u2014 \u957F\u671F\u6295\u8D44
      weight \u6700\u591A 10%, \u77ED\u671F\u4EA4\u6613\u53EF\u653E\u5927.\\n\\n**\u5199\u5165
      narrative \u7684\u6807\u51C6\u53E5\u5F0F**:\\n- \\\"{target_name} \u8FD1 5 \u65E5\u4E3B\u529B{\u51C0\u6D41\u5165/\u51C0\u6D41\u51FA}
      {X} \u4EBF (`dominant_flow_signal = {signal}`), \u5317\u5411\u8D44\u91D1{\u589E\u6301/\u51CF\u6301/\u4E2D\u6027}.\\\"\\n-
      \\\"\u77ED\u671F\u8D44\u91D1\u9762{\u504F\u591A/\u4E2D\u6027/\u504F\u7A7A},
      \u8DDF\u57FA\u672C\u9762\u4FE1\u53F7 {\u4E00\u81F4/\u80CC\u79BB} \u2014 {\u5F3A\u5316/\u4E0D\u5F71\u54CD}\u5EFA\u8BAE.\\\"\\n\\n\\n##
      \xA7 3.3 \u4E8B\u4EF6\u9A71\u52A8 (Event-driven)\\n\\n**\u5173\u952E\u6307\u6807**
      (\u6765\u81EA `get_forecast`, `get_dividend_history`):\\n- \u4E1A\u7EE9\u9884\u544A
      (`GetForecastTool.forecast_signal`): `\\\"positive\\\"` (\u9884\u589E / \u626D\u4E8F
      / \u7565\u589E) / `\\\"negative\\\"` (\u9884\u51CF / \u4E8F\u635F / \u7565\u51CF)
      / `\\\"neutral\\\"`.\\n- \u4E1A\u7EE9\u9884\u544A\u7A97\u53E3\u671F (\u5E74\u62A5
      1 \u6708\u5E95 / \u534A\u5E74\u62A5 7 \u6708\u4E2D / \u4E09\u5B63\u62A5 10 \u6708\u4E2D).\\n-
      \u73B0\u91D1\u5206\u7EA2 (`GetDividendHistoryTool`): \u6D3E\u751F `dividend_consistency_score`
      (\u8FD1 5 \u5E74\u8FDE\u7EED\u5206\u7EA2\u6B21\u6570 / 5).\\n- \u80A1\u606F\u7387\u8FD1
      5 \u5E74\u8D8B\u52BF (\u4E0A\u5347 / \u7A33\u5B9A / \u4E0B\u964D).\\n- \u80A1\u7968\u56DE\u8D2D\u516C\u544A:
      \u91D1\u989D / \u5360\u603B\u5E02\u503C\u6BD4\u4F8B / \u662F\u5426\u6CE8\u9500.\\n-
      \u89E3\u7981\u516C\u544A: \u89E3\u7981\u65E5\u671F / \u89E3\u7981\u89C4\u6A21
      / \u89E3\u7981\u80A1\u4E1C\u7C7B\u578B (\u5927\u80A1\u4E1C / \u6218\u6295 /
      \u9AD8\u7BA1).\\n- \u91CD\u7EC4 / \u6536\u8D2D\u516C\u544A: \u662F\u5426\u6784\u6210\u91CD\u5927\u8D44\u4EA7\u91CD\u7EC4
      + \u6807\u7684\u8D44\u4EA7\u8D28\u91CF.\\n\\n**\u5224\u65AD\u9608\u503C** (\u901A\u7528\u57FA\u51C6):\\n\\n|
      \u4E8B\u4EF6 | \u5F3A\u5229\u597D | \u5229\u597D | \u4E2D\u6027 | \u5229\u7A7A
      | \u5F3A\u5229\u7A7A |\\n|---|---|---|---|---|---|\\n| \u4E1A\u7EE9\u9884\u544A
      | \u626D\u4E8F / \u9884\u589E > 50% | \u7565\u589E 0\u201350% | \u6301\u5E73
      | \u7565\u51CF 0\u2013-30% | \u9884\u51CF < -30% / \u4E8F\u635F |\\n| \u5206\u7EA2
      | \u8FDE\u7EED 5 \u5E74 + \u80A1\u606F\u7387 > 4% | \u8FDE\u7EED 3 \u5E74 +
      > 2% | \u5076\u5C14\u5206\u7EA2 | \u4E0D\u5206\u7EA2 | \u53D6\u6D88\u5206\u7EA2
      |\\n| \u56DE\u8D2D | \u6CE8\u9500\u5F0F (\u51CF\u5C11\u80A1\u672C) | \u589E\u6301\u5F0F
      + \u5DF2\u5B9E\u65BD | \u516C\u544A\u4F46\u672A\u5B9E\u65BD | \u7F29\u51CF\u56DE\u8D2D
      | \u2014 |\\n| \u89E3\u7981 | \u6218\u6295\u957F\u671F\u6301\u6709 | \u4E2D\u5C0F\u89C4\u6A21
      < 5% | 5\u201310% \u6D41\u901A\u80A1 | > 10% \u6D41\u901A\u80A1 | > 30% + \u5927\u80A1\u4E1C\u89E3\u7981
      |\\n\\n\u6CE8: `recommendation_rules.yaml` \u4E2D:\\n- `recommend_overweight`
      \u89E6\u53D1: `forecast_signal == \\\"positive\\\"`.\\n- `recommend_sell` \u89E6\u53D1:
      `forecast_signal == \\\"negative\\\"`.\\nnarrative \u4E0D\u9700\u91CD\u590D\u9608\u503C,
      \u53EA\u9700\u5F15\u7528\u8BED\u4E49\u6807\u7B7E.\\n\\n**\u884C\u4E1A\u5DEE\u5F02\u63D0\u9192**:\\n-
      **\u767D\u9152 / \u516C\u7528\u4E8B\u4E1A**: \u9AD8\u5206\u7EA2\u884C\u4E1A,
      `dividend_consistency_score` \u63A5\u8FD1 1 \u662F\u57FA\u7EBF (\u4E94\u7CAE\u6DB2
      / \u957F\u6C5F\u7535\u529B etc).\\n- **\u79D1\u6280\u4E92\u8054\u7F51 / \u521B\u4E1A\u677F**:
      \u901A\u5E38\u4E0D\u5206\u7EA2, \u770B\u56DE\u8D2D + \u589E\u6301; \u6709\u9650\u552E\u89E3\u7981\u538B\u529B.\\n-
      **\u623F\u5730\u4EA7**: \u91CD\u7EC4 / \u914D\u80A1\u4E8B\u4EF6\u9AD8\u9891,
      \u770B\u662F\u5426\u7EBE\u56F0 (\u501F\u65B0\u8FD8\u65E7 vs \u6218\u6295\u5165\u4E3B).\\n-
      **\u533B\u836F\u751F\u7269**: \u521B\u65B0\u836F BD \u516C\u544A + \u4E34\u5E8A\u6570\u636E\u516C\u544A\u662F\u4E3B\u8981\u50AC\u5316,
      \u8DDF\u4E1A\u7EE9\u9884\u544A\u72EC\u7ACB.\\n\\n**\u8BC4\u4F30\u6D41\u7A0B**:\\n1.
      \u5148\u770B\u4E1A\u7EE9\u9884\u544A\u7A97\u53E3\u662F\u5426\u5C06\u81F3, \u4E34\u8FD1\u9884\u544A\u671F
      (1 \u6708 / 7 \u6708 / 10 \u6708) \u98CE\u9669\u66F4\u5927 \u2014 \u8DDF\u9884\u671F\u5DEE\u6355\u6349.\\n2.
      \u8C03 `get_forecast` \u770B\u9884\u544A\u8BED\u8A00, \u843D\u5230 `forecast_signal`
      \u4E09\u6863.\\n3. \u8C03 `get_dividend_history` \u770B 5 \u5E74\u8FDE\u7EED\u6027
      + \u80A1\u606F\u7387\u8D70\u5411, \u6D3E\u751F `dividend_consistency_score`.\\n4.
      \u68C0\u67E5\u8FD1 90 \u65E5\u89E3\u7981 / \u56DE\u8D2D / \u91CD\u7EC4\u516C\u544A
      \u2014 \u5F3A\u5229\u597D / \u5F3A\u5229\u7A7A\u53EF\u5355\u72EC\u89E6\u53D1\u8BC4\u7EA7\u8DF3\u6863.\\n5.
      \u8DDF\u57FA\u672C\u9762\u4FE1\u53F7\u6C47\u603B, \u7528 evidence \u4E2D\u6807\u8BB0
      `event_signals` \u5582\u7ED9 Writer.\\n\\n**\u5199\u5165 narrative \u7684\u6807\u51C6\u53E5\u5F0F**:\\n-
      \\\"{target_name} \u6700\u65B0\u4E1A\u7EE9\u9884\u544A {positive/neutral/negative},
      \u8FD1 5 \u5E74\u5206\u7EA2\u4E00\u81F4\u6027 {score}/1.0.\\\"\\n- \\\"\u8FD1
      90 \u65E5 {\u6709/\u65E0} \u89E3\u7981\u538B\u529B ({\u65E5\u671F} \u89E3\u7981
      {X}% \u6D41\u901A\u80A1), {\u6709/\u65E0}\u56DE\u8D2D\u516C\u544A.\\\"\\n\\n\\n##
      \xA7 3.4 \u98CE\u9669\u56E0\u5B50 (Risk Factors)\\n\\n**\u5173\u952E\u6307\u6807**
      (\u7EFC\u5408\u591A tool):\\n- \u5927\u80A1\u4E1C\u51CF\u6301\u516C\u544A (\u6765\u81EA
      `get_holder_change`).\\n- \u80A1\u6743\u8D28\u62BC\u6BD4\u4F8B (`pledge_ratio`,
      \u6765\u81EA `get_holder_change` \u6D3E\u751F).\\n- \u884C\u4E1A\u653F\u7B56\u7EA2\u7EBF
      (\u6765\u81EA `web_search`, e.g. \u53CD\u5784\u65AD / \u96C6\u91C7 / \u9650\u8D2D).\\n-
      \u8D22\u52A1\u5F02\u5E38\u9879 (\u5546\u8A89 / \u5E94\u6536\u8D26\u6B3E / \u5B58\u8D27
      \u7A81\u589E, \u6765\u81EA `get_balance_sheet`, `get_financials`).\\n- \u8D44\u4EA7\u8D1F\u503A\u8868\u8B66\u6212
      (`asset_liability_warning`: bool, \u6D3E\u751F = \u8D44\u4EA7\u8D1F\u503A\u7387
      > \u884C\u4E1A\u8B66\u6212\u7EBF).\\n- \u4E1A\u7EE9\u8D1F\u9884\u544A (`forecast_signal
      == \\\"negative\\\"`).\\n- \u76D1\u7BA1\u5904\u7F5A / \u8BC9\u8BBC / \u7ACB\u6848\u8C03\u67E5\u516C\u544A
      (\u6765\u81EA `web_search`, `get_news`).\\n\\n**\u5224\u65AD\u9608\u503C** (\u4E00\u7968\u5426\u51B3\u7C7B\u7EA2\u7EBF):\\n\\n|
      \u98CE\u9669 | \u7EA2\u7EBF\u89E6\u53D1 | \u5F71\u54CD |\\n|---|---|---|\\n|
      \u4E1A\u7EE9\u8D1F\u9884\u544A | `forecast_signal == \\\"negative\\\"` | \u76F4\u63A5
      \u2192 recommend_sell (\u786C\u89C4\u5219) |\\n| \u8D28\u62BC\u6BD4\u4F8B\u8FC7\u9AD8
      | `pledge_ratio > 0.60` | \u76F4\u63A5 \u2192 recommend_sell |\\n| \u8D44\u4EA7\u8D1F\u503A\u8868\u8B66\u6212
      | `asset_liability_warning == True` | \u76F4\u63A5 \u2192 recommend_sell |\\n|
      PE \u5386\u53F2\u5206\u4F4D\u6781\u7AEF | `pe_percentile > 0.90` | \u76F4\u63A5
      \u2192 recommend_sell |\\n| \u7ACB\u6848\u8C03\u67E5 / \u9000\u5E02\u98CE\u9669\u8B66\u793A
      | \u76D1\u7BA1\u516C\u544A | \u9000\u51FA\u7814\u7A76, \u4E0D\u7ED9\u63A8\u8350
      |\\n| \u5927\u989D\u5546\u8A89\u51CF\u503C | \u5355\u671F\u51CF\u503C > \u51C0\u8D44\u4EA7
      20% | \u8BC4\u7EA7\u964D 1\u20132 \u6863 |\\n\\n\u6CE8: \u4E0A 4 \u6761\u7EA2\u7EBF\u662F
      `recommendation_rules.yaml` \u4E2D `recommend_sell` \u7684 `any_of` \u89E6\u53D1\u6761\u4EF6,
      narrative \u4E0D\u9700\u91CD\u590D\u9608\u503C, \u53EA\u9700\u5982\u5B9E\u6807\u6CE8\u4E8B\u4EF6.\\n\\n**\u884C\u4E1A\u5DEE\u5F02\u63D0\u9192**:\\n-
      **\u94F6\u884C\u91D1\u878D**: \u4E0D\u826F\u7387 + \u8D44\u672C\u5145\u8DB3\u7387
      (CAR) + \u62E8\u5907\u8986\u76D6\u7387 \u662F\u884C\u4E1A\u4E13\u7528\u98CE\u9669\u6307\u6807,
      \u4E0A\u8FF0\u901A\u7528\u6846\u67B6\u8865\u5145\u7528.\\n- **\u623F\u5730\u4EA7**:
      \u4E09\u9053\u7EA2\u7EBF (\u5254\u9664\u9884\u6536\u6B3E\u8D44\u4EA7\u8D1F\u503A\u7387
      > 70% / \u51C0\u8D1F\u503A\u7387 > 100% / \u73B0\u91D1\u77ED\u503A\u6BD4 < 1)
