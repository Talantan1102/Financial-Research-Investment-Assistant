      \u770B\u591A\u8BBA\u636E(Bull)\\n- \u54C1\u724C\u62A4\u57CE\u6CB3\u6781\u6DF1\uFF0C\u9AD8\u7AEF\u767D\u9152\u9F99\u5934\u5730\u4F4D\u7A33\u56FA\uFF0C\u5B9A\u4EF7\u6743\u5F3A\uFF0C\u6BDB\u5229\u738790%\u4EE5\u4E0A\u6301\u7EED\u7A33\u5B9A\\n-
