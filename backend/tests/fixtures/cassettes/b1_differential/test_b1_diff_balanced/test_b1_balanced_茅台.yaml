      \xA7 1.1 \u507F\u503A\u80FD\u529B (Solvency)\\n\\n**\u5173\u952E\u6307\u6807**
      (\u6765\u81EA `get_balance_sheet`, `get_cashflow`):\\n- \u8D44\u4EA7\u8D1F\u503A\u7387
      = `total_liab / total_assets` (\u6765\u81EA `GetBalanceSheetTool`, \u6D3E\u751F\u5B57\u6BB5
      `asset_liability_ratio`).\\n- \u6D41\u52A8\u6BD4\u7387 = `total_cur_assets /
      total_cur_liab` (\u77ED\u671F\u507F\u503A\u80FD\u529B).\\n- \u901F\u52A8\u6BD4\u7387
      = `(total_cur_assets - inventories) / total_cur_liab` (\u5254\u9664\u5B58\u8D27\u540E\u77ED\u671F\u507F\u503A\u80FD\u529B).\\n-
