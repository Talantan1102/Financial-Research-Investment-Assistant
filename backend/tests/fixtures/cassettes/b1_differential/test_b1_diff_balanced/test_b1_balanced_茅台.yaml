      < 0.30 AND ROE > 0.15 AND \u8425\u6536 / \u51C0\u5229\u53CC\u5347 (\u53CC yoy
      > 0) |\\n| **recommend_overweight** | forecast_signal == positive OR (4 \u9879\u6761\u4EF6\u4E2D
      \u2265 3 \u9879\u6EE1\u8DB3) |\\n| **recommend_underweight** | PE \u5206\u4F4D
      > 0.70 OR \u8425\u6536 yoy < 0 OR \u51C0\u5229\u6DA6 yoy < 0 |\\n| **recommend_hold**
      | fallback (\u4F30\u503C\u5408\u7406 + \u8D22\u52A1\u5065\u5EB7 + \u65E0\u660E\u663E\u50AC\u5316\u4E5F\u65E0\u660E\u663E\u98CE\u9669)
      |\\n\\n\u4F18\u5148\u7EA7\u8BC4\u4F30\u987A\u5E8F (Python `_PRIORITY` \u5217\u8868,
