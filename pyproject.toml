[project]
name = "financial-research-assistant"
version = "0.1.0"
description = "Financial Research Investment Assistant — LLM application portfolio project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Authentication
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pydantic[email]>=2.7",
    # AI/LLM
    # cap openai<2.37 — 2.37 引入构造期 credentials 强制校验,
    # 跟 LLMConfig() 在 mock 路径传空 api_key 的模式冲突 (test_bocha_factory).
    "openai>=1.40,<2.37",
    "tiktoken>=0.8.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langgraph-checkpoint-postgres>=2.0",
    "dashscope>=1.20",
    "tqdm>=4.66.0",
    "cachetools>=5.5.0",
    # NLP
    "nltk>=3.8",
    "jieba>=0.42",
    # HTTP
    "httpx>=0.27",
    "aiohttp>=3.10",
    "requests>=2.32",
    # Document parsing
    "beautifulsoup4>=4.12",
    "trafilatura>=1.10",
    "lxml>=5.2",
    "pypdf2>=3.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "markdown>=3.6",
    # Data
    "numpy>=1.26",
    "pandas>=2.2",
    # Utils
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    # MCP
    "mcp>=1.0",
    # MCP capability schemas are validated directly by the runtime.
    "jsonschema>=4.23",
    # Stock data
    "tushare>=1.4",
    # v0.8.3 — monitoring scheduler (apscheduler retired in v1.0, kept until Task 14 退役)
    "apscheduler>=3.11",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.1",  # bundled libpq — required by langgraph-checkpoint-postgres>=3.x
    "redis>=7.4.0",
    # Windows SkillExecutor sandbox — Job Object memory cap + kill-on-close.
    "pywin32>=311; sys_platform == 'win32'",
    # v1.0 monitoring engine — Celery async task system
    "celery>=5.3,<6.0",
    # Harness Board (dashboard/) — server-side rendering
    "jinja2>=3.1",
    "greenlet>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-recording>=0.13",
    "pytest-repeat>=0.9",
    "pytest-cov>=5.0",
    "poethepoet>=0.27",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "types-cachetools>=5.5.0",
    "types-python-dateutil>=2.9",
]

test = [
    # v1.0 monitoring engine — L2 e2e Redis container fixture
    "testcontainers[redis]>=4.0,<5.0",
]

# Roadmap 2026-05-07 dep refactor: KB feature 4 重型 deps 拆 optional
# Slim install (no KB):  uv sync --extra dev   →  /knowledge endpoint 返 503 stub
# Full install (with KB): uv sync --extra dev --extra kb
kb = [
    "mineru[core]>=3.1.0",
    "pymilvus>=2.6.0",
    "pdfplumber>=0.11.0",
    "langchain-text-splitters>=0.3.0",
]

# 代码解释器(run_python)绘图依赖 —— numpy/pandas 已在 base,只需 plotly。
# 装:pip install -e '.[code-interpreter]'(国内走清华镜像 -i https://pypi.tuna.tsinghua.edu.cn/simple)
code-interpreter = [
    "plotly>=5.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "docs/archive",
    ".venv",
    "venv",
    "__pycache__",
    # Legacy services scheduled for deletion in v0 — excluded from lint until removed.
    # See spec 附录 B (deletion list) in docs/superpowers/specs/2026-04-29-dev-test-loop-design.md.
    "backend/app/service/chat_service*.py",
    "backend/app/service/mcp_chat_service.py",
    "backend/app/service/react_controller.py",
    "backend/app/service/smart_analyzer.py",
    "backend/app/service/dr_g.py",
    "backend/app/service/bidding_service.py",
    "backend/app/service/database_explorer.py",
    "backend/app/service/text2sql_service.py",
    "backend/app/service/deep_research_v2/",
    "backend/app/service/docmind_service.py",
    "backend/app/service/news_collection_service.py",
    # Legacy bootstrap script — `from models import ...` relies on sys.path hack
    # (line 15) so isort can't determine ordering; scheduled for deletion when
    # the industry-data tables are migrated to the v0+ app/services/ stack.
    "backend/app/scripts/init_industry_data.py",
    # Legacy test files scheduled for deletion (replaced by tests/{unit,integration,e2e,eval}/)
    "backend/test_mock_tushare.py",
    "backend/test_mock_integration.py",
    "backend/test_mock_extended.py",
    "backend/app/mcp_server/tests/test_mcp_server.py",
    "backend/tests/integration/test_mcp_meta_tools.py",
    "backend/tests/integration/test_mcp_resource_tool_arch.py",
    "backend/tests/e2e/test_e2e_chat.py",
    # Harness Board derive fixtures — read as text by code_grep, not executed.
    # Intentional bare-name references (e.g. `Tier`) simulate real backend modules.
    "dashboard/tests/derive/fixtures/",
]

[tool.ruff.lint]
# Enable: pycodestyle errors (E), pyflakes (F), isort (I),
#         pep8-naming (N), pyupgrade (UP), bugbear (B),
#         comprehensions (C4), simplify (SIM)
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
# v0 baseline: don't enforce the strict ones until later
ignore = [
    "E501",  # line too long (formatter handles most cases)
    "B008",  # function-call-in-default-argument (FastAPI Depends idiom)
    "N803",  # function args lowercase (we have ts_code, etc.)
    "N806",  # variable in function should be lowercase (we have DataFrames)
    # v0 baseline — legitimate project-wide patterns
    "E402",  # module-level import not at top (app_main loads .env before imports)
    "N815",  # mixed-case attrs (Tushare API field names use camelCase)
    "B904",  # raise-from in except (cleanup pass scheduled post-v0)
    "B905",  # zip-without-explicit-strict (re-enable after py311 sweep)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["B011"]  # assert in tests is fine
# E722/F841 in active code, scoped per-file with TODO markers tracing each entry to its v0 disposition
"backend/app/data/tushare_client.py" = ["E722", "F841"]  # TODO(v0): fix during data-adapter refactor in v0 spec
"backend/app/mcp_server/control_flow/engine.py" = ["F841"]  # TODO(v0): file deleted in v0 spec (mcp_server replaced by orchestration/) — drop this entry then
"backend/app/mcp_server/skills/base.py" = ["F841"]  # TODO(v0): file deleted in v0 spec (skills/ replaced by tools/) — drop this entry then
"backend/app/mcp_server/skills/data_analysis.py" = ["F841"]  # TODO(v1): file migrated to tools/ in v1 工具迁移 spec — drop this entry then
"backend/app/mcp_server/skills/deep_research.py" = ["F841"]  # TODO(v0): file deleted in v0 spec (deep_research → ResearchPlanner agent) — drop this entry then
"backend/app/router/chat_router.py" = ["F841"]  # TODO(v0): rewritten in v0 spec (HTTP contract preserved, internals new) — drop this entry then

[tool.mypy]
python_version = "3.11"
strict_optional = true
disallow_untyped_defs = false  # lenient for legacy code; tighten per directory below
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true  # 3rd-party stubs missing OK for now
files = ["backend/app", "backend/tests", "backend/eval"]
mypy_path = ["backend"]
explicit_package_bases = true
exclude = [
    "docs/archive",
    "venv",
    ".venv",
    "__pycache__",
    # Harness Board derive fixtures — read as text by code_grep, not imported.
    # Intentional bare-name references (e.g. `Tier`) simulate real backend modules.
    "dashboard/tests/derive/fixtures/",
]

# Strict tier — these dirs don't exist yet; will be populated by v0 spec.
# Once they exist, they MUST be 100% typed; mypy skips empty namespaces today.
# Override only adds disallow_untyped_defs delta; strict_optional inherited from global.
# Note: module names rooted at `app.*` (not `backend.app.*`) because there is no
# `backend/__init__.py`; mypy's source root is `backend/` so the package is `app`.
[[tool.mypy.overrides]]
module = "app.services.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.agents.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.tools.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.orchestration.*"
disallow_untyped_defs = true

# Legacy code scheduled for deletion in v0
# (see spec §11 现有文件去向 + 附录 B in docs/superpowers/specs/2026-04-29-dev-test-loop-design.md).
[[tool.mypy.overrides]]
module = [
    "app.service.*",       # old service dir (note: singular)
    "app.mcp_server.*",
    "app.mcp_client.*",
]
ignore_errors = true

# Tests are runtime contracts and remain covered by the pytest gate.  The
# legacy suite is not fully typed (SQLAlchemy fixtures and protocol fakes in
# particular), so its annotations must not mask the application/eval mypy
# signal used by CI.
[[tool.mypy.overrides]]
module = ["tests.*", "backend.tests.*"]
ignore_errors = true

# tushare_client is on the v0 refactor list (see ruff per-file-ignores TODO);
# 95 type errors today, all PEP 484 implicit-Optional and stub-coverage gaps.
# Type fix is part of the v0 data-adapter refactor, not v0 typing scope.
[[tool.mypy.overrides]]
module = "app.data.tushare_client"
ignore_errors = true

# SQLAlchemy ORM models — Column[X] vs X interop. Fix requires SA 2.0
# mapped_column migration or the SQLAlchemy mypy plugin. Out of v0 typing scope.
[[tool.mypy.overrides]]
module = "app.models.*"
ignore_errors = true

# v1.0 monitoring engine — same SA 2.0 Column[T] interop debt cascading from
# app.models.monitoring (which is in app.models.* ignored above). Repos +
# Celery tasks assign/read scalar values to/from Column[T] attributes; tests
# pass `user.id` (Column[UUID] per mypy) to repos expecting `str`. Fix is the
# same mapped_column migration; deferred to dedicated SA 2.0 sweep.
[[tool.mypy.overrides]]
module = [
    "app.services.monitoring.repositories",
    "app.tasks.monitoring",
    "tests.unit.services.test_monitoring_repositories",
    "tests.unit.models.test_monitoring_models",
    "tests.unit.tasks.test_generate_detail_card",
    "tests.integration.router.test_signals_endpoint",
    # Golden eval still uses legacy MonitoringCustomer schema; migration to
    # MonitoringSubject deferred to escalation.py retirement.
    "tests.eval.test_b3_dogfood_golden",
]
ignore_errors = true

# v1.x 持仓总览引擎 — 同 app.models.* / monitoring 那套 SA 2.0 Column[T] interop
# debt:快照 repo 给 Column[T] 属性赋标量值;Celery 任务把 Position 的 Column 属性
# 传给期望标量(int/float/UUID)的 repo。修法同样是 mapped_column 迁移,deferred
# to dedicated SA 2.0 sweep。
[[tool.mypy.overrides]]
module = [
    "app.services.position_snapshot_repo",
    "app.tasks.portfolio_snapshot",
]
ignore_errors = true

# C.5 cross-session memory tests — same SA 2.0 Column[T] interop debt as
# the v1.0 monitoring block above. Tests construct ORM models (AgeNode,
# Episode, etc.) and pass their `.id` (Column[UUID] per mypy) to functions
# expecting UUID. test_mcp_tools also passes str UUID literals to Pydantic
# args that declare `user_id: UUID` (Pydantic auto-coerces at runtime).
# Both resolve with the same mapped_column migration deferred to SA 2.0 sweep.
[[tool.mypy.overrides]]
module = [
    "tests.integration.memory.test_apply_action_e2e",
    "tests.integration.memory.test_milvus_outbox_e2e",
    "tests.integration.memory.test_cost_opt_e2e",
    "tests.integration.memory.test_conflict_resolver_e2e",
    "tests.integration.memory.test_episodes_e2e",
    "tests.integration.memory.test_extractor_e2e",
    "tests.integration.memory.test_instrumentation_e2e",
    "tests.integration.memory.test_working_blocks_e2e",
    "tests.integration.memory.test_write_pipeline_hardening",
    "tests.unit.memory.test_batch_extractor",
    "tests.unit.memory.test_mcp_tools",
]
ignore_errors = true

# FastAPI routers — UploadFile.filename: str | None and Depends signature gaps.
# chat_router rewritten in v0 spec; other routers preserved as HTTP surface
# and will get types as part of v0 router-typing pass.
[[tool.mypy.overrides]]
module = "app.router.*"
ignore_errors = true

# Legacy top-level test scripts scheduled for deletion in Plan A Task 6
# (already in ruff per-file-ignores as such).
[[tool.mypy.overrides]]
module = [
    "test_mock_tushare",
    "test_mock_integration",
    "test_mock_extended",
]
ignore_errors = true

# yaml has stubs that come and go across mypy/typeshed releases — cross-venv
# stable behavior demanded an explicit override (Plan B/C/D each toggled
# unused-ignore differently for the same `import yaml` line).
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# requests is only imported by tests/e2e/test_chat_title_e2e.py (dogfood-only).
# Stubs ship via types-requests, but we don't want a new dev dep for one file;
# global ignore_missing_imports only silences import-not-found, not import-untyped.
[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "unit: L0 — pure functions / Pydantic / no LLM",
    "integration: L1 — agent + cross-cutting, LLM in mock mode",
    "e2e: L2 — HTTP → graph, LLM in cassette mode",
    "eval: L3 — golden set + LLM-as-judge, LLM in live mode",
    "live_only: requires real LLM API (excluded from PR job)",
    "slow: takes > 5s (excluded from default `poe test`)",
    "golden: B-3 dogfood golden cases — deterministic, no real API calls",
]

[tool.poe.tasks]
# Active in Plan A
format       = "ruff format ."
test         = "pytest backend/tests/unit backend/tests/integration backend/tests/e2e -m 'not slow and not live_only'"
test-all     = "pytest backend/tests"
# TODO(I-1): canonical naming — uvicorn currently uses `app.app_main:app` because
# `backend/__init__.py` doesn't exist. To be unified before Plan A PR.
dev          = "uvicorn app.app_main:app --reload --port 8000 --app-dir backend"
# Task 13: local uvicorn dev run (same as dev; explicit alias for `poe serve`)
serve        = "uvicorn app.app_main:app --reload --port 8000 --app-dir backend"

# Plan D: trace-view CLI (replaces earlier echo stub)
trace-view.shell = "uv run python scripts/trace_view.py $@"

# Plan D: dependency security audit (manual + nightly)
audit         = "pip-audit"

# Plan C eval pipeline — runs L1 EvalRunner + sanity check (mock SUT + mock Judge).
# Real-LLM eval runs via L2 cassette, already covered by `poe ci`.
eval          = "pytest backend/tests/integration/test_eval_runner.py backend/tests/integration/test_sanity_check.py -v"
eval-sanity   = "pytest backend/tests/integration/test_sanity_check.py -v"
# Manual trigger: `poe eval-cross-judge -- --judge-a a.jsonl --judge-b b.jsonl`
eval-cross-judge.shell = "uv run python scripts/cross_judge_check.py $@"

# Plan B scaffolds for spec § 4 quantification; full impl in Plan C/D.
# Today: just runs the L1 suite under LLM_MODE=mock to surface obvious determinism breaks.
test-fidelity    = "pytest backend/tests/integration -v"
# Re-runs L1 ten times to spot flakes — full mock-vs-live comparison comes in Plan C.
test-flake-check = "pytest backend/tests/integration --count=10"

# `lint` runs three checks in sequence; using a sequence of cmd items so each
# entry is a shell command, not a reference to another poe task.
[tool.poe.tasks.lint]
sequence = [
    { cmd = "ruff format --check ." },
    { cmd = "ruff check ." },
    { cmd = "mypy backend" },
]

# `ci` chains `lint` then `test`; sequence of `ref` items references other tasks.
[tool.poe.tasks.ci]
sequence = [
    { ref = "lint" },
    { ref = "test" },
]

# Plan D: simulates the nightly job locally (uses live LLM via .env).
# Skips pip-audit (run via `poe audit` if needed).
[tool.poe.tasks.nightly-local]
sequence = [
    { cmd = "pytest backend/tests/e2e -v" },
    { cmd = "uv run poe eval" },
    { shell = "unset all_proxy https_proxy http_proxy && uv run python -m backend.tests.eval.cassette_validation" },
]

[dependency-groups]
dev = [
    "fakeredis>=2.21",
]
run-control = [
    "bcrypt>=4",
    "fastapi>=0.115",
    "greenlet>=3.5.0",
    "passlib[bcrypt]>=1.7",
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.7",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "redis>=7.4.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]
